<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<meta property="og:type" content="website">
<meta property="og:title" content="新竹出發多日遊｜挑一趟過夜的行程">
<meta property="og:description" content="以過夜基地為中心的景點與住宿地圖，挑完直接開 Google 地圖導航。">

<meta property="og:url" content="https://tw101099.github.io/hsinchu-multiday-trips/">

<style>

:root{
  --bg:#faf9f7; --panel:#ffffff; --sunk:#f2efe9;
  --ink:#1c1a17; --ink2:#6b645b; --ink3:#9a938a;
  --line:#e3ddd3; --line2:#cfc7ba;
  --accent:#5c5449; --accent-soft:#eae4d9; --on-accent:#ffffff;
  --warn:#9a5b17;

  --danger:#9c3b2c;
  --sb:#cfc7ba; --sb-hover:#a89f92;

  --r:10px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131211; --panel:#1b1a18; --sunk:#232120;
    --ink:#efeae2; --ink2:#a29a8f; --ink3:#787066;
    --line:#332f2b; --line2:#454039;
    --accent:#bcb2a2; --accent-soft:#2c2822; --on-accent:#17150f;
    --warn:#e0a45c;
    --danger:#c17167;
    --sb:#4a443c; --sb-hover:#6a6157;
      }
}
:root[data-theme="dark"]{
    --bg:#131211; --panel:#1b1a18; --sunk:#232120;
    --ink:#efeae2; --ink2:#a29a8f; --ink3:#787066;
    --line:#332f2b; --line2:#454039;
    --accent:#bcb2a2; --accent-soft:#2c2822; --on-accent:#17150f;
    --warn:#e0a45c;
        --danger:#c17167;
    --sb:#4a443c; --sb-hover:#6a6157;
}
*{box-sizing:border-box; scrollbar-width:thin; scrollbar-color:var(--sb) transparent;
  -webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:11px; height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{
  background:var(--sb); border-radius:999px; border:3px solid transparent; background-clip:content-box;
}
::-webkit-scrollbar-thumb:hover{background:var(--sb-hover); background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}

html{height:100%; overflow:hidden; overscroll-behavior:none; touch-action:manipulation}
body{
  margin:0; height:100dvh; overflow:hidden; overscroll-behavior:none;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.6;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
  -webkit-user-select:none; user-select:none;
  touch-action:manipulation;
}
button{font:inherit; color:inherit; cursor:pointer}
.num{font-family:var(--mono); font-size:.92em; letter-spacing:-.01em}
.ic{width:14px; height:14px; flex:none; stroke:currentColor; fill:none; stroke-width:1.5;
    stroke-linecap:round; stroke-linejoin:round; vertical-align:-2px; margin-right:4px}

.app{display:flex; flex-direction:column; height:100dvh; overflow:hidden; padding-bottom:env(safe-area-inset-bottom)}

@media (display-mode:standalone) and (orientation:portrait){
  html, body, .app{ height:100vh; height:-webkit-fill-available; }
}
.bar{
  flex:none; display:flex; align-items:center; gap:10px;
  padding:max(8px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));
  background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap;
}
.logo{font-weight:700; white-space:nowrap}
.logo small{display:block; font-weight:400; font-size:11px; color:var(--ink3); letter-spacing:.06em}
.seg{display:flex; background:var(--sunk); border-radius:999px; padding:2px}
.seg button{border:0; background:none; padding:4px 13px; border-radius:999px; font-size:13px; color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--accent); color:var(--on-accent)}

#qwrap{

  flex:1 1 150px; max-width:250px; min-width:110px; padding:2px 9px 2px 6px;
  border-radius:999px; border:1px solid var(--line); background:var(--bg);
  display:flex; flex-wrap:nowrap; align-items:center; gap:3px; min-height:32px; cursor:text;
  overflow-x:auto; scrollbar-width:none;
}
#qwrap::-webkit-scrollbar{display:none}
#qwrap:hover{border-color:var(--accent)}
#qwrap:focus-within{outline:1px solid var(--accent); border-color:var(--accent)}
#q{
  flex:1 1 60px; min-width:50px; width:0; padding:3px 0 3px 6px; border:none; outline:none;
  background:transparent; color:var(--ink); font:inherit; font-size:16px;
}

.qtok{
  flex:none;   
  display:inline-flex; align-items:center; gap:4px; font-size:12px; line-height:1.7;
  padding:0 7px 0 9px; border-radius:999px; border:1px solid var(--accent);
  color:var(--accent); background:none; cursor:pointer; white-space:nowrap; font-family:inherit;
}
.qtok:hover{opacity:.7}
.qtok .x{font-size:14px; line-height:1; opacity:.8}
#theme{
  flex:none; border:1px solid var(--line2); background:var(--bg); border-radius:999px;
  padding:5px 9px; line-height:1; color:var(--ink2);
}
#theme:hover{border-color:var(--accent); color:var(--accent)}
#theme svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.6;
           stroke-linecap:round; stroke-linejoin:round; vertical-align:-2px}
.tally{margin-left:auto; font-size:12px; color:var(--ink3); white-space:nowrap}

@media (max-width:520px){
  .tally{display:none}

  #qwrap{flex:1 1 80px; min-width:80px; max-width:none}
}

.main{flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden}
.panel{
  background:var(--panel); border-top:1px solid var(--line);
  flex:0 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
.stage{position:relative; flex:1 1 auto; min-height:220px; background:var(--sunk)}
#map{position:absolute; inset:0}
.mapnote{
  position:absolute; left:10px; bottom:10px; z-index:500; display:none; max-width:calc(100% - 20px);
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:5px 10px; font-size:11.5px; color:var(--ink2); box-shadow:0 1px 6px rgba(0,0,0,.12);
}
.mapmsg{
  position:absolute; inset:0; display:none; flex-direction:column; justify-content:center;
  padding:26px; gap:8px; color:var(--ink2); font-size:13.5px; text-align:center;
}

.mapoverlay{
  position:absolute; left:10px; right:10px; z-index:600;

  bottom:10px;
  display:flex; flex-direction:column; align-items:flex-start; gap:8px; pointer-events:none;
}
.mapoverlay > *{pointer-events:auto}
.mapbtns{display:flex; flex-direction:column; align-items:flex-start; gap:6px; max-width:100%}
.mapbtns button{
  border:1px solid var(--line); background:var(--panel); color:var(--ink2);
  border-radius:999px; padding:5px 12px; font-size:12.5px; white-space:nowrap;
  box-shadow:0 1px 6px rgba(0,0,0,.18);
}
.mapbtns button:hover{border-color:var(--accent); color:var(--accent)}
.mapbtns button[aria-pressed=true]{background:var(--accent-soft); border-color:var(--accent); color:var(--ink); font-weight:600}

.leaflet-bar a.locbtn{display:flex; align-items:center; justify-content:center; cursor:pointer}

.locbtn svg{display:block; width:16px; height:16px; fill:none; stroke:currentColor;
            stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}

.mypin{
  width:22px !important; height:22px !important; margin:-11px 0 0 -11px !important;
  display:grid; place-items:center; border-radius:999px;
  background:#7B57A8; border:2.5px solid var(--panel); box-shadow:0 1px 5px rgba(0,0,0,.35);
}
:root[data-theme="dark"] .mypin{background:#B79BDB}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .mypin{background:#B79BDB} }
.mypin svg{display:block; width:12px; height:12px; stroke:var(--panel); fill:none;
           stroke-width:2; stroke-linecap:round; stroke-linejoin:round}

.leaflet-marker-icon.hubpin, .leaflet-marker-icon.mypin{display:grid}
.locbtn.on{color:#7B57A8}
:root[data-theme="dark"] .locbtn.on{color:#B79BDB}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .locbtn.on{color:#B79BDB} }
.loctip{
  position:absolute; left:50%; bottom:64px; transform:translateX(-50%);
  background:var(--panel); color:var(--ink); border:1px solid var(--line);
  border-radius:8px; padding:6px 12px; font-size:13px; z-index:1200;
  box-shadow:0 2px 10px rgba(0,0,0,.18); opacity:0; transition:opacity .25s;
  pointer-events:none; white-space:nowrap;
}
.loctip.show{opacity:1}

.totop{
  position:fixed; z-index:550;
  right:calc(16px + env(safe-area-inset-right));
  bottom:calc(16px + env(safe-area-inset-bottom));
  width:40px; height:40px;
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--panel); border:1px solid var(--line2); color:var(--ink2);
  box-shadow:0 2px 10px rgba(0,0,0,.22); opacity:0; pointer-events:none;
  transition:opacity .15s, border-color .15s, color .15s;
}
.totop[hidden]{display:none}
.totop svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.totop:hover{border-color:var(--accent); color:var(--accent)}
.totop.show{opacity:1; pointer-events:auto}
.totop.docked{right:calc(100vw - 394px + env(safe-area-inset-right))}

.totop.docked.wide{right:calc(100vw - 765px + env(safe-area-inset-right))}

.mapcard{
  display:none; align-self:stretch; background:var(--panel); border:1px solid var(--line2);
  border-radius:var(--r); box-shadow:0 2px 14px rgba(0,0,0,.22); padding:10px 12px;
}
.mapcard.on{display:block}
.mapcard .ttl{display:flex; align-items:flex-start; gap:8px}
.mapcard .ttl b{font-size:14px; font-weight:600; flex:1; min-width:0}
.mapcard .x{flex:none; border:0; background:none; color:var(--ink3); font-size:16px; line-height:1; padding:0 2px}
.mapcard .x:hover{color:var(--accent)}
.mapcard .sub{margin:3px 0 0; font-size:12px; color:var(--ink3)}
.mapcard .m{margin:5px 0 0; font-size:12px; color:var(--ink2); display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 10px}
.mapcard .acts{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px}
.mapcard .acts a, .mapcard .acts button{
  border:1px solid var(--line); background:var(--bg); color:var(--ink2); text-decoration:none;
  border-radius:999px; padding:3px 10px; font-size:12.5px; white-space:nowrap;
}
.mapcard .acts .primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}

.pinlbl{
  position:absolute; left:30px; top:50%; transform:translateY(-50%); white-space:nowrap;
  font-size:11.5px; color:var(--ink); background:var(--panel); border:1px solid var(--line);
  border-radius:4px; padding:1px 5px; box-shadow:0 1px 3px rgba(0,0,0,.16);
  cursor:pointer;   
}
.main.nomap .stage{display:none}

.main.nomap .panel{flex:1 1 auto}

@media (max-width:899px), (max-height:559px){
  .main:not(.nomap) .results,
  .main:not(.nomap) .legend,
  .main:not(.nomap) .foot,

  .main:not(.nomap) .tripbox,
  .main:not(.nomap) .baseview,
  .main:not(.nomap) .sec.toplevel{display:none}
  .main:not(.nomap) .tpickmini{display:block}
  .main:not(.nomap) .stage{min-height:280px}
}

@media (min-width:900px) and (min-height:560px){
  .main{flex-direction:row}
  .panel{width:410px; flex:0 0 410px; border-top:0; border-right:1px solid var(--line)}
  .main.nomap .panel{width:auto; flex:1 1 auto}
}

@media (min-width:1280px) and (min-height:560px){
  .panel.twolane{
    width:781px; flex:0 0 781px;
    display:flex; flex-direction:row; overflow:hidden;   
  }
  .panel.twolane .lane{min-height:0; overflow-y:auto; overscroll-behavior:contain;
                       -webkit-overflow-scrolling:touch}
  .panel.twolane .lane-trip{flex:0 0 380px; width:380px; border-right:1px solid var(--line)}
  .panel.twolane .lane-explore{flex:1 1 auto; min-width:0}

  .panel.twolane .lane-trip > .sec.toplevel{
    position:sticky; top:0; z-index:400;
    padding-bottom:8px; background:var(--panel); border-bottom:1px solid var(--line);
  }
}

.fbar{
  position:sticky; top:0; z-index:400; display:flex; align-items:center; gap:8px;
  padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line);
}
.fbtn{
  flex:none; border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent);
  border-radius:999px; padding:4px 12px; font-size:13px; white-space:nowrap; font-weight:600;
}
.fbtn[aria-expanded=true]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.chev{width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round;
      stroke-linejoin:round; margin-left:4px; vertical-align:-1px; transition:transform .15s}
.fbtn[aria-expanded=true] .chev{transform:rotate(180deg)}
.fsum{

  flex:1; min-width:0; font:inherit; font-size:13.5px; color:var(--ink2);
  overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; border:0; background:none; padding:2px 0; text-align:left;
}
.fsum:hover{color:var(--ink)}
.fsum b{color:var(--ink); font-weight:600}

.clear, .ghost{
  border:1px solid var(--line); background:var(--bg); color:var(--ink2);
  border-radius:999px; padding:3px 10px; font-size:12.5px; white-space:nowrap;
  text-decoration:none; font-family:inherit; line-height:1.5;
}
.clear:hover, .ghost:hover{border-color:var(--line2); color:var(--ink)}
.clear:hover{color:var(--accent)}
#sort{
  flex:none; border:1px solid var(--line); border-radius:999px; background:var(--bg); color:var(--ink2);
  font:inherit; font-size:12.5px; padding:3px 10px; max-width:120px;
}

.filters{padding:10px 14px 12px; border-bottom:1px solid var(--line)}
.frow{display:flex; align-items:flex-start; gap:9px; padding:4px 0}
.fkey{flex:none; width:52px; padding-top:4px; font-size:11.5px; color:var(--ink3); letter-spacing:.06em}
.chips{display:flex; flex-wrap:wrap; gap:5px; flex:1; min-width:0}
.chip{
  border:1px solid var(--line); background:var(--bg); border-radius:999px;
  padding:3px 10px; font-size:12.5px; color:var(--ink2); line-height:1.5;
  transition:border-color .15s, background .15s, color .15s;
}
.chip:hover{border-color:var(--line2); color:var(--ink)}

.chip[aria-pressed=true]{background:var(--accent-soft); border-color:var(--accent); color:var(--ink); font-weight:600}
.chip:disabled{opacity:.45; cursor:default; pointer-events:none}
.cnt{margin-left:5px; color:var(--ink3); font-size:11px}
.chip[aria-pressed=true] .cnt{color:var(--ink3)}
.sec{
  display:flex; align-items:center; gap:7px; width:100%; border:0; background:none;
  padding:9px 0 0; margin-top:11px; border-top:1px solid var(--line);
  font-size:12.5px; color:var(--ink2); text-align:left;
}
.sec:hover{color:var(--accent)}
.sec .n{color:var(--ink3); font-family:var(--mono)}

.sec .n .ic{width:13px; height:13px; vertical-align:-2px; margin-left:3px}

.sec.toplevel{padding-left:14px; padding-right:14px; border-top:0; margin-top:0}

.filters > .sec:first-child{border-top:0; margin-top:0; padding-top:2px}
.sec.toplevel[aria-expanded=false]{border-bottom:1px solid var(--line); padding-bottom:9px}
.sec .chev{margin-left:auto}
.sec[aria-expanded=true] .chev{transform:rotate(180deg)}
.subrows{margin-top:5px}

.rlist{margin-top:4px}
.rrow{
  display:flex; width:100%; align-items:center; gap:9px; padding:6px 8px; font-size:13px;
  border:1px solid transparent; border-radius:8px; background:none; text-align:left; color:var(--ink2);
}
.rrow:hover{background:var(--sunk); color:var(--ink)}
.rrow[aria-pressed=true]{background:var(--accent-soft); border-color:var(--accent); color:var(--ink); font-weight:600}

.rrow .rbar{flex:none; width:3px; height:17px; border-radius:2px}
.rrow .nm{flex:1; min-width:0}
.rrow .n{flex:none; font-size:11.5px; color:var(--ink3)}

.rrow .away{
  flex:none; font-size:11px; color:var(--ink3); white-space:nowrap;
  border:1px solid var(--line); border-radius:999px; padding:0 7px;
}
.rrow[aria-pressed=true] .away{border-color:var(--line2); color:var(--ink2)}

.rlist .tcath{margin:9px 0 3px}
.rlist .tcath:first-child{margin-top:2px}

.tpickmini{display:none; padding:2px 0 4px}
.tpickmini .fkey{width:auto; padding:0 0 2px}

.tpickmini .tpick{padding:2px 0 0}
.tpickmini .tcath.tog{padding:4px 2px}
.tpickmini .rtlist{margin-left:2px}
.tpickmini .rthead{padding:5px 7px; font-size:12.5px}
.tpickmini .rtrips{margin-left:10px; padding-left:9px}
.tpickmini .trow{padding:5px 8px; font-size:12.5px}

.results{padding:2px 12px 20px}

.ghead{
  position:relative; display:flex; width:100%; align-items:center; gap:7px;
  margin:14px 0 6px; padding:6px 10px 6px 15px; border:0; border-radius:8px;
  border-bottom:1px solid var(--line); background:none; text-align:left; cursor:pointer;
  font:inherit; font-size:12px; color:var(--ink3); transition:background .12s;
}
.ghead:hover{background:var(--sunk)}
.ghead::before{
  content:""; position:absolute; left:0; top:8px; bottom:8px; width:3px;
  border-radius:2px; background:var(--dc,var(--ink3));
}
.ghead .gnm{
  flex:1; min-width:0; font-size:14px; font-weight:600; color:var(--ink);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.ghead .num{flex:none}
.ghead .chev{flex:none; width:12px; height:12px; color:var(--ink3); transition:transform .15s}
.ghead[aria-expanded=true] .chev{transform:rotate(180deg)}

.gintro{
  margin:0 0 8px; padding:10px 13px 11px; border-radius:8px; background:var(--sunk);
}
.gintro .gstyle{display:flex; flex-wrap:wrap; gap:5px; margin:0 0 8px}
.gintro .gchip{
  font-size:11px; padding:2px 8px; border-radius:999px; background:var(--panel);
  border:1px solid var(--line2); color:var(--ink2); white-space:nowrap;
}

.gintro .gdesc{
  font-size:13px; color:var(--ink2); line-height:1.65; margin:0 0 7px;
  -webkit-user-select:text; user-select:text;
}

.gintro .groads{font-size:11.5px; color:var(--ink3); line-height:1.5; margin:0}
.row{
  position:relative; display:flex; width:100%; text-align:left; gap:8px; align-items:flex-start;
  border:1px solid transparent; border-radius:var(--r); background:none; padding:7px 9px;
  transition:background .12s, border-color .12s;
}
.row:hover{background:var(--sunk)}
.row[aria-expanded=true]{background:var(--accent-soft); border-color:var(--accent)}
.row .rbody{flex:1; min-width:0}
.row .t{display:flex; gap:6px; align-items:center; font-size:14.5px; font-weight:600}

.row .m{font-size:12px; color:var(--ink2); margin-top:1px; display:flex; align-items:baseline; flex-wrap:wrap}
.row .off{color:var(--ink3); font-size:11px; border:1px dashed var(--line2); border-radius:999px; padding:0 6px}

.tag{font-size:11px; padding:0 7px; border-radius:999px; border:1px solid var(--line2); color:var(--ink2); white-space:nowrap}
.tag.hard{border-color:var(--warn); color:var(--warn)}
.star{color:var(--accent); font-size:11px}
.empty{padding:26px 6px; color:var(--ink2); font-size:14px}
.empty button{border:0; background:none; color:var(--accent); text-decoration:underline; padding:0}

義縣阿里山鄉", "base": "dabang-tefuye", "theme": "heritage", "kind": "男子會所", "diff": "散步", "time": "約 30–45 分鐘", "season": "", "desc": "特富野大社的核心聚會所，與達邦庫巴並列為鄒族現存兩座神聖庫巴之一。建築前方矗立象徵天神降臨通道之巨大雀榕神樹與木斛蘭，為部落長老議事、男子成年禮與傳統戰祭的聖所，外觀雄偉且散發古樸原鄉氣息。", "note": "遵守鄒族文化禁忌，女性與未經許可之外人嚴禁登階進入建築本體；祭典期間遵守部落祭儀規範；特富野聚落道路較狹窄，建議將車輛停放於部落外側牌樓停車場後步行入內。", "tags": ["老宅", "避暑"], "sources": ["https://www.cip.gov.tw/"], "source": "https://www.cip.gov.tw/", "drive": "離基地約 5 分", "stay_h": 0.75, "drive_min": 5, "total_h": 0.9, "season_months": [], "id": "pe3609bc1"}, {"name": "貢禮之石", "lat": 23.4081787, "lng": 120.7222309, "town": "嘉義縣阿里山鄉", "base": "dabang-tefuye", "theme": "heritage", "kind": "自然祭祀石", "diff": "開車", "time": "約 20–30 分鐘", "season": "", "desc": "座落於縣169線進入里佳部落（藍色部落）入口處路旁，為鄒族守護神信仰的巨大天然岩石。相傳早年族人入山打獵或遠行返回聚落前，必在此巨石前擺放酒、肉或農作祭祀山神以祈求平安與庇佑，石面平整宛如天然供桌。", "note": "位於 169 縣道旁，設有解說告示牌與小型臨停避車彎；參觀時請尊重原住民信仰儀軌，切勿攀爬巨石或於祭石上丟棄垃圾；由此續行約 2 公里即可抵達里佳聚落中心。", "tags": ["避暑"], "sources": ["https://www.ali-nsa.net/"], "source": "https://www.ali-nsa.net/", "drive": "離基地約 20 分", "stay_h": 0.5, "drive_min": 20, "total_h": 1.2, "season_months": [], "id": "pf1415094"}, {"name": "Mimiyo秘密遊民宿", "lat": 23.4281214, "lng": 120.7408652, "town": "嘉義縣阿里山鄉", "base": "dabang-tefuye", "zone": "特富野社", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "座落於特富野深山山谷溪畔，由鄒族青年打造，取名 Mimiyo 意為鄒族語「到處走走」。園區隱身於茂密竹林與原始林間，提供全木造景觀客房與石砌大浴池，夜間圍繞柴燒壁爐品茗閒談，環境遺世獨立。", "note": "雙人套房平日約 3600–4200 元、假日約 4500–5500 元（含手作早餐）；需透過官方網站或電話預約；由達邦深入山區產業道路約 15 分鐘，路幅較窄需小心慢行；全館室內禁菸。", "tags": ["避暑", "夜景"], "sources": ["http://www.mimiyo.com.tw/"], "source": "http://www.mimiyo.com.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "mimiyo"}, {"name": "給巴娜民宿", "lat": 23.4562528, "lng": 120.7529753, "town": "嘉義縣阿里山鄉", "base": "dabang-tefuye", "zone": "達邦大社", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "位於達邦部落中心，提供雙人與四人房、烤肉區與露台。若要安排部落導覽或原民風味餐，應事先向業者確認內容與預約方式。", "note": "雙人房平日約 2000–2600 元、假日約 2800–3400 元；採電話預訂；附設專屬庭院停車位；如需體驗部落烤肉或風味晚餐需於訂房時提前預約。", "tags": ["親子", "避暑"], "sources": ["https://alishan.cyhg.gov.tw/"], "source": "https://alishan.cyhg.gov.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p5377759a"}, {"name": "特富野步道", "lat": 23.4604829, "lng": 120.7541593, "town": "嘉義縣阿里山鄉", "base": "dabang-tefuye", "theme": "trail-near", "kind": "部落古道", "diff": "健行", "time": "單程約 40–60 分鐘", "season": "", "desc": "連接達邦大社與特富野社的人行步道，全長約 1.1 公里，由達邦吊橋跨越伊斯基安溪後進入樟樹林與竹林。此處非台18自忠端的特富野古道。", "note": "此步道為村落間的特富野步道，非台18線自忠端的特富野古道，兩者路徑完全不同；步道鋪設木棧階梯與泥土路，雨後竹林段稍濕滑，建議著輕便健行鞋；兩端入口皆有路牌指引。", "tags": ["避暑", "巨木", "親子"], "sources": ["https://www.ali-nsa.net/"], "source": "https://www.ali-nsa.net/", "drive": "離基地約 5 分", "stay_h": 1.0, "drive_min": 5, "total_h": 1.2, "season_months": [], "id": "p627de700"}, {"name": "東澳灣", "lat": 24.5112386, "lng": 121.838045, "town": "宜蘭縣蘇澳鎮", "theme": "coast", "kind": "弧形礫石海灘", "base": "dongao", "diff": "散步", "time": "約 1–1.5 小時", "desc": "東澳灣是中央山脈東側與太平洋相接的弧形礫石海灣。水域活動應透過合法業者、依海象進行，不把日出、海色或出海條件寫成保證。", "note": "礫石灘坡度、水流與浪況會變化；不自行下水，水域活動使用救生裝備並依業者與海象警示。", "season": "", "tags": [], "sources": ["https://www.nanao.e-land.gov.tw/", "https://travel.yilan.tw/"], "source": "https://www.nanao.e-land.gov.tw/", "drive": "離基地約 5 分", "stay_h": 1.5, "drive_min": 5, "total_h": 1.7, "season_months": [], "id": "p6ccfede1"}, {"name": "粉鳥林漁港", "lat": 24.4973072, "lng": 121.8415038, "town": "宜蘭縣蘇澳鎮", "theme": "coast", "kind": "海蝕奇岩漁港", "base": "dongao", "diff": "散步", "time": "約 45–60 分鐘", "desc": "粉鳥林漁港在東澳灣南側，可觀察小型漁港、防波堤與礫石海岸地形。", "note": "港區道路及停車受人潮影響；海岸非受管制游泳場，依海象與現場告示活動，不進入消波塊或危險水域。", "season": "", "tags": [], "sources": ["https://www.necoast-nsa.gov.tw/", "https://www.suao.gov.tw/"], "source": "https://www.necoast-nsa.gov.tw/", "drive": "離基地約 10 分", "stay_h": 1.0, "drive_min": 10, "total_h": 1.3, "season_months": [], "id": "pd97b3e8d"}, {"name": "露境東岳探險渡假營地", "lat": 24.5259571, "lng": 121.8345752, "town": "宜蘭縣蘇澳鎮", "theme": "lodging", "kind": "露營區", "base": "dongao", "zone": "東岳聚落", "diff": "開車", "time": "", "desc": "露境東岳探險渡假營地是東澳一帶的露營住宿選項，適合作為湧泉、海灣與聚落行程的過夜基地。", "note": "營位、活動、價格與安全限制以業者當期公告為準，戶外活動另確認天候與年齡限制。", "season": "", "tags": ["需預約"], "sources": ["https://www.camping085.com/"], "source": "https://www.camping085.com/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p75f56807"}, {"name": "蛇山步道", "lat": 24.520541, "lng": 121.8314085, "town": "宜蘭縣南澳鄉", "theme": "trail-near", "kind": "部落景觀步道", "base": "dongao", "diff": "散步", "time": "往返約 45–60 分鐘", "desc": "蛇山步道位於東岳聚落後方，是連接聚落與山坡的短程步行路線。", "note": "步道開放、路況與校地或部落範圍依現場告示；雨後階梯濕滑，勿為看列車或景觀偏離步道。", "season": "", "tags": [], "sources": ["https://www.nanao.e-land.gov.tw/", "https://travel.yilan.tw/"], "source": "https://www.nanao.e-land.gov.tw/", "drive": "離基地約 5 分", "stay_h": 1.0, "drive_min": 5, "total_h": 1.2, "season_months": [], "id": "pe47d9d70"}, {"name": "東岳湧泉", "lat": 24.5243055, "lng": 121.8310008, "town": "宜蘭縣南澳鄉", "theme": "water", "kind": "天然低溫湧泉公園", "base": "dongao", "diff": "散步", "time": "約 1–1.5 小時", "desc": "東岳湧泉是東澳一帶的低溫湧泉戲水設施，鄰近北迴鐵路與聚落。適合在設施開放且水況安全時安排短暫停留。", "note": "開放季節、時段與現場水況由南澳鄉公所公告；未開放或豪雨後不下水。溪石濕滑，穿水鞋並看顧兒童。", "season": "6月-10月", "tags": ["親子", "冷泉"], "sources": ["https://www.nanao.e-land.gov.tw/", "https://travel.yilan.tw/"], "source": "https://www.nanao.e-land.gov.tw/", "drive": "離基地約 5 分", "stay_h": 1.5, "drive_min": 5, "total_h": 1.7, "season_months": [6, 7, 8, 9, 10], "id": "p30fd1fad"}, {"name": "雲海咖啡廳", "lat": 24.5276473, "lng": 121.1178162, "town": "新竹縣五峰鄉", "base": "guanwu", "theme": "cafe", "kind": "景觀咖啡", "diff": "開車", "time": "約 1 小時", "season": "雲海季10月至翌年3月，小藍莓產季7月至8月", "desc": "設於雪霸休閒農場花園觀景台旁，海拔 1,923 公尺，面向五峰鄉深山群谷與大霸尖山方向。室內外設有木質觀景露天座位，招牌為在地栽植手工小藍莓果茶、高山熱咖啡與現烤格子鬆餅，傍晚為觀賞雲海晚霞絕佳位置。", "note": "營業時間 08:30–21:00（全年無休）；每人低消一杯飲品或餐點（約 140–200 元）；現金與信用卡皆可；車輛停放雪霸農場公用停車位；午後戶外露天座位氣溫降至攝氏 15 度以下，需自備防風保暖衣物。", "tags": ["展望", "夕陽", "避暑"], "sources": ["https://www.sheipa.com.tw/", "https://travel.hsinchu.gov.tw/"], "source": "https://www.sheipa.com.tw/", "drive": "離基地約 15 分", "stay_h": 1.0, "drive_min": 15, "total_h": 1.5, "season_months": [1, 2, 3, 7, 8, 10, 11, 12], "id": "p7358392c"}, {"name": "觀霧餐廳", "lat": 24.5033779, "lng": 121.1142665, "town": "苗栗縣泰安鄉", "base": "guanwu", "theme": "food", "kind": "合菜熱食", "diff": "開車", "time": "約 1 小時", "season": "霧社櫻花季3月中旬至下旬", "desc": "位於觀霧山莊內，為海拔 2,000 公尺觀霧山莊區全區唯一提供熱食合菜與熱湯之實體餐飲據點。供應高山野溪鱸魚、客家小炒、馬告排骨湯等熱騰騰合菜定食與單點料理，餐廳前庭即為知名地標霧社櫻王。", "note": "中餐供餐時間 11:30–14:00（對外開放單點與合菜）、晚餐 17:30–19:30（以住客為主，視現場食材情況開放散客）；非山莊房客可現場候位或電話確認（037-268818）；每人均消約 250–400 元，僅收現金；車輛停放觀霧山莊專用停車場。", "tags": ["避暑"], "sources": ["https://www.guanwuvilla.com/", "https://recreation.forest.gov.tw/Forest/RA?typ_id=0200004"], "source": "https://www.guanwuvilla.com/", "drive": "離基地約 5 分", "stay_h": 1.0, "drive_min": 5, "total_h": 1.2, "season_months": [3], "id": "pdacd10db"}, {"name": "觀霧山莊", "lat": 24.5033762, "lng": 121.1141275, "town": "苗栗縣泰安鄉", "base": "guanwu", "zone": "觀霧山莊區", "theme": "lodging", "kind": "高山山莊", "diff": "開車", "time": "", "season": "霧社櫻花季3月中旬至下旬", "desc": "位於觀霧國家森林遊樂區內，為園區住宿據點，提供雙人房、多人雅房、背包客床位與團體房型；館內另有餐廳與便利店。住宿位置靠近觀霧山莊露營區、榛山步道與觀霧瀑布步道一帶。", "note": "房價與房型依日期變動，請以官方訂房網為準；可線上訂房或電話洽詢。餐廳晚餐僅供住宿客，山上補給選擇有限；夜間氣溫低，需備保暖衣物。", "tags": ["需預約", "避暑", "展望"], "sources": ["https://www.guanwuvilla.com/"], "source": "https://www.guanwuvilla.com/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [3], "id": "pa3e65536"}, {"name": "觀霧露營區", "lat": 24.5033762, "lng": 121.1141275, "town": "苗栗縣泰安鄉", "base": "guanwu", "zone": "觀霧山莊區", "theme": "lodging", "kind": "高山露營區", "diff": "開車", "time": "", "season": "", "desc": "Google Maps 名稱為「觀霧露營區」，由觀霧山莊管理，位於觀霧山莊周邊的高海拔園區。它讓露營者可在園區內過夜，隔日接續檜山巨木群、榛山或觀霧瀑布步道。", "note": "露營區僅限電話訂房，請洽觀霧山莊確認營位、費用、車輛與炊煮規定。園區規定非觀霧山莊露營區住宿客不得於園內露營或車宿；高海拔夜間低溫，依季節備妥睡袋與保暖層。", "tags": ["需預約", "避暑"], "sources": ["https://www.guanwuvilla.com/booking/", "https://recreation.forest.gov.tw/Forest/RA?typ=0&typ_id=0200004", "https://maps.app.goo.gl/HeKUCfwuhKEm6xWd8"], "source": "https://www.guanwuvilla.com/booking/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p5c42c7e1"}, {"name": "野馬農園", "lat": 24.5321437, "lng": 121.1239467, "town": "新竹縣五峰鄉", "base": "guanwu", "zone": "大鹿林道高海拔露營帶", "theme": "lodging", "kind": "露營區", "diff": "開車", "time": "", "season": "雲海季10月至翌年3月，櫻花季2月至3月", "desc": "位於大鹿林道 21 公里處、緊鄰雪霸休閒農場旁山谷，海拔約 1,900 公尺，為觀霧自駕沿線海拔最高之自搭帳露營區。營位依山勢錯落，視野開闊正對雪山山脈與聖稜線山巒，入夜無光害銀河清晰，清晨常有大片壯觀雲海湧入山谷。", "note": "草地與碎石營位每帳約 1000–1200 元；採電話預約訂位（0939-615013）；進場時間 12:00、拔營時間 11:30；提供熱水衛浴、洗手台水電與公共冰箱；海拔極高早晚氣溫常低於攝氏 10 度，需自備防寒高保暖睡袋；進入營區最後約 500 公尺為窄陡水泥產業道路需慢行。", "tags": ["需預約", "避暑", "展望", "夕陽", "夜景", "寵物"], "sources": ["https://travel.hsinchu.gov.tw/", "https://www.facebook.com/"], "source": "https://travel.hsinchu.gov.tw/", "drive": "離基地約 25 分", "stay_h": 0.5, "drive_min": 25, "total_h": 1.3, "season_months": [1, 2, 3, 10, 11, 12], "id": "p13fc10ef"}, {"name": "雪霸休閒農場", "lat": 24.5276476, "lng": 121.1178128, "town": "新竹縣五峰鄉", "base": "guanwu", "zone": "野馬瞰山區", "theme": "lodging", "kind": "高山度假農場", "diff": "開車", "time": "", "season": "雲海季10月至翌年3月，小藍莓產季7月至8月", "desc": "農場位於大鹿林道約 21.5 公里、海拔約 1,923 公尺，鄰近野馬瞰山步道。園區提供木屋與客房，並種植小藍莓、奇異果及溫帶花卉；住宿可把高山農場、森林步道與觀霧園區安排在同一趟行程。", "note": "房價、餐食與活動依房型及日期調整，請由官網或電話預訂並確認。農場至觀霧國家森林遊樂區仍需山路車程；進入大鹿林道前請加滿油，夜間與濃霧時段減速行駛。", "tags": ["需預約", "避暑", "展望", "夕陽", "夜景", "親子"], "sources": ["https://www.sheipa.com.tw/"], "source": "https://www.sheipa.com.tw/", "drive": "離基地約 15 分", "stay_h": 0.5, "drive_min": 15, "total_h": 1.0, "season_months": [1, 2, 3, 7, 8, 10, 11, 12], "id": "pf6ff94ec"}, {"name": "雲山民宿", "lat": 24.5387187, "lng": 121.1263771, "town": "新竹縣五峰鄉", "base": "guanwu", "zone": "大鹿林道15K雲山帶", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "雲海季10月至翌年3月", "desc": "坐落於大鹿林道 15 公里處雲山部落，海拔約 1,500 公尺，為五峰通往觀霧途中重要之中繼宿點。主建築為原木景觀木屋，面向雪山山脈背側深谷，群山環抱，清晨與黃昏常可自陽台直接俯瞰翻騰雲海與落日晚霞。", "note": "雙人套房約 2500–3200 元、四人套房約 3800–4800 元（含中式早餐）；採電話預約訂房（03-5856188）；入住時間 15:00、退房時間 10:00；客房內無冷暖氣機，山區夜間低溫需自備保暖衣物；附設專屬停車場；全館禁菸且不收寵物入住木屋。", "tags": ["需預約", "避暑", "展望", "夕陽"], "sources": ["http://www.8898go.com/035856188", "https://travel.hsinchu.gov.tw/"], "source": "http://www.8898go.com/035856188", "drive": "離基地約 25 分", "stay_h": 0.5, "drive_min": 25, "total_h": 1.3, "season_months": [1, 2, 3, 10, 11, 12], "id": "p51530058"}, {"name": "榛山步道", "lat": 24.4958082, "lng": 121.1105954, "town": "苗栗縣泰安鄉", "base": "guanwu", "theme": "trail-mountain", "kind": "高山展望步道", "diff": "健行", "time": "全程約 4 公里、約 3 小時", "season": "杜鵑花季4月至5月", "desc": "步道口位於大鹿林道西線約 1.7 公里處，全程約 4 公里、約需 3 小時。路線經過紅檜、扁柏、臺灣粗榧與杜鵑科植物組成的林地，通往榛山稜線，是觀察觀霧高山森林與雪霸連峰地形的健行路線。", "note": "自大鹿林道西線入口步行到步道口來回約需 1 小時，行程應一併計入。榛山觀景平台基座已拆除，請依現場動線行走；山區午後雲霧與降雨會影響視線，備妥保暖、防水衣物與飲水。", "tags": ["展望", "避暑"], "sources": ["https://recreation.forest.gov.tw/Forest/RA?typ_id=0200004"], "source": "https://recreation.forest.gov.tw/Forest/RA?typ_id=0200004", "drive": "離基地約 10 分", "stay_h": 3.0, "drive_min": 10, "total_h": 3.3, "season_months": [4, 5], "id": "pcd6a678f"}, {"name": "檜山巨木群步道", "lat": 24.5025475, "lng": 121.1108886, "town": "苗栗縣泰安鄉", "base": "guanwu", "theme": "trail-mountain", "kind": "巨木步道", "diff": "健行", "time": "全程約 4 公里、約 2.5 小時", "season": "", "desc": "步道位於樂山林道沿線，通往五株紅檜巨木。全程約 4 公里，林相為雲霧帶的針闊葉混合林；紅檜、扁柏、昆欄樹與蕨類在步道兩側交錯。", "note": "依園區公告，步道約需 2.5 小時；雨後泥土、木棧與樹根濕滑，請穿著抓地力足夠的鞋。觀霧午後易起霧，宜預留回程與行車時間；出發前查詢園區公告。", "tags": ["巨木", "避暑", "展望"], "sources": ["https://recreation.forest.gov.tw/Forest/RA?typ_id=0200004"], "source": "https://recreation.forest.gov.tw/Forest/RA?typ_id=0200004", "drive": "離基地約 10 分", "stay_h": 2.5, "drive_min": 10, "total_h": 2.8, "season_months": [], "id": "pc20a2c68"}, {"name": "觀霧八仙瀑布", "lat": 24.533876, "lng": 121.097682, "town": "新竹縣五峰鄉", "base": "guanwu", "theme": "trail-mountain", "kind": "林道沿線瀑布景觀", "diff": "散步", "time": "約 10–15 分鐘", "season": "", "desc": "大鹿林道約 8.5 公里處，爺巴堪溪因溪谷落差形成八字形的八仙瀑布。此處是上行觀霧時的沿途地景，不以進入溪谷或下切瀑布為行程內容。", "note": "位在狹窄林道路段，僅能在安全、不妨礙會車處短暫停留；不可把路肩當停車場。雨後、濃霧與道路施工時視線及通行狀況較差，行前查詢大鹿林道公告。", "tags": ["中繼", "瀑布"], "sources": ["https://recreation.forest.gov.tw/Forest/RA?typ=0&typ_id=0200004"], "source": "https://recreation.forest.gov.tw/Forest/RA?typ=0&typ_id=0200004", "drive": "離基地約 30 分", "stay_h": 0.25, "drive_min": 30, "total_h": 1.2, "season_months": [], "id": "p9fc4bbd4"}, {"name": "觀霧瀑布步道", "lat": 24.5036431, "lng": 121.1158516, "town": "苗栗縣泰安鄉", "base": "guanwu", "theme": "trail-mountain", "kind": "森林瀑布步道", "diff": "健行", "time": "全程約 1.5 公里、來回至少約 1.5 小時", "season": "", "desc": "步道起點在觀霧山莊露營區附近，全程約 1.5 公里。去程下坡約 30–50 分鐘，海拔落差約 280 公尺；終點可見落差 30 餘公尺的觀霧瀑布，設有涼亭可休息。", "note": "去程下坡、回程持續上坡，來回至少約需 1.5 小時，請依體力決定是否下切。步道潮濕時木棧、泥土與階梯易滑；遇濃霧或降雨，勿為趕行程勉強進入。", "tags": ["瀑布", "避暑"], "sources": ["https://recreation.forest.gov.tw/Forest/RA?typ_id=0200004"], "source": "https://recreation.forest.gov.tw/Forest/RA?typ_id=0200004", "drive": "離基地約 5 分", "stay_h": 1.5, "drive_min": 5, "total_h": 1.7, "season_months": [], "id": "p991f6e99"}, {"name": "野馬瞰山", "lat": 24.5270111, "lng": 121.1154722, "town": "新竹縣五峰鄉", "base": "guanwu", "theme": "trail-mountain", "kind": "森林步道", "diff": "散步", "time": "環狀約 2 公里、約 1–1.5 小時", "season": "", "desc": "步道在雪霸休閒農場上方，環狀一圈約 2 公里，海拔約 1,913 公尺。路徑穿過柳杉與闊葉樹混生林，地面多為松針、落葉與樹根；行走重點在森林結構與高山農場周邊的地形。", "note": "由雪霸休閒農場園區進入；雨後土徑與樹根濕滑，請穿防滑鞋。高海拔午後常起霧，能見度降低時依步道標示折返，不以雲海或展望作為必然行程。", "tags": ["避暑"], "sources": ["https://travel.hsinchu.gov.tw/", "https://www.sheipa.com.tw/"], "source": "https://travel.hsinchu.gov.tw/", "drive": "離基地約 15 分", "stay_h": 1.5, "drive_min": 15, "total_h": 2.0, "season_months": [], "id": "p42d15342"}, {"name": "觀霧國家森林遊樂區遊客中心", "lat": 24.5060814, "lng": 121.1136749, "town": "苗栗縣泰安鄉", "base": "guanwu", "theme": "trail-near", "kind": "遊客中心與步道", "diff": "散步", "time": "約 45–60 分鐘", "season": "", "desc": "遊客中心是觀霧的導覽與環境教育據點，提供森林生態、原住民族文化、山岳與林業主題展示。中心旁可銜接雲霧步道；該步道全長 846 公尺，適合作為健行前後認識園區與短暫步行的安排。", "note": "園區開放時間為 08:00–17:00，遊客中心每週二休館，國定假日照常開放；目前免收門票。大鹿林道路幅狹窄且施工、管制可能變動，行前查詢園區公告並在進山前加滿油。", "tags": ["親子"], "sources": ["https://recreation.forest.gov.tw/Forest/RA?typ_id=0200004", "https://hsinchu.forest.gov.tw/0000146"], "source": "https://recreation.forest.gov.tw/Forest/RA?typ_id=0200004", "drive": "離基地約 5 分", "stay_h": 1.0, "drive_min": 5, "total_h": 1.2, "season_months": [], "id": "p737e769a"}, {"name": "觀霧山椒魚生態中心", "lat": 24.5066481, "lng": 121.1144437, "town": "苗栗縣泰安鄉", "base": "guanwu", "theme": "trail-near", "kind": "生態園區", "diff": "散步", "time": "約 40 分鐘", "season": "", "desc": "國內首座以冰河時期孑遺物種國寶「觀霧山椒魚」為主題之國家公園生態教育展示館。館內設有山椒魚棲地復育區、高山生態影音解說廳、霧林帶生態模型，展示觀霧特有種植物棣慕華鳳仙花及台灣檫樹復育成果。", "note": "開館時間 09:00–16:30（每週一休館，遇國定假日順延）；免門票自由參觀；每日上午 10:00 提供定時免費專人解說導覽；館旁設有觀霧國家森林遊樂區遊客中心專用大型免費停車場；館內設有飲水機與公廁。", "tags": ["雨天", "親子", "避暑"], "sources": ["https://www.spnp.gov.tw/cp.aspx?n=14573", "https://recreation.forest.gov.tw/Forest/RA?typ_id=0200004"], "source": "https://www.spnp.gov.tw/cp.aspx?n=14573", "drive": "離基地約 5 分", "stay_h": 0.67, "drive_min": 5, "total_h": 0.8, "season_months": [], "id": "padfb2867"}, {"name": "雲霧步道", "lat": 24.5064251, "lng": 121.1152613, "town": "苗栗縣泰安鄉", "base": "guanwu", "theme": "trail-near", "kind": "景觀步道", "diff": "散步", "time": "環狀 848 公尺、約 30–40 分鐘", "season": "", "desc": "起點位於觀霧山椒魚生態中心後方，全長 848 公尺之全平整高架環狀木棧道。沿途築有三處制高觀景平台，天氣晴朗時可 180 度清晰遠眺大霸尖山、小霸尖山、雪山主峰勾勒出之壯麗聖稜線連峰與榛山全貌。", "note": "全天開放；免門票；步道入口緊鄰遊客中心大停車場；環狀步行一圈約 30–40 分鐘，階梯數百階但坡度平緩好走；高海拔紫外線強烈需防曬；雨後木棧道邊緣偶有濕滑，行走需留心踏點。", "tags": ["展望", "避暑", "親子"], "sources": ["https://recreation.forest.gov.tw/Forest/RA?typ_id=0200004", "https://www.spnp.gov.tw/"], "source": "https://recreation.forest.gov.tw/Forest/RA?typ_id=0200004", "drive": "離基地約 5 分", "stay_h": 0.67, "drive_min": 5, "total_h": 0.8, "season_months": [], "id": "p8e2f6d3f"}, {"name": "寶湖宮天地堂地母廟", "lat": 23.9514518, "lng": 120.9894656, "town": "南投縣埔里鎮", "base": "guokeng-puli", "theme": "heritage", "kind": "寺廟建築", "diff": "散步", "time": "約 1–1.5 小時", "season": "", "desc": "位於埔里金鶯山麓的地母信仰廟宇，建築依山分層，使用青綠琉璃瓦、石雕欄杆與朱紅梁柱。乾元殿可望埔里盆地。", "note": "園區全天開放參觀，附設大型免費停車場與洗手間；登上乾元殿需攀爬多層階梯，行動不便者可於一樓大殿參拜；廟方備有免費決明子茶與茶水供信眾飲用。", "tags": ["老宅", "展望", "親子"], "sources": ["http://www.timu.org.tw/"], "source": "http://www.timu.org.tw/", "drive": "離基地約 15 分", "stay_h": 1.5, "drive_min": 15, "total_h": 2.0, "season_months": [], "id": "paa17dbb7"}, {"name": "漫聚時光森林營地", "lat": 23.9732155, "lng": 120.9937343, "town": "南投縣埔里鎮", "base": "guokeng-puli", "zone": "埔里東郊", "theme": "lodging", "kind": "露營區", "diff": "開車", "time": "", "season": "", "desc": "位於埔里乾溪景觀橋旁，佔地達 6000 坪，距離國道 6 號埔里端出口僅約 2 分鐘車程。營區保留數十年樹齡之樟木與松樹，設有草皮自搭帳區、固定式豪華大型蓮花帳與水管小屋，並具備戲水池與兒童遊具設施。", "note": "自搭帳草地每帳約 1200–1500 元、固定式豪華帳平日約 3600–4800 元；可透過官網或電話預訂；鄰近埔里市區超商與加油站，生活補給便利；附設大型專屬停車場。", "tags": ["親子", "玩水"], "sources": ["https://yccfc.com.tw/"], "source": "https://yccfc.com.tw/", "drive": "離基地約 20 分", "stay_h": 0.5, "drive_min": 20, "total_h": 1.2, "season_months": [], "id": "p8b959a79"}, {"name": "相逢部落", "lat": 23.8943955, "lng": 120.9908738, "town": "南投縣仁愛鄉", "base": "guokeng-puli", "zone": "過坑山谷", "theme": "lodging", "kind": "豪華露營", "diff": "開車", "time": "", "season": "", "desc": "座落於仁愛鄉中正村平等巷山谷間，為全包式免搭帳豪華露營區。營區被原始樹林包圍，規劃大型球型帳與神殿帳，帳內配備冷暖空調、雙人床與獨立衛浴，提供一泊多食（含迎賓下午茶、手作DIY、豐盛晚餐與消夜調酒）。", "note": "雙人豪華帳一泊多食平日約 11000–14000 元、假日約 15000–18000 元；全預約制，需透過官方網站線上預訂；入營前有高爾夫球車接駁行李；附設專屬住客停車場。", "tags": ["需預約", "避暑", "親子"], "sources": ["https://xfcamp.vip/"], "source": "https://xfcamp.vip/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "pab13aae6"}, {"name": "虎頭山觀景平台", "lat": 23.9636164, "lng": 120.9891761, "town": "南投縣埔里鎮", "base": "guokeng-puli", "theme": "trail-near", "kind": "高台觀景", "diff": "散步", "time": "約 45–60 分鐘", "season": "", "desc": "位於埔里東北方虎頭山頂，海拔約 555 公尺，為台灣地理中心碑後方延伸之稜線高點。山頂平台氣流穩定，為台灣知名的飛行傘體驗基地，正對整個埔里盆地平原，向西可飽覽群山環抱之落日晚霞與璀璨夜景。", "note": "自埔里市區沿知安路上山車程約 8 分鐘，道路全線雙向通暢；觀景平台免費開放，旁設有公有停車場與景觀咖啡座；黃昏與入夜時分風勢較大，建議攜帶薄外套。", "tags": ["夕陽", "夜景", "展望", "親子"], "sources": ["https://travel.nantou.gov.tw/"], "source": "https://travel.nantou.gov.tw/", "drive": "離基地約 25 分", "stay_h": 1.0, "drive_min": 25, "total_h": 1.8, "season_months": [], "id": "paeaf9225"}, {"name": "金岳莎韻部落廚房（預約制）", "lat": 24.4709295, "lng": 121.7763471, "town": "宜蘭縣南澳鄉", "theme": "food", "kind": "原住民風味餐廳", "base": "jinyang-jinyue", "diff": "散步", "time": "約 1–1.5 小時", "desc": "部落廚房提供預約制風味餐，是以餐食理解金岳社區與在地食材的選項。", "note": "依店家要求提前預約；菜色、最低人數、費用與開餐日均以當期回覆為準。", "season": "", "tags": ["需預約"], "sources": ["https://www.facebook.com/sayunkitchen/", "https://travel.yilan.tw/"], "source": "https://www.facebook.com/sayunkitchen/", "drive": "離基地約 15 分", "stay_h": 1.5, "drive_min": 15, "total_h": 2.0, "season_months": [], "id": "pf13a1478"}, {"name": "莎韻紀念公園", "lat": 24.4486299, "lng": 121.7784321, "town": "宜蘭縣南澳鄉", "theme": "heritage", "kind": "歷史紀念公園", "base": "jinyang-jinyue", "diff": "散步", "time": "約 20–30 分鐘", "desc": "莎韻紀念公園紀念泰雅少女莎韻．哈勇在日治時期的事件，是進入金洋與金岳前理解大南澳歷史的一處停留點。", "note": "公園位於道路旁，短暫停留並注意車流；以現地解說和公部門資料為準，不將單一敘事延伸為部落整體歷史。", "season": "", "tags": ["中繼"], "sources": ["https://www.nanao.e-land.gov.tw/", "https://travel.yilan.tw/"], "source": "https://www.nanao.e-land.gov.tw/", "drive": "離基地約 10 分", "stay_h": 0.5, "drive_min": 10, "total_h": 0.8, "season_months": [], "id": "p1226bb7d"}, {"name": "那山那谷", "lat": 24.4365633, "lng": 121.749354, "town": "宜蘭縣南澳鄉", "theme": "lodging", "kind": "露營休閒莊園", "base": "jinyang-jinyue", "zone": "金洋深山溪谷", "diff": "開車", "time": "", "desc": "那山那谷位於金洋溪谷，提供露營及住宿選項，可與已預約的水域活動搭配。", "note": "營位、房型、設備與價格以官方訂位資訊為準；山區降雨可能影響道路與活動，預訂前確認取消規則。", "season": "", "tags": ["需預約"], "sources": ["https://nsng.tw/"], "source": "https://nsng.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p9584b3c4"}, {"name": "那山那谷漂漂河/溯溪/盪鞦韆Swing", "lat": 24.4363822, "lng": 121.7496921, "town": "宜蘭縣南澳鄉", "theme": "water", "kind": "水上漂流活動", "base": "jinyang-jinyue", "diff": "健行", "time": "約 2–2.5 小時", "desc": "那山那谷提供南澳南溪相關的預約制水域活動。活動是否成行取決於業者評估、天候、水位與參加者條件。", "note": "全預約制；不要引用固定費用。依業者要求使用裝備，豪雨、上游降雨或警示時取消活動。", "season": "4月-10月", "tags": ["玩水", "需預約"], "sources": ["https://nsngtubing.rezio.shop/zh-TW", "https://nsng.tw/"], "source": "https://nsngtubing.rezio.shop/zh-TW", "drive": "離基地約 5 分", "stay_h": 2.5, "drive_min": 5, "total_h": 2.7, "season_months": [4, 5, 6, 7, 8, 9, 10], "id": "swing"}, {"name": "金岳瀑布", "lat": 24.4685555, "lng": 121.7531077, "town": "宜蘭縣南澳鄉", "theme": "water", "kind": "深潭峽谷瀑布", "base": "jinyang-jinyue", "diff": "健行", "time": "約 1.5–2 小時", "desc": "金岳瀑布位於鹿皮溪谷，是溪流、岩壁與深潭組成的自然水域，不是設有救生管理的戲水園區。", "note": "只在道路、步道與天候均安全時前往；不跳水、不在深潭游泳，豪雨或上游降雨時完全避免入溪。", "season": "5月-10月", "tags": ["瀑布"], "sources": ["https://travel.yilan.tw/", "https://www.nanao.e-land.gov.tw/"], "source": "https://travel.yilan.tw/", "drive": "離基地約 20 分", "stay_h": 2.0, "drive_min": 20, "total_h": 2.7, "season_months": [5, 6, 7, 8, 9, 10], "id": "p13ce67c1"}, {"name": "朝陽漁港", "lat": 24.4610255, "lng": 121.8211573, "town": "宜蘭縣蘇澳鎮", "theme": "coast", "kind": "定置漁港", "base": "nanao-chaoyang", "diff": "散步", "time": "約 45–60 分鐘", "desc": "朝陽漁港是南澳沿海漁業與定置網作業的港口。漁獲進港與拍賣由漁船作業、天候及季節決定，不應列為固定時刻的保證活動。", "note": "若欲購買漁獲，先向港區或攤商確認當日作業；港區道路狹窄，勿占用作業區與車道。", "season": "", "tags": [], "sources": ["https://www.suao.gov.tw/", "https://travel.yilan.tw/"], "source": "https://www.suao.gov.tw/", "drive": "離基地約 5 分", "stay_h": 1.0, "drive_min": 5, "total_h": 1.2, "season_months": [], "id": "p72ff9d7b"}, {"name": "宜蘭南澳建華冰店", "lat": 24.4662857, "lng": 121.804367, "town": "宜蘭縣南澳鄉", "theme": "food", "kind": "傳統冰果老店", "base": "nanao-chaoyang", "diff": "散步", "time": "約 30–45 分鐘", "desc": "建華冰店是南澳車站周邊的在地冰品店，可作為抵達或離開南澳時的短暫補給。", "note": "營業日、品項、價格與停車以店家當日公告為準，台 9 線沿線不可任意臨停。", "season": "", "tags": [], "sources": ["https://travel.yilan.tw/", "https://www.nanao.e-land.gov.tw/"], "source": "https://travel.yilan.tw/", "drive": "離基地約 5 分", "stay_h": 0.75, "drive_min": 5, "total_h": 0.9, "season_months": [], "id": "p7e570b3a"}, {"name": "南澳生態教育館", "lat": 24.4678921, "lng": 121.7936484, "town": "宜蘭縣南澳鄉", "theme": "heritage", "kind": "生態植物園區", "base": "nanao-chaoyang", "diff": "散步", "time": "約 45–60 分鐘", "desc": "南澳生態教育館提供南澳自然、文化及森林經營主題的環境教育資訊，園區有原生樹木園區，現有 47 科、120 種植物。", "note": "免費參觀；室內服務時間為週一至週五 09:00–16:00，週六、週日及國定假日休館。進入鄰近保護區另須申請，勿把教育館開放視為保留區開放。", "season": "", "tags": ["親子"], "sources": ["https://www.forest.gov.tw/0000489", "https://travel.yilan.tw/"], "source": "https://www.forest.gov.tw/0000489", "drive": "離基地約 10 分", "stay_h": 1.0, "drive_min": 10, "total_h": 1.3, "season_months": [], "id": "p3342a5ea"}, {"name": "愛在大南澳民宿", "lat": 24.4652169, "lng": 121.8045113, "town": "宜蘭縣蘇澳鎮", "theme": "lodging", "kind": "休閒民宿", "base": "nanao-chaoyang", "zone": "南澳車站街區", "diff": "開車", "time": "", "desc": "民宿位於南澳車站周邊，適合作為朝陽漁港與步道的住宿選項。", "note": "房價、早餐與停車以業者回覆為準；原始來源不足以固定列示現行價格，套用前再確認。", "season": "", "tags": ["需預約"], "sources": ["https://yilannanao.mystrikingly.com/", "https://travel.yilan.tw/"], "source": "https://yilannanao.mystrikingly.com/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p8958c229"}, {"name": "朝陽步道", "lat": 24.4611582, "lng": 121.8192249, "town": "宜蘭縣蘇澳鎮", "theme": "trail-near", "kind": "國家步道", "base": "nanao-chaoyang", "diff": "健行", "time": "往返約 1.5–2 小時", "desc": "朝陽步道位於朝陽社區南側龜山，官方全長 2.2 公里、海拔 0 至 182 公尺。沿途通過大頭茶純林、桂竹林與風衝林，可觀察南澳漁港與蘇花海岸。", "note": "目前全線開放；由南澳漁港登山口進入，依體力與天候安排。雨後階梯濕滑，帶水並遵守步道告示。", "season": "", "tags": [], "sources": ["https://recreation.forest.gov.tw/Trail/RT?tr_id=022", "https://www.suao.gov.tw/"], "source": "https://recreation.forest.gov.tw/Trail/RT?tr_id=022", "drive": "離基地約 5 分", "stay_h": 2.0, "drive_min": 5, "total_h": 2.2, "season_months": [], "id": "pbc135f55"}, {"name": "三毛夢屋", "lat": 24.5739865, "lng": 121.105869, "town": "新竹縣五峰鄉", "base": "qingquan", "theme": "heritage", "kind": "名人故居", "diff": "散步", "time": "約 30–45 分鐘", "season": "", "desc": "三毛夢屋位於清泉聚落坡地，為作家三毛曾在清泉居住與工作相關的空間。它把文學記憶連到清泉的教會、部落與山谷地景，適合與張學良文化園區、清泉吊橋一帶以步行串聯。", "note": "由文化園區周邊步行上坡可達，坡道與階梯較陡，請穿平底防滑鞋。開放日、入內方式及消費規定可能調整，供應資訊未有可供本次交叉核實的個別官方公告，出發前請向營運方確認。", "tags": ["老宅"], "sources": ["https://travel.hsinchu.gov.tw/", "https://www.wufeng.gov.tw/"], "source": "https://travel.hsinchu.gov.tw/", "drive": "離基地約 5 分", "stay_h": 0.75, "drive_min": 5, "total_h": 0.9, "season_months": [], "id": "p02c382b7"}, {"name": "張學良文化園區", "lat": 24.5724819, "lng": 121.1054503, "town": "新竹縣五峰鄉", "base": "qingquan", "theme": "heritage", "kind": "歷史建築園區", "diff": "散步", "time": "約 1–1.5 小時", "season": "", "desc": "張學良與趙一荻於 1946 至 1957 年在清泉度過幽禁歲月。現址於 2014 年重建張學良故居，並與原住民族館整合為文化園區，展出照片、手稿與相關檔案，呈現清泉在近代政治史與地方文化中的位置。", "note": "開放時間為 09:00–17:00，週一、除夕及年初一休館，免費參觀；出發前仍請查詢園區最新公告。可利用鄰近公有停車場，雨後縣道 122 線與山區支路應留意落石及濕滑。", "tags": ["老宅", "親子", "雨天"], "sources": ["https://www.hchcc.gov.tw/", "https://travel.hsinchu.gov.tw/"], "source": "https://www.hchcc.gov.tw/", "drive": "離基地約 5 分", "stay_h": 1.5, "drive_min": 5, "total_h": 1.7, "season_months": [], "id": "p14d41e1e"}, {"name": "Ching Chuan Fountain of Youth Hostel", "lat": 24.5769308, "lng": 121.1038218, "town": "新竹縣五峰鄉", "base": "qingquan", "zone": "清泉溫泉聚落", "theme": "lodging", "kind": "教會招待所", "diff": "開車", "time": "", "season": "", "desc": "招待所位於清泉天主堂周邊，提供青年活動與旅宿空間，是清泉聚落中可與教會、三毛相關場域一併理解的住宿選項。", "note": "房型、價格、共用設施與入住規定需以教會或營運方當期回覆為準，請先電話或網站預約。所附網站未能在本次查核中取得足以固定列示的價位資料，請勿將舊價視為現行價格。", "tags": [], "sources": ["http://chingchuanhostel.catholic.org.tw/"], "source": "http://chingchuanhostel.catholic.org.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "ching-chuan-fountain-of-youth-hostel"}, {"name": "布拉谷民宿-五峰清泉", "lat": 24.5720704, "lng": 121.1113969, "town": "新竹縣五峰鄉", "base": "qingquan", "zone": "清泉溫泉聚落", "theme": "lodging", "kind": "原鄉民宿", "diff": "開車", "time": "", "season": "", "desc": "民宿位於清泉部落周邊，提供清泉過夜選項，適合把文化園區、溫泉與翌日上觀霧的行程拆開安排。", "note": "房價、早餐、晚餐與停車安排以業者當期公告為準，請透過業者提供的聯絡方式預訂。所附來源為業者資訊頁，未能由本次查核取得完整的房價與設施清單，訂房前請逐項確認。", "tags": ["親子"], "sources": ["https://sites.google.com/view/170tribe/bulagu"], "source": "https://sites.google.com/view/170tribe/bulagu", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p5bc4fb55"}, {"name": "清泉溫泉（將軍湯）", "lat": 24.573424, "lng": 121.1056151, "town": "新竹縣五峰鄉", "base": "qingquan", "theme": "water", "kind": "露天溫泉泡腳池", "diff": "散步", "time": "約 30–45 分鐘", "season": "", "desc": "清泉溫泉日治時期稱為井上溫泉，屬弱鹼性碳酸氫鈉泉；現地以露天泡腳池方式供人使用。它與張學良文化園區、清泉吊橋相鄰，可作為清泉聚落步行行程的短暫停留。", "note": "現場為泡腳設施，不等同全身湯屋；水溫受引水與天候影響，入池前先試溫並自備擦腳用品。是否全天開放及現場管理規定可能變動，請依現場公告。", "tags": ["溫泉", "親子"], "sources": ["https://travel.hsinchu.gov.tw/", "https://www.wufeng.gov.tw/"], "source": "https://travel.hsinchu.gov.tw/", "drive": "離基地約 5 分", "stay_h": 0.75, "drive_min": 5, "total_h": 0.9, "season_months": [], "id": "p989b0709"}, {"name": "七星潭海岸風景特定區", "lat": 24.0314268, "lng": 121.6271764, "town": "花蓮縣新城鄉", "base": "qixingtan", "theme": "coast", "kind": "月牙灣礫石海岸", "diff": "散步", "time": "約 1–1.5 小時", "season": "", "desc": "七星潭為長條弧形的礫石海灣，岸上可見灰黑礫石、太平洋與北側蘇花海崖輪廓。海岸坡降快，應在岸上賞景，不可下海游泳或追浪。", "note": "七星潭海域為斷層形成的極端陡降型海灣，離岸數公尺即有數十公尺深之深水海溝與強大暗湧，全線嚴禁下海戲水與游泳，切勿過度靠近浪腳；海岸風景區設有大型免費停車場、觀景步道與公共廁所。", "tags": ["展望", "避暑", "親子"], "sources": ["https://tour-hualien.hl.gov.tw/TourContent.aspx?n=242&s=1170", "https://www.sincheng.gov.tw/"], "source": "https://tour-hualien.hl.gov.tw/TourContent.aspx?n=242&s=1170", "drive": "離基地約 5 分", "stay_h": 1.5, "drive_min": 5, "total_h": 1.7, "season_months": [], "id": "pea9431e9"}, {"name": "七星柴魚博物館", "lat": 24.0271713, "lng": 121.6291292, "town": "花蓮縣新城鄉", "base": "qixingtan", "theme": "heritage", "kind": "產業博物館", "diff": "散步", "time": "約 45–60 分鐘", "season": "", "desc": "以柴魚加工為主題的產業文化博物館，前身為柴魚燻培工廠。四層樓展館以復刻燻焙房、模型與互動展示介紹黑潮漁業、柴魚分級及加工技藝，並提供手刨柴魚與章魚燒手作體驗。", "note": "館區自 2023 年起全面開放免收門票自由參觀（手作體驗與特色商品另計）；營業時間為 09:00–17:30（週三公休）；館方對面備有專屬免費停車場。", "tags": ["手作", "親子", "避暑"], "sources": ["http://www.katsuo.com.tw/", "https://tour-hualien.hl.gov.tw/TourContent.aspx?n=242&s=1171"], "source": "http://www.katsuo.com.tw/", "drive": "離基地約 5 分", "stay_h": 1.0, "drive_min": 5, "total_h": 1.2, "season_months": [], "id": "pa8b0bb8f"}, {"name": "四八高地戰備坑道", "lat": 24.0256408, "lng": 121.630255, "town": "花蓮縣新城鄉", "base": "qixingtan", "theme": "heritage", "kind": "軍事坑道", "diff": "散步", "time": "約 45–60 分鐘", "season": "", "desc": "位於海拔 48 公尺的海岸階地，為日軍開鑿、後由國軍擴建的戰備坑道。坑道長約 180 公尺，連接掩體與槍眼；出口可接曼波園區高台，望向七星潭海岸。", "note": "坑道開放自由參觀（開放時間 08:30–17:00，每週一休園維護）；坑道內部階梯較陡且光線微暗，建議牽好長輩與幼童慢行；曼波園區旁設有公有免費停車場與洗手間。", "tags": ["展望", "避暑", "親子"], "sources": ["http://mambo.hl999.url.tw/", "https://tour-hualien.hl.gov.tw/TourContent.aspx?n=242&s=1182"], "source": "http://mambo.hl999.url.tw/", "drive": "離基地約 5 分", "stay_h": 1.0, "drive_min": 5, "total_h": 1.2, "season_months": [], "id": "p025a3959"}, {"name": "七星潭渡假飯店", "lat": 24.0272201, "lng": 121.6305635, "town": "花蓮縣新城鄉", "base": "qixingtan", "zone": "七星潭海濱", "theme": "lodging", "kind": "度假飯店", "diff": "開車", "time": "", "season": "", "desc": "位於七星潭海灣第一排的旅宿，客房設有面海窗景與頂樓露台。館內提供研磨咖啡、冷飲與手工餅乾，住宿者可租借自行車。", "note": "海景雙人房平日約 2,200–2,800 元、假日約 3,200–4,200 元（含自助早餐）；可透過官網或訂房平台預訂；飯店免費提供住客自行車借用，適合清晨沿兩潭自行車道騎行；附設專屬室內外停車場。", "tags": ["展望", "親子", "自行車"], "sources": ["http://www.hotelbayview.com.tw/"], "source": "http://www.hotelbayview.com.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p3aa782e6"}, {"name": "去七星潭海景民宿", "lat": 24.0270943, "lng": 121.6307365, "town": "花蓮縣新城鄉", "base": "qixingtan", "zone": "七星潭海濱", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "位於七星潭大漢村明潭街巷內，步行至海堤約 2 分鐘。提供海景房與頂樓視野，房型以雙人與家庭旅客為主。", "note": "雙人海景套房平日約 1,400–1,800 元、假日約 2,200–2,800 元；可透過官網或電話預訂；提供免費 WiFi 與獨立衛浴空調；門前劃設免費停車位；全館室內嚴禁吸菸。", "tags": ["展望", "避暑"], "sources": ["https://go-qixingtan.com/"], "source": "https://go-qixingtan.com/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "pbc4bb13e"}, {"name": "踏浪星辰", "lat": 24.0257069, "lng": 121.6318348, "town": "花蓮縣花蓮市", "base": "qixingtan", "zone": "大漢田園", "theme": "lodging", "kind": "露營區", "diff": "開車", "time": "", "season": "", "desc": "位於七星潭後方田園草地，提供蓮花帳與露營車，帳內配有冷氣與床具。夜間觀星受雲量、月相與周邊照明影響，不保證可見星空。", "note": "豪華雙人帳平日約 2,800–3,800 元、假日約 4,000–5,000 元（含手作活力早餐）；需透過官方線上系統預訂；園區設有樹蔭兒童沙坑與小動物休憩區；附設專用住客平面停車場。", "tags": ["夜景", "展望", "親子"], "sources": ["https://tour-hualien.hl.gov.tw/", "https://m.facebook.com/100063784112349/"], "source": "https://tour-hualien.hl.gov.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p9d0f288f"}, {"name": "仁愛鄉萬豐村天主堂", "lat": 23.9455545, "lng": 121.07871, "town": "南投縣仁愛鄉", "base": "qubing", "theme": "heritage", "kind": "部落教堂", "diff": "散步", "time": "約 30–45 分鐘", "season": "", "desc": "座落於萬豐村布農族聚落高處，建於 1950 年代，為曲冰村民重要的宗教信仰與聚會中心。教堂建築採用石材與木構交融，外觀純樸莊嚴，前庭設有開闊觀景台，可居高臨下俯瞰萬豐河階農田與濁水溪河谷。", "note": "開放參觀外觀與庭院，進入聖堂內部請保持肅靜並脫帽；主日彌撒時間通常為週日上午，非教友參訪請避免干擾儀式；周邊巷道狹窄，建議將車輛停放於部落外側活動中心旁。", "tags": ["老宅", "展望", "避暑"], "sources": ["https://travel.nantou.gov.tw/"], "source": "https://travel.nantou.gov.tw/", "drive": "離基地約 5 分", "stay_h": 0.75, "drive_min": 5, "total_h": 0.9, "season_months": [], "id": "p05b638ae"}, {"name": "曲冰遺址 (Chuping Archaeological Site)", "lat": 23.955332, "lng": 121.0800996, "town": "南投縣仁愛鄉", "base": "qubing", "theme": "heritage", "kind": "考古遺址", "diff": "散步", "time": "約 30–40 分鐘", "season": "", "desc": "位於投83線旁濁水溪東岸河階高地，海拔約 750 公尺，為台灣高山地區首度發現的史前聚落遺址（經指定為國定考古遺址）。遺址年代距今約 2,000 至 3,000 年，曾出土大量新石器時代石斧、玉器、陶片及完整聚落石板棺群。", "note": "為保護出土古蹟免受風化侵蝕，考古挖掘坑目前已全數覆土回填保存，現場設置紀念石碑、休憩涼亭與解說展示牌供遊客理解史前文化；路旁設有專屬小型停車彎。", "tags": ["避暑"], "sources": ["https://nchdb.boch.gov.tw/"], "source": "https://nchdb.boch.gov.tw/", "drive": "離基地約 5 分", "stay_h": 0.67, "drive_min": 5, "total_h": 0.8, "season_months": [], "id": "chuping-archaeological-site"}, {"name": "剛剛好包棟民宿Gang Gang House", "lat": 23.9463155, "lng": 121.0762378, "town": "南投縣仁愛鄉", "base": "qubing", "zone": "曲冰聚落", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "位於萬豐村清華巷的包棟民宿，提供客房、廚房、客廳、卡拉OK及戶外烤肉區，適合多人住宿安排。", "note": "包棟住宿每晚約 4500–8000 元（依入住人數而定）；需透過官方粉絲專頁或電話預訂；部落內夜間極度寧靜，戶外活動請於 22:00 前降低音量；附設專用停車位。", "tags": ["避暑", "親子"], "sources": ["https://www.facebook.com/GangGangHouse37/"], "source": "https://www.facebook.com/GangGangHouse37/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "gang-gang-house"}, {"name": "曲冰部落岱牧露營區", "lat": 23.9339095, "lng": 121.0753873, "town": "南投縣仁愛鄉", "base": "qubing", "zone": "濁水溪谷營地", "theme": "lodging", "kind": "露營區", "diff": "開車", "time": "", "season": "", "desc": "位於投83線旁濁水溪上游河階地，坐擁開闊群山山景。營區規劃平整厚實草皮營位，周遭環境純樸無光害，早晨可沐浴在林蔭晨曦之中，夜間仰望無遮蔽之繁星銀河，為安靜放空之自然營地。", "note": "草地營位每帳約 1000–1200 元；採官網或電話預約；衛浴熱水水壓充足、環境維護整潔；全區禁止過度喧鬧，維護部落夜間安寧。", "tags": ["夜景", "避暑", "展望"], "sources": ["https://cyubingdaimu.com/"], "source": "https://cyubingdaimu.com/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p9c140e4f"}, {"name": "里列格營地", "lat": 23.928099, "lng": 121.071538, "town": "南投縣仁愛鄉", "base": "qubing", "zone": "濁水溪谷營地", "theme": "lodging", "kind": "露營區", "diff": "開車", "time": "", "season": "", "desc": "位於萬豐村南端河岸台地，設有階梯式草坪營位，可望濁水溪河床與周邊山稜。", "note": "自搭帳營位每帳約 1000–1200 元；採電話或臉書粉絲頁預訂；水電衛浴齊備且提供吹風機與冷藏冰箱；山區早晚溫差大，需攜帶足夠保暖衣物。", "tags": ["夜景", "避暑", "展望"], "sources": ["https://www.facebook.com/abis777/"], "source": "https://www.facebook.com/abis777/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p17479e92"}, {"name": "Wanfeng Suspension Bridge", "lat": 23.9583151, "lng": 121.075729, "town": "南投縣仁愛鄉", "base": "qubing", "theme": "trail-near", "kind": "吊橋步道", "diff": "散步", "time": "約 30–45 分鐘", "season": "", "desc": "萬豐吊橋橫跨濁水溪谷，過去是曲冰通往對岸耕地與獵場的聯外通道。橋面狹窄，兩端停車空間有限，須由投83較寬的路肩步行下切。", "note": "吊橋限載人數 10 人，橋面狹窄僅容單人交會；橋頭兩側路肩狹小無法停車，需由投83線路肩寬闊處步行下切水泥便道抵達；大雨或強風期間行走需特別留意安全。", "tags": ["峽谷", "展望", "避暑"], "sources": ["http://www.nantou.gov.tw/"], "source": "http://www.nantou.gov.tw/", "drive": "離基地約 5 分", "stay_h": 0.75, "drive_min": 5, "total_h": 0.9, "season_months": [], "id": "wanfeng-suspension-bridge"}, {"name": "曲冰峽谷", "lat": 23.9568098, "lng": 121.0816694, "town": "南投縣仁愛鄉", "base": "qubing", "theme": "trail-near", "kind": "峽谷地形", "diff": "開車", "time": "約 20–30 分鐘", "season": "", "desc": "位於投83線曲冰至萬豐之間之濁水溪峽谷觀景段，地質屬變質砂岩與板岩互層。因河流下切侵蝕作用強烈，形成幾近垂直的石壁與河階地形，公路緊貼山壁蜿蜒而行，沿途設有多處遠眺峽谷深壑的展望點。", "note": "此處為公路沿線之觀景節點，路旁設有觀景護欄與解說告示牌；山區落石多發路段請勿久留，颱風或豪雨警報發布後應避免前往。", "tags": ["峽谷", "展望", "避暑"], "sources": ["http://nrch.culture.tw/twpedia.aspx?id=8065"], "source": "http://nrch.culture.tw/twpedia.aspx?id=8065", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p7a381c9d"}, {"name": "天送埤林鐵文創園區（太平山林鐵）", "lat": 24.6626851, "lng": 121.6193472, "town": "宜蘭縣三星鄉", "base": "sanxing-tiansongpi", "theme": "heritage", "kind": "林鐵車站", "diff": "散步", "time": "約 1–1.5 小時", "season": "", "desc": "建於 1921 年，為昔日羅東森林鐵路平原段的客貨轉運中繼站。園區保留檜木站房、轉車盤與火車迴轉軌道，並設有復刻五分車台車體驗與林業歷史展示。", "note": "全天開放免費參觀外圍鐵道公園，搭乘復刻蒸氣小火車單趟每人 50 元；周邊緊鄰三星蔥油餅與味珍香卜肉等名店；附設大型免費停車場與洗手間。", "tags": ["看火車", "老宅", "親子", "中繼"], "sources": ["https://www.tsp-station.org/"], "source": "https://www.tsp-station.org/", "drive": "離基地約 5 分", "stay_h": 1.5, "drive_min": 5, "total_h": 1.7, "season_months": [], "id": "pb7474b8c"}, {"name": "天送幸福和苑", "lat": 24.6628368, "lng": 121.6184668, "town": "宜蘭縣三星鄉", "base": "sanxing-tiansongpi", "zone": "天送埤街區", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "座落於天送埤車站古蹟旁，為典雅風格之獨棟包棟式渡假民宿。環境鬧中取靜，庭院植栽雅緻，室內採和風無印設計與高品質寢具，提供廚房、客廳及專屬停車空間，適合成員眾多的家庭團體。", "note": "包棟平日約 18000–22000 元、假日約 24000–28000 元（可容納 10–14 人）；可透過官網或電話預訂；緊鄰歷史鐵道古蹟，全社區與園區嚴禁施放煙火；附設專屬停車位。", "tags": ["親子"], "sources": ["https://www.tiansong-villa.com.tw/"], "source": "https://www.tiansong-villa.com.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p907b6a26"}, {"name": "星亮點Kayu露營區", "lat": 24.6780658, "lng": 121.6012158, "town": "宜蘭縣大同鄉", "base": "sanxing-tiansongpi", "zone": "崙埤台地", "theme": "lodging", "kind": "露營區", "diff": "開車", "time": "", "season": "", "desc": "座落於大同鄉崙埤村雪山山脈支脈台地上，海拔約 300 公尺。營區視野開闊無遮蔽，正面俯瞰蘭陽平原街景與龜山島海平線，設有自搭帳草地碎石營位、免搭帳狩獵帳以及沙坑、鞦韆等兒童遊憩設施。", "note": "自搭帳草地營位每帳約 1200–1500 元、狩獵帳雙人平日約 2800–3600 元；需透過官方網站線上預約系統預訂；水電衛浴齊備；通往營區之山區產業道路路幅較狹窄，會車需減速。", "tags": ["夜景", "展望", "親子"], "sources": ["https://www.kayucamp.com/"], "source": "https://www.kayucamp.com/", "drive": "離基地約 10 分", "stay_h": 0.5, "drive_min": 10, "total_h": 0.8, "season_months": [], "id": "kayu"}, {"name": "艾麗絲泉民宿", "lat": 24.6654898, "lng": 121.6243916, "town": "宜蘭縣三星鄉", "base": "sanxing-tiansongpi", "zone": "天送埤街區", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "位於三星天送埤老爺山莊別墅區，距天送埤車站約 900 公尺。提供雙人房、四人房及包棟住宿，設有陽台與庭院。", "note": "雙人房平日約 2200–2800 元、假日約 3000–3800 元（含手作早餐）；可透過官網或電話預訂；提供住客專屬免費停車位；全面室內禁菸。", "tags": ["親子"], "sources": ["https://www.alicesprings.com.tw/"], "source": "https://www.alicesprings.com.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p02c26081"}, {"name": "九寮溪自然步道", "lat": 24.6737613, "lng": 121.5995228, "town": "宜蘭縣大同鄉", "base": "sanxing-tiansongpi", "theme": "trail-near", "kind": "溪谷瀑布步道", "diff": "健行", "time": "往返約 2.5–3 小時", "season": "", "desc": "位於大同鄉崙埤村九寮溪生態園區內，步道沿九寮溪溪岸向山區深入，單程長度約 3 公里。沿途穿梭於亞熱帶茂密雨林與闊葉林，串聯崖躍吊橋、巴尬吊橋等特色繩索橋樑，步道終點為高約 30 公尺之戈霸瀑布。", "note": "由停車場至管制步道起點需先步行平緩水泥路約 1 公里（約 15 分鐘）；步道全線起伏平緩、多林蔭，林務局整理之木棧道與碎石路況良好；入口處設有大型收費停車場（小型車 50 元）與公廁。", "tags": ["瀑布", "玩水", "避暑", "親子"], "sources": ["https://recreation.forest.gov.tw/Trail/RT?tr_id=012"], "source": "https://recreation.forest.gov.tw/Trail/RT?tr_id=012", "drive": "離基地約 5 分", "stay_h": 3.0, "drive_min": 5, "total_h": 3.2, "season_months": [], "id": "p172ef995"}, {"name": "奮起湖車庫", "lat": 23.505587, "lng": 120.6954491, "town": "嘉義縣竹崎鄉", "base": "shizhuo-fenqihu", "theme": "heritage", "kind": "鐵道古蹟", "diff": "散步", "time": "約 30–45 分鐘", "season": "", "desc": "阿里山林業鐵路蒸汽火車頭時代的重要保養檢修車庫，木造桁架結構原貌保存良好。內部常態展示 28 號與 29 號 18 噸 Shay 式直立式汽缸蒸汽機車頭、蒸汽加水塔、舊式鐵道車床機具以及豐富之百年林鐵修築歷史文物。", "note": "開放時間為每日 08:00–16:00，免費參觀；緊鄰奮起湖車站月台，參觀時切勿跨越營運中之鐵軌警示線。", "tags": ["看火車", "老宅", "親子"], "sources": ["https://afrch.forest.gov.tw/0000150"], "source": "https://afrch.forest.gov.tw/0000150", "drive": "離基地約 5 分", "stay_h": 0.75, "drive_min": 5, "total_h": 0.9, "season_months": [], "id": "peb935f48"}, {"name": "奮起湖大飯店", "lat": 23.505324, "lng": 120.695108, "town": "嘉義縣竹崎鄉", "base": "shizhuo-fenqihu", "zone": "奮起湖老街", "theme": "lodging", "kind": "飯店", "diff": "開車", "time": "", "season": "", "desc": "位於奮起湖老街入口與車站附近，提供日式房型與原木裝潢客房，館內設有便當店與在地步道導覽服務。", "note": "雙人房平日約 1900–2600 元、假日約 2800–3800 元（附贈 7-Eleven 早餐兌換券）；可透過官網、電話或訂房平台預訂；附設專用地下停車場；熱水採定時供應（晚間與清晨）。", "tags": ["老宅", "避暑", "親子"], "sources": ["https://www.fenchihu.com.tw/"], "source": "https://www.fenchihu.com.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "pd06aecf4"}, {"name": "綠香茶園民宿", "lat": 23.4741777, "lng": 120.7030989, "town": "嘉義縣竹崎鄉", "base": "shizhuo-fenqihu", "zone": "頂石棹", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "座落於石棹茶區山坡上，四周被翠綠的茶樹梯田層層圍繞。客房設有大面觀景窗，拉開窗簾即可遠眺山巒雲海與落日餘暉，民宿自家經營茶廠，住客可品茗高山烏龍並品嘗茶葉入菜的在地風味晚餐。", "note": "雙人房平日約 2600–3400 元、假日約 3400–4200 元（含手作早餐）；需透過電話預約訂房；附設專用露天停車場；提供茶油雞等無菜單風味合菜需提前預訂。", "tags": ["夕陽", "展望", "避暑"], "sources": ["https://travel.chiayi.gov.tw/"], "source": "https://travel.chiayi.gov.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p84f93085"}, {"name": "阿將的家23咖啡館", "lat": 23.4612219, "lng": 120.6980397, "town": "嘉義縣阿里山鄉", "base": "shizhuo-fenqihu", "zone": "頂石棹", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "位於樂野與達邦交界山脊，由鄒族營主耗時多年以一磚一石手工堆砌而成之石頭木造藝術莊園。園區結合手沖阿里山咖啡、鐵藝多肉造景、貓咪庭院與巨石特色客房，展現獨特的鄒式手作美學與高山景觀。", "note": "雙人石頭屋住宿平日約 3800–4800 元、假日約 4800–6000 元（含早餐）；採全預約制（官方 Line 預訂）；進入莊園聯絡道路較狹窄，會車需留意；咖啡館內用需遵守入園低消規定。", "tags": ["需預約", "老宅", "避暑"], "sources": ["https://www.facebook.com/ajanghome/"], "source": "https://www.facebook.com/ajanghome/", "drive": "離基地約 10 分", "stay_h": 0.5, "drive_min": 10, "total_h": 0.8, "season_months": [], "id": "23"}, {"name": "阿里山石窯園露營區", "lat": 23.4877699, "lng": 120.682339, "town": "嘉義縣竹崎鄉", "base": "shizhuo-fenqihu", "zone": "頂石棹", "theme": "lodging", "kind": "露營區", "diff": "開車", "time": "", "season": "", "desc": "位於頂石棹往光華方向的森林山谷，提供碎石、草地營位與水管屋。園內有柴燒石窯，窯烤活動須依營區當期公告與預約安排。", "note": "自搭帳營位每帳約 1000–1200 元、水管屋雙人約 1800–2400 元；需透過臉書粉絲專頁或電話預訂；提供冷藏冰箱與熱水衛浴；窯烤體驗需視當日開窯狀況報名。", "tags": ["親子", "避暑"], "sources": ["https://www.facebook.com/shiyaoyuan888/"], "source": "https://www.facebook.com/shiyaoyuan888/", "drive": "離基地約 10 分", "stay_h": 0.5, "drive_min": 10, "total_h": 0.8, "season_months": [], "id": "p5a5d86d9"}, {"name": "奮起湖老街", "lat": 23.5051199, "lng": 120.6949355, "town": "嘉義縣竹崎鄉", "base": "shizhuo-fenqihu", "theme": "oldstreet", "kind": "老街聚落", "diff": "散步", "time": "約 1–1.5 小時", "season": "", "desc": "位於海拔約 1,400 公尺的山城聚落，街道沿坡地與石板路延伸約 500 公尺。早期是阿里山林業鐵路的重要客貨交會站，現有木造店鋪、鐵路便當與在地小吃。", "note": "老街街道狹窄全線為步行階梯，推車動線較受限；車輛可停放在第一或第二公有收費停車場（假日上午易滿位）；平日多數店家營業至 17:00，假日營業至 18:00。", "tags": ["親子", "避暑"], "sources": ["https://www.ali-nsa.net/zh-tw/attractions/detail/157"], "source": "https://www.ali-nsa.net/zh-tw/attractions/detail/157", "drive": "離基地約 5 分", "stay_h": 1.5, "drive_min": 5, "total_h": 1.7, "season_months": [], "id": "p89125050"}, {"name": "百年肖楠林", "lat": 23.5040836, "lng": 120.6954727, "town": "嘉義縣竹崎鄉", "base": "shizhuo-fenqihu", "theme": "trail-near", "kind": "巨木步道", "diff": "散步", "time": "約 20–30 分鐘", "season": "", "desc": "位於奮起湖老街下方山坡，為 1910 年代栽植的台灣肖楠林。林內有木棧環狀步道與休憩平台，可由老街步行前往。", "note": "由老街下坡階梯步行約 3 分鐘即達，全線平緩好走；林間潮濕，木棧道表面偶有青苔，行走需小心防滑；步道無公廁，可先於老街或車站洗手間使用。", "tags": ["巨木", "避暑", "親子"], "sources": ["https://www.ali-nsa.net/"], "source": "https://www.ali-nsa.net/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p9e110efb"}, {"name": "石棹琉璃光", "lat": 23.4779001, "lng": 120.7023532, "town": "嘉義縣竹崎鄉", "base": "shizhuo-fenqihu", "theme": "trail-near", "kind": "夜景觀景點", "diff": "開車", "time": "約 30–40 分鐘", "season": "11月-3月", "desc": "位於頂石棹培仔桶林道旁之開闊制高點，海拔約 1,400 公尺。秋冬時節因冷空氣沉降，石棹谷地常聚集厚實低空雲海，入夜後聚落家戶燈火與行經公路的車燈透過薄霧層層折射，呈現如彩繪玻璃般斑斕絢麗的琉璃光景致。", "note": "琉璃光現象好發於秋冬季（11月至隔年3月）鋒面來臨前後；觀景處位於產業道路彎道旁，夜間無路燈，需攜帶手電筒照明並注意往來會車；周邊嚴禁違規停車阻礙農作車輛進出。", "tags": ["夜景", "展望", "避暑"], "sources": ["https://tbocc.cyhg.gov.tw/Sight_Content.aspx?n=100317&s=513515"], "source": "https://tbocc.cyhg.gov.tw/Sight_Content.aspx?n=100317&s=513515", "drive": "離基地約 5 分", "stay_h": 0.67, "drive_min": 5, "total_h": 0.8, "season_months": [1, 2, 3, 11, 12], "id": "pc4a0c2be"}, {"name": "霞之道 北口", "lat": 23.4796847, "lng": 120.7016289, "town": "嘉義縣竹崎鄉", "base": "shizhuo-fenqihu", "theme": "trail-near", "kind": "茶園步道", "diff": "散步", "time": "往返約 30–45 分鐘", "season": "", "desc": "頂石棹步道群中的茶園步道，全長約 250 公尺，海拔約 1,450 公尺。木棧階梯穿過烏龍茶園與孟宗竹林，北口向西望曾文溪河谷。", "note": "北口步道旁僅能停靠少數車輛，建議將車輛停於石棹遊客服務中心或周邊民宿後步行前往；傍晚山風漸起，建議備妥防風保暖衣物。", "tags": ["夕陽", "展望", "避暑"], "sources": ["https://www.ali-nsa.net/mountain/zh-tw/trail/18"], "source": "https://www.ali-nsa.net/mountain/zh-tw/trail/18", "drive": "離基地約 5 分", "stay_h": 0.75, "drive_min": 5, "total_h": 0.9, "season_months": [], "id": "pb808ce81"}, {"name": "台灣基督長老教會司馬庫斯教會", "lat": 24.577585, "lng": 121.332632, "town": "新竹縣尖石鄉", "base": "smangus", "theme": "heritage", "kind": "部落教堂", "diff": "散步", "time": "約 30–45 分鐘", "season": "", "desc": "教會位在司馬庫斯部落生活範圍內，是理解部落信仰與共同生活脈絡的場所。參訪應以不干擾居民與禮拜活動為前提。", "note": "是否開放室內、禮拜與活動時段以教會及部落現場安排為準；請勿將教會當作可自由進入的展示空間。", "tags": [], "sources": ["https://smangus.org/", "https://www.pct.org.tw/"], "source": "https://smangus.org/", "drive": "離基地約 5 分", "stay_h": 0.75, "drive_min": 5, "total_h": 0.9, "season_months": [], "id": "pe10f02f5"}, {"name": "司馬庫斯迦南小木屋", "lat": 24.5780701, "lng": 121.3375838, "town": "新竹縣尖石鄉", "base": "smangus", "zone": "司馬庫斯部落核心", "theme": "lodging", "kind": "渡假木屋", "diff": "開車", "time": "", "season": "", "desc": "迦南小木屋是司馬庫斯部落共同經營的住宿選項之一。住宿可把抵達後的部落步行與翌日巨木群健行拆開安排，減少同日長程駕駛與健行的負荷。", "note": "由部落官方訂房系統或電話預訂；房型、價格與餐食依當期公告。櫻花季可能需配合總量管制及通行證，請勿以訂到房間推定必然可自由通行。", "tags": ["需預約", "避暑"], "sources": ["https://smangus.org/lodging.html"], "source": "https://smangus.org/lodging.html", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p0ca02b8f"}, {"name": "司馬庫斯巨木群", "lat": 24.5751392, "lng": 121.3663543, "town": "新竹縣尖石鄉", "base": "smangus", "theme": "trail-mountain", "kind": "千年檜木步道", "diff": "健行", "time": "往返約 4–5 小時", "season": "", "desc": "巨木群位於部落以東、海拔約 1,600 公尺的森林中。部落官方資料記載最大紅檜 Yaya Qparung 周長 20.5 公尺、樹齡二千多年；步行的價值在於認識紅檜森林與部落維護的山林環境。", "note": "步道禁止機車、腳踏車與生火野炊。山路車況、季節性通行證與部落總量管制依最新公告變動；出發前確認，並預留完整往返時間與天候備案。", "tags": ["巨木", "避暑"], "sources": ["https://smangus.org/gianttrees.html", "https://travel.hsinchu.gov.tw/"], "source": "https://smangus.org/gianttrees.html", "drive": "離基地約 15 分", "stay_h": 5.0, "drive_min": 15, "total_h": 5.5, "season_months": [], "id": "pa8669d51"}, {"name": "玉蘭茶園觀景臺", "lat": 24.6740321, "lng": 121.5846858, "town": "宜蘭縣大同鄉", "base": "songluo-yulan", "theme": "cafe", "kind": "茶園觀景", "diff": "開車", "time": "約 1–1.5 小時", "season": "", "desc": "位於台7線上方的玉蘭茶園坡地，設有涼亭與品茗座椅。天候清朗時可向東望蘭陽平原與蘭陽溪谷，周圍為梯田式茶園。", "note": "現場提供茶具組與茶葉租借泡茶，亦販售茶燻蛋、茶香滷味與合菜；山頂道路較為狹窄，會車需禮讓；觀景台周邊附設免費小型停車場與公共洗手間。", "tags": ["展望", "夕陽", "中繼", "親子"], "sources": ["https://www.sunshin.org.tw/yulan/"], "source": "https://www.sunshin.org.tw/yulan/", "drive": "離基地約 10 分", "stay_h": 1.5, "drive_min": 10, "total_h": 1.8, "season_months": [], "id": "p86558ded"}, {"name": "牛鬥一角宜蘭露營區民宿", "lat": 24.6348816, "lng": 121.5684732, "town": "宜蘭縣三星鄉", "base": "songluo-yulan", "zone": "牛鬥農莊", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "位於牛鬥橋旁的蘭陽溪南岸台地，鄰近台7丙線終點。提供獨棟木屋套房與草地營位，園內有落羽松、果樹及親子活動空間。", "note": "小木屋雙人房平日約 2500–3200 元、草地露營每帳約 1000 元；可透過官網或電話訂房；園區附設免費停車場；全區禁止施放煙火與喧鬧。", "tags": ["親子"], "sources": ["http://www.newdow.com.tw/"], "source": "http://www.newdow.com.tw/", "drive": "離基地約 15 分", "stay_h": 0.5, "drive_min": 15, "total_h": 1.0, "season_months": [], "id": "p5edd408e"}, {"name": "玉蘭茶園露營區", "lat": 24.67472, "lng": 121.584629, "town": "宜蘭縣大同鄉", "base": "songluo-yulan", "zone": "玉蘭茶園", "theme": "lodging", "kind": "露營區", "diff": "開車", "time": "", "season": "", "desc": "位於玉蘭茶園坡地，營位沿茶園地形分布，設有遮雨棚與碎石營位。營區面向蘭陽溪流域，夜間可視當日天候觀察平原燈火。", "note": "一帳營位費用約 1000–1200 元；採電話或官方預約；水電與衛浴設備齊全，熱水 24 小時供應；山頂產業道路狹小，夜間開車上山需放慢車速。", "tags": ["夜景", "展望", "避暑"], "sources": ["https://ioutrave.weebly.com/yulanchayuanluyingcyu.html"], "source": "https://ioutrave.weebly.com/yulanchayuanluyingcyu.html", "drive": "離基地約 10 分", "stay_h": 0.5, "drive_min": 10, "total_h": 0.8, "season_months": [], "id": "p85e1004b"}, {"name": "逢春園渡假別墅", "lat": 24.6686883, "lng": 121.597991, "town": "宜蘭縣大同鄉", "base": "songluo-yulan", "zone": "玉蘭茶園", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "座落於玉蘭茶園半山腰，佔地千坪，為大同鄉歷史悠久的莊園民宿。園區擁有修剪整齊之開闊草坪與庭院造景，遠眺蘭陽溪河谷，提供雙人及四人景觀客房，主打在地茶香手作無菜單料理。", "note": "雙人房平日約 3400–4200 元、假日約 4000–5200 元（含精緻早餐）；訂房可透過官網或電話預訂；提供專屬戶外停車場；為維護住宿品質全面禁菸。", "tags": ["避暑"], "sources": ["https://fengchunvilla.com.tw/"], "source": "https://fengchunvilla.com.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p5f359fef"}, {"name": "松羅國家步道", "lat": 24.6687206, "lng": 121.5631729, "town": "宜蘭縣大同鄉", "base": "songluo-yulan", "theme": "trail-near", "kind": "溪谷步道", "diff": "散步", "time": "往返約 2 小時", "season": "", "desc": "沿著松羅溪開闢的林蔭步道，全長約 2 公里，早期為泰雅族獵徑。步道全程依傍溪流，沿途綠樹遮蔭、林相原始茂密，包含巨石溪澗、繩索吊橋與水域生態，水質清澈可見苦花魚悠游。", "note": "由管制鐵門至步道入口需先步行碎石產業道路約 1.5 公里（約 20 分鐘）；步道平緩好走，雨後部分路段濕滑；步道外側設有免費大型停車場與公廁。", "tags": ["避暑", "玩水", "親子"], "sources": ["https://hiking.biji.co/index.php?q=trail&act=detail&id=372"], "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=372", "drive": "離基地約 10 分", "stay_h": 2.0, "drive_min": 10, "total_h": 2.3, "season_months": [], "id": "p8c192901"}, {"name": "太魯閣牌樓", "lat": 24.155504, "lng": 121.6216294, "town": "花蓮縣秀林鄉", "base": "tailuge-tianxiang", "theme": "heritage", "kind": "地標牌樓", "diff": "散步", "time": "約 20–30 分鐘", "season": "", "desc": "建於 1960 年，座落於中橫公路東端起點與錦文橋頭，為台灣公路工程的代表性歷史地標。牌樓採中國傳統宮殿式瓦頂建築，題字「東西橫貫公路」，見證中橫公路開鑿歷史，一旁銜接整修完成之錦文橋人行景觀步道。", "note": "牌樓位於台8線車流要道，臨停拍照需嚴格使用牌樓旁專屬停車避車彎，切勿站立於公路中央；旁側設有太魯閣紀念碑與解說看板，可步行漫步錦文橋眺望立霧溪出海口河谷。", "tags": ["展望", "親子"], "sources": ["https://www.taroko.gov.tw/AttractionTrailContent.aspx?n=5511&sms=11272&s=1", "https://tour-hualien.hl.gov.tw/TourContent.aspx?n=242&s=1175"], "source": "https://www.taroko.gov.tw/AttractionTrailContent.aspx?n=5511&sms=11272&s=1", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "pcff05846"}, {"name": "太魯閣遊客中心", "lat": 24.1577097, "lng": 121.6222261, "town": "花蓮縣秀林鄉", "base": "tailuge-tianxiang", "theme": "heritage", "kind": "國家公園展館", "diff": "散步", "time": "約 1–1.5 小時", "season": "", "desc": "座落於太魯閣台地，為太魯閣國家公園管理處所在地與進入峽谷前的全方位導覽基地。館內設有「生態館」、「人與自然館」及特展室，透過大型地質模型、互動多媒體與標本，系統性介紹太魯閣大理岩峽谷成因、泰雅與太魯閣族人文歷史。", "note": "開放時間與休館日依太管處公告；附設停車場、餐飲販賣部與公共洗手間。可在此確認步道與台8線最新開放資訊。", "tags": ["避暑", "親子"], "sources": ["https://www.taroko.gov.tw/VisitorCenterContent.aspx?n=5507&sms=11267&s=1"], "source": "https://www.taroko.gov.tw/VisitorCenterContent.aspx?n=5507&sms=11267&s=1", "drive": "離基地約 5 分", "stay_h": 1.5, "drive_min": 5, "total_h": 1.7, "season_months": [], "id": "p53ba9a32"}, {"name": "祥德寺", "lat": 24.1794017, "lng": 121.4960416, "town": "花蓮縣秀林鄉", "base": "tailuge-tianxiang", "theme": "heritage", "kind": "高山佛寺", "diff": "散步", "time": "約 1–1.5 小時", "season": "", "desc": "建於 1968 年，位於天祥立霧溪與大沙溪匯流處對岸的河階山頭。由天祥步過普渡橋後沿階梯而上，寺區有七層天峰塔、高 36 尺白衣大士立像與地藏菩薩聖像，可望天祥台地與立霧溪谷。", "note": "寺院開放時間為 08:00–16:00；由普渡橋至大殿需步行約 15 分鐘連續上坡階梯；進入佛門淨地請保持莊重肅靜；天祥公車總站旁設有大型停車場與公廁。", "tags": ["展望", "避暑"], "sources": ["https://www.taroko.gov.tw/AttractionTrailContent.aspx?n=5511&sms=11272&s=40", "http://www.dizapusa.org.tw/"], "source": "https://www.taroko.gov.tw/AttractionTrailContent.aspx?n=5511&sms=11272&s=40", "drive": "離基地約 20 分", "stay_h": 1.5, "drive_min": 20, "total_h": 2.2, "season_months": [], "id": "pa083f5ad"}, {"name": "太魯閣天祥青年活動中心", "lat": 24.185528, "lng": 121.4932968, "town": "花蓮縣秀林鄉", "base": "tailuge-tianxiang", "zone": "天祥台地", "theme": "lodging", "kind": "青年活動中心", "diff": "開車", "time": "", "season": "", "desc": "位於天祥高台樹林間，提供雙人房、四人房與背包床位，附設餐廳與交誼空間。適合需在天祥過夜、並能配合台8放行時段的行程。", "note": "雙人客房平日約 1,600–2,200 元、假日約 2,200–2,800 元（含早餐）；可透過救國團官網或電話預訂；進出需注意台8線太魯閣段每日定時放行交管時段；附設專屬平面停車場。", "tags": ["避暑", "親子"], "sources": ["http://tienhsiang.cyh.org.tw/", "https://www.thb.gov.tw/"], "source": "http://tienhsiang.cyh.org.tw/", "drive": "離基地約 25 分", "stay_h": 0.5, "drive_min": 25, "total_h": 1.3, "season_months": [], "id": "pc90135d6"}, {"name": "太魯閣晶英酒店 Silks Place Taroko", "lat": 24.1809788, "lng": 121.4942235, "town": "花蓮縣秀林鄉", "base": "tailuge-tianxiang", "zone": "天祥台地", "theme": "lodging", "kind": "頂級度假酒店", "diff": "開車", "time": "", "season": "", "desc": "位於天祥台地，客房結合現代設計與原住民編織元素；頂樓設有溫水泳池、水療池與夜間活動空間。自駕進出須配合台8線當日道路管制。", "note": "雙人房平日約 8,200–11,000 元、假日約 11,000–15,000 元（含精緻早晚餐）；需透過晶華集團官網或電話預訂；自駕前往需嚴格配合台8線中橫公路施工放行時段（每日 07:00~08:00、10:00、12:00~13:00、15:00、16:30~17:30 放行，夜間封閉），飯店備有住客專屬地下停車場與接駁車服務。", "tags": ["避暑", "夜景", "親子"], "sources": ["https://taroko.silksplace.com/tw/", "https://www.thb.gov.tw/"], "source": "https://taroko.silksplace.com/tw/", "drive": "離基地約 20 分", "stay_h": 0.5, "drive_min": 20, "total_h": 1.2, "season_months": [], "id": "silks-place-taroko"}, {"name": "遊手浩賢民宿", "lat": 24.142009, "lng": 121.6341472, "town": "花蓮縣秀林鄉", "base": "tailuge-tianxiang", "zone": "太魯閣口富世", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "位於秀林鄉富世部落，距太魯閣牌樓與遊客中心車程約 2 分鐘。提供客房、部落周邊資訊與庭院停車空間，適合作為不進入天祥時的峽谷入口住宿選項。", "note": "雙人客房平日約 1,800–2,200 元、假日約 2,200–2,800 元；可透過電話或訂房平台預約；位於平地省道旁無山路管制風險；提供專用庭院停車位。", "tags": ["親子", "避暑"], "sources": ["https://tour-hualien.hl.gov.tw/"], "source": "https://tour-hualien.hl.gov.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p9df7806e"}, {"name": "綠水步道", "lat": 24.1787312, "lng": 121.5082293, "town": "花蓮縣秀林鄉", "base": "tailuge-tianxiang", "theme": "trail-mountain", "kind": "合歡越嶺古道", "diff": "健行", "time": "約 45–60 分鐘", "season": "", "desc": "原為日治時期合歡越嶺警備道之一段，全長約 2 公里，路寬維持約 2 公尺平緩規格。步道沿山壁開鑿，穿行於茂密的樟科楠木林與岩生植物帶，中段設有一座長約 30 公尺之小岩洞隧道與橫跨深壑之木棧道，俯瞰下方立霧溪大理石峽谷與曲流景觀。", "note": "綠水步道與台8通行狀態會隨災後復建及天候調整；出發日須同時查太魯閣國家公園與公路局公告。未開放時不得列入行程，改以太魯閣口周邊的可開放點替代。", "tags": ["峽谷", "展望", "避暑"], "sources": ["https://www.taroko.gov.tw/ch/trailsAttractions/trail-list/45", "https://168.thb.gov.tw/"], "source": "https://www.taroko.gov.tw/ch/trailsAttractions/trail-list/45", "drive": "離基地約 20 分", "stay_h": 1.0, "drive_min": 20, "total_h": 1.7, "season_months": [], "id": "p0001b103"}, {"name": "太平山林業鐵路_太平山站", "lat": 24.4927778, "lng": 121.535, "town": "宜蘭縣大同鄉", "base": "taipingshan", "theme": "heritage", "kind": "森林鐵道", "diff": "散步", "time": "車程加停留約 1.5–2 小時", "season": "", "desc": "太平山蹦蹦車起點站，海拔約 1,900 公尺，行駛於昔日太平山茂興線運材鐵道上。單程車程約 20 分鐘、長度 3 公里，以開放式黃色開放式台車行駛至茂興車站，下車後可銜接茂興懷舊步道主線與上下環線。", "note": "每日 07:00 於太平山莊站櫃檯現場開賣當日所有班次車票，無預售機制；行駛班次自 07:30 起每半小時或一小時一班，每班次限額 180 人，假日極易提早售罄；全票 180 元、優待票 120 元。位於太平山國家森林遊樂區內，需購票入園（票價與入園時間依林業署官方公告）。", "tags": ["看火車", "親子", "避暑"], "sources": ["https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2996&ctNode=229&mp=1"], "source": "https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2996&ctNode=229&mp=1", "drive": "離基地約 5 分", "stay_h": 2.0, "drive_min": 5, "total_h": 2.2, "season_months": [], "id": "pbfd51638"}, {"name": "太平山莊", "lat": 24.4922909, "lng": 121.5366036, "town": "宜蘭縣大同鄉", "base": "taipingshan", "zone": "太平山莊", "theme": "lodging", "kind": "山莊", "diff": "開車", "time": "", "season": "", "desc": "林業及自然保育署直營之高山旅宿，為太平山行政與遊客服務核心，海拔約 1,950 公尺。建築群隨山勢層疊而建，依木材樹種命名為紅檜館、香杉館、扁柏館、台灣杉館與肖楠館，附設餐廳、咖啡館與販賣部。", "note": "雙人房平日約 2800–3800 元、假日約 3500–4800 元（含早晚餐）；僅能透過林業保育署太平山訂房系統於入住日前 30 天上午 08:00 線上預訂；客房不提供一次性盥洗用品；山莊旁設有階梯停車場。", "tags": ["需預約", "避暑"], "sources": ["https://tpsr.forest.gov.tw/"], "source": "https://tpsr.forest.gov.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p2893b7ef"}, {"name": "翠峰山屋", "lat": 24.5096438, "lng": 121.6105629, "town": "宜蘭縣大同鄉", "base": "taipingshan", "zone": "翠峰山屋", "theme": "lodging", "kind": "山屋", "diff": "開車", "time": "", "season": "", "desc": "位於翠峰景觀道路終點，海拔約 1,850 公尺，鄰近翠峰湖環山步道與望洋山步道入口。山屋為兩層木造建築，提供二人房及八人團體通鋪。", "note": "二人房平日約 3000 元、假日約 3800 元（含早晚餐）；需透過太平山官方訂房系統於入住日前 30 天線上預訂；山區夜間採發電機限時供電（通常 22:00 熄燈）；不提供一次性備品與毛巾，附設小型停車場。", "tags": ["需預約", "避暑"], "sources": ["https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=3000&ctNode=272&mp=1"], "source": "https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=3000&ctNode=272&mp=1", "drive": "離基地約 95 分", "stay_h": 0.5, "drive_min": 95, "total_h": 3.7, "season_months": [], "id": "p414420d1"}, {"name": "太平山檜木原始林步道", "lat": 24.494218, "lng": 121.5349374, "town": "宜蘭縣大同鄉", "base": "taipingshan", "theme": "trail-mountain", "kind": "巨木步道", "diff": "健行", "time": "環狀一圈約 40–50 分鐘", "season": "", "desc": "步道入口位於太平山莊中央階梯頂端鎮安宮旁，海拔約 2,000 公尺，步道全長約 0.6 公里。全線為木棧道環狀動線，穿行於紅檜與台灣扁柏原生林中，沿途可見雙層林相、倒木樹抱石與二代木更新之自然林業生態。", "note": "步道坡度起伏平緩，但需先由太平山莊服務中心攀爬近 500 階紅葉步道階梯抵達入口；雨天木棧道表面濕滑，建議穿著防滑健行鞋與攜帶登山杖。位於太平山國家森林遊樂區內，需購票入園（票價與入園時間依林業署官方公告）。", "tags": ["巨木", "避暑"], "sources": ["https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2966&ctNode=281&mp=1"], "source": "https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2966&ctNode=281&mp=1", "drive": "離基地約 5 分", "stay_h": 0.83, "drive_min": 5, "total_h": 1.0, "season_months": [], "id": "p29d2058e"}, {"name": "望洋山步道", "lat": 24.5101954, "lng": 121.6090163, "town": "宜蘭縣大同鄉", "base": "taipingshan", "theme": "trail-mountain", "kind": "登山步道", "diff": "健行", "time": "往返約 1.5 小時", "season": "", "desc": "步道入口位於翠峰山屋旁，步道長度約 950 公尺，山頂觀景台海拔達 2,050 公尺。步道沿著望洋山稜線鋪設碎石階梯而上，登頂展望平台面朝東方蘭陽平原與太平洋，是翠峰湖區域清晨觀賞日出晨曦與翻騰雲海之核心制高點。", "note": "全線皆為上坡階梯，海拔落差約 180 公尺，清晨觀日出需自備頭燈照明；冬季或清晨氣溫偏低（常低於 10 度），需準備防風保暖衣物；步道起點鄰近翠峰山屋停車場。位於太平山國家森林遊樂區內，需購票入園（票價與入園時間依林業署官方公告）。", "tags": ["展望", "避暑"], "sources": ["https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2973&ctNode=289&mp=1"], "source": "https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2973&ctNode=289&mp=1", "drive": "離基地約 95 分", "stay_h": 1.5, "drive_min": 95, "total_h": 4.7, "season_months": [], "id": "pada633f2"}, {"name": "翠峰湖環山步道-東口", "lat": 24.5107709, "lng": 121.6086183, "town": "宜蘭縣大同鄉", "base": "taipingshan", "theme": "trail-mountain", "kind": "湖泊步道", "diff": "健行", "time": "觀景台折返約 40 分鐘，環湖全程約 2.5 小時", "season": "9月-11月", "desc": "步道圍繞高山湖泊翠峰湖（滿水期湖面面積約 25 公頃），海拔約 1,900 公尺。東口設有木造雙層觀湖平台，沿途鋪設碎石路與木棧道，林相包含奧氏虎皮楠、台灣杜鵑及檜木純林，中段設有寂靜山徑聆聽天然苔蘚音景。", "note": "步道全長 3.95 公里，自東口步行至第一觀湖平台約 300 公尺（約 10 分鐘，平緩好走）；若走完全程需原路折返或由西口（翠峰景觀道路 15.5K）踢產道回東口；東口設有專屬公廁與停車場。位於太平山國家森林遊樂區內，需購票入園（票價與入園時間依林業署官方公告）。", "tags": ["避暑", "展望"], "sources": ["https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2972&ctNode=288&mp=1"], "source": "https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2972&ctNode=288&mp=1", "drive": "離基地約 95 分", "stay_h": 2.5, "drive_min": 95, "total_h": 5.7, "season_months": [9, 10, 11], "id": "pa0543ab0"}, {"name": "見晴懷古步道", "lat": 24.5052473, "lng": 121.5256669, "town": "宜蘭縣大同鄉", "base": "taipingshan", "theme": "trail-mountain", "kind": "森林鐵道步道", "diff": "散步", "time": "往返約 1 小時", "season": "", "desc": "由早期見晴線運材鐵道修築而成，步道長度約 900 公尺，海拔約 1,890 公尺。沿途保留舊時木製鐵軌、枕木、轉轍器與兩座懸空高架鐵道遺跡，林間長年雲霧繚繞且覆蓋厚層苔蘚植物。", "note": "步道與停車安排依太平山當日公告調整；出發前查詢園區步道開放長度及宜專1線路況。入口位於宜專1號 23.1 公里處，小型車通常需停放見晴停車場後步行前往。", "tags": ["避暑", "展望", "親子"], "sources": ["https://recreation.forest.gov.tw/News/News?id=20260430001", "https://tps.forest.gov.tw/"], "source": "https://recreation.forest.gov.tw/News/News?id=20260430001", "drive": "離基地約 10 分", "stay_h": 1.0, "drive_min": 10, "total_h": 1.3, "season_months": [], "id": "p92073cf3"}, {"name": "白嶺巨木", "lat": 24.5308457, "lng": 121.5188185, "town": "宜蘭縣大同鄉", "base": "taipingshan", "theme": "trail-near", "kind": "巨木觀景點", "diff": "開車", "time": "約 15–20 分鐘", "season": "", "desc": "位於宜專1號 14.5 公里轉彎處，海拔 1,450 公尺，為太平山針闊葉林分水嶺。此株紅檜巨木樹齡推估超過 2,500 年，樹高約 30 公尺、胸圍 9.4 公尺，需約 6 人才能合抱，樹體頂端雖受雷擊斷裂，側枝依然繁茂旺盛。", "note": "此處位於道路彎道旁，路肩設有木棧觀景平台與解說牌；車位約僅能停靠 3–4 輛小型車，為短暫停歇拍照之中繼點，下車走動需留意轉彎會車。位於太平山國家森林遊樂區內，需購票入園（票價與入園時間依林業署官方公告）。", "tags": ["巨木", "中繼", "避暑"], "sources": ["https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2963&ctNode=279&mp=1"], "source": "https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2963&ctNode=279&mp=1", "drive": "離基地約 35 分", "stay_h": 0.33, "drive_min": 35, "total_h": 1.5, "season_months": [], "id": "pa08350db"}, {"name": "鳩之澤溫泉", "lat": 24.5453779, "lng": 121.5081831, "town": "宜蘭縣大同鄉", "base": "taipingshan", "theme": "water", "kind": "溫泉", "diff": "散步", "time": "約 1.5–2 小時", "season": "", "desc": "位於宜專1號 4.3 公里處多望溪谷，海拔約 520 公尺。泉質為弱鹼性碳酸氫鈉泉，溫泉水呈淡藍色清澈無硫磺味，設有露天溫泉SPA區、男女日式裸湯區、家庭湯屋以及利用地熱熱源的高溫煮蛋槽。", "note": "大眾SPA池與男女裸湯營業時間 09:00–19:00；溫泉煮蛋槽提供竹簍租借（押金 200 元、租金 20 元），現場販售雞蛋與玉米；設有專屬免費停車場與洗手間。位於太平山國家森林遊樂區內，需購票入園（票價與入園時間依林業署官方公告）。", "tags": ["溫泉", "玩水", "避暑", "親子"], "sources": ["https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2962&ctNode=277&mp=1"], "source": "https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2962&ctNode=277&mp=1", "drive": "離基地約 75 分", "stay_h": 2.0, "drive_min": 75, "total_h": 4.5, "season_months": [], "id": "p715753b1"}, {"name": "武界阿米倫秘境度假山莊", "lat": 23.9084696, "lng": 121.0501451, "town": "南投縣仁愛鄉", "base": "wujie", "zone": "部落核心", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "座落於法治村界山巷高處，緊鄰濁水溪上游河畔。山莊設有庭園景觀木屋、景觀雙人房與四人房，提供布農族原鄉風味晚餐與部落文化深度導覽套裝行程，夜晚可於庭院眺望星空。", "note": "雙人套房一泊二食平日約 3800–4600 元、假日約 4800–5800 元；可透過官網或電話預訂；提供四驅車接駁至一線天與茶園觀日出等付費套裝服務；附設專用停車場。", "tags": ["避暑", "夜景"], "sources": ["https://amironbnb.com/"], "source": "https://amironbnb.com/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p6c6ca9
