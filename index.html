function draw(){
  if (!ready) return;
  const list=shown().slice();
  const ids=new Set(list.map(p=>p.id));
  if (S.sel && BY_ID[S.sel] && !ids.has(S.sel)){ list.push(BY_ID[S.sel]); ids.add(S.sel); }
  PLAN.forEach(id=>{ const p=BY_ID[id]; if (p && !ids.has(id)){ list.push(p); ids.add(id); } });

  if (engine==="osm"){
    lines.clearLayers(); pts.clearLayers(); marks={};
    drawLegs();
    const asIcon = zoom >= ICON_ZOOM;
    const planNo={}; PLAN.forEach((id,i)=>{ planNo[id]=i+1; });
    list.forEach(p=>{
      const on=p.id===S.sel;
      const n=planNo[p.id];
      let m;
      if (n){
        m = asIcon
          ? L.marker([p.lat,p.lng], {icon:L.divIcon({className:"", html:planPinHTML(p,n), iconSize:[26,26]}),
                                     zIndexOffset:1000})
          : L.marker([p.lat,p.lng], {icon:L.divIcon({className:"", html:planDotHTML(p,n), iconSize:[20,20]}),
                                     zIndexOffset:1000});
      } else if (asIcon){
        m = L.marker([p.lat,p.lng], {icon:L.divIcon({className:"", html:markerHTML(p), iconSize:[26,26]}),
                                     zIndexOffset:on?900:0});
      } else if (p.theme==="lodging"){
        m = L.marker([p.lat,p.lng], {
          icon:L.divIcon({className:"lodgemk"+(on?" on":""), iconSize:[18,18], iconAnchor:[9,9],
                          html:`<span class="ld" style="background:${(TH[p.theme]||{}).color||"#888"}"></span>`}),
          zIndexOffset:on?900:0});
      } else {
        m = L.circleMarker([p.lat,p.lng],{radius:on?9:5.5, color:"#fff", weight:on?2.5:1.2,
                                          fillColor:(TH[p.theme]||{}).color||"#888", fillOpacity:1,
                                          bubblingMouseEvents:false});
      }
      m.addTo(pts);
      m.bindTooltip(tipHTML(p), {direction:"top", offset:[0,asIcon?-14:-8], className:"tt", opacity:1});
      m.on("mouseover", ()=>highlightRow(p.id,true));
      m.on("mouseout", ()=>highlightRow(p.id,false));
      m.on("click", ()=>select(p.id));
      marks[p.id]=m;
    });
    if (S.sel && marks[S.sel] && marks[S.sel].bringToFront) marks[S.sel].bringToFront();
    PLAN.forEach(id=>{ const m=marks[id]; if (m && m.bringToFront) m.bringToFront(); });
    drawBasePins();
  }
}

function drawLegs(){
  const days=tripLegs();
  if (!days) return;
  const casing = DARK ? "#000000" : "#ffffff";
  days.forEach((d,i)=>{
    const c=dayColor(i);
    (d.legs||[]).forEach(lg=>{
      if (!lg.coords || lg.coords.length<2) return;
      L.polyline(lg.coords, {color:casing, weight:8, opacity:.5, lineJoin:"round",
                             lineCap:"round", interactive:false}).addTo(lines);
      L.polyline(lg.coords, {color:c, weight:4.5, opacity:.95, lineJoin:"round", lineCap:"round"})
        .bindTooltip(`<b>Day ${i+1}</b><i>${esc(lg.from_name)} → ${esc(lg.to_name)}　` +
                     `${Math.round(lg.min)} 分 · ${lg.km.toFixed(1)} km</i>`,
                     {sticky:true, className:"tt", opacity:1})
        .addTo(lines);
    });
  });
}

function drawBasePins(){
  BASES.forEach(b=>{
    if (!b.anchor) return;
    const m=L.marker(b.anchor, {
      icon:L.divIcon({className:"basepin"+(BASE_SEL===b.id?" on":""), iconSize:[26,26], iconAnchor:[13,13],
        html:`<span class="bp" style="background:${b.color||"#888"}">` +
             `<svg viewBox="0 0 16 16"><path d="M2.5 8.5 8 3l5.5 5.5M4 7v6h8V7"/></svg></span>`}),
      zIndexOffset:1500});
    m.bindTooltip(`<b>${esc(b.name)}</b><i>${esc(b.town||"")}` +
                  (b.drive_min!=null?`　離新竹約 ${b.drive_min} 分`:"") + `</i>`,
                  {direction:"top", offset:[0,-14], className:"tt", opacity:1});
    m.on("click", ()=>selectBase(b.id));
    m.addTo(pts);
    if (BASE_SEL===b.id) zonesOf(b).forEach(z=>{
      const on=ZONE_SEL===z.name;
      const zm=L.marker([z.anchor.lat, z.anchor.lng], {
        icon:L.divIcon({className:"zonepin"+(on?" on":""), iconSize:[14,14], iconAnchor:[7,7],
                        html:`<span class="zp" style="background:${b.color||"#888"}"></span>`}),
        zIndexOffset:1400});
      zm.bindTooltip(`<b>${esc(z.name)}</b>` + (z.note?`<i>${esc(z.note)}</i>`:""),
                     {direction:"top", offset:[0,-8], className:"tt", opacity:1});
      zm.on("click", ()=>selectZone(z.name));
      zm.addTo(pts);
    });
  });
}
function fit(items){
  if (!ready || !items.length) return;
  map.fitBounds(L.latLngBounds(items.map(p=>[p.lat,p.lng])).pad(.15));
}
function panTo(p){
  if (!ready) return;
  map.setView([p.lat,p.lng], Math.max(map.getZoom(),13), {animate:true});
}

            `離新竹 <span class="num">${hm(b.drive_min)}</span></span>` : "") +
          `<span class="mi">住宿 <span class="num">${nl}</span> 家` +
            (nz?`／<span class="num">${nz}</span> 條住宿帶`:"") + `</span></p>` +
        `<div class="acts">` +
          `<button class="primary" data-act="basedetail">看基地（住宿與附近精選）</button>` +
        `</div>`;

          S.view="list"; syncViews(); S.listOpen=true; SCROLL_BASE=true; save(); render();
        }
      };
      return;
    }
  }
  const p = (isMapOnly() && S.sel) ? BY_ID[S.sel] : null;
  box.className = "mapcard" + (p ? " on" : "");
  if (!p){ box.innerHTML=""; return; }
  primeNearData();
  const ns=nearestStop(p);
  const legHTML = ns
    ? `<span class="mi" title="離行程最近的一站">${CAR_SVG}離${esc(ns.stop.name)} ` +
        (ns.min!=null ? `${ns.real?"":"約 "}<span class="num">${ns.min}</span> 分 · ` : ``) +
        `<span class="num">${ns.km.toFixed(1)}</span> km</span>`
    : `<span class="mi" title="從新竹市區出發的車程">${CAR_SVG}<span class="num">${p.drive_min}</span> 分</span>`;
  box.innerHTML =
    `<div class="ttl"><b>${esc(p.name)}</b>` +
      `<button class="x" data-act="close" aria-label="關閉">×</button></div>` +
    `<p class="sub">${esc(p.town)}　${esc((TH[p.theme]||{}).name||"")}　${EFFORT[p.diff]||p.diff}</p>` +
    `<p class="m">${legHTML}` +
      `<span class="mi" title="停留">${HOURGLASS_SVG}<span class="num">${p.stay_h}</span> 小時</span></p>` +
    tagsHTML(p) +
    `<div class="acts">` +
      `<button data-act="plan"${inPlan(p.id)?"":' class="primary"'}>${inPlan(p.id)?"從行程移除":"加進行程"}</button>` +
      `<button data-act="detail">看詳細</button>` +
      `<a href="https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(HOME.name)}&destination=${encodeURIComponent(gnav(p))}" target="_blank" rel="noopener">導航</a>` +
      `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(gview(p))}" target="_blank" rel="noopener">看 Google 地圖</a>` +
    `</div>`;
  box.onclick=e=>{
    const b=e.target.closest("[data-act]"); if (!b) return;
    const act=b.dataset.act;
    if (act==="close"){ S.sel=null; render(); }
    else if (act==="plan"){ togglePlan(p.id); }
    else if (act==="tag"){ SCROLL_TO=b.dataset.pid||null; searchFor(b.dataset.tag); }
    else if (act==="detail"){ S.view="list"; syncViews(); S.listOpen=true; SCROLL_TO=p.id; save(); render(); }
  };
}

function toggleBaseView(){

    S.inseason=false; S.mine=null; resetQ();
    S.base=planBaseSet();
    S.listOpen=true; SCROLL_GROUP=true;
    if (!isMapOnly()){ S.open=true; S.basesOpen=true; }
    fit(PLACES.filter(p=>S.base.has(p.base)));
  }
  S.sel=null; EXTRA=new Set(); save(); render();
}
function cycleNearView(){
  if (NEAR_VIEW && NEAR_LEVEL < NEAR_STEPS.length-1){
    NEAR_LEVEL++;                       // 放寬一級
  } else if (NEAR_VIEW){
    NEAR_VIEW=false; NEAR_LEVEL=0;      // 已在最寬，再按就取消
  } else {
    NEAR_VIEW=true; NEAR_LEVEL=0; BASE_VIEW=false;
    S.base=new Set(); S.themes=new Set(); S.diffs=new Set(); S.budget=new Set();
    S.inseason=false; S.mine=null; resetQ();
    S.listOpen=true; SCROLL_RESET=true;
  }
  primeNearView();
  S.sel=null; EXTRA=new Set(); save(); render();
}

function emphasize(id,on){

  if (!m) return;

    const el = m.getElement && m.getElement();
    if (el) el.classList.toggle("hot", !!on);

const inPlan = id => PLAN.includes(id);
const stayOf = p => (STAY[p.id]==null ? p.stay_h : STAY[p.id]);
function stayLabel(h){
  const m=Math.round(h*60);
  if (m<60) return `停 ${m} 分`;
  return m%60 ? `停 ${Math.floor(m/60)} 小時 ${m%60} 分` : `停 ${m/60} 小時`;
}
function adjustStay(p, delta){
  STAY[p.id]=Math.max(0.25, Math.round((stayOf(p)+delta)*4)/4);
  save(); renderTrip();
}
function togglePlan(id){
  const i=PLAN.indexOf(id);
  if (i<0){ PLAN.push(id); TRIP_OPEN=true; } else PLAN.splice(i,1);
  syncBaseView(); syncNearView();   // 兩種檢視都以行程為前提，行程一動就重算
  save(); render();
}
function movePlan(i, dir){
  const j=i+dir;
  if (j<0 || j>=PLAN.length) return;
  const t=PLAN[i]; PLAN[i]=PLAN[j]; PLAN[j]=t;
  save(); render();
}
function optimizePlan(){
  const ps=PLAN.map(id=>BY_ID[id]).filter(Boolean);
  if (ps.length<3) return;
  const rest=ps.slice(), order=[];
  let cur=HOME;
  while (rest.length){
    let bi=0, bd=Infinity;
    rest.forEach((p,i)=>{ const d=km(cur,p); if (d<bd){ bd=d; bi=i; } });
    cur=rest[bi]; order.push(rest.splice(bi,1)[0]);
  }
  PLAN=order.map(p=>p.id);
  save(); render();
}
function schedule(){
  const ps=PLAN.map(id=>BY_ID[id]).filter(Boolean);
  if (!ps.length) return null;
  let t=START, stayTotal=0, driveTotal=0;
  const items=ps.map((p,i)=>{
    let legMin, legKm, legReal;
    if (i===0){
      const home=neighGet("HOME", p.id);
      legMin=p.drive_min;
      if (home){ legKm=home.km; legReal=true; }
    } else {
      const lg=legOf(ps[i-1],p);
      legMin=lg.min; legKm=lg.km; legReal=lg.real;
    }
    driveTotal += legMin;
    const arrive=t+legMin, stay=stayOf(p), leave=arrive+stay*60;
    t=leave; stayTotal+=stay;
    return {p, n:i+1,
      leg: legText(legMin, legKm, legReal),
      win: `${fmt(arrive)}–${fmt(leave)}`,
      stay: stayLabel(stay),
      warn: (months(p).length && !months(p).includes(MONTH)) ? "這季節不是它最好的時候" : ""};
  });
  const last=ps[ps.length-1];
  const homeBack=neighGet("HOME", last.id);   // 同上：分鐘照策展值，公里數才取表值
  const back = last.drive_min;
  const backKm = homeBack ? homeBack.km : null;
  const backReal = !!homeBack;
  driveTotal+=back;
  return {ps, items, back, backKm, backReal, backTime:t+back, stay:Math.round(stayTotal*10)/10,
          driveTotal, total:Math.round(((t+back)-START)/6)/10};
}
function planURL(){
  const ps=PLAN.map(id=>BY_ID[id]).filter(Boolean);
  if (!ps.length) return "#";
  const last=ps[ps.length-1];
  const way=ps.slice(0,-1).map(gnav).join("|"); // 途經點也是要「開到得了」，跟單點導航同一套規則
  return "https://www.google.com/maps/dir/?api=1&travelmode=driving" +
    "&origin=" + encodeURIComponent(HOME.name) +
    "&destination=" + encodeURIComponent(gnav(last)) +
    (way ? "&waypoints=" + encodeURIComponent(way) : "");
}

function syncTripUp(){
  const el=document.getElementById("trip");
  if (!el) return;

  const head=el.querySelector(".head");
  const pad=parseFloat(getComputedStyle(el).paddingBottom)||0;
  const base=(head? head.getBoundingClientRect().height : 0)+pad;
  document.documentElement.style.setProperty("--tripup", Math.max(0, h-base)+"px");

function alignLeadColumn(root){
  root.classList.remove("stacked");
  root.style.removeProperty("--leadw");
  const leads=root.querySelectorAll(".stop .lead");
  if (!leads.length) return;
  let max=0;
  leads.forEach(l=>{ max=Math.max(max, l.getBoundingClientRect().width); });
  if (!max) return;   // 面板收合中量到的都是 0（display:none），維持原狀，等展開再量
  const opsEl=root.querySelector(".stop .ops");
  const opsW = opsEl ? opsEl.getBoundingClientRect().width : 100;
  const avail = root.getBoundingClientRect().width || innerWidth;
  const META_MIN = 130;   // 中間欄（時間窗＋停留）擠到這個寬度以下就不好讀了
  const needed = max + 10 + META_MIN + 10 + opsW;
  if (needed > avail) root.classList.add("stacked");
  else root.style.setProperty("--leadw", Math.ceil(max)+"px");
}

function wireStopGestures(wrap, stop, grip, id){
  grip.addEventListener("pointerdown", e=>{
    if (e.pointerType==="mouse" && e.button!==0) return;
    e.preventDefault();
    startDrag(id, wrap, e);
  });
  wrap.addEventListener("contextmenu", e=>{ if (wrap.classList.contains("dragging")) e.preventDefault(); });

  wrap.addEventListener("pointerdown", e=>{
    if (e.target.closest("button, .grip, a")) return;
    if (e.pointerType==="mouse" && e.button!==0) return;
    GESTURE = { id, wrap, stop, startX:e.clientX, startY:e.clientY,
                pointerId:e.pointerId, mouse:e.pointerType==="mouse", dir:null, dx:0, thresh:SWIPE_DELETE_PX };
    if (e.pointerType!=="mouse"){
      clearTimeout(PRESS_TIMER);
      const pe=e;
      PRESS_TIMER=setTimeout(()=>{
        if (!GESTURE || GESTURE.id!==id || GESTURE.pointerId!==pe.pointerId || GESTURE.dir!=null) return;
        GESTURE=null;
        startDrag(id, wrap, pe);
      }, 400);
    }
  });
  wrap.addEventListener("pointermove", e=>{
    if (!GESTURE || GESTURE.id!==id || e.pointerId!==GESTURE.pointerId) return;
    const dx=e.clientX-GESTURE.startX, dy=e.clientY-GESTURE.startY;
    if (GESTURE.dir==null){
      if (Math.abs(dx)<8 && Math.abs(dy)<8) return;
      clearTimeout(PRESS_TIMER);   // 位移已經超過長按門檻，不會再是長按
      if (GESTURE.mouse && Math.abs(dy)>=Math.abs(dx)){
        const ev=e; GESTURE=null;
        startDrag(id, wrap, ev);
        return;
      }
      if (Math.abs(dx)>Math.abs(dy)){
        GESTURE.dir="h";
        try{ wrap.setPointerCapture(e.pointerId); }catch(_){}   // 極少數情況（如合成事件）沒有 active pointer 可抓，抓不到就算了，不影響橫滑本身
        wrap.classList.add("swiping");
      } else { GESTURE=null; return; }   // 觸控縱向：放手，讓原生捲頁接手
    }
    if (GESTURE.dir!=="h") return;
    e.preventDefault();
    const clamped=Math.min(0, dx);
    stop.style.transform=`translateX(${clamped}px)`;
    GESTURE.dx=clamped;
    GESTURE.thresh=Math.min(SWIPE_DELETE_PX, wrap.getBoundingClientRect().width*0.35);
    wrap.classList.toggle("del-armed", -clamped>GESTURE.thresh);
  });
  const endSwipe=()=>{
    clearTimeout(PRESS_TIMER);
    if (!GESTURE || GESTURE.id!==id) return;
    if (GESTURE.dir==="h"){
      const commit = -GESTURE.dx > GESTURE.thresh;
      wrap.classList.remove("swiping","del-armed");
      if (commit){
        if (!RM.matches){
          stop.style.transition="transform .16s ease";
          stop.style.transform=`translateX(-${wrap.getBoundingClientRect().width}px)`;
        }
        setTimeout(()=>togglePlan(id), RM.matches?0:150);
      } else {
        if (!RM.matches) stop.style.transition="transform .16s ease";
        stop.style.transform="translateX(0)";
        setTimeout(()=>{ stop.style.transition=""; }, 180);
      }
    }
    GESTURE=null;
  };
  wrap.addEventListener("pointerup", endSwipe);
  wrap.addEventListener("pointercancel", endSwipe);
}

function clearDragIndicators(){
  document.querySelectorAll(".stopwrap.drag-over-top,.stopwrap.drag-over-bottom")
    .forEach(el=>el.classList.remove("drag-over-top","drag-over-bottom"));
}
function markDragOver(id,pos){
  const el=document.querySelector(`.stopwrap[data-id="${id}"]`);
  if (el) el.classList.add(pos==="top"?"drag-over-top":"drag-over-bottom");
}
function startDrag(id, wrap, e){
  const startIndex=PLAN.indexOf(id);
  if (startIndex<0) return;
  const rows=Array.from(document.querySelectorAll("#trip .stopwrap")).map(r=>{
    const rc=r.getBoundingClientRect();
    return {id:r.dataset.id, top:rc.top, h:rc.height};
  });
  DRAG={id, startY:e.clientY, startIndex, targetIndex:startIndex, pointerId:e.pointerId, rows};
  wrap.classList.add("dragging");
  const move=ev=>{
    if (!DRAG || ev.pointerId!==DRAG.pointerId) return;
    ev.preventDefault();
    wrap.style.transform=`translateY(${ev.clientY-DRAG.startY}px)`;
    const others=DRAG.rows.filter(r=>r.id!==id);
    let count=0;
    others.forEach(r=>{ if (ev.clientY > r.top + r.h/2) count++; });
    DRAG.targetIndex=count;
    clearDragIndicators();
    if (count<others.length) markDragOver(others[count].id,"top");
    else if (others.length) markDragOver(others[others.length-1].id,"bottom");
  };
  const up=ev=>{
    if (!DRAG || ev.pointerId!==DRAG.pointerId) return;
    document.removeEventListener("pointermove",move);
    document.removeEventListener("pointerup",up);
    document.removeEventListener("pointercancel",up);
    clearDragIndicators();
    wrap.classList.remove("dragging");
    const {startIndex:si, targetIndex:ti}=DRAG;
    DRAG=null;
    if (ti!==si){
      const arr=PLAN.slice(); arr.splice(si,1); arr.splice(ti,0,id);
      PLAN=arr; save(); render();
    } else {
      if (!RM.matches) wrap.style.transition="transform .14s ease";
      wrap.style.transform="translateY(0)";
      setTimeout(()=>{ wrap.style.transition=""; }, 160);
    }
  };
  document.addEventListener("pointermove",move);
  document.addEventListener("pointerup",up);
  document.addEventListener("pointercancel",up);
}

const NEAR_STEPS = [{km:10,n:5},{km:20,n:8},{km:30,n:10},{km:40,n:12}];

function pickNearby(list, n){
  const groups=new Map();
  list.forEach(o=>{ if(!groups.has(o.x.theme)) groups.set(o.x.theme,[]); groups.get(o.x.theme).push(o); });
  groups.forEach(g=>g.sort((a,b)=>a.d-b.d));
  const picked=[];
  const gOld=groups.get("oldstreet");
  if (gOld){
    const quota=Math.min(gOld.length, Math.ceil(n/3));
    picked.push(...gOld.splice(0, quota));
    if (!gOld.length) groups.delete("oldstreet");
  }
  const order=[...groups.keys()].sort((a,b)=>groups.get(a)[0].d-groups.get(b)[0].d);
  let idx=0;
  while (picked.length<n){
    let added=false;
    for (const th of order){
      const g=groups.get(th);
      if (idx<g.length){ picked.push(g[idx]); added=true; if (picked.length>=n) break; }
    }
    if (!added) break;
    idx++;
  }
  return picked.sort((a,b)=>a.d-b.d);
}

  if (near.length || canWiden){
    const n=document.createElement("div"); n.className="nearby";
    n.innerHTML=`<h3>附近精選地點（車程 ${step.km} 公里內）</h3>`;
    if (near.length) near.forEach(({x,d:dd,min,real})=>
      n.appendChild(rowFor(x, null, {km:dd, min, real})));
    else {
      const e=document.createElement("p"); e.className="nonear";
      e.textContent="這個車程範圍內沒有別的點。山上繞路遠，可以放寬距離再看。";
      n.appendChild(e);
    }
    if (canWiden){
      const more=document.createElement("button"); more.className="wider";
      more.textContent=`再遠一點（${NEAR_STEPS[S.near+1].km} 公里內）`;
      more.onclick=()=>{ S.near++; render(); };
      n.appendChild(more);
    }
    d.appendChild(n);
  }
  return d;
}

function tripLegs(){
  const t = S.trip && LEGS[S.trip];
  return (t && t.days && t.days.length) ? t.days : null;
}
function selectTrip(id){
  S.trip = (S.trip===id) ? null : id;   // 再點一次同一條＝關掉（連帶收掉地圖上的腿線）
  if (S.trip){ S.tripsOpen=true; fitTrip(); }
  save(); render();
}

function fitTrip(){
  const days=tripLegs();
  if (!ready || !days) return;
  const pts=[];
  days.forEach(d=>(d.legs||[]).forEach(l=>(l.coords||[]).forEach(c=>pts.push(c))));
  if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(.12));
}
function legRow(lg){
  const r=document.createElement("div"); r.className="tleg";
  r.innerHTML = CAR_SVG +
    `<span class="via">${esc(lg.from_name)} → ${esc(lg.to_name)}</span>` +
    `<span><span class="num">${Math.round(lg.min)}</span> 分 · ` +
    `<span class="num">${lg.km.toFixed(1)}</span> km</span>`;
  return r;
}

function tripStopRow(p){
  const b=document.createElement("button");

  const body=document.createElement("div"); body.className="tb";

    `<div class="t">${ico(p.theme,(TH[p.theme]||{}).color)}<span>${esc(p.name)}</span>` +

  add.onclick=e=>{ e.stopPropagation(); togglePlan(p.id); };

function nightRow(d, i, total){
  const b = d.base ? BS[d.base] : null;
  if (b){
    const el=document.createElement("button");
    el.type="button"; el.className="tnight";
    el.innerHTML = ico("lodging",(TH.lodging||{}).color) + `當晚住 <b>${esc(b.name)}</b>` +
      (b.drive_min!=null ? `　<span class="num">離新竹 ${b.drive_min} 分</span>` : "") +
      `<span class="more">看基地 ›</span>`;
    el.onclick=()=>selectBase(b.id);
    return el;
  }
  const el=document.createElement("div"); el.className="tnight";
  el.innerHTML = (i===total-1)
    ? HOME_SVG + `開回新竹，行程結束`
    : `這一天沒有指定過夜基地`;
  return el;
}

const DAY_NAV_MAX_WAY = 9;   // Google 的 dir?api=1 途經點上限（官方文件寫 9 個）

function baseNavTarget(bid){
  const b = bid ? BS[bid] : null;
  return (b && b.anchor) ? `${b.anchor[0]},${b.anchor[1]}` : HOME.name;
}
function dayNav(days, i){
  const d = days[i] || {};
  const way = (d.stops || []).map(nm=>BY_NAME[nm]).filter(Boolean).map(gnav);
  const origin = baseNavTarget(i===0 ? null : (days[i-1]||{}).base);
  const dest = baseNavTarget(d.base);
  const url = "https://www.google.com/maps/dir/?api=1&travelmode=driving" +
    "&origin=" + encodeURIComponent(origin) +
    "&destination=" + encodeURIComponent(dest) +
    (way.length ? "&waypoints=" + encodeURIComponent(way.join("|")) : "");
  return {url, way, over: way.length > DAY_NAV_MAX_WAY};
}
function dayNavHTML(days, i){
  const nv = dayNav(days, i);
  if (nv.over)
    return `<span class="tdnav off" title="Google 地圖的多點路線最多 ${DAY_NAV_MAX_WAY} 個途經點，` +
      `這天有 ${nv.way.length} 個停點——寧可讓你自己分段，也不要默默少導幾個點">` +
      `停點太多，請分段導航</span>`;
  return `<a class="tdnav" href="${esc(nv.url)}" target="_blank" rel="noopener" ` +
    `title="用 Google 地圖導這一整天：從出發點經過 ${nv.way.length} 個停點到當晚落腳處">` +
    `當日導航</a>`;
}
function renderTrips(){
  const box=document.createElement("div"); box.className="tripbox";
  const pick=document.createElement("div"); pick.className="tpick";

  const tripChip = t => chip(
    (t.code ? `<span class="tcode">${esc(t.code)}</span>` : "") +
    `${esc(t.name)}<span class="cnt num">${t.days.length} 天</span>`,
    S.trip===t.id, ()=>selectTrip(t.id));

  const group=(label, color, rows)=>{
    if (!rows.length) return;
    const g=document.createElement("div"); g.className="tcat";
    const h=document.createElement("div"); h.className="tcath"; h.textContent=label;
    h.style.setProperty("--cc", color);
    const row=document.createElement("div"); row.className="tcatrow";
    rows.forEach(t=>row.appendChild(tripChip(t)));
    g.append(h, row); pick.appendChild(g);
  };
  CATS.forEach(c=>group(c.name, catColor(c), TRIPS.filter(t=>t.cat===c.id)));
  group("未分類", catColor(null), TRIPS.filter(t=>!CT[t.cat]));
  box.appendChild(pick);
  if (!S.trip) return box;

  const days=tripLegs();
  if (!days){
    const e=document.createElement("p"); e.className="nonear";
    e.textContent="這條行程還沒有腿線資料——跑 distance/fetch_legs.py 產一份就會出現逐日時間軸。";
    box.appendChild(e);
    return box;
  }
  days.forEach((d,i)=>{
    const wrap=document.createElement("div"); wrap.className="tday";
    wrap.style.setProperty("--dc", dayColor(i));
    const over = DAY_DRIVE_WARN_MIN!=null && d.min>DAY_DRIVE_WARN_MIN;
    const head=document.createElement("div"); head.className="tdhead";
    head.innerHTML =
      `<span class="dno">Day ${i+1}</span>` +
      `<span class="dsub">${(d.stops||[]).length} 個停點</span>` +
      `<span class="tdbudget${over?" over":""}" title="這一天所有腿段的車程加總，共 ${d.min} 分` +
        `（各段的分鐘各自四捨五入過，逐段相加可能差一兩分）">` +
        CAR_SVG + `開車 <span class="num">${hm(d.min)}</span>` +
        (d.km!=null ? ` · <span class="num">${d.km.toFixed(1)}</span> km` : "") +
      `</span>` +
      dayNavHTML(days, i);
    wrap.appendChild(head);
    const tnote = (((TRIP_BY_ID[S.trip] || {}).days || [])[i] || {}).note;
    if (tnote){
      const n=document.createElement("p"); n.className="tdnote"; n.textContent=tnote;
      wrap.appendChild(n);
    }
    if ((d.legs||[]).length){
      d.legs.forEach(lg=>{
        wrap.appendChild(legRow(lg));
        const p=BY_ID[lg.to];
        if (p) wrap.appendChild(tripStopRow(p));
      });
    } else {
      (d.stops||[]).forEach(nm=>{ const p=BY_NAME[nm]; if (p) wrap.appendChild(tripStopRow(p)); });
    }
    wrap.appendChild(nightRow(d, i, days.length));
    box.appendChild(wrap);
  });
  const f=document.createElement("p"); f.className="nonear";
  f.textContent="車程是本地 OSRM 實算的，行程首尾自動接新竹；停留時間與當日總時數請自己斟酌。";
  box.appendChild(f);
  return box;
}

function selectBase(id){
  if (BASE_SEL===id){ closeBase(); return; }
  BASE_SEL=id; ZONE_SEL=null; BASE_NEAR=0;
  const b=BS[id];
  if (b && b.anchor && ready) map.setView(b.anchor, Math.max(map.getZoom(),12), {animate:false});
  if (!isMapOnly()) SCROLL_BASE=true;
  render();
}
function closeBase(){ BASE_SEL=null; ZONE_SEL=null; BASE_NEAR=0; render(); }
function selectZone(name){
  ZONE_SEL = (ZONE_SEL===name) ? null : name;
  BASE_NEAR=0;
  const z=zonesOf(BS[BASE_SEL]).find(x=>x.name===ZONE_SEL);
  if (z && ready) map.setView([z.anchor.lat, z.anchor.lng], Math.max(map.getZoom(),13), {animate:false});
  render();
}
function renderBaseView(){
  const b=BS[BASE_SEL];
  if (!b) return null;
  const zones=zonesOf(b);
  const zone=zones.find(z=>z.name===ZONE_SEL)||null;
  const oid = zone ? zoneOriginId(b.id, zone.name) : ("base:"+b.id);
  const step = NEAR_STEPS[Math.min(BASE_NEAR, NEAR_STEPS.length-1)];
  const menu = BASE_POINTS[b.id] || [];
  const lodges = lodgingOf(b.id);

  const d=document.createElement("div"); d.className="baseview";
  d.innerHTML =
    `<div class="bvh"><b>${esc(b.name)}</b>` +
      `<button type="button" class="x" data-act="closebase" aria-label="關閉基地視圖">×</button></div>` +
    `<p class="bvm">${esc(b.town||"")}` +
      (b.drive_min!=null ? `　<span class="mi" title="從新竹市區開到這個基地">${CAR_SVG}離新竹 ` +
        `<span class="num">${hm(b.drive_min)}</span>` +
        (b.drive_km!=null?` · <span class="num">${b.drive_km.toFixed(1)}</span> km`:"") + `</span>` : "") +
      `　菜單 <span class="num">${menu.length}</span> 個點</p>`;
  d.querySelector("[data-act=closebase]").onclick=closeBase;

  if (zones.length){
    const zr=document.createElement("div"); zr.className="zrow";
    zones.forEach(z=>{
      const c=chip(esc(z.name), ZONE_SEL===z.name, ()=>selectZone(z.name));
      if (z.note) c.title=z.note;    // 完整的 note 在下面住宿分組的帶名底下
      zr.appendChild(c);
    });
    d.appendChild(zr);
  }

  const h1=document.createElement("h3");
  h1.textContent=`住宿（${lodges.length} 家）`;
  d.appendChild(h1);
  if (!lodges.length){
    const e=document.createElement("p"); e.className="nonear";
    e.textContent="這個基地還沒有住宿資料。";
    d.appendChild(e);
  } else if (zones.length){
    zones.forEach(z=>{
      const rows=lodges.filter(p=>p.zone===z.name);
      if (!rows.length) return;
      const zh=document.createElement("p"); zh.className="zhead"; zh.textContent=z.name;
      d.appendChild(zh);
      if (z.note){
        const zn=document.createElement("p"); zn.className="znote"; zn.textContent=z.note;
        d.appendChild(zn);
      }
      rows.forEach(p=>d.appendChild(rowFor(p)));
    });
    const rest=lodges.filter(p=>!zones.some(z=>z.name===p.zone));
    if (rest.length){
      const zh=document.createElement("p"); zh.className="zhead"; zh.textContent="未分區";
      d.appendChild(zh);
      rest.forEach(p=>d.appendChild(rowFor(p)));
    }
  } else {
    lodges.forEach(p=>d.appendChild(rowFor(p)));
  }

  const pool=PLACES.filter(x=>x.theme!=="lodging").map(x=>{
    const r=originDist(oid, x);
    if (!r || r.km>step.km) return null;
    const fac = zone && zone.drive && zone.drive[x.id];
    return {x, d:r.km, min: fac ? fac.min : r.min, real:true};
  }).filter(Boolean);
  const near=pickNearby(pool, step.n);
  const h2=document.createElement("h3");
  h2.textContent=`附近精選地點（車程 ${step.km} 公里內，從${zone?`「${zone.name}」`:"基地"}量）`;
  d.appendChild(h2);
  const nb=document.createElement("div");
  if (near.length) near.forEach(({x,d:dd,min,real})=>nb.appendChild(rowFor(x, null, {km:dd, min, real})));
  else {
    const e=document.createElement("p"); e.className="nonear";
    e.textContent="這個車程範圍內沒有別的點。山上繞路遠，可以放寬距離再看。";
    nb.appendChild(e);
  }
  if (BASE_NEAR < NEAR_STEPS.length-1){
    const more=document.createElement("button"); more.className="wider";
    more.textContent=`再遠一點（${NEAR_STEPS[BASE_NEAR+1].km} 公里內）`;
    more.onclick=()=>{ BASE_NEAR++; render(); };
    nb.appendChild(more);
  }
  d.appendChild(nb);
  return d;
}

function renderPanel(){
  const panel=document.getElementById("panel");
  const keep=panel.scrollTop;
  panel.innerHTML="";
  panel.appendChild(renderFilterBar());
  if (S.open) panel.appendChild(renderFilters());

  if (TRIPS.length){
    panel.appendChild(section("範例行程",
      S.trip ? `1/${TRIPS.length} 條` : `${TRIPS.length} 條`, S.tripsOpen,
      ()=>{ S.tripsOpen=!S.tripsOpen; save(); render(); }, "toplevel"));
    if (S.tripsOpen) panel.appendChild(renderTrips());
  }
  if (BASE_SEL){
    const bv=renderBaseView();
    if (bv) panel.appendChild(bv);
  }
  panel.appendChild(section("景點清單", `${shown().length}/${PLACES.length}`, S.listOpen,
    ()=>{ S.listOpen=!S.listOpen; save(); render(); }, "toplevel"));
  if (S.listOpen){
    panel.appendChild(renderList());
    const lg=document.createElement("div"); lg.className="legend";
    lg.innerHTML=THEMES.map(t=>`<span>${ico(t.id,t.color)}${t.name}</span>`).join("");
    panel.appendChild(lg);
    const f=document.createElement("p"); f.className="foot";
    f.innerHTML = (PUBLIC ? "" : "★ 是你自己收藏過的地方。") +
      "清單上的車程與停留都是估的；「今天的行程」的點間車程與「順路可搭」的距離會另外去算真實路線，" +
      "算不到才退回估算值（會標「約」或「直線」）。" +
      "山區路況、林道封閉、園區開放時間與店家公休都會變動，出發前請以官方公告與店家粉專為準；" +
      "本頁僅供行程參考，不保證資訊正確或即時。底圖與圖磚為 OpenStreetMap 貢獻者所有。";
    panel.appendChild(f);
  }
  if (SCROLL_RESET){
    panel.scrollTop = 0;
    SCROLL_RESET = false;
  } else {
    panel.scrollTop = keep;
  }
  if (SCROLL_BASE){
    const bv=panel.querySelector(".baseview");
    if (bv){
      const bar=document.querySelector(".fbar");
      const r=bv.getBoundingClientRect();
      const target=(bar?bar.getBoundingClientRect().bottom:r.top)+10;
      panel.scrollTop += (r.top-target);
    }
    SCROLL_BASE=false;
  }
  if (SCROLL_GROUP){
    const g=panel.querySelector(".ghead");
    if (g){
      const bar=document.querySelector(".fbar");
      const r=g.getBoundingClientRect();
      const target=(bar?bar.getBoundingClientRect().bottom:r.top)+10;
      panel.scrollTop += (r.top-target);
    }
    SCROLL_GROUP=false;
  }
  if (SCROLL_TO){
    const el=panel.querySelector(`.row[data-id="${SCROLL_TO}"]`);
    if (el){
      const bar=document.querySelector(".fbar");
      const r=el.getBoundingClientRect();
      const target=(bar?bar.getBoundingClientRect().bottom:r.top)+10;
      const desired=panel.scrollTop+(r.top-target);
      const max=panel.scrollHeight-panel.clientHeight;
      if (desired<=max){
        panel.scrollTop=Math.max(0, desired);
      } else {
        const rowOffset=r.top-panel.getBoundingClientRect().top+panel.scrollTop;
        panel.scrollTop = (rowOffset+r.height<panel.clientHeight) ? 0 : max;
      }
    } else {
      panel.scrollTop = 0;
    }
    SCROLL_TO=null;
  }
}

let SCROLL_TO=null;
function select(id){
  if (S.sel===id){ S.sel=null; S.near=0; render(); return; }
  S.sel=id; S.near=0;
  const p=BY_ID[id];
  if (p){
    if (!pass(p)) EXTRA.add(id);        // 從「附近精選地點」跳到不在篩選裡的點，讓它有位置可展開
    if (isMapOnly() && ready && map.getZoom() < ICON_ZOOM){
      map.setView([p.lat,p.lng], ICON_ZOOM, {animate:false});
    } else {
      panTo(p);
    }
  }
  if (!isMapOnly()){ S.listOpen=true; SCROLL_TO=id; }
  render();
}

function syncViews(){
  document.querySelectorAll("#views button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===S.view));
  document.getElementById("main").classList.toggle("nomap", S.view!=="map");
}

function updateTotop(){
  const btn=document.getElementById("totop");
  if (!btn) return;
  btn.hidden = isMapOnly();
  if (btn.hidden) return;
  const main=document.getElementById("main");
  const docked = matchMedia("(min-width:900px) and (min-height:560px)").matches &&
                 main && !main.classList.contains("nomap");
  btn.classList.toggle("docked", docked);
  const panel=document.getElementById("panel");
  const vh = panel.clientHeight || innerHeight;
  btn.classList.toggle("show", panel.scrollTop > vh*1.75);
}
document.getElementById("panel").addEventListener("scroll", updateTotop, {passive:true});
addEventListener("resize", updateTotop);
document.getElementById("totop").onclick=()=>{

}

  applyTheme(); save(); render();

<script>

(function(){
  let lastTouchEnd = 0;
  document.addEventListener("touchend", function(e){
    if (e.target && e.target.closest && e.target.closest("#map")) return;
    const now = Date.now();
    const dt = now - lastTouchEnd;
    lastTouchEnd = now;
    if (dt > 0 && dt < 300){
      e.preventDefault();
      const t = e.target;
      if (t && typeof t.click === "function") t.click();
    }
  }, {passive:false});
})();
</script>
<script>

window.__iosStandaloneFix = { active:false, gap:null, screenH:null, appliedH:null };
(function(){
  function isStandaloneMode(){
    return (window.matchMedia && matchMedia("(display-mode:standalone)").matches) ||
           window.navigator.standalone === true;
  }

  function isPortrait(){
    if (window.matchMedia){
      const mq = matchMedia("(orientation:portrait)");
      if (typeof mq.matches === "boolean") return mq.matches;
    }
    return window.innerWidth < window.innerHeight;
  }
  function clearInline(){
    document.documentElement.style.height = "";
    document.body.style.height = "";
    const appEl = document.getElementById("app");
    if (appEl) appEl.style.height = "";
  }
  function apply(){
    const state = window.__iosStandaloneFix;
    if (!isStandaloneMode()){
      state.active = false; state.gap = null; state.screenH = null; state.appliedH = null;
      return;
    }
    if (!isPortrait()){
      clearInline();
      state.active = false; state.gap = null; state.screenH = null; state.appliedH = null;
      resizeMap();
      return;
    }
    const sh = window.screen && window.screen.height;
    const ih = window.innerHeight;
    if (!sh || !ih){ state.active = false; return; }
    const gap = sh - ih;
    state.screenH = sh; state.gap = gap;
    if (gap > 15 && gap < 100){
      const px = sh + "px";
      document.documentElement.style.height = px;
      document.body.style.height = px;
      const appEl = document.getElementById("app");
      if (appEl) appEl.style.height = px;
      state.active = true;
      state.appliedH = sh;
    } else {
      clearInline();
      state.active = false;
      state.appliedH = null;
    }
    resizeMap();
  }
  apply();
  window.addEventListener("orientationchange", function(){ setTimeout(apply, 250); });
  window.addEventListener("resize", apply);
})();
</script>

<script>

(function(){

  const GOATCOUNTER_SITE = "tw101099n";
  const BASE = GOATCOUNTER_SITE ? "https://" + GOATCOUNTER_SITE + ".goatcounter.com" : "";
  const LINE1 = "我愛我那環海多山的國家";
  const FALLBACK = "Author: 行路有風溫柔閣驕傲的臺灣查某囝";

  let total = null;      // 拿到過的總數（字串，已含千分位）；null＝還沒拿到
  let panel = null, closing = false;

  function ping(){
    if (!BASE) return;
    try{
      const s = document.createElement("script");
      s.async = true;
      s.src = "https://gc.zgo.at/count.js";
      s.setAttribute("data-goatcounter", BASE + "/count");
      s.onerror = function(){};
      document.head.appendChild(s);
    }catch(e){}
  }

  function fetchTotal(){
    if (!BASE) return Promise.resolve(null);
    return fetch(BASE + "/counter/TOTAL.json", {mode:"cors"})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){
        const c = j && j.count;
        if (typeof c === "string" && c.trim()) { total = c.trim(); return total; }
        if (typeof c === "number") { total = String(c); return total; }
        return null;
      })
      .catch(function(){ return null; });
  }

  function countText(){
    return total ? total + " 個臺灣囡子的足跡" : FALLBACK;
  }

  function open(){
    if (panel) return;
    closing = false;
    panel = document.createElement("div");
    panel.className = "egg";
    panel.setAttribute("role", "dialog");
    panel.setAttribute("aria-label", LINE1);
    const card = document.createElement("div");
    card.className = "eggcard";
    const l1 = document.createElement("p");
    l1.className = "eggline";
    l1.textContent = LINE1;
    const l2 = document.createElement("p");
    l2.className = "eggcount";
    l2.textContent = countText();
    card.appendChild(l1);
    card.appendChild(l2);
    panel.appendChild(card);

    card.addEventListener("click", function(e){ e.stopPropagation(); });
    panel.addEventListener("click", close);
    document.body.appendChild(panel);

    void panel.offsetWidth;
    panel.classList.add("on");

    if (!total && BASE){
      fetchTotal().then(function(){
        if (panel && !closing && total) l2.textContent = countText();
      });
    }

    document.addEventListener("keydown", onKey);
  }
  function onKey(e){ if (e.key === "Escape") close(); }
  function close(){
    if (!panel || closing) return;
    closing = true;
    document.removeEventListener("keydown", onKey);
    const p = panel;
    panel = null;
    p.classList.remove("on");

    let done = false;
    function drop(){
      if (done) return;
      done = true;
      if (p.parentNode) p.parentNode.removeChild(p);
    }
    p.addEventListener("transitionend", drop);
    setTimeout(drop, 600);
  }

  const logo = document.getElementById("logo");
  if (logo){
    let timer = null, sx = 0, sy = 0, moved = false;
    const HOLD_MS = 3000, TOL = 14;
    function begin(x, y){
      moved = false; sx = x; sy = y;
      clearTimeout(timer);
      timer = setTimeout(function(){ if (!moved) open(); }, HOLD_MS);
    }
    function trackMove(x, y){
      if (Math.abs(x - sx) > TOL || Math.abs(y - sy) > TOL){ moved = true; clearTimeout(timer); }
    }
    function cancel(){ clearTimeout(timer); }
    logo.addEventListener("touchstart", function(e){ const t = e.touches[0]; begin(t.clientX, t.clientY); }, {passive:true});
    logo.addEventListener("touchmove", function(e){ const t = e.touches[0]; trackMove(t.clientX, t.clientY); }, {passive:true});
    logo.addEventListener("touchend", cancel);
    logo.addEventListener("touchcancel", cancel);
    logo.addEventListener("mousedown", function(e){ begin(e.clientX, e.clientY); });
    logo.addEventListener("mousemove", function(e){ if (timer) trackMove(e.clientX, e.clientY); });
    logo.addEventListener("mouseup", cancel);
    logo.addEventListener("mouseleave", cancel);
    logo.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  }

  ping();
  fetchTotal();
})();
</script>
