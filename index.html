<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>新竹出發多日遊｜挑一趟過夜的行程</title>
<meta name="description" content="從新竹出發、過一夜以上的行程：85 個景點與住宿，依基地、主題與時間篩選，可以直接排成一趟兩天一夜。">
<meta property="og:type" content="website">
<meta property="og:title" content="新竹出發多日遊｜挑一趟過夜的行程">
<meta property="og:description" content="以過夜基地為中心的景點與住宿地圖，挑完直接開 Google 地圖導航。">
<meta property="og:locale" content="zh_TW">
<meta property="og:url" content="https://tw101099.github.io/hsinchu-multiday-trips/">
<meta property="og:image" content="https://tw101099.github.io/hsinchu-multiday-trips/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://tw101099.github.io/hsinchu-multiday-trips/og-image.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%235c5449'/%3E%3Cpath d='M5 24h22L18.5 9.5l-4 6.5-3-4z' fill='none' stroke='%23faf9f7' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>

:root{
  --bg:#faf9f7; --panel:#ffffff; --sunk:#f2efe9;
  --ink:#1c1a17; --ink2:#6b645b; --ink3:#9a938a;
  --line:#e3ddd3; --line2:#cfc7ba;
  --accent:#5c5449; --accent-soft:#eae4d9; --on-accent:#ffffff;
  --warn:#9a5b17;

  --danger:#9c3b2c;
  --sb:#cfc7ba; --sb-hover:#a89f92;
  --r:10px; --barh:56px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131211; --panel:#1b1a18; --sunk:#232120;
    --ink:#efeae2; --ink2:#a29a8f; --ink3:#787066;
    --line:#332f2b; --line2:#454039;
    --accent:#bcb2a2; --accent-soft:#2c2822; --on-accent:#17150f;
    --warn:#e0a45c;
    --danger:#c17167;
    --sb:#4a443c; --sb-hover:#6a6157;
      }
}
:root[data-theme="dark"]{
    --bg:#131211; --panel:#1b1a18; --sunk:#232120;
    --ink:#efeae2; --ink2:#a29a8f; --ink3:#787066;
    --line:#332f2b; --line2:#454039;
    --accent:#bcb2a2; --accent-soft:#2c2822; --on-accent:#17150f;
    --warn:#e0a45c;
        --danger:#c17167;
    --sb:#4a443c; --sb-hover:#6a6157;
}
*{box-sizing:border-box; scrollbar-width:thin; scrollbar-color:var(--sb) transparent;
  -webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:11px; height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{
  background:var(--sb); border-radius:999px; border:3px solid transparent; background-clip:content-box;
}
::-webkit-scrollbar-thumb:hover{background:var(--sb-hover); background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}

html{height:100%; overflow:hidden; overscroll-behavior:none; touch-action:manipulation}
body{
  margin:0; height:100dvh; overflow:hidden; overscroll-behavior:none;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.6;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
  -webkit-user-select:none; user-select:none;
  touch-action:manipulation;
}
button{font:inherit; color:inherit; cursor:pointer}
.num{font-family:var(--mono); font-size:.92em; letter-spacing:-.01em}
.ic{width:14px; height:14px; flex:none; stroke:currentColor; fill:none; stroke-width:1.5;
    stroke-linecap:round; stroke-linejoin:round; vertical-align:-2px; margin-right:4px}

.app{display:flex; flex-direction:column; height:100dvh; overflow:hidden; padding-bottom:calc(var(--barh) + env(safe-area-inset-bottom))}

@media (display-mode:standalone) and (orientation:portrait){
  html, body, .app{ height:100vh; height:-webkit-fill-available; }
}
.bar{
  flex:none; display:flex; align-items:center; gap:10px;
  padding:max(8px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));
  background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap;
}
.logo{font-weight:700; white-space:nowrap}
.logo small{display:block; font-weight:400; font-size:11px; color:var(--ink3); letter-spacing:.06em}
.seg{display:flex; background:var(--sunk); border-radius:999px; padding:2px}
.seg button{border:0; background:none; padding:4px 13px; border-radius:999px; font-size:13px; color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--accent); color:var(--on-accent)}

#qwrap{

  flex:1 1 150px; max-width:250px; min-width:110px; padding:2px 9px 2px 6px;
  border-radius:999px; border:1px solid var(--line); background:var(--bg);
  display:flex; flex-wrap:nowrap; align-items:center; gap:3px; min-height:32px; cursor:text;
  overflow-x:auto; scrollbar-width:none;
}
#qwrap::-webkit-scrollbar{display:none}
#qwrap:hover{border-color:var(--accent)}
#qwrap:focus-within{outline:1px solid var(--accent); border-color:var(--accent)}
#q{
  flex:1 1 60px; min-width:50px; width:0; padding:3px 0 3px 6px; border:none; outline:none;
  background:transparent; color:var(--ink); font:inherit; font-size:16px;
}

.qtok{
  flex:none;   
  display:inline-flex; align-items:center; gap:4px; font-size:12px; line-height:1.7;
  padding:0 7px 0 9px; border-radius:999px; border:1px solid var(--accent);
  color:var(--accent); background:none; cursor:pointer; white-space:nowrap; font-family:inherit;
}
.qtok:hover{opacity:.7}
.qtok .x{font-size:14px; line-height:1; opacity:.8}
#theme{
  flex:none; border:1px solid var(--line2); background:var(--bg); border-radius:999px;
  padding:5px 9px; line-height:1; color:var(--ink2);
}
#theme:hover{border-color:var(--accent); color:var(--accent)}
#theme svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.6;
           stroke-linecap:round; stroke-linejoin:round; vertical-align:-2px}
.tally{margin-left:auto; font-size:12px; color:var(--ink3); white-space:nowrap}

@media (max-width:520px){
  .tally{display:none}

  #qwrap{flex:1 1 80px; min-width:80px; max-width:none}
}

.main{flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden}
.panel{
  background:var(--panel); border-top:1px solid var(--line);
  flex:0 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
.stage{position:relative; flex:1 1 auto; min-height:220px; background:var(--sunk)}
#map{position:absolute; inset:0}
.mapnote{
  position:absolute; left:10px; bottom:10px; z-index:500; display:none; max-width:calc(100% - 20px);
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:5px 10px; font-size:11.5px; color:var(--ink2); box-shadow:0 1px 6px rgba(0,0,0,.12);
}
.mapmsg{
  position:absolute; inset:0; display:none; flex-direction:column; justify-content:center;
  padding:26px; gap:8px; color:var(--ink2); font-size:13.5px; text-align:center;
}

.stage .leaflet-bottom{bottom:var(--tripup, 0px)}
.mapoverlay{
  position:absolute; left:10px; right:10px; z-index:600;

  bottom:calc(10px + var(--tripup, 0px));
  display:flex; flex-direction:column; align-items:flex-start; gap:8px; pointer-events:none;
}
.mapoverlay > *{pointer-events:auto}
.mapbtns{display:flex; flex-direction:column; align-items:flex-start; gap:6px; max-width:100%}
.mapbtns button{
  border:1px solid var(--line); background:var(--panel); color:var(--ink2);
  border-radius:999px; padding:5px 12px; font-size:12.5px; white-space:nowrap;
  box-shadow:0 1px 6px rgba(0,0,0,.18);
}
.mapbtns button:hover{border-color:var(--accent); color:var(--accent)}
.mapbtns button[aria-pressed=true]{background:var(--accent-soft); border-color:var(--accent); color:var(--ink); font-weight:600}

.leaflet-bar a.locbtn{display:flex; align-items:center; justify-content:center; cursor:pointer}

.locbtn svg{display:block; width:16px; height:16px; fill:none; stroke:currentColor;
            stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}

.mypin{
  width:22px !important; height:22px !important; margin:-11px 0 0 -11px !important;
  display:grid; place-items:center; border-radius:999px;
  background:#7B57A8; border:2.5px solid var(--panel); box-shadow:0 1px 5px rgba(0,0,0,.35);
}
:root[data-theme="dark"] .mypin{background:#B79BDB}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .mypin{background:#B79BDB} }
.mypin svg{display:block; width:12px; height:12px; stroke:var(--panel); fill:none;
           stroke-width:2; stroke-linecap:round; stroke-linejoin:round}

.leaflet-marker-icon.hubpin, .leaflet-marker-icon.mypin{display:grid}
.locbtn.on{color:#7B57A8}
:root[data-theme="dark"] .locbtn.on{color:#B79BDB}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .locbtn.on{color:#B79BDB} }
.loctip{
  position:absolute; left:50%; bottom:64px; transform:translateX(-50%);
  background:var(--panel); color:var(--ink); border:1px solid var(--line);
  border-radius:8px; padding:6px 12px; font-size:13px; z-index:1200;
  box-shadow:0 2px 10px rgba(0,0,0,.18); opacity:0; transition:opacity .25s;
  pointer-events:none; white-space:nowrap;
}
.loctip.show{opacity:1}

.totop{
  position:fixed; z-index:550;
  right:calc(16px + env(safe-area-inset-right));
  bottom:calc(var(--barh) + env(safe-area-inset-bottom) + 16px);
  width:40px; height:40px;
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--panel); border:1px solid var(--line2); color:var(--ink2);
  box-shadow:0 2px 10px rgba(0,0,0,.22); opacity:0; pointer-events:none;
  transition:opacity .15s, border-color .15s, color .15s;
}
.totop[hidden]{display:none}
.totop svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.totop:hover{border-color:var(--accent); color:var(--accent)}
.totop.show{opacity:1; pointer-events:auto}
.totop.docked{right:calc(100vw - 394px + env(safe-area-inset-right))}

.mapcard{
  display:none; align-self:stretch; background:var(--panel); border:1px solid var(--line2);
  border-radius:var(--r); box-shadow:0 2px 14px rgba(0,0,0,.22); padding:10px 12px;
}
.mapcard.on{display:block}
.mapcard .ttl{display:flex; align-items:flex-start; gap:8px}
.mapcard .ttl b{font-size:14px; font-weight:600; flex:1; min-width:0}
.mapcard .x{flex:none; border:0; background:none; color:var(--ink3); font-size:16px; line-height:1; padding:0 2px}
.mapcard .x:hover{color:var(--accent)}
.mapcard .sub{margin:3px 0 0; font-size:12px; color:var(--ink3)}
.mapcard .m{margin:5px 0 0; font-size:12px; color:var(--ink2); display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 10px}
.mapcard .acts{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px}
.mapcard .acts a, .mapcard .acts button{
  border:1px solid var(--line); background:var(--bg); color:var(--ink2); text-decoration:none;
  border-radius:999px; padding:3px 10px; font-size:12.5px; white-space:nowrap;
}
.mapcard .acts .primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}

.pinlbl{
  position:absolute; left:30px; top:50%; transform:translateY(-50%); white-space:nowrap;
  font-size:11.5px; color:var(--ink); background:var(--panel); border:1px solid var(--line);
  border-radius:4px; padding:1px 5px; box-shadow:0 1px 3px rgba(0,0,0,.16);
  cursor:pointer;   
}
.main.nomap .stage{display:none}

.main.nomap .panel{flex:1 1 auto}

@media (max-width:899px), (max-height:559px){
  .main:not(.nomap) .results,
  .main:not(.nomap) .legend,
  .main:not(.nomap) .foot,

  .main:not(.nomap) .tripbox,
  .main:not(.nomap) .baseview,
  .main:not(.nomap) .sec.toplevel{display:none}
  .main:not(.nomap) .stage{min-height:280px}
}

@media (min-width:900px) and (min-height:560px){
  .main{flex-direction:row}
  .panel{width:410px; flex:0 0 410px; border-top:0; border-right:1px solid var(--line)}
  .main.nomap .panel{width:auto; flex:1 1 auto}
}

.fbar{
  position:sticky; top:0; z-index:400; display:flex; align-items:center; gap:8px;
  padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line);
}
.fbtn{
  flex:none; border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent);
  border-radius:999px; padding:4px 12px; font-size:13px; white-space:nowrap; font-weight:600;
}
.fbtn[aria-expanded=true]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.chev{width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round;
      stroke-linejoin:round; margin-left:4px; vertical-align:-1px; transition:transform .15s}
.fbtn[aria-expanded=true] .chev{transform:rotate(180deg)}
.fsum{

  flex:1; min-width:0; font:inherit; font-size:13.5px; color:var(--ink2);
  overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; border:0; background:none; padding:2px 0; text-align:left;
}
.fsum:hover{color:var(--ink)}
.fsum b{color:var(--ink); font-weight:600}

.clear, .ghost, .trip .go a, .trip .go button{
  border:1px solid var(--line); background:var(--bg); color:var(--ink2);
  border-radius:999px; padding:3px 10px; font-size:12.5px; white-space:nowrap;
  text-decoration:none; font-family:inherit; line-height:1.5;
}
.clear:hover, .ghost:hover, .trip .go a:hover, .trip .go button:hover{border-color:var(--line2); color:var(--ink)}
.clear:hover{color:var(--accent)}
#sort{
  flex:none; border:1px solid var(--line); border-radius:999px; background:var(--bg); color:var(--ink2);
  font:inherit; font-size:12.5px; padding:3px 10px; max-width:120px;
}

.filters{padding:10px 14px 12px; border-bottom:1px solid var(--line)}
.frow{display:flex; align-items:flex-start; gap:9px; padding:4px 0}
.fkey{flex:none; width:52px; padding-top:4px; font-size:11.5px; color:var(--ink3); letter-spacing:.06em}
.chips{display:flex; flex-wrap:wrap; gap:5px; flex:1; min-width:0}
.chip{
  border:1px solid var(--line); background:var(--bg); border-radius:999px;
  padding:3px 10px; font-size:12.5px; color:var(--ink2); line-height:1.5;
  transition:border-color .15s, background .15s, color .15s;
}
.chip:hover{border-color:var(--line2); color:var(--ink)}

.chip[aria-pressed=true]{background:var(--accent-soft); border-color:var(--accent); color:var(--ink); font-weight:600}
.chip:disabled{opacity:.45; cursor:default; pointer-events:none}
.cnt{margin-left:5px; color:var(--ink3); font-size:11px}
.chip[aria-pressed=true] .cnt{color:var(--ink3)}
.sec{
  display:flex; align-items:center; gap:7px; width:100%; border:0; background:none;
  padding:9px 0 0; margin-top:11px; border-top:1px solid var(--line);
  font-size:12.5px; color:var(--ink2); text-align:left;
}
.sec:hover{color:var(--accent)}
.sec .n{color:var(--ink3); font-family:var(--mono)}

.sec .n .ic{width:13px; height:13px; vertical-align:-2px; margin-left:3px}

.sec.toplevel{padding-left:14px; padding-right:14px; border-top:0; margin-top:0}

.filters > .sec:first-child{border-top:0; margin-top:0; padding-top:2px}
.sec.toplevel[aria-expanded=false]{border-bottom:1px solid var(--line); padding-bottom:9px}
.sec .chev{margin-left:auto}
.sec[aria-expanded=true] .chev{transform:rotate(180deg)}
.subrows{margin-top:5px}
.rgroup{margin-top:6px}

.dirsec{border-top:0; margin-top:4px; padding-top:4px; font-size:12px}

.rgroup.first .dirsec{margin-top:0}
.dirsec::before{content:""; flex:none; width:8px; height:8px; border-radius:50%; background:var(--dc,var(--ink3))}
.dirsec .n{font-family:var(--mono)}
.rlist{margin-top:4px}
.rrow{
  display:flex; width:100%; align-items:center; gap:9px; padding:6px 8px; font-size:13px;
  border:1px solid transparent; border-radius:8px; background:none; text-align:left; color:var(--ink2);
}
.rrow:hover{background:var(--sunk); color:var(--ink)}
.rrow[aria-pressed=true]{background:var(--accent-soft); border-color:var(--accent); color:var(--ink); font-weight:600}

.rrow .rbar{flex:none; width:3px; height:17px; border-radius:2px}
.rrow .nm{flex:1; min-width:0}
.rrow .n{flex:none; font-size:11.5px; color:var(--ink3)}

.results{padding:2px 12px 20px}

.ghead{
  position:relative; display:flex; width:100%; align-items:center; gap:7px;
  margin:14px 0 6px; padding:6px 10px 6px 15px; border:0; border-radius:8px;
  border-bottom:1px solid var(--line); background:none; text-align:left; cursor:pointer;
  font:inherit; font-size:12px; color:var(--ink3); transition:background .12s;
}
.ghead:hover{background:var(--sunk)}
.ghead::before{
  content:""; position:absolute; left:0; top:8px; bottom:8px; width:3px;
  border-radius:2px; background:var(--dc,var(--ink3));
}
.ghead .gnm{
  flex:1; min-width:0; font-size:14px; font-weight:600; color:var(--ink);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.ghead .num{flex:none}
.ghead .chev{flex:none; width:12px; height:12px; color:var(--ink3); transition:transform .15s}
.ghead[aria-expanded=true] .chev{transform:rotate(180deg)}

.gintro{
  margin:0 0 8px; padding:10px 13px 11px; border-radius:8px; background:var(--sunk);
}
.gintro .gstyle{display:flex; flex-wrap:wrap; gap:5px; margin:0 0 8px}
.gintro .gchip{
  font-size:11px; padding:2px 8px; border-radius:999px; background:var(--panel);
  border:1px solid var(--line2); color:var(--ink2); white-space:nowrap;
}

.gintro .gdesc{
  font-size:13px; color:var(--ink2); line-height:1.65; margin:0 0 7px;
  -webkit-user-select:text; user-select:text;
}

.gintro .groads{font-size:11.5px; color:var(--ink3); line-height:1.5; margin:0}
.row{
  position:relative; display:flex; width:100%; text-align:left; gap:8px; align-items:flex-start;
  border:1px solid transparent; border-radius:var(--r); background:none; padding:7px 9px;
  transition:background .12s, border-color .12s;
}
.row:hover{background:var(--sunk)}
.row[aria-expanded=true]{background:var(--accent-soft); border-color:var(--accent)}
.row .rbody{flex:1; min-width:0}
.row .t{display:flex; gap:6px; align-items:center; font-size:14.5px; font-weight:600}

.row .m{font-size:12px; color:var(--ink2); margin-top:1px; display:flex; align-items:baseline; flex-wrap:wrap}
.row .off{color:var(--ink3); font-size:11px; border:1px dashed var(--line2); border-radius:999px; padding:0 6px}
.add{
  flex:none; align-self:center; border:1px solid var(--line2); background:var(--bg);
  width:26px; height:26px; border-radius:999px; font-size:14px; line-height:1;
  color:var(--ink3); padding:0;
}
.add:hover{border-color:var(--accent); color:var(--accent)}
.add[data-in=true]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}

.add[data-in=true]:hover{border-color:var(--accent); color:var(--on-accent)}
.tag{font-size:11px; padding:0 7px; border-radius:999px; border:1px solid var(--line2); color:var(--ink2); white-space:nowrap}
.tag.hard{border-color:var(--warn); color:var(--warn)}
.star{color:var(--accent); font-size:11px}
.empty{padding:26px 6px; color:var(--ink2); font-size:14px}
.empty button{border:0; background:none; color:var(--accent); text-decoration:underline; padding:0}

.main.nomap .results{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:0 14px; align-items:start}
.main.nomap .ghead, .main.nomap .gintro, .main.nomap .detail{grid-column:1/-1}

@media (min-width:700px){
  .main.nomap .detail{border-top:1px solid var(--accent); border-radius:var(--r); margin-top:6px}
}

.detail{
  border:1px solid var(--accent); border-top:0; border-radius:0 0 var(--r) var(--r);
  margin:-1px 9px 10px; padding:11px 13px 13px; background:var(--accent-soft);
}

 "青年活動中心", "diff": "開車", "time": "", "season": "", "desc": "位於阿里山公路 85K 轉入之二萬坪風景區，海拔 2,000 公尺。活動中心正對壯麗塔山石壁，緊鄰林鐵二萬平車站與黑森林步道，提供二人房、四人房及團體房型，環境比園區內部更為安靜清幽，為觀賞塔山夕照雲海之高山旅宿。", "note": "雙人套房平日約 2800–3600 元、假日約 3600–4600 元（含早餐）；可透過救國團官網或電話預約；門前設有寬敞免費停車場；山區早晚溫差大，備品簡約建議自備盥洗用具。", "tags": ["夕陽", "夜景", "避暑"], "sources": ["https://alishan.cyh.org.tw/"], "source": "https://alishan.cyh.org.tw/", "drive": "離基地約 25 分", "stay_h": 0.5, "drive_min": 25, "total_h": 1.3, "season_months": [], "id": "pbede15f5"}, {"name": "小笠原山觀景台", "lat": 23.506129, "lng": 120.823798, "town": "南投縣信義鄉", "base": "alishan", "theme": "trail-mountain", "kind": "環景平台", "diff": "散步", "time": "約 1–1.5 小時", "season": "10月-12月", "desc": "位於祝山稜脈最南端，海拔 2,488 公尺，以 1904 年首度踏勘的日籍技師小笠原富次郎命名。頂端設置全圓形木造環景平台，擁有 360 度無死角高山展望，向東環伺玉山群峰、向南縱覽陳有蘭溪谷與阿里山山脈，清晨常可遇見台灣特有種黑長尾雉（帝雉）於草地覓食。", "note": "由祝山車站步行鋪裝柏油林道約 10–15 分鐘（約 500 公尺）即可抵達；相較於祝山平台人潮更為分散清幽；觀景台設有木椅，全線無洗手間。位於阿里山國家森林遊樂區內，需購票入園（票價與入園時間依林業署官方公告）。", "tags": ["展望", "避暑"], "sources": ["https://www.ali-nsa.net/"], "source": "https://www.ali-nsa.net/", "drive": "離基地約 25 分", "stay_h": 1.5, "drive_min": 25, "total_h": 2.3, "season_months": [10, 11, 12], "id": "p4ebbb2b2"}, {"name": "巨木群棧道", "lat": 23.5167437, "lng": 120.8096083, "town": "嘉義縣阿里山鄉", "base": "alishan", "theme": "trail-mountain", "kind": "巨木步道", "diff": "健行", "time": "全程約 1.5–2 小時", "season": "", "desc": "串聯阿里山園區內兩期巨木棧道系統，全長逾 1 公里，穿行於 36 株樹齡數百年至兩千年以上之紅檜巨木林中。沿途途經樹齡約 2,000 年之香林神木、千歲檜、樹靈塔、琴山河合博士旌功碑以及神木火車站倒伏的第一代老神木遺跡。", "note": "步道多為高架木棧道與石階，坡度起伏適中；可搭配神木車站搭乘森林小火車折返阿里山車站，減少回程上坡攀爬負擔；林間濕氣重，階梯濕滑需著防滑鞋。位於阿里山國家森林遊樂區內，需購票入園（票價與入園時間依林業署官方公告）。", "tags": ["巨木", "避暑", "親子"], "sources": ["https://recreation.forest.gov.tw/Trail/RT?tr_id=075"], "source": "https://recreation.forest.gov.tw/Trail/RT?tr_id=075", "drive": "離基地約 5 分", "stay_h": 2.0, "drive_min": 5, "total_h": 2.2, "season_months": [], "id": "p37a9c1a5"}, {"name": "水山巨木步道", "lat": 23.5127758, "lng": 120.812081, "town": "嘉義縣阿里山鄉", "base": "alishan", "theme": "trail-mountain", "kind": "森林鐵道步道", "diff": "散步", "time": "往返約 1.5 小時", "season": "", "desc": "沿昔日阿里山通往自忠的水山線鐵道修築而成，步道全長約 1.6 公里，海拔約 2,200 公尺。沿途保留舊鐵道柳杉林景觀與木造桁架拱橋，終點為樹齡約 2,700 年、胸圍超過 16 公尺的水山巨木紅檜，環境靜謐清幽。", "note": "由沼平車站步行出發，沿途鋪設碎石與木棧道，坡度起伏極小，老少咸宜；午後林間容易起濃霧，建議午後 15:30 前完成健行；步道內無洗手間，需先於沼平車站使用。位於阿里山國家森林遊樂區內，需購票入園（票價與入園時間依林業署官方公告）。", "tags": ["巨木", "避暑", "親子"], "sources": ["https://recreation.forest.gov.tw/Trail/RT?tr_id=076"], "source": "https://recreation.forest.gov.tw/Trail/RT?tr_id=076", "drive": "離基地約 5 分", "stay_h": 1.5, "drive_min": 5, "total_h": 1.7, "season_months": [], "id": "peda8fbca"}, {"name": "祝山觀日平臺", "lat": 23.5103109, "lng": 120.8236851, "town": "嘉義縣阿里山鄉", "base": "alishan", "theme": "trail-near", "kind": "觀日高台", "diff": "散步", "time": "約 1 小時", "season": "", "desc": "位於阿里山林鐵祝山車站旁，海拔 2,451 公尺，為阿里山歷史悠久之日出展望勝地。平台正對玉山群峰與中央山脈北段稜線，清晨可欣賞旭日自玉山山頭躍出之晨曦，以及腳下翻騰之高山雲海。", "note": "可於阿里山火車站前一日 13:00–16:00 預購隔日清晨祝山線觀日列車車票；觀日列車發車時間依每日日出時間調整（約清晨 04:30–05:50 間）；清晨氣溫偏低，需穿著禦寒保暖衣物。位於阿里山國家森林遊樂區內，需購票入園（票價與入園時間依林業署官方公告）。", "tags": ["展望", "看火車", "避暑"], "sources": ["https://afrch.forest.gov.tw/"], "source": "https://afrch.forest.gov.tw/", "drive": "離基地約 20 分", "stay_h": 1.0, "drive_min": 20, "total_h": 1.7, "season_months": [], "id": "p2ded9413"}, {"name": "Dabang Kuba", "lat": 23.4548846, "lng": 120.7496079, "town": "嘉義縣阿里山鄉", "base": "dabang-tefuye", "theme": "heritage", "kind": "男子會所", "diff": "散步", "time": "約 30–45 分鐘", "season": "", "desc": "座落於達邦大社中心，為鄒族僅存的兩座庫巴（Kuba，傳統男子會所）之一，列為國定重要民俗文化資產。建築採高架圓木榫接構建，覆蓋五節芒草屋頂，入口處種植神樹雀榕，為每年舉辦著名瑪雅斯比戰祭之核心神聖場域。", "note": "傳統習俗嚴禁女性與外人登上階梯進入庫巴內部，遊客僅能在廣場外圍參觀拍照；進入祭典廣場請保持肅靜與文化尊重；周邊設有部落公廁與小型停車空地。", "tags": ["老宅", "避暑"], "sources": ["https://alishan.cyhg.gov.tw/"], "source": "https://alishan.cyhg.gov.tw/", "drive": "離基地約 5 分", "stay_h": 0.75, "drive_min": 5, "total_h": 0.9, "season_months": [], "id": "dabang-kuba"}, {"name": "特富野男子會所（特富野庫巴）", "lat": 23.4623, "lng": 120.7574353, "town": "嘉義縣阿里山鄉", "base": "dabang-tefuye", "theme": "heritage", "kind": "男子會所", "diff": "散步", "time": "約 30–45 分鐘", "season": "", "desc": "特富野大社的核心聚會所，與達邦庫巴並列為鄒族現存兩座神聖庫巴之一。建築前方矗立象徵天神降臨通道之巨大雀榕神樹與木斛蘭，為部落長老議事、男子成年禮與傳統戰祭的聖所，外觀雄偉且散發古樸原鄉氣息。", "note": "遵守鄒族文化禁忌，女性與未經許可之外人嚴禁登階進入建築本體；祭典期間遵守部落祭儀規範；特富野聚落道路較狹窄，建議將車輛停放於部落外側牌樓停車場後步行入內。", "tags": ["老宅", "避暑"], "sources": ["https://www.cip.gov.tw/"], "source": "https://www.cip.gov.tw/", "drive": "離基地約 5 分", "stay_h": 0.75, "drive_min": 5, "total_h": 0.9, "season_months": [], "id": "pe3609bc1"}, {"name": "貢禮之石", "lat": 23.4081787, "lng": 120.7222309, "town": "嘉義縣阿里山鄉", "base": "dabang-tefuye", "theme": "heritage", "kind": "自然祭祀石", "diff": "開車", "time": "約 20–30 分鐘", "season": "", "desc": "座落於縣169線進入里佳部落（藍色部落）入口處路旁，為鄒族守護神信仰的巨大天然岩石。相傳早年族人入山打獵或遠行返回聚落前，必在此巨石前擺放酒、肉或農作祭祀山神以祈求平安與庇佑，石面平整宛如天然供桌。", "note": "位於 169 縣道旁，設有解說告示牌與小型臨停避車彎；參觀時請尊重原住民信仰儀軌，切勿攀爬巨石或於祭石上丟棄垃圾；由此續行約 2 公里即可抵達里佳聚落中心。", "tags": ["避暑"], "sources": ["https://www.ali-nsa.net/"], "source": "https://www.ali-nsa.net/", "drive": "離基地約 20 分", "stay_h": 0.5, "drive_min": 20, "total_h": 1.2, "season_months": [], "id": "pf1415094"}, {"name": "Mimiyo秘密遊民宿", "lat": 23.4281214, "lng": 120.7408652, "town": "嘉義縣阿里山鄉", "base": "dabang-tefuye", "zone": "特富野社", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "座落於特富野深山山谷溪畔，由鄒族青年打造，取名 Mimiyo 意為鄒族語「到處走走」。園區隱身於茂密竹林與原始林間，提供全木造景觀客房與石砌大浴池，夜間圍繞柴燒壁爐品茗閒談，環境遺世獨立。", "note": "雙人套房平日約 3600–4200 元、假日約 4500–5500 元（含手作早餐）；需透過官方網站或電話預約；由達邦深入山區產業道路約 15 分鐘，路幅較窄需小心慢行；全館室內禁菸。", "tags": ["避暑", "夜景"], "sources": ["http://www.mimiyo.com.tw/"], "source": "http://www.mimiyo.com.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "mimiyo"}, {"name": "給巴娜民宿", "lat": 23.4562528, "lng": 120.7529753, "town": "嘉義縣阿里山鄉", "base": "dabang-tefuye", "zone": "達邦大社", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "座落於達邦部落中心，為鄒族在地經營之原鄉文化接待民宿。提供雙人及四人溫馨家庭套房，戶外設有烤肉專區與休閒露台，民宿主人熱情分享鄒族傳統祭儀故事，並可協助預訂在地原民風味餐。", "note": "雙人房平日約 2000–2600 元、假日約 2800–3400 元；採電話預訂；附設專屬庭院停車位；如需體驗部落烤肉或風味晚餐需於訂房時提前預約。", "tags": ["親子", "避暑"], "sources": ["https://alishan.cyhg.gov.tw/"], "source": "https://alishan.cyhg.gov.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p5377759a"}, {"name": "特富野步道", "lat": 23.4604829, "lng": 120.7541593, "town": "嘉義縣阿里山鄉", "base": "dabang-tefuye", "theme": "trail-near", "kind": "部落古道", "diff": "健行", "time": "單程約 40–60 分鐘", "season": "", "desc": "連接達邦大社與特富野社的百年人行聯絡步道，全長約 1.1 公里，起點由達邦吊橋跨越伊斯基安溪。步道穿梭於高聳的百年樟樹純林與蒼翠竹林之中，地勢略有起伏，登高處可俯瞰達邦部落山谷田園景色。", "note": "此步道為村落間的特富野步道，非台18線自忠端的特富野古道，兩者路徑完全不同；步道鋪設木棧階梯與泥土路，雨後竹林段稍濕滑，建議著輕便健行鞋；兩端入口皆有路牌指引。", "tags": ["避暑", "巨木", "親子"], "sources": ["https://www.ali-nsa.net/"], "source": "https://www.ali-nsa.net/", "drive": "離基地約 5 分", "stay_h": 1.0, "drive_min": 5, "total_h": 1.2, "season_months": [], "id": "p627de700"}, {"name": "雲海咖啡廳", "lat": 24.5276473, "lng": 121.1178162, "town": "新竹縣五峰鄉", "base": "guanwu", "theme": "cafe", "kind": "景觀咖啡", "diff": "開車", "time": "約 1 小時", "season": "雲海季10月至翌年3月，小藍莓產季7月至8月", "desc": "設於雪霸休閒農場花園觀景台旁，海拔1,923公尺，面向五峰鄉深山群谷與大霸尖山方向。室內外設有木質觀景露天座位，招牌為在地栽植手工小藍莓果茶、高山熱咖啡與現烤格子鬆餅，傍晚為觀賞雲海晚霞絕佳位置。", "note": "營業時間 08:30–21:00（全年無休）；每人低消一杯飲品或餐點（約140–200元）；現金與信用卡皆可；車輛停放雪霸農場公用停車位；午後戶外露天座位氣溫降至攝氏15度以下，需自備防風保暖衣物。", "tags": ["展望", "夕陽", "避暑"], "sources": ["https://www.sheipa.com.tw/", "https://travel.hsinchu.gov.tw/"], "source": "https://www.sheipa.com.tw/", "drive": "離基地約 10 分", "stay_h": 1.0, "drive_min": 10, "total_h": 1.3, "season_months": [1, 2, 3, 7, 8, 10, 11, 12], "id": "p7358392c"}, {"name": "觀霧餐廳", "lat": 24.5033779, "lng": 121.1142665, "town": "苗栗縣泰安鄉", "base": "guanwu", "theme": "food", "kind": "合菜熱食", "diff": "開車", "time": "約 1 小時", "season": "霧社櫻花季3月中旬至下旬", "desc": "位於觀霧山莊內，為海拔2,000公尺觀霧遊憩區全區唯一提供熱食合菜與熱湯之實體餐飲據點。供應高山野溪鱸魚、客家小炒、馬告排骨湯等熱騰騰合菜定食與單點料理，餐廳前庭即為知名地標霧社櫻王。", "note": "中餐供餐時間 11:30–14:00（對外開放單點與合菜）、晚餐 17:30–19:30（以住客為主，視現場食材情況開放散客）；非山莊房客可現場候位或電話確認（037-268818）；每人均消約250–400元，僅收現金；車輛停放觀霧山莊專用停車場。", "tags": ["避暑"], "sources": ["https://www.guanwuvilla.com/", "https://recreation.forest.gov.tw/Forest/RA?typ_id=0200004"], "source": "https://www.guanwuvilla.com/", "drive": "離基地約 5 分", "stay_h": 1.0, "drive_min": 5, "total_h": 1.2, "season_months": [3], "id": "pdacd10db"}, {"name": "張學良文化園區", "lat": 24.5724819, "lng": 121.1054503, "town": "新竹縣五峰鄉", "base": "guanwu", "theme": "heritage", "kind": "文化園區", "diff": "散步", "time": "約 1 小時", "season": "", "desc": "1946年西安事變主角張學良與趙一荻被幽禁於五峰清泉溫泉長達十餘年。現址為依原貌重建之日式黑瓦檜木平房，館內完整陳列張學良生平手稿、歷史黑白照片及幽禁生活器物，戶外庭園串聯清泉吊橋群與上坪溪畔。", "note": "開館時間 09:00–17:00（週一公休）；免門票參觀；園區旁設有清泉第一大型收費公有停車場；內部需脫鞋參觀；大雨後聯外道路縣道122線偶有邊坡落石需減速慢行。", "tags": ["老宅", "親子", "雨天"], "sources": ["https://www.wufeng.gov.tw/", "https://travel.hsinchu.gov.tw/"], "source": "https://www.wufeng.gov.tw/", "drive": "離基地約 50 分", "stay_h": 1.0, "drive_min": 50, "total_h": 2.7, "season_months": [], "id": "p14d41e1e"}, {"name": "觀霧山莊", "lat": 24.5033762, "lng": 121.1141275, "town": "苗栗縣泰安鄉", "base": "guanwu", "zone": "觀霧遊憩區", "theme": "lodging", "kind": "山莊", "diff": "開車", "time": "", "season": "霧社櫻花季3月中旬至下旬", "desc": "位於觀霧國家森林遊樂區核心，海拔2,000公尺，為林業及自然保育署唯一委外經營之公辦民營合法住宿設施。房型涵蓋小木屋二人雅房、四人套房，正對大鹿林道西線榛山景觀，前庭立有樹齡近百年之國寶級霧社櫻王。", "note": "雙人雅房約3800–4500元、二人套房約4840–6160元、四人小木屋約6600–8580元（一泊二食專案）；僅採官網系統線上訂房（每月1日08:00開放次月訂房），電話037-268818；入住15:00、退房10:00；客房無冷暖氣機，需自備禦寒厚衣物；附設專屬停車場；全區禁菸且禁帶寵物與車宿。", "tags": ["需預約", "避暑", "展望"], "sources": ["https://www.guanwuvilla.com/", "https://recreation.forest.gov.tw/Forest/RA?typ_id=0200004"], "source": "https://www.guanwuvilla.com/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [3], "id": "pa3e65536"}, {"name": "野馬農園", "lat": 24.5321437, "lng": 121.1239467, "town": "新竹縣五峰鄉", "base": "guanwu", "zone": "大鹿林道高海拔露營帶", "theme": "lodging", "kind": "露營區", "diff": "開車", "time": "", "season": "雲海季10月至翌年3月，櫻花季2月至3月", "desc": "位於大鹿林道21公里處、緊鄰雪霸休閒農場旁山谷，海拔約1,900公尺，為觀霧自駕沿線海拔最高之自搭帳露營區。營位依山勢錯落，視野開闊正對雪山山脈與聖稜線山巒，入夜無光害銀河清晰，清晨常有大片壯觀雲海湧入山谷。", "note": "草地與碎石營位每帳約1000–1200元；採電話預約訂位（0939-615013）；進場時間12:00、拔營時間11:30；提供熱水衛浴、洗手台水電與公共冰箱；海拔極高早晚氣溫常低於攝氏10度，需自備防寒高保暖睡袋；進入營區最後約500公尺為窄陡水泥產業道路需慢行。", "tags": ["需預約", "避暑", "展望", "夕陽", "夜景", "寵物"], "sources": ["https://travel.hsinchu.gov.tw/", "https://www.facebook.com/"], "source": "https://travel.hsinchu.gov.tw/", "drive": "離基地約 20 分", "stay_h": 0.5, "drive_min": 20, "total_h": 1.2, "season_months": [1, 2, 3, 10, 11, 12], "id": "p13fc10ef"}, {"name": "雪霸休閒農場", "lat": 24.5276476, "lng": 121.1178128, "town": "新竹縣五峰鄉", "base": "guanwu", "zone": "雪霸休閒農場", "theme": "lodging", "kind": "度假農場", "diff": "開車", "time": "", "season": "雲海季10月至翌年3月，小藍莓產季7月至8月", "desc": "座落於大鹿林道21.5公里處，海拔1,923公尺，鄰近觀霧國家森林遊樂區。園區闢建歐式木屋與花園小木屋客房群，四周為小藍莓與奇異果果園環抱，設有雲海景觀平台，為雪霸山區最具代表性之高山度假宿點。", "note": "雙人房約5000–6500元、四人房約7000–9200元（含早晚餐Buffet與國家公園步道導覽）；官網線上訂房或電話預約（03-5856192）；入住時間15:00、退房時間10:00；提供洗沐備品、吹風機與電熱毯，附設專屬停車場；全區禁止露營車宿。", "tags": ["需預約", "避暑", "展望", "夕陽", "夜景", "親子"], "sources": ["https://www.sheipa.com.tw/", "https://travel.hsinchu.gov.tw/"], "source": "https://www.sheipa.com.tw/", "drive": "離基地約 10 分", "stay_h": 0.5, "drive_min": 10, "total_h": 0.8, "season_months": [1, 2, 3, 7, 8, 10, 11, 12], "id": "pf6ff94ec"}, {"name": "雲山民宿", "lat": 24.5387187, "lng": 121.1263771, "town": "新竹縣五峰鄉", "base": "guanwu", "zone": "大鹿林道15K雲山帶", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "雲海季10月至翌年3月", "desc": "坐落於大鹿林道15公里處雲山部落，海拔約1,500公尺，為五峰通往觀霧途中重要之中繼宿點。主建築為原木景觀木屋，面向雪山山脈背側深谷，群山環抱，清晨與黃昏常可自陽台直接俯瞰翻騰雲海與落日晚霞。", "note": "雙人套房約2500–3200元、四人套房約3800–4800元（含中式早餐）；採電話預約訂房（03-5856188）；入住時間15:00、退房時間10:00；客房內無冷暖氣機，山區夜間低溫需自備保暖衣物；附設專屬停車場；全館禁菸且不收寵物入住木屋。", "tags": ["需預約", "避暑", "展望", "夕陽"], "sources": ["http://www.8898go.com/035856188", "https://travel.hsinchu.gov.tw/"], "source": "http://www.8898go.com/035856188", "drive": "離基地約 20 分", "stay_h": 0.5, "drive_min": 20, "total_h": 1.2, "season_months": [1, 2, 3, 10, 11, 12], "id": "p51530058"}, {"name": "榛山步道", "lat": 24.4958082, "lng": 121.1105954, "town": "苗栗縣泰安鄉", "base": "guanwu", "theme": "trail-mountain", "kind": "登山步道", "diff": "健行", "time": "環狀 4.13 公里（含聯絡道往返約 8 公里）、約 3.5–4 小時", "season": "杜鵑花季4月至5月", "desc": "自大鹿林道西線車行終點進入，環狀步道全長4.13公里，最高登頂海拔2,489公尺之榛山山頂。稜線觀景平台具備360度開闊全景視野，為眺望雪山山脈「聖稜線」（大霸尖山至雪山主峰）最壯闊完整的制高眺望點，春季沿途台灣杜鵑盛開。", "note": "全天開放（建議07:00–12:00前起登）；免門票；車輛需停放於觀霧山莊停車場，自山莊步行大鹿林道西線約2公里（約30分鐘）至步道入口；全程爬升約400公尺，後段枕木碎石階梯陡峭，需穿抓地登山鞋並攜帶足量飲水與登山杖。", "tags": ["展望", "避暑"], "sources": ["https://recreation.forest.gov.tw/Forest/RA?typ_id=0200004", "https://hiking.biji.co/index.php?q=trail&act=detail&id=238"], "source": "https://recreation.forest.gov.tw/Forest/RA?typ_id=0200004", "drive": "離基地約 5 分", "stay_h": 4.0, "drive_min": 5, "total_h": 4.2, "season_months": [4, 5], "id": "pcd6a678f"}, {"name": "檜山巨木群步道", "lat": 24.5025475, "lng": 121.1108886, "town": "苗栗縣泰安鄉", "base": "guanwu", "theme": "trail-mountain", "kind": "森林步道", "diff": "健行", "time": "單程 2.8 公里至巨木群折返、約 2.5–3 小時", "season": "", "desc": "原為日治時期大鹿林道運材台車舊鐵道，步道起點位於樂山林道1.2公里處，前2.8公里地勢平緩開闊，沿途柳杉林密布。步道深處群聚五株樹齡逾千年以上之紅檜神木，其中2號巨木胸圍達17.2公尺、樹高34公尺，為全台第七大巨木。", "note": "全天開放健行（建議07:00–14:00前進出）；免門票；步道口旁設有樂山林道1.2K小型停車場（約12輛小型車位）與流動廁所；往返巨木群約5.6公里需步行約3小時，過2.8K後為陡降連續木棧階梯較耗體力；山區常午後起霧降雨，需備雨具與登山杖。", "tags": ["巨木", "避暑", "展望"], "sources": ["https://recreation.forest.gov.tw/Forest/RA?typ_id=0200004", "https://hiking.biji.co/index.php?q=trail&act=detail&id=236"], "source": "https://recreation.forest.gov.tw/Forest/RA?typ_id=0200004", "drive": "離基地約 5 分", "stay_h": 3.0, "drive_min": 5, "total_h": 3.2, "season_months": [], "id": "pc20a2c68"}, {"name": "野馬瞰山", "lat": 24.5270111, "lng": 121.1154722, "town": "新竹縣五峰鄉", "base": "guanwu", "theme": "trail-mountain", "kind": "森林步道", "diff": "健行", "time": "環狀約 2 公里、約 1.5 小時", "season": "", "desc": "位於雪霸休閒農場上方之原始林山頭，海拔1,913公尺，山頂立有三等三角點編號6274。森林步道全程穿梭於高聳柳杉林與原生紅檜巨木林中，地面鋪滿厚實松針與落葉腐植層，觸感鬆軟彈性，環形一圈長約2公里。", "note": "全天開放（建議日間08:00–16:00行走）；非住客進入農場免收門票；車輛停放於雪霸休閒農場免費迎賓停車場；步道樹根盤錯濕滑，建議穿著防滑登山鞋；午後14:00起霧後能見度偏低，請沿著樹幹黃色數字反光指標行進勿偏離路徑。", "tags": ["避暑"], "sources": ["https://hiking.biji.co/index.php?q=trail&act=detail&id=472", "https://www.sheipa.com.tw/"], "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=472", "drive": "離基地約 10 分", "stay_h": 1.5, "drive_min": 10, "total_h": 1.8, "season_months": [], "id": "p42d15342"}, {"name": "觀霧山椒魚生態中心", "lat": 24.5066481, "lng": 121.1144437, "town": "苗栗縣泰安鄉", "base": "guanwu", "theme": "trail-near", "kind": "生態園區", "diff": "散步", "time": "約 40 分鐘", "season": "", "desc": "國內首座以冰河時期孑遺物種國寶「觀霧山椒魚」為主題之國家公園生態教育展示館。館內設有山椒魚棲地復育區、高山生態影音解說廳、霧林帶生態模型，展示觀霧特有種植物棣慕華鳳仙花及台灣檫樹復育成果。", "note": "開館時間 09:00–16:30（每週一休館，遇國定假日順延）；免門票自由參觀；每日上午10:00提供定時免費專人解說導覽；館旁設有觀霧國家森林遊樂區遊客中心專用大型免費停車場；館內設有飲水機與公廁。", "tags": ["雨天", "親子", "避暑"], "sources": ["https://www.spnp.gov.tw/cp.aspx?n=14573", "https://recreation.forest.gov.tw/Forest/RA?typ_id=0200004"], "source": "https://www.spnp.gov.tw/cp.aspx?n=14573", "drive": "離基地約 5 分", "stay_h": 0.67, "drive_min": 5, "total_h": 0.8, "season_months": [], "id": "padfb2867"}, {"name": "雲霧步道", "lat": 24.5064251, "lng": 121.1152613, "town": "苗栗縣泰安鄉", "base": "guanwu", "theme": "trail-near", "kind": "景觀步道", "diff": "散步", "time": "環狀 848 公尺、約 30–40 分鐘", "season": "", "desc": "起點位於觀霧山椒魚生態中心後方，全長848公尺之全平整高架環狀木棧道。沿途築有三處制高觀景平台，天氣晴朗時可180度清晰遠眺大霸尖山、小霸尖山、雪山主峰勾勒出之壯麗聖稜線連峰與榛山全貌。", "note": "全天開放；免門票；步道入口緊鄰遊客中心大停車場；環狀步行一圈約30–40分鐘，階梯數百階但坡度平緩好走；高海拔紫外線強烈需防曬；雨後木棧道邊緣偶有濕滑，行走需留心踏點。", "tags": ["展望", "避暑", "親子"], "sources": ["https://recreation.forest.gov.tw/Forest/RA?typ_id=0200004", "https://www.spnp.gov.tw/"], "source": "https://recreation.forest.gov.tw/Forest/RA?typ_id=0200004", "drive": "離基地約 5 分", "stay_h": 0.67, "drive_min": 5, "total_h": 0.8, "season_months": [], "id": "p8e2f6d3f"}, {"name": "清泉溫泉（將軍湯）", "lat": 24.573424, "lng": 121.1056151, "town": "新竹縣五峰鄉", "base": "guanwu", "theme": "water", "kind": "溫泉足湯", "diff": "開車", "time": "約 30 分鐘", "season": "", "desc": "日治時期稱為井上溫泉的天然弱鹼性碳酸氫鈉泉，泉溫約攝氏48度，水質清澈無色無臭。現規劃為戶外免費露天泡腳池，引天然溫泉水流經多階洗石子足湯水道，水深約30公分，可同時容納數十人泡腳放鬆。", "note": "全天24小時開放戶外露天足湯；免收門票自由入座；位於張學良文化園區吊橋旁，車輛停放於清泉第一停車場後步行約3分鐘抵達；出水口溫度較高入池前需先試溫，建議自備擦腳毛巾。", "tags": ["溫泉", "親子"], "sources": ["https://www.trimt-nsa.gov.tw/", "https://travel.hsinchu.gov.tw/"], "source": "https://www.trimt-nsa.gov.tw/", "drive": "離基地約 50 分", "stay_h": 0.5, "drive_min": 50, "total_h": 2.2, "season_months": [], "id": "p989b0709"}, {"name": "寶湖宮天地堂地母廟", "lat": 23.9514518, "lng": 120.9894656, "town": "南投縣埔里鎮", "base": "guokeng-puli", "theme": "heritage", "kind": "寺廟建築", "diff": "散步", "time": "約 1–1.5 小時", "season": "", "desc": "座落於埔里金鶯山麓，為台灣地母信仰之總廟，海拔約 500 公尺。廟宇依山層疊建造，主殿背靠綠意山巒，以氣勢宏偉的青綠色琉璃瓦屋頂、漢白玉石雕欄杆與朱紅梁柱為建築特色，最高點乾元殿可遠眺整座埔里盆地景致。", "note": "園區全天開放參觀，附設大型免費停車場與洗手間；登上乾元殿需攀爬多層階梯，行動不便者可於一樓大殿參拜；廟方備有免費決明子茶與茶水供信眾飲用。", "tags": ["老宅", "展望", "親子"], "sources": ["http://www.timu.org.tw/"], "source": "http://www.timu.org.tw/", "drive": "離基地約 15 分", "stay_h": 1.5, "drive_min": 15, "total_h": 2.0, "season_months": [], "id": "paa17dbb7"}, {"name": "漫聚時光森林營地", "lat": 23.9732155, "lng": 120.9937343, "town": "南投縣埔里鎮", "base": "guokeng-puli", "zone": "埔里東郊", "theme": "lodging", "kind": "露營區", "diff": "開車", "time": "", "season": "", "desc": "位於埔里乾溪景觀橋旁，佔地達 6000 坪，距離國道 6 號埔里端出口僅約 2 分鐘車程。營區保留數十年樹齡之樟木與松樹，設有草皮自搭帳區、固定式豪華大型蓮花帳與水管小屋，並具備戲水池與兒童遊具設施。", "note": "自搭帳草地每帳約 1200–1500 元、固定式豪華帳平日約 3600–4800 元；可透過官網或電話預訂；鄰近埔里市區超商與加油站，生活補給便利；附設大型專屬停車場。", "tags": ["親子", "玩水"], "sources": ["https://yccfc.com.tw/"], "source": "https://yccfc.com.tw/", "drive": "離基地約 20 分", "stay_h": 0.5, "drive_min": 20, "total_h": 1.2, "season_months": [], "id": "p8b959a79"}, {"name": "相逢部落", "lat": 23.8943955, "lng": 120.9908738, "town": "南投縣仁愛鄉", "base": "guokeng-puli", "zone": "過坑山谷", "theme": "lodging", "kind": "豪華露營", "diff": "開車", "time": "", "season": "", "desc": "座落於仁愛鄉中正村平等巷山谷間，為全包式免搭帳豪華露營區。營區被原始樹林包圍，規劃大型球型帳與神殿帳，帳內配備冷暖空調、雙人床與獨立衛浴，提供一泊多食（含迎賓下午茶、手作DIY、豐盛晚餐與消夜調酒）。", "note": "雙人豪華帳一泊多食平日約 11000–14000 元、假日約 15000–18000 元；全預約制，需透過官方網站線上預訂；入營前有高爾夫球車接駁行李；附設專屬住客停車場。", "tags": ["需預約", "避暑", "親子"], "sources": ["https://xfcamp.vip/"], "source": "https://xfcamp.vip/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "pab13aae6"}, {"name": "虎頭山觀景平台", "lat": 23.9636164, "lng": 120.9891761, "town": "南投縣埔里鎮", "base": "guokeng-puli", "theme": "trail-near", "kind": "高台觀景", "diff": "散步", "time": "約 45–60 分鐘", "season": "", "desc": "位於埔里東北方虎頭山頂，海拔約 555 公尺，為台灣地理中心碑後方延伸之稜線高點。山頂平台氣流穩定，為台灣知名的飛行傘體驗基地，正對整個埔里盆地平原，向西可飽覽群山環抱之落日晚霞與璀璨夜景。", "note": "自埔里市區沿知安路上山車程約 8 分鐘，道路全線雙向通暢；觀景平台免費開放，旁設有公有停車場與景觀咖啡座；黃昏與入夜時分風勢較大，建議攜帶薄外套。", "tags": ["夕陽", "夜景", "展望", "親子"], "sources": ["https://travel.nantou.gov.tw/"], "source": "https://travel.nantou.gov.tw/", "drive": "離基地約 25 分", "stay_h": 1.0, "drive_min": 25, "total_h": 1.8, "season_months": [], "id": "paeaf9225"}, {"name": "仁愛鄉萬豐村天主堂", "lat": 23.9455545, "lng": 121.07871, "town": "南投縣仁愛鄉", "base": "qubing", "theme": "heritage", "kind": "部落教堂", "diff": "散步", "time": "約 30–45 分鐘", "season": "", "desc": "座落於萬豐村布農族聚落高處，建於 1950 年代，為曲冰村民重要的宗教信仰與聚會中心。教堂建築採用石材與木構交融，外觀純樸莊嚴，前庭設有開闊觀景台，可居高臨下俯瞰萬豐河階農田與濁水溪河谷。", "note": "開放參觀外觀與庭院，進入聖堂內部請保持肅靜並脫帽；主日彌撒時間通常為週日上午，非教友參訪請避免干擾儀式；周邊巷道狹窄，建議將車輛停放於部落外側活動中心旁。", "tags": ["老宅", "展望", "避暑"], "sources": ["https://travel.nantou.gov.tw/"], "source": "https://travel.nantou.gov.tw/", "drive": "離基地約 5 分", "stay_h": 0.75, "drive_min": 5, "total_h": 0.9, "season_months": [], "id": "p05b638ae"}, {"name": "曲冰遺址 (Chuping Archaeological Site)", "lat": 23.955332, "lng": 121.0800996, "town": "南投縣仁愛鄉", "base": "qubing", "theme": "heritage", "kind": "考古遺址", "diff": "散步", "time": "約 30–40 分鐘", "season": "", "desc": "位於投83線旁濁水溪東岸河階高地，海拔約 750 公尺，為台灣高山地區首度發現的史前聚落遺址（經指定為國定考古遺址）。遺址年代距今約 2,000 至 3,000 年，曾出土大量新石器時代石斧、玉器、陶片及完整聚落石板棺群。", "note": "為保護出土古蹟免受風化侵蝕，考古挖掘坑目前已全數覆土回填保存，現場設置紀念石碑、休憩涼亭與解說展示牌供遊客理解史前文化；路旁設有專屬小型停車彎。", "tags": ["避暑"], "sources": ["https://nchdb.boch.gov.tw/"], "source": "https://nchdb.boch.gov.tw/", "drive": "離基地約 5 分", "stay_h": 0.67, "drive_min": 5, "total_h": 0.8, "season_months": [], "id": "chuping-archaeological-site"}, {"name": "剛剛好包棟民宿Gang Gang House", "lat": 23.9463155, "lng": 121.0762378, "town": "南投縣仁愛鄉", "base": "qubing", "zone": "曲冰聚落", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "座落於萬豐村清華巷內之布農原鄉包棟民宿。室內空間溫馨潔淨，提供寬敞廚房、客廳、卡拉OK與戶外烤肉休憩區，適合家庭聚會或多位好友深度包棟漫遊曲冰部落。", "note": "包棟住宿每晚約 4500–8000 元（依入住人數而定）；需透過官方粉絲專頁或電話預訂；部落內夜間極度寧靜，戶外活動請於 22:00 前降低音量；附設專用停車位。", "tags": ["避暑", "親子"], "sources": ["https://www.facebook.com/GangGangHouse37/"], "source": "https://www.facebook.com/GangGangHouse37/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "gang-gang-house"}, {"name": "曲冰部落岱牧露營區", "lat": 23.9339095, "lng": 121.0753873, "town": "南投縣仁愛鄉", "base": "qubing", "zone": "濁水溪谷營地", "theme": "lodging", "kind": "露營區", "diff": "開車", "time": "", "season": "", "desc": "位於投83線旁濁水溪上游河階地，坐擁開闊群山山景。營區規劃平整厚實草皮營位，周遭環境純樸無光害，早晨可沐浴在林蔭晨曦之中，夜間仰望無遮蔽之繁星銀河，為安靜放空之自然營地。", "note": "草地營位每帳約 1000–1200 元；採官網或電話預約；衛浴熱水水壓充足、環境維護整潔；全區禁止過度喧鬧，維護部落夜間安寧。", "tags": ["夜景", "避暑", "展望"], "sources": ["https://cyubingdaimu.com/"], "source": "https://cyubingdaimu.com/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p9c140e4f"}, {"name": "里列格營地", "lat": 23.928099, "lng": 121.071538, "town": "南投縣仁愛鄉", "base": "qubing", "zone": "濁水溪谷營地", "theme": "lodging", "kind": "露營區", "diff": "開車", "time": "", "season": "", "desc": "位於萬豐村南端河岸台地，海拔約 700 公尺。營區地勢微高，俯瞰濁水溪河床與中央山脈支脈，設有階梯式草坪營位與乾淨衛浴，營主熱情接待並分享布農文化，冬天氣候舒爽涼潤。", "note": "自搭帳營位每帳約 1000–1200 元；採電話或臉書粉絲頁預訂；水電衛浴齊備且提供吹風機與冷藏冰箱；山區早晚溫差大，需攜帶足夠保暖衣物。", "tags": ["夜景", "避暑", "展望"], "sources": ["https://www.facebook.com/abis777/"], "source": "https://www.facebook.com/abis777/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p17479e92"}, {"name": "Wanfeng Suspension Bridge", "lat": 23.9583151, "lng": 121.075729, "town": "南投縣仁愛鄉", "base": "qubing", "theme": "trail-near", "kind": "吊橋步道", "diff": "散步", "time": "約 30–45 分鐘", "season": "", "desc": "橫跨濁水溪峽谷之鐵索吊橋（萬豐吊橋），為昔日曲冰通往對岸耕地與獵場之聯外通道。橋長約 100 餘公尺，橋身橫懸於高聳山壁之間，兩岸青翠山巒夾峙，俯瞰濁水溪激流切割形成的深邃峽谷地貌。", "note": "吊橋限載人數 10 人，橋面狹窄僅容單人交會；橋頭兩側路肩狹小無法停車，需由投83線路肩寬闊處步行下切水泥便道抵達；大雨或強風期間行走需特別留意安全。", "tags": ["峽谷", "展望", "避暑"], "sources": ["http://www.nantou.gov.tw/"], "source": "http://www.nantou.gov.tw/", "drive": "離基地約 5 分", "stay_h": 0.75, "drive_min": 5, "total_h": 0.9, "season_months": [], "id": "wanfeng-suspension-bridge"}, {"name": "曲冰峽谷", "lat": 23.9568098, "lng": 121.0816694, "town": "南投縣仁愛鄉", "base": "qubing", "theme": "trail-near", "kind": "峽谷地形", "diff": "開車", "time": "約 20–30 分鐘", "season": "", "desc": "位於投83線曲冰至萬豐之間之濁水溪峽谷觀景段，地質屬變質砂岩與板岩互層。因河流下切侵蝕作用強烈，形成幾近垂直的石壁與河階地形，公路緊貼山壁蜿蜒而行，沿途設有多處遠眺峽谷深壑的展望點。", "note": "此處為公路沿線之觀景節點，路旁設有觀景護欄與解說告示牌；山區落石多發路段請勿久留，颱風或豪雨警報發布後應避免前往。", "tags": ["峽谷", "展望", "避暑"], "sources": ["http://nrch.culture.tw/twpedia.aspx?id=8065"], "source": "http://nrch.culture.tw/twpedia.aspx?id=8065", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p7a381c9d"}, {"name": "天送埤林鐵文創園區（太平山林鐵）", "lat": 24.6626851, "lng": 121.6193472, "town": "宜蘭縣三星鄉", "base": "sanxing-tiansongpi", "theme": "heritage", "kind": "林鐵車站", "diff": "散步", "time": "約 1–1.5 小時", "season": "", "desc": "建於 1921 年，為昔日羅東森林鐵路平原段重要之客貨轉運中繼站，也是全線唯一完整保存之日式木造車站。園區活化保留了檜木站房、轉車盤與火車迴轉軌道，現場設有復刻版五分車台車行駛體驗及林業歷史展示。", "note": "全天開放免費參觀外圍鐵道公園，搭乘復刻蒸氣小火車單趟每人 50 元；周邊緊鄰三星蔥油餅與味珍香卜肉等名店；附設大型免費停車場與洗手間。", "tags": ["看火車", "老宅", "親子", "中繼"], "sources": ["https://www.tsp-station.org/"], "source": "https://www.tsp-station.org/", "drive": "離基地約 5 分", "stay_h": 1.5, "drive_min": 5, "total_h": 1.7, "season_months": [], "id": "pb7474b8c"}, {"name": "天送幸福和苑", "lat": 24.6628368, "lng": 121.6184668, "town": "宜蘭縣三星鄉", "base": "sanxing-tiansongpi", "zone": "天送埤街區", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "座落於天送埤車站古蹟旁，為典雅風格之獨棟包棟式渡假民宿。環境鬧中取靜，庭院植栽雅緻，室內採和風無印設計與高品質寢具，提供廚房、客廳及專屬停車空間，適合成員眾多的家庭團體。", "note": "包棟平日約 18000–22000 元、假日約 24000–28000 元（可容納 10–14 人）；可透過官網或電話預訂；緊鄰歷史鐵道古蹟，全社區與園區嚴禁施放煙火；附設專屬停車位。", "tags": ["老宅", "親子"], "sources": ["https://www.tiansong-villa.com.tw/"], "source": "https://www.tiansong-villa.com.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p907b6a26"}, {"name": "星亮點Kayu露營區", "lat": 24.6780658, "lng": 121.6012158, "town": "宜蘭縣大同鄉", "base": "sanxing-tiansongpi", "zone": "崙埤台地", "theme": "lodging", "kind": "露營區", "diff": "開車", "time": "", "season": "", "desc": "座落於大同鄉崙埤村雪山山脈支脈台地上，海拔約 300 公尺。營區視野開闊無遮蔽，正面俯瞰蘭陽平原街景與龜山島海平線，設有自搭帳草地碎石營位、免搭帳狩獵帳以及沙坑、鞦韆等兒童遊憩設施。", "note": "自搭帳草地營位每帳約 1200–1500 元、狩獵帳雙人平日約 2800–3600 元；需透過官方網站線上預約系統預訂；水電衛浴齊備；通往營區之山區產業道路路幅較狹窄，會車需減速。", "tags": ["夜景", "展望", "親子"], "sources": ["https://www.kayucamp.com/"], "source": "https://www.kayucamp.com/", "drive": "離基地約 10 分", "stay_h": 0.5, "drive_min": 10, "total_h": 0.8, "season_months": [], "id": "kayu"}, {"name": "艾麗絲泉民宿", "lat": 24.6654898, "lng": 121.6243916, "town": "宜蘭縣三星鄉", "base": "sanxing-tiansongpi", "zone": "天送埤街區", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "座落於三星鄉天送埤老爺山莊別墅特區內，鄰近天送埤火車站約 900 公尺。別墅環境清幽開闊，周邊綠樹環繞、鳥語花香，提供雙人房、四人房以及整棟包棟住宿，附設景觀陽台與花園庭院。", "note": "雙人房平日約 2200–2800 元、假日約 3000–3800 元（含手作早餐）；可透過官網或電話預訂；山莊社區內道路寬敞，提供住客專屬免費停車位；全面室內禁菸。", "tags": ["親子"], "sources": ["https://www.alicesprings.com.tw/"], "source": "https://www.alicesprings.com.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p02c26081"}, {"name": "九寮溪自然步道", "lat": 24.6737613, "lng": 121.5995228, "town": "宜蘭縣大同鄉", "base": "sanxing-tiansongpi", "theme": "trail-near", "kind": "溪谷瀑布步道", "diff": "健行", "time": "往返約 2.5–3 小時", "season": "", "desc": "位於大同鄉崙埤村九寮溪生態園區內，步道沿九寮溪溪岸向山區深入，單程長度約 3 公里。沿途穿梭於亞熱帶茂密雨林與闊葉林，串聯崖躍吊橋、巴尬吊橋等特色繩索橋樑，步道終點為高約 30 公尺之戈霸瀑布。", "note": "由停車場至管制步道起點需先步行平緩水泥路約 1 公里（約 15 分鐘）；步道全線起伏平緩、多林蔭，林務局整理之木棧道與碎石路況良好；入口處設有大型收費停車場（小型車 50 元）與公廁。", "tags": ["瀑布", "玩水", "避暑", "親子"], "sources": ["https://recreation.forest.gov.tw/Trail/RT?tr_id=012"], "source": "https://recreation.forest.gov.tw/Trail/RT?tr_id=012", "drive": "離基地約 5 分", "stay_h": 3.0, "drive_min": 5, "total_h": 3.2, "season_months": [], "id": "p172ef995"}, {"name": "奮起湖車庫", "lat": 23.505587, "lng": 120.6954491, "town": "嘉義縣竹崎鄉", "base": "shizhuo-fenqihu", "theme": "heritage", "kind": "鐵道古蹟", "diff": "散步", "time": "約 30–45 分鐘", "season": "", "desc": "阿里山林業鐵路蒸汽火車頭時代的重要保養檢修車庫，木造桁架結構原貌保存良好。內部常態展示 28 號與 29 號 18 噸 Shay 式直立式汽缸蒸汽機車頭、蒸汽加水塔、舊式鐵道車床機具以及豐富之百年林鐵修築歷史文物。", "note": "開放時間為每日 08:00–16:00，免費參觀；緊鄰奮起湖車站月台，參觀時切勿跨越營運中之鐵軌警示線。", "tags": ["看火車", "老宅", "親子"], "sources": ["https://afrch.forest.gov.tw/0000150"], "source": "https://afrch.forest.gov.tw/0000150", "drive": "離基地約 5 分", "stay_h": 0.75, "drive_min": 5, "total_h": 0.9, "season_months": [], "id": "peb935f48"}, {"name": "奮起湖大飯店", "lat": 23.505324, "lng": 120.695108, "town": "嘉義縣竹崎鄉", "base": "shizhuo-fenqihu", "zone": "奮起湖老街", "theme": "lodging", "kind": "飯店", "diff": "開車", "time": "", "season": "", "desc": "座落於奮起湖老街入口與車站旁，為奮起湖歷史悠久的代表性飯店。客房採日式和風榻榻米與原木裝潢，館內附設著名之奮起湖便當本舖，並每日提供住客免費之在地歷史步道專人導覽。", "note": "雙人房平日約 1900–2600 元、假日約 2800–3800 元（附贈 7-Eleven 早餐兌換券）；可透過官網、電話或訂房平台預訂；附設專用地下停車場；熱水採定時供應（晚間與清晨）。", "tags": ["老宅", "避暑", "親子"], "sources": ["https://www.fenchihu.com.tw/"], "source": "https://www.fenchihu.com.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "pd06aecf4"}, {"name": "綠香茶園民宿", "lat": 23.4741777, "lng": 120.7030989, "town": "嘉義縣竹崎鄉", "base": "shizhuo-fenqihu", "zone": "頂石棹", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "座落於石棹茶區山坡上，四周被翠綠的茶樹梯田層層圍繞。客房設有大面觀景窗，拉開窗簾即可遠眺山巒雲海與落日餘暉，民宿自家經營茶廠，住客可品茗高山烏龍並品嘗茶葉入菜的在地風味晚餐。", "note": "雙人房平日約 2600–3400 元、假日約 3400–4200 元（含手作早餐）；需透過電話預約訂房；附設專用露天停車場；提供茶油雞等無菜單風味合菜需提前預訂。", "tags": ["夕陽", "展望", "避暑"], "sources": ["https://travel.chiayi.gov.tw/"], "source": "https://travel.chiayi.gov.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p84f93085"}, {"name": "阿將的家23咖啡館", "lat": 23.4612219, "lng": 120.6980397, "town": "嘉義縣阿里山鄉", "base": "shizhuo-fenqihu", "zone": "頂石棹", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "位於樂野與達邦交界山脊，由鄒族營主耗時多年以一磚一石手工堆砌而成之石頭木造藝術莊園。園區結合手沖阿里山咖啡、鐵藝多肉造景、貓咪庭院與巨石特色客房，展現獨特的鄒式手作美學與高山景觀。", "note": "雙人石頭屋住宿平日約 3800–4800 元、假日約 4800–6000 元（含早餐）；採全預約制（官方 Line 預訂）；進入莊園聯絡道路較狹窄，會車需留意；咖啡館內用需遵守入園低消規定。", "tags": ["需預約", "老宅", "避暑"], "sources": ["https://lin.ee/aBP6TBlK"], "source": "https://lin.ee/aBP6TBlK", "drive": "離基地約 10 分", "stay_h": 0.5, "drive_min": 10, "total_h": 0.8, "season_months": [], "id": "23"}, {"name": "阿里山石窯園露營區", "lat": 23.4877699, "lng": 120.682339, "town": "嘉義縣竹崎鄉", "base": "shizhuo-fenqihu", "zone": "頂石棹", "theme": "lodging", "kind": "露營區", "diff": "開車", "time": "", "season": "", "desc": "位於頂石棹往光華方向之森林山谷間，海拔約 1,200 公尺。園區綠樹遮蔭，規劃碎石草地營位與趣味水管屋，營主自建特色柴燒石窯，假日定期舉辦親子手工窯烤披薩體驗，春夏季周邊林間常有螢火蟲穿梭。", "note": "自搭帳營位每帳約 1000–1200 元、水管屋雙人約 1800–2400 元；需透過臉書粉絲專頁或電話預訂；提供冷藏冰箱與熱水衛浴；窯烤體驗需視當日開窯狀況報名。", "tags": ["親子", "避暑"], "sources": ["https://www.facebook.com/profile.php?id=100000114125684"], "source": "https://www.facebook.com/profile.php?id=100000114125684", "drive": "離基地約 10 分", "stay_h": 0.5, "drive_min": 10, "total_h": 0.8, "season_months": [], "id": "p5a5d86d9"}, {"name": "奮起湖老街", "lat": 23.5051199, "lng": 120.6949355, "town": "嘉義縣竹崎鄉", "base": "shizhuo-fenqihu", "theme": "oldstreet", "kind": "老街聚落", "diff": "散步", "time": "約 1–1.5 小時", "season": "", "desc": "全台灣海拔最高之歷史老街之一（海拔約 1,400 公尺），沿山坡階梯與石板路依勢而建，長度約 500 公尺。早期為阿里山林業鐵路本線最大客貨交會站，街區聚集木造店鋪，以現做鐵路便當、手工黑糖草仔粿、現烤甜甜圈與野生愛玉聞名。", "note": "老街街道狹窄全線為步行階梯，推車動線較受限；車輛可停放在第一或第二公有收費停車場（假日上午易滿位）；平日多數店家營業至 17:00，假日營業至 18:00。", "tags": ["親子", "避暑"], "sources": ["https://www.ali-nsa.net/zh-tw/attractions/detail/157"], "source": "https://www.ali-nsa.net/zh-tw/attractions/detail/157", "drive": "離基地約 5 分", "stay_h": 1.5, "drive_min": 5, "total_h": 1.7, "season_months": [], "id": "p89125050"}, {"name": "百年肖楠林", "lat": 23.5040836, "lng": 120.6954727, "town": "嘉義縣竹崎鄉", "base": "shizhuo-fenqihu", "theme": "trail-near", "kind": "巨木步道", "diff": "散步", "time": "約 20–30 分鐘", "season": "", "desc": "位於奮起湖老街下方山坡，為日治時期 1910 年代所栽植之台灣肖楠母樹純林，樹齡皆超過百年。林內巨木高聳入雲、幹身挺直蒼勁，林下鋪設木棧環狀步道與休憩平台，為老街旁天然森林浴散步場域。", "note": "由老街下坡階梯步行約 3 分鐘即達，全線平緩好走；林間潮濕，木棧道表面偶有青苔，行走需小心防滑；步道無公廁，可先於老街或車站洗手間使用。", "tags": ["巨木", "避暑", "親子"], "sources": ["https://www.ali-nsa.net/"], "source": "https://www.ali-nsa.net/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p9e110efb"}, {"name": "石棹琉璃光", "lat": 23.4779001, "lng": 120.7023532, "town": "嘉義縣竹崎鄉", "base": "shizhuo-fenqihu", "theme": "trail-near", "kind": "夜景觀景點", "diff": "開車", "time": "約 30–40 分鐘", "season": "11月-3月", "desc": "位於頂石棹培仔桶林道旁之開闊制高點，海拔約 1,400 公尺。秋冬時節因冷空氣沉降，石棹谷地常聚集厚實低空雲海，入夜後聚落家戶燈火與行經公路的車燈透過薄霧層層折射，呈現如彩繪玻璃般斑斕絢麗的琉璃光景致。", "note": "琉璃光現象好發於秋冬季（11月至隔年3月）鋒面來臨前後；觀景處位於產業道路彎道旁，夜間無路燈，需攜帶手電筒照明並注意往來會車；周邊嚴禁違規停車阻礙農作車輛進出。", "tags": ["夜景", "展望", "避暑"], "sources": ["https://tbocc.cyhg.gov.tw/Sight_Content.aspx?n=100317&s=513515"], "source": "https://tbocc.cyhg.gov.tw/Sight_Content.aspx?n=100317&s=513515", "drive": "離基地約 5 分", "stay_h": 0.67, "drive_min": 5, "total_h": 0.8, "season_months": [1, 2, 3, 11, 12], "id": "pc4a0c2be"}, {"name": "霞之道 北口", "lat": 23.4796847, "lng": 120.7016289, "town": "嘉義縣竹崎鄉", "base": "shizhuo-fenqihu", "theme": "trail-near", "kind": "茶園步道", "diff": "散步", "time": "往返約 30–45 分鐘", "season": "", "desc": "頂石棹步道群（霧茶雲霞櫻）中最具代表性的夕陽步道，全長約 250 公尺，海拔約 1,450 公尺。木棧階梯穿行於修剪整齊的高山烏龍茶園山坡之間，南端穿入翠綠孟宗竹林，北口則正對向西延展的曾文溪河谷，為黃昏觀賞夕陽晚霞與火燒雲的觀景點。", "note": "北口步道旁僅能停靠少數車輛，建議將車輛停於石棹遊客服務中心或周邊民宿後步行前往；傍晚山風漸起，建議備妥防風保暖衣物。", "tags": ["夕陽", "展望", "避暑"], "sources": ["https://www.ali-nsa.net/mountain/zh-tw/trail/18"], "source": "https://www.ali-nsa.net/mountain/zh-tw/trail/18", "drive": "離基地約 5 分", "stay_h": 0.75, "drive_min": 5, "total_h": 0.9, "season_months": [], "id": "pb808ce81"}, {"name": "玉蘭茶園觀景臺", "lat": 24.6740321, "lng": 121.5846858, "town": "宜蘭縣大同鄉", "base": "songluo-yulan", "theme": "cafe", "kind": "茶園觀景", "diff": "開車", "time": "約 1–1.5 小時", "season": "", "desc": "座落於玉蘭休閒農業區最高處山丘，海拔約 500 公尺。觀景台設有木造涼亭與品茗座椅，視野遼闊無遮蔽，向東可俯瞰整片蘭陽平原與蜿蜒的蘭陽溪谷，周圍環繞梯田狀茶樹林。", "note": "現場提供茶具組與茶葉租借泡茶，亦販售茶燻蛋、茶香滷味與合菜；山頂道路較為狹窄，會車需禮讓；觀景台周邊附設免費小型停車場與公共洗手間。", "tags": ["展望", "夕陽", "中繼", "親子"], "sources": ["https://www.sunshin.org.tw/yulan/"], "source": "https://www.sunshin.org.tw/yulan/", "drive": "離基地約 10 分", "stay_h": 1.5, "drive_min": 10, "total_h": 1.8, "season_months": [], "id": "p86558ded"}, {"name": "牛鬥一角宜蘭露營區民宿", "lat": 24.6348816, "lng": 121.5684732, "town": "宜蘭縣三星鄉", "base": "songluo-yulan", "zone": "牛鬥農莊", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "位於牛鬥橋旁之蘭陽溪南岸台地，鄰近台7丙線終點。園區佔地廣闊，種植落羽松、果樹與大片平整草皮，提供獨棟小木屋套房以及寬敞的草地營位，具備完善的親子活動空間與農莊自然生態。", "note": "小木屋雙人房平日約 2500–3200 元、草地露營每帳約 1000 元；可透過官網或電話訂房；園區附設寬敞免費停車場；全區禁止施放煙火與喧鬧。", "tags": ["親子"], "sources": ["http://www.newdow.com.tw/"], "source": "http://www.newdow.com.tw/", "drive": "離基地約 15 分", "stay_h": 0.5, "drive_min": 15, "total_h": 1.0, "season_months": [], "id": "p5edd408e"}, {"name": "玉蘭茶園露營區", "lat": 24.67472, "lng": 121.584629, "town": "宜蘭縣大同鄉", "base": "songluo-yulan", "zone": "玉蘭茶園", "theme": "lodging", "kind": "露營區", "diff": "開車", "time": "", "season": "", "desc": "位於玉蘭茶園最高點茶樹間，為山坡景觀露營地。營位依茶園地形梯田式分佈，設有木造遮雨棚營位與碎石營位，走出帳篷即可俯瞰蘭陽溪流域與遠方平原夜景，清晨亦能迎接晨霧與日出。", "note": "一帳營位費用約 1000–1200 元；採電話或官方預約；水電與衛浴設備齊全，熱水 24 小時供應；山頂產業道路狹小，夜間開車上山需放慢車速。", "tags": ["夜景", "展望", "避暑"], "sources": ["https://ioutrave.weebly.com/yulanchayuanluyingcyu.html"], "source": "https://ioutrave.weebly.com/yulanchayuanluyingcyu.html", "drive": "離基地約 10 分", "stay_h": 0.5, "drive_min": 10, "total_h": 0.8, "season_months": [], "id": "p85e1004b"}, {"name": "逢春園渡假別墅", "lat": 24.6686883, "lng": 121.597991, "town": "宜蘭縣大同鄉", "base": "songluo-yulan", "zone": "玉蘭茶園", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "座落於玉蘭茶園半山腰，佔地千坪，為大同鄉歷史悠久的莊園民宿。園區擁有修剪整齊之開闊草坪與庭院造景，遠眺蘭陽溪河谷，提供雙人及四人景觀客房，主打在地茶香手作無菜單料理。", "note": "雙人房平日約 3400–4200 元、假日約 4000–5200 元（含精緻早餐）；訂房可透過官網或電話預訂；提供專屬戶外停車場；為維護住宿品質全面禁菸。", "tags": ["避暑"], "sources": ["https://fengchunvilla.com.tw/"], "source": "https://fengchunvilla.com.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p5f359fef"}, {"name": "松羅國家步道", "lat": 24.6687206, "lng": 121.5631729, "town": "宜蘭縣大同鄉", "base": "songluo-yulan", "theme": "trail-near", "kind": "溪谷步道", "diff": "散步", "time": "往返約 2 小時", "season": "", "desc": "沿著松羅溪開闢的林蔭步道，全長約 2 公里，早期為泰雅族獵徑。步道全程依傍溪流，沿途綠樹遮蔭、林相原始茂密，包含巨石溪澗、繩索吊橋與水域生態，水質清澈可見苦花魚悠游。", "note": "由管制鐵門至步道入口需先步行碎石產業道路約 1.5 公里（約 20 分鐘）；步道平緩好走，雨後部分路段濕滑；步道外側設有免費大型停車場與公廁。", "tags": ["避暑", "玩水", "親子"], "sources": ["https://hiking.biji.co/index.php?q=trail&act=detail&id=372"], "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=372", "drive": "離基地約 10 分", "stay_h": 2.0, "drive_min": 10, "total_h": 2.3, "season_months": [], "id": "p8c192901"}, {"name": "太平山林業鐵路_太平山站", "lat": 24.4927778, "lng": 121.535, "town": "宜蘭縣大同鄉", "base": "taipingshan", "theme": "heritage", "kind": "森林鐵道", "diff": "散步", "time": "車程加停留約 1.5–2 小時", "season": "", "desc": "太平山蹦蹦車起點站，海拔約 1,900 公尺，行駛於昔日太平山茂興線運材鐵道上。單程車程約 20 分鐘、長度 3 公里，以開放式黃色開放式台車行駛至茂興車站，下車後可銜接茂興懷舊步道主線與上下環線。", "note": "每日 07:00 於太平山莊站櫃檯現場開賣當日所有班次車票，無預售機制；行駛班次自 07:30 起每半小時或一小時一班，每班次限額 180 人，假日極易提早售罄；全票 180 元、優待票 120 元。位於太平山國家森林遊樂區內，需購票入園（票價與入園時間依林業署官方公告）。", "tags": ["看火車", "親子", "避暑"], "sources": ["https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2996&ctNode=229&mp=1"], "source": "https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2996&ctNode=229&mp=1", "drive": "離基地約 5 分", "stay_h": 2.0, "drive_min": 5, "total_h": 2.2, "season_months": [], "id": "pbfd51638"}, {"name": "太平山莊", "lat": 24.4922909, "lng": 121.5366036, "town": "宜蘭縣大同鄉", "base": "taipingshan", "zone": "太平山莊", "theme": "lodging", "kind": "山莊", "diff": "開車", "time": "", "season": "", "desc": "林業及自然保育署直營之高山旅宿，為太平山行政與遊客服務核心，海拔約 1,950 公尺。建築群隨山勢層疊而建，依木材樹種命名為紅檜館、香杉館、扁柏館、台灣杉館與肖楠館，附設餐廳、咖啡館與販賣部。", "note": "雙人房平日約 2800–3800 元、假日約 3500–4800 元（含早晚餐）；僅能透過林業保育署太平山訂房系統於入住日前 30 天上午 08:00 線上預訂；客房不提供一次性盥洗用品；山莊旁設有階梯停車場。", "tags": ["需預約", "避暑"], "sources": ["https://tpsr.forest.gov.tw/"], "source": "https://tpsr.forest.gov.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p2893b7ef"}, {"name": "翠峰山屋", "lat": 24.5096438, "lng": 121.6105629, "town": "宜蘭縣大同鄉", "base": "taipingshan", "zone": "翠峰山屋", "theme": "lodging", "kind": "山屋", "diff": "開車", "time": "", "season": "", "desc": "座落於翠峰景觀道路 16.5 公里終點，海拔約 1,850 公尺，緊鄰翠峰湖環山步道與望洋山步道入口。山屋為兩層樓木造綠建築，提供二人房型與八人團體通鋪，是深山湖區唯一的過夜住宿設施。", "note": "二人房平日約 3000 元、假日約 3800 元（含早晚餐）；需透過太平山官方訂房系統於入住日前 30 天線上預訂；山區夜間採發電機限時供電（通常 22:00 熄燈）；不提供一次性備品與毛巾，附設小型停車場。", "tags": ["需預約", "避暑"], "sources": ["https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=3000&ctNode=272&mp=1"], "source": "https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=3000&ctNode=272&mp=1", "drive": "離基地約 95 分", "stay_h": 0.5, "drive_min": 95, "total_h": 3.7, "season_months": [], "id": "p414420d1"}, {"name": "太平山檜木原始林步道", "lat": 24.494218, "lng": 121.5349374, "town": "宜蘭縣大同鄉", "base": "taipingshan", "theme": "trail-mountain", "kind": "巨木步道", "diff": "健行", "time": "環狀一圈約 40–50 分鐘", "season": "", "desc": "步道入口位於太平山莊中央階梯頂端鎮安宮旁，海拔約 2,000 公尺，步道全長約 0.6 公里。全線為木棧道環狀動線，穿行於紅檜與台灣扁柏原生林中，沿途可見雙層林相、倒木樹抱石與二代木更新之自然林業生態。", "note": "步道坡度起伏平緩，但需先由太平山莊服務中心攀爬近 500 階紅葉步道階梯抵達入口；雨天木棧道表面濕滑，建議穿著防滑健行鞋與攜帶登山杖。位於太平山國家森林遊樂區內，需購票入園（票價與入園時間依林業署官方公告）。", "tags": ["巨木", "避暑"], "sources": ["https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2966&ctNode=281&mp=1"], "source": "https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2966&ctNode=281&mp=1", "drive": "離基地約 5 分", "stay_h": 0.83, "drive_min": 5, "total_h": 1.0, "season_months": [], "id": "p29d2058e"}, {"name": "望洋山步道", "lat": 24.5101954, "lng": 121.6090163, "town": "宜蘭縣大同鄉", "base": "taipingshan", "theme": "trail-mountain", "kind": "登山步道", "diff": "健行", "time": "往返約 1.5 小時", "season": "", "desc": "步道入口位於翠峰山屋旁，步道長度約 950 公尺，山頂觀景台海拔達 2,050 公尺。步道沿著望洋山稜線鋪設碎石階梯而上，登頂展望平台面朝東方蘭陽平原與太平洋，是翠峰湖區域清晨觀賞日出晨曦與翻騰雲海之核心制高點。", "note": "全線皆為上坡階梯，海拔落差約 180 公尺，清晨觀日出需自備頭燈照明；冬季或清晨氣溫偏低（常低於 10 度），需準備防風保暖衣物；步道起點鄰近翠峰山屋停車場。位於太平山國家森林遊樂區內，需購票入園（票價與入園時間依林業署官方公告）。", "tags": ["展望", "避暑"], "sources": ["https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2973&ctNode=289&mp=1"], "source": "https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2973&ctNode=289&mp=1", "drive": "離基地約 95 分", "stay_h": 1.5, "drive_min": 95, "total_h": 4.7, "season_months": [], "id": "pada633f2"}, {"name": "翠峰湖環山步道-東口", "lat": 24.5107709, "lng": 121.6086183, "town": "宜蘭縣大同鄉", "base": "taipingshan", "theme": "trail-mountain", "kind": "湖泊步道", "diff": "健行", "time": "觀景台折返約 40 分鐘，環湖全程約 2.5 小時", "season": "9月-11月", "desc": "步道圍繞高山湖泊翠峰湖（滿水期湖面面積約 25 公頃），海拔約 1,900 公尺。東口設有木造雙層觀湖平台，沿途鋪設碎石路與木棧道，林相包含奧氏虎皮楠、台灣杜鵑及檜木純林，中段設有寂靜山徑聆聽天然苔蘚音景。", "note": "步道全長 3.95 公里，自東口步行至第一觀湖平台約 300 公尺（約 10 分鐘，平緩好走）；若走完全程需原路折返或由西口（翠峰景觀道路 15.5K）踢產道回東口；東口設有專屬公廁與停車場。位於太平山國家森林遊樂區內，需購票入園（票價與入園時間依林業署官方公告）。", "tags": ["避暑", "展望"], "sources": ["https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2972&ctNode=288&mp=1"], "source": "https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2972&ctNode=288&mp=1", "drive": "離基地約 95 分", "stay_h": 2.5, "drive_min": 95, "total_h": 5.7, "season_months": [9, 10, 11], "id": "pa0543ab0"}, {"name": "見晴懷古步道", "lat": 24.5052473, "lng": 121.5256669, "town": "宜蘭縣大同鄉", "base": "taipingshan", "theme": "trail-mountain", "kind": "森林鐵道步道", "diff": "散步", "time": "往返約 1 小時", "season": "", "desc": "由早期見晴線運材鐵道修築而成，步道長度約 900 公尺，海拔約 1,890 公尺。沿途保留舊時木製鐵軌、枕木、轉轍器與兩座懸空高架鐵道遺跡，林間長年雲霧繚繞且覆蓋厚層苔蘚植物。", "note": "全線平緩好走，目前開放至 900 公尺處吊索橋折返；步道入口位於宜專1號 23.1 公里處，此處僅能停放機車與公務車，小型車需停放於 24.5 公里處之見晴停車場後步行人行專用道（約 1 公里、15 分鐘）至步道口。位於太平山國家森林遊樂區內，需購票入園（票價與入園時間依林業署官方公告）。", "tags": ["避暑", "展望", "親子"], "sources": ["https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2964&ctNode=280&mp=1"], "source": "https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2964&ctNode=280&mp=1", "drive": "離基地約 10 分", "stay_h": 1.0, "drive_min": 10, "total_h": 1.3, "season_months": [], "id": "p92073cf3"}, {"name": "白嶺巨木", "lat": 24.5308457, "lng": 121.5188185, "town": "宜蘭縣大同鄉", "base": "taipingshan", "theme": "trail-near", "kind": "巨木觀景點", "diff": "開車", "time": "約 15–20 分鐘", "season": "", "desc": "位於宜專1號 14.5 公里轉彎處，海拔 1,450 公尺，為太平山針闊葉林分水嶺。此株紅檜巨木樹齡推估超過 2,500 年，樹高約 30 公尺、胸圍 9.4 公尺，需約 6 人才能合抱，樹體頂端雖受雷擊斷裂，側枝依然繁茂旺盛。", "note": "此處位於道路彎道旁，路肩設有木棧觀景平台與解說牌；車位約僅能停靠 3–4 輛小型車，為短暫停歇拍照之中繼點，下車走動需留意轉彎會車。位於太平山國家森林遊樂區內，需購票入園（票價與入園時間依林業署官方公告）。", "tags": ["巨木", "中繼", "避暑"], "sources": ["https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2963&ctNode=279&mp=1"], "source": "https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2963&ctNode=279&mp=1", "drive": "離基地約 35 分", "stay_h": 0.33, "drive_min": 35, "total_h": 1.5, "season_months": [], "id": "pa08350db"}, {"name": "鳩之澤溫泉", "lat": 24.5453779, "lng": 121.5081831, "town": "宜蘭縣大同鄉", "base": "taipingshan", "theme": "water", "kind": "溫泉", "diff": "散步", "time": "約 1.5–2 小時", "season": "", "desc": "位於宜專1號 4.3 公里處多望溪谷，海拔約 520 公尺。泉質為弱鹼性碳酸氫鈉泉，溫泉水呈淡藍色清澈無硫磺味，設有露天溫泉SPA區、男女日式裸湯區、家庭湯屋以及利用地熱熱源的高溫煮蛋槽。", "note": "大眾SPA池與男女裸湯營業時間 09:00–19:00；溫泉煮蛋槽提供竹簍租借（押金 200 元、租金 20 元），現場販售雞蛋與玉米；設有專屬免費停車場與洗手間。位於太平山國家森林遊樂區內，需購票入園（票價與入園時間依林業署官方公告）。", "tags": ["溫泉", "玩水", "避暑", "親子"], "sources": ["https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2962&ctNode=277&mp=1"], "source": "https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2962&ctNode=277&mp=1", "drive": "離基地約 75 分", "stay_h": 2.0, "drive_min": 75, "total_h": 4.5, "season_months": [], "id": "p715753b1"}, {"name": "武界阿米倫秘境度假山莊", "lat": 23.9084696, "lng": 121.0501451, "town": "南投縣仁愛鄉", "base": "wujie", "zone": "部落核心", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "座落於法治村界山巷高處，緊鄰濁水溪上游河畔。山莊設有庭園景觀木屋、景觀雙人房與四人房，提供布農族原鄉風味晚餐與部落文化深度導覽套裝行程，夜晚可於庭院眺望星空。", "note": "雙人套房一泊二食平日約 3800–4600 元、假日約 4800–5800 元；可透過官網或電話預訂；提供四驅車接駁至一線天與茶園觀日出等付費套裝服務；附設專用停車場。", "tags": ["避暑", "夜景"], "sources": ["https://amironbnb.com/"], "source": "https://amironbnb.com/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p6c6ca95d"}, {"name": "武界雲海民宿", "lat": 23.9089626, "lng": 121.0477894, "town": "南投縣仁愛鄉", "base": "wujie", "zone": "部落核心", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "位於武安路旁之部落中心，為武界原住民接待民宿。提供多種團體客房與家庭套房，提供全包式部落體驗套裝（含在地三餐、高台觀日出專車、部落巡禮及一線天接駁溯溪）。", "note": "套裝行程每人約 2800–3500 元（含一泊三食、導覽與接駁）；需透過電話或官方 Line 預訂；附設專屬大型停車場；夜間提供原民歌舞互動體驗。", "tags": ["親子", "避暑"], "sources": ["https://rink.cc/80whv"], "source": "https://rink.cc/80whv", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "pd7b6e679"}, {"name": "武界雲窩森林露營區", "lat": 23.9238772, "lng": 121.0513508, "town": "南投縣仁愛鄉", "base": "wujie", "zone": "茶園高台", "theme": "lodging", "kind": "露營區", "diff": "開車", "time": "", "season": "", "desc": "位於武界茶園巷高處山林間，海拔約 1,050 公尺。營區由天然闊葉林包圍，設有草皮碎石營位與原木平台，視野開闊無光害，早晨可迎接山谷雲海繚繞，夜晚適宜觀賞繁星銀河與野生動物鳴唱。", "note": "自搭帳營位每帳約 1000–1200 元；採電話或官方粉絲專頁預約；衛浴設施集中管理，熱水 24 小時供應；上山產業道路狹小，需慢行會車，不提供夜衝。", "tags": ["夜景", "避暑", "展望"], "sources": ["https://www.facebook.com/%E6%AD%A6%E7%95%8C-%E9%9B%B2%E7%AA%A9%E6%A3%AE%E6%9E%97%E9%9C%B2%E7%87%9F%E5%8D%80-1847505548802197/"], "source": "https://www.facebook.com/%E6%AD%A6%E7%95%8C-%E9%9B%B2%E7%AA%A9%E6%A3%AE%E6%9E%97%E9%9C%B2%E7%87%9F%E5%8D%80-1847505548802197/", "drive": "離基地約 10 分", "stay_h": 0.5, "drive_min": 10, "total_h": 0.8, "season_months": [], "id": "p572de992"}, {"name": "南投武界觀景茶園露營區", "lat": 23.9183867, "lng": 121.0246882, "town": "南投縣仁愛鄉", "base": "wujie", "theme": "trail-near", "kind": "高台觀景", "diff": "開車", "time": "約 1–1.5 小時", "season": "10月-3月", "desc": "座落於武界部落西側高山山脊，海拔約 1,400 公尺。茶園沿著山稜線開墾，視野遼闊無遮蔽，正對武界谷地與中央山脈干卓萬群峰，為清晨觀賞峽谷低空雲海湧現、奔騰雲瀑與日出晨曦的高台。", "note": "清晨觀日出時段需配合晨光（約 05:30–06:30），山區氣溫常較谷地低 6–8 度，需自備保暖衣物；山路產業道路狹小坡陡，會車需留意路肩。", "tags": ["展望", "避暑"], "sources": ["https://www.facebook.com/share/1BfiMWxTdh/"], "source": "https://www.facebook.com/share/1BfiMWxTdh/", "drive": "離基地約 30 分", "stay_h": 1.5, "drive_min": 30, "total_h": 2.5, "season_months": [1, 2, 3, 10, 11, 12], "id": "p0d0b3c8b"}, {"name": "思源吊橋", "lat": 23.9168482, "lng": 121.0549261, "town": "南投縣仁愛鄉", "base": "wujie", "theme": "trail-near", "kind": "吊橋步道", "diff": "散步", "time": "約 20–30 分鐘", "season": "", "desc": "建於 1919 年，橫跨濁水溪上游溪谷，全長約 100 公尺。橋身結構細長，橋下為開闊溪床與沖積扇，為由法治村聚落徒步前往武界壩頂、曲冰古道與摩摩納爾瀑布之必經孔道。", "note": "吊橋每次限通行 10 人，步行時略有晃動；過橋後銜接坡度約 45 度之好漢坡水泥路直上台電工作站，建議著抓地力良好之健行鞋；橋頭前設有私人收費接駁停車空地。", "tags": ["展望", "避暑", "親子"], "sources": ["https://travel.nantou.gov.tw/"], "source": "https://travel.nantou.gov.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p3a94ab19"}, {"name": "一線天", "lat": 23.8885643, "lng": 121.04506, "town": "南投縣仁愛鄉", "base": "wujie", "theme": "water", "kind": "峽谷奇觀", "diff": "健行", "time": "往返約 2–2.5 小時", "season": "11月-4月", "desc": "位於濁水溪與栗栖溪匯流處之上游溪谷，為流水長年侵蝕巨型板岩形成的狹窄地質峽谷。兩側聳立垂直石壁，寬度僅容數人並肩而過，溪床散布紋理特殊的龍紋石與沉積岩碎屑。", "note": "此點位於天然溪床內無車道，僅限冬季枯水期（11月至隔年4月）由部落搭乘合格接駁四驅車抵達下切點後步行，或全程沿溪床徒步；夏秋汛期溪水暴漲有高度危險嚴禁前往；需備防滑涉水鞋。", "tags": ["峽谷", "玩水", "避暑"], "sources": ["https://travel.nantou.gov.tw/"], "source": "https://travel.nantou.gov.tw/", "drive": "離基地約 5 分", "stay_h": 2.5, "drive_min": 5, "total_h": 2.7, "season_months": [1, 2, 3, 4, 11, 12], "id": "pfc8c83fb"}, {"name": "摩摩納爾瀑布", "lat": 23.9223899, "lng": 121.0601056, "town": "南投縣仁愛鄉", "base": "wujie", "theme": "water", "kind": "瀑布步道", "diff": "健行", "time": "往返約 1.5–2 小時", "season": "10月-4月", "desc": "位於武界壩上游之深山峽谷中，為布農族傳統聖地。瀑布自高約 20 公尺的岩壁裂縫傾瀉而下，岩壁因富含鐵質與苔蘚而呈現橙橘色與翠綠色交織紋理，下方形成清澈見底的深潭。", "note": "由思源吊橋步行至瀑布單程約 45 分鐘，後段約 150 公尺需踩踏溪石涉水前進，水深及膝，建議穿著防滑水陸兩用鞋；夏季午後雷雨易致溪水混濁暴漲，應儘早折返。", "tags": ["瀑布", "玩水", "避暑", "峽谷"], "sources": ["https://travel.nantou.gov.tw/"], "source": "https://travel.nantou.gov.tw/", "drive": "離基地約 5 分", "stay_h": 2.0, "drive_min": 5, "total_h": 2.2, "season_months": [1, 2, 3, 4, 10, 11, 12], "id": "p133cc360"}, {"name": "武界壩", "lat": 23.915, "lng": 121.057222, "town": "南投縣仁愛鄉", "base": "wujie", "theme": "water", "kind": "水壩工程", "diff": "散步", "time": "約 30–45 分鐘", "season": "", "desc": "1934 年完工之攔河混凝土重力壩，壩高 57.6 公尺、長 91.5 公尺，主要功能為攔截濁水溪上游溪水，透過長達 15 公里之引水隧道注入日月潭蓄水發電。站在壩頂土地公廟前可俯瞰呈現翠綠色的攔截蓄水池。", "note": "內部水利重地不開放進入，觀景點為土地公廟前觀景平台與安東巒觀景涼亭；由思源吊橋健行至此約需 15–20 分鐘步程。", "tags": ["展望", "避暑"], "sources": ["https://www.taipower.com.tw/"], "source": "https://www.taipower.com.tw/", "drive": "離基地約 5 分", "stay_h": 0.75, "drive_min": 5, "total_h": 0.9, "season_months": [], "id": "p591de3cf"}, {"name": "四季星空民宿", "lat": 23.4310478, "lng": 120.6593762, "town": "嘉義縣番路鄉", "base": "xiding", "zone": "巃頭山腰", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "座落於隙頂山谷深處之南歐鄉村風別墅民宿，鵝黃色外牆搭配紅瓦與花園庭院。客房佈置典雅溫馨，擁有面向茶園山谷與山嵐的專屬觀景陽台，夜晚周邊無光害，可躺在露台欣賞滿天星斗。", "note": "雙人房平日約 3600–4500 元、假日約 4600–5800 元（含手作西式早餐）；需透過官方網站訂房系統預訂；由台18線進入民宿之產業道路較陡，依指標減速慢行；室內全面禁菸。", "tags": ["夜景", "避暑"], "sources": ["https://www.seasonstar.com.tw/html/order.htm"], "source": "https://www.seasonstar.com.tw/html/order.htm", "drive": "離基地約 10 分", "stay_h": 0.5, "drive_min": 10, "total_h": 0.8, "season_months": [], "id": "p092470b8"}, {"name": "星月傳說休閒區", "lat": 23.4219883, "lng": 120.6518773, "town": "嘉義縣番路鄉", "base": "xiding", "zone": "隙頂茶區", "theme": "lodging", "kind": "露營區", "diff": "開車", "time": "", "season": "", "desc": "位於隙頂傳說路旁山坡，為最靠近二延平步道的景觀露營地。營位規劃平整草皮與碎石區，坐擁開闊群山視野，正對夕陽落日方向，入夜後可俯瞰嘉南平原萬家燈火與山嵐雲海流動。", "note": "自搭帳草地營位每帳約 1000–1200 元；採電話或臉書粉絲頁預約；衛浴設施齊備，熱水穩定供應；傳說路路幅較狹窄，會車需禮讓；營區未提供公用冷藏冰箱，需自備保冰設備。", "tags": ["夕陽", "夜景", "展望", "避暑"], "sources": ["https://m.facebook.com/100063869027448/"], "source": "https://m.facebook.com/100063869027448/", "drive": "離基地約 15 分", "stay_h": 0.5, "drive_min": 15, "total_h": 1.0, "season_months": [], "id": "pc0aba23a"}, {"name": "生力農場民宿", "lat": 23.431723, "lng": 120.6643359, "town": "嘉義縣番路鄉", "base": "xiding", "zone": "巃頭山腰", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "座落於台18線 55.6 公里處隙頂茶區，為結合茶葉產銷、風味餐飲與高山住宿的在地老牌茶莊民宿。客房窗外即為梯田式高山烏龍茶園，提供品茗體驗與阿里山紅茶茶香無菜單料理，清晨可步行前往茶林山步道散步。", "note": "雙人套房平日約 2800–3600 元、假日約 3800–4600 元（含早餐）；可透過官網或電話預訂；提供專屬戶外平面停車場；風味合菜需於入住日前提前預約。", "tags": ["避暑", "展望"], "sources": ["http://www.slfhs.com/"], "source": "http://www.slfhs.com/", "drive": "離基地約 10 分", "stay_h": 0.5, "drive_min": 10, "total_h": 0.8, "season_months": [], "id": "pf2b36c1d"}, {"name": "二延平步道", "lat": 23.4175793, "lng": 120.650847, "town": "嘉義縣番路鄉", "base": "xiding", "theme": "trail-near", "kind": "景觀健行步道", "diff": "健行", "time": "往返約 1.5–2 小時", "season": "10月-3月", "desc": "起點位於台18線 52.8 公里處，全長約 1,150 公尺，海拔由 1,250 攀升至 1,450 公尺。步道依山勢修築木棧階梯與泥石路徑，穿行於孟宗竹林、巨石駁坎與開闊的高山茶園之間，沿途設有三座觀景木亭。", "note": "全線多為連續上坡木棧階梯，單程攀升約 200 公尺落差，需具備基本腳力並建議攜帶登山杖；登山口設有公有洗手間與小型停車場，假日時路肩停車位易客滿。", "tags": ["夕陽", "展望", "避暑"], "sources": ["https://www.ali-nsa.net/zh-tw/attractions/detail/141"], "source": "https://www.ali-nsa.net/zh-tw/attractions/detail/141", "drive": "離基地約 15 分", "stay_h": 2.0, "drive_min": 15, "total_h": 2.5, "season_months": [1, 2, 3, 10, 11, 12], "id": "p184b16ed"}, {"name": "阿里山迷糊步道", "lat": 23.4718923, "lng": 120.7141045, "town": "嘉義縣番路鄉", "base": "xiding", "theme": "trail-near", "kind": "溪谷竹林步道", "diff": "健行", "time": "往返約 1.5–2 小時", "season": "", "desc": "原名米洋溪步道，位於樂野部落旁，全長約 2.3 公里，海拔約 1,200 公尺。步道沿米洋溪兩岸修築，沿途穿行於極具綠意的茂密孟宗竹林與原始林相中，串聯木造涼亭、小拱橋與親水吊橋，清晨水氣豐沛且常起輕霧。", "note": "北側入口位於台18線 66 公里處（阿里山鄉公所旁），設有大型停車場與公廁；步道起伏平緩好走，雨後部分石階濕滑需留意防滑；目前南側通往福山步道段進行維修中，建議原路折返。", "tags": ["避暑", "親子"], "sources": ["https://www.ali-nsa.net/zh-tw/attractions/detail/138"], "source": "https://www.ali-nsa.net/zh-tw/attractions/detail/138", "drive": "離基地約 35 分", "stay_h": 2.0, "drive_min": 35, "total_h": 3.2, "season_months": [], "id": "pde68829b"}, {"name": "隙頂二延平步道觀雲平台", "lat": 23.4243264, "lng": 120.6527138, "town": "嘉義縣阿里山鄉", "base": "xiding", "theme": "trail-near", "kind": "觀雲高台", "diff": "散步", "time": "約 45–60 分鐘", "season": "10月-3月", "desc": "二延平步道最高終點處之木造大型展望平台，海拔約 1,450 公尺。因地形正處八掌溪與曾文溪水氣上升匯聚之風口，秋冬午後常有壯觀的翻騰雲海與氣勢磅礡的雲瀑翻越山稜，向西更可遠眺嘉南平原、仁義潭與蘭潭水庫全景。", "note": "黃昏時段為拍攝夕陽晚霞與雲海之尖峰，常聚集大量攝影愛好者；山頂無洗手間與補給販售，需自備飲水；入夜後氣溫驟降且山風強勁，需備齊防風保暖外套。", "tags": ["夕陽", "展望", "夜景", "避暑"], "sources": ["https://www.ali-nsa.net/zh-tw/attractions/detail/141"], "source": "https://www.ali-nsa.net/zh-tw/attractions/detail/141", "drive": "離基地約 5 分", "stay_h": 1.0, "drive_min": 5, "total_h": 1.2, "season_months": [1, 2, 3, 10, 11, 12], "id": "pa67d49d0"}, {"name": "太平山林業鐵路土場車站 林鐵列車展示區", "lat": 24.5730009, "lng": 121.4964925, "town": "宜蘭縣大同鄉", "base": "yingshi-maoan", "theme": "heritage", "kind": "鐵道紀念園區", "diff": "散步", "time": "約 30–45 分鐘", "season": "", "desc": "位於台7甲線與宜專1號交會處之土場聚落，昔日為羅東森林鐵路平地段與山地索道交接的木材轉運站。現場保留重建之中興號柴油客車、羅東一號蒸汽火車頭以及載運檜木原木的鋼體平車，設有歷史照片解說廊道。", "note": "全天免費開放參觀，附設寬敞免費停車場與洗手間；緊鄰太平山國家森林遊樂區土場售票站，適合開車上山前或下山後短暫停留。", "tags": ["看火車", "中繼", "老宅", "親子"], "sources": ["https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2908&ctNode=275&mp=1"], "source": "https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2908&ctNode=275&mp=1", "drive": "離基地約 15 分", "stay_h": 0.75, "drive_min": 15, "total_h": 1.2, "season_months": [], "id": "pcad42792"}, {"name": "太平山—英仕山莊(太平山民宿)", "lat": 24.625918, "lng": 121.5410788, "town": "宜蘭縣大同鄉", "base": "yingshi-maoan", "zone": "英士部落", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "座落於台7線旁之雪山山脈東側斜坡，距離土場收費站約 12 分鐘車程。山莊設有水力旋轉景觀餐廳、獨棟歐式小木屋與本館客房，同時提供草地露營營位，背山面谷可眺望蘭陽溪河床景色。", "note": "雙人房平日約 2600–3500 元、假日約 3600–4600 元；訂房可透過官網或電話預約；設有大型自家庭園停車場；旋轉餐廳下午茶為水力機械帶動之特色體驗。", "tags": ["親子", "避暑"], "sources": ["https://hotel.eztravel.com.tw/detail-yilan-7614-2229646/yingshih-guest-house/"], "source": "https://hotel.eztravel.com.tw/detail-yilan-7614-2229646/yingshih-guest-house/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p0dbcf11b"}, {"name": "太平山旅居TaiPingShan Camper Van", "lat": 24.5387067, "lng": 121.4557843, "town": "宜蘭縣大同鄉", "base": "yingshi-maoan", "zone": "茂安部落", "theme": "lodging", "kind": "露營車", "diff": "開車", " let NEAR_SET = null;
function refreshNearSet(){ NEAR_SET = (NEAR_VIEW && PLAN.length) ? nearViewSet() : null; }

function nearPool(st){
  const maxKm=NEAR_STEPS[NEAR_STEPS.length-1].km;
  return PLACES.filter(x=>x.id!==st.id && nkm(st,x)<=maxKm)
    .sort((a,b)=>nkm(st,a)-nkm(st,b));
}
function nearViewSet(){
  const stops=PLAN.map(id=>BY_ID[id]).filter(Boolean);
  const lim=NEAR_STEPS[Math.min(NEAR_LEVEL, NEAR_STEPS.length-1)].km;
  const out=new Set();
  stops.forEach(st=>{
    out.add(st.id);
    const road=NEAR[st.id];
    nearPool(st).forEach(x=>{
      if (out.has(x.id)) return;
      const r=road&&road[x.id];
      if (r && r.km<=lim) out.add(x.id);
    });
  });
  return out;
}

function primeNearData(){
  PLAN.map(id=>BY_ID[id]).filter(Boolean).forEach(st=>{
    if (!NEAR_DONE.has(st.id)) fetchNear(st, nearPool(st));
  });
}
function primeNearView(){ if (NEAR_VIEW) primeNearData(); }

function nearestStop(p){
  let best=null;
  PLAN.map(id=>BY_ID[id]).filter(Boolean).forEach(st=>{
    if (st.id===p.id) return;
    const r=NEAR[st.id] && NEAR[st.id][p.id];
    if (r && (!best || r.km<best.km)) best={stop:st, km:r.km, min:r.min, real:true};
  });
  return best;
}

function planBaseSet(){
  const s=new Set();
  PLAN.forEach(id=>{ const p=BY_ID[id]; if (p && p.base) s.add(p.base); });
  return s;
}
function syncNearView(){
  if (!NEAR_VIEW) return;
  if (!PLAN.length){ NEAR_VIEW=false; NEAR_LEVEL=0; return; }
  primeNearView();
}
function syncBaseView(){
  if (!BASE_VIEW) return;
  if (!PLAN.length){ BASE_VIEW=false; S.base=new Set(); return; }
  S.base=planBaseSet();
}

function applyTheme(){
  const root=document.documentElement;
  if (THEME==="auto") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", THEME);
  DARK = THEME==="dark" || (THEME==="auto" && SYS.matches);
  BASES.forEach((b,i)=>{ b.color = (DARK && b.dark) ? b.dark : LIGHT_BASE[i]; });
  THEMES.forEach((t,i)=>{ t.color = (DARK && t.dark) ? t.dark : LIGHT_TH[i]; });
  const b=document.getElementById("theme");
  if (b){
    b.innerHTML = THEME==="auto" ? AUTO : (THEME==="dark" ? MOON : SUN);
    b.title = THEME==="auto" ? "跟著系統（點擊改成亮色）"

}

function readHash(){
  const h=(location.hash||"").replace(/^#/,"");
  if (!h) return;
  const q={};
  h.split("&").forEach(kv=>{ const i=kv.indexOf("="); if (i>0) q[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1)); });
  if (q.plan){
    const ids=q.plan.split(",").filter(id=>BY_ID[id]);
    if (ids.length){ PLAN=ids; TRIP_OPEN=true; S.open=false; }
  }
  if (/^\d{1,2}:\d{2}$/.test(q.start||"")){
    const [hh,mm]=q.start.split(":").map(Number);
    START=(hh||0)*60+(mm||0);
  }
}

const TAGSET=new Set();

function termHit(p, hay, t){
  if (TAGSET.has(t))
    return (p.tags||[]).some(x=>String(x).toLowerCase()===t) || p.name.toLowerCase().includes(t);
  return hay.includes(t);
}

function passExcept(p, skip){
  if (NEAR_SET && !NEAR_SET.has(p.id)) return false;
  if (skip!=="base" && S.base.size && !S.base.has(p.base)) return false;
  if (skip!=="themes" && S.themes.size && !S.themes.has(p.theme)) return false;
  if (skip!=="diffs" && S.diffs.size && !S.diffs.has(p.diff)) return false;
  if (skip!=="budget" && S.budget.size && !S.budget.has(bud(p))) return false;
  if (skip!=="mine" && S.mine==="yes" && !p.in_user_list) return false;
  if (skip!=="mine" && S.mine==="no" && p.in_user_list) return false;
  if (skip!=="inseason" && S.inseason && !months(p).includes(MONTH)) return false;
  if (S.q || S.qtags.length){
    const hay=(p.name+p.town+p.desc+p.note+p.season+p.kind+(p.tags||[]).join("")).toLowerCase();
    if (S.q && !termHit(p, hay, S.q)) return false;
    for (const t of S.qtags) if (!termHit(p, hay, t)) return false;
  }
  return true;
}

const RAD = Math.PI/180;
function km(a,b){
  const dLat=(b.lat-a.lat)*RAD, dLng=(b.lng-a.lng)*RAD, la=(a.lat+b.lat)/2*RAD;
  return Math.hypot(dLat, dLng*Math.cos(la))*6371;
}

const rc = p => (p.nav ? p.nav[1]+","+p.nav[0] : p.lng+","+p.lat);
const navpt = p => (p.nav ? {lat:p.nav[0], lng:p.nav[1]} : p);
const nkm = (a,b) => km(navpt(a), navpt(b));

function legEstimate(a,b){
  const d=nkm(a,b)*1.5;
  return {km:d, min:Math.round(d/45*60), real:false};
}

function legOf(a,b){
  const r=neighGet(a.id||"HOME", b.id||"HOME");
  return r ? {km:r.km, min:r.min, real:true} : legEstimate(a,b);
}

const NEAR={}, NEAR_DONE=new Set();

let NEIGH_TRI=null;
try{
  if (NEIGH_B64){
    const bin=atob(NEIGH_B64);
    const buf=new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
    NEIGH_TRI=new Uint16Array(buf.buffer);
  }
}catch(e){ NEIGH_TRI=null; }
const IDX_OF={}; PLACES.forEach((p,i)=>{ IDX_OF[p.id]=i; });
function neighGet(aid,bid){
  if (aid===bid) return null;
  if (aid==="HOME" || bid==="HOME"){
    const i=IDX_OF[aid==="HOME"?bid:aid];
    const h=(i!=null) && (NEIGH_ORIG.__HOME__||[])[i];
    return (h && h[0]!==65535) ? {km:h[0]/10, min:h[1]} : null;
  }
  if (!NEIGH_TRI) return null;
  let ia=IDX_OF[aid], ib=IDX_OF[bid];
  if (ia==null || ib==null) return null;
  if (ia>ib){ const t=ia; ia=ib; ib=t; }
  const n=PLACES.length;
  const k=(ia*(2*n-ia-1)/2 + (ib-ia-1))*2;   // 上三角列序的格位
  const km10=NEIGH_TRI[k];
  return km10===65535 ? null : {km:km10/10, min:NEIGH_TRI[k+1]};
}
function fetchNear(p, pool){
  if (NEAR_DONE.has(p.id) || !pool.length) return;
  const m=NEAR[p.id]||(NEAR[p.id]={});
  pool.forEach(x=>{ if (!(x.id in m)) m[x.id]=neighGet(p.id,x.id); });
  NEAR_DONE.add(p.id);
}

function originDist(oid, p){
  const row=NEIGH_ORIG[oid];
  if (!row) return null;
  const i=IDX_OF[p.id];
  if (i==null) return null;
  const v=row[i];
  return (v && v[0]!==65535) ? {km:v[0]/10, min:v[1]} : null;
}

const esc = s => (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fmt(min){
  const m=((Math.round(min)%1440)+1440)%1440;
  return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
}

function legText(min, km, real){
  return km!=null ? `${real?"":"約 "}${min} 分 · ${km.toFixed(1)} km` : `${min} 分`;
}

let engine=null, map=null, marks={}, lines=null, pts=null, ready=false, zoom=11;
const ICON_ZOOM = 14;

function note(html){
  const el=document.getElementById("mapnote");
  if (!html){ el.style.display="none"; return; }
  el.style.display="block"; el.innerHTML=html;
}
function loadOSM(why){
  if (engine) return;
  engine="loading";
  const css=document.createElement("link");
  css.rel="stylesheet"; css.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
  document.head.appendChild(css);
  const js=document.createElement("script");
  js.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
  js.onload=()=>initOSM(why);
  js.onerror=()=>{
    engine=null;
    const m=document.getElementById("mapmsg");
    m.style.display="flex";
    m.textContent="底圖載不進來，可能是沒連網。切到「清單」，內容一樣看得到。";
  };
  document.head.appendChild(js);
}
function initOSM(why){
  engine="osm";
  map=L.map("map",{zoomControl:true}).setView([24.76,121.06],11);

  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
              {maxZoom:18,
               attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" ' +
                           'target="_blank" rel="noopener">OpenStreetMap</a> contributors' +
                           ' · <a href="https://opendatacommons.org/licenses/odbl/" ' +
                           'target="_blank" rel="noopener">ODbL</a>'}).addTo(map);
  lines=L.layerGroup().addTo(map);
  pts=L.layerGroup().addTo(map);
  L.marker([HOME.lat,HOME.lng],{icon:L.divIcon({className:"hubpin",
    html:'<svg viewBox="0 0 16 16"><path d="M2.5 8.5 8 3l5.5 5.5M4 7v6h8V7"/></svg>'})})
    .bindTooltip(HOME.name,{direction:"top",offset:[0,-11],className:"tt",opacity:1})
    .addTo(map);
  zoom=map.getZoom();
  addLocateControl();
  map.on("click", ()=>{ if (S.sel){ S.sel=null; render(); } });
  map.on("zoomend", ()=>{
    const z=map.getZoom();
    const crossed = (z>=ICON_ZOOM) !== (zoom>=ICON_ZOOM);
    zoom=z;
    if (crossed) draw();
  });
  ready=true;
  note(why ? "底圖用 OpenStreetMap：" + why : "");
  draw();
}
