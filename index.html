<script>

window.__iosStandaloneFix = { active:false, gap:null, screenH:null, appliedH:null };
(function(){
  function isStandaloneMode(){
    return (window.matchMedia && matchMedia("(display-mode:standalone)").matches) ||
           window.navigator.standalone === true;
  }

  function isPortrait(){
    if (window.matchMedia){
      const mq = matchMedia("(orientation:portrait)");
      if (typeof mq.matches === "boolean") return mq.matches;
    }
    return window.innerWidth < window.innerHeight;
  }
  function clearInline(){
    document.documentElement.style.height = "";
    document.body.style.height = "";
    const appEl = document.getElementById("app");
    if (appEl) appEl.style.height = "";
  }
  function apply(){
    const state = window.__iosStandaloneFix;
    if (!isStandaloneMode()){
      state.active = false; state.gap = null; state.screenH = null; state.appliedH = null;
      return;
    }
    if (!isPortrait()){
      clearInline();
      state.active = false; state.gap = null; state.screenH = null; state.appliedH = null;
      resizeMap();
      return;
    }
    const sh = window.screen && window.screen.height;
    const ih = window.innerHeight;
    if (!sh || !ih){ state.active = false; return; }
    const gap = sh - ih;
    state.screenH = sh; state.gap = gap;
    if (gap > 15 && gap < 100){
      const px = sh + "px";
      document.documentElement.style.height = px;
      document.body.style.height = px;
      const appEl = document.getElementById("app");
      if (appEl) appEl.style.height = px;
      state.active = true;
      state.appliedH = sh;
    } else {
      clearInline();
      state.active = false;
      state.appliedH = null;
    }
    resizeMap();
  }
  apply();
  window.addEventListener("orientationchange", function(){ setTimeout(apply, 250); });
  window.addEventListener("resize", apply);
})();
</script>

<script>

(function(){

  const GOATCOUNTER_SITE = "tw101099n";
  const BASE = GOATCOUNTER_SITE ? "https://" + GOATCOUNTER_SITE + ".goatcounter.com" : "";
  const LINE1 = "我愛我那環海多山的國家";
  const FALLBACK = "Author: 行路有風溫柔閣驕傲的臺灣查某囝";

  let total = null;      // 拿到過的總數（字串，已含千分位）；null＝還沒拿到
  let panel = null, closing = false;

  function ping(){
    if (!BASE) return;
    try{
      const s = document.createElement("script");
      s.async = true;
      s.src = "https://gc.zgo.at/count.js";
      s.setAttribute("data-goatcounter", BASE + "/count");
      s.onerror = function(){};
      document.head.appendChild(s);
    }catch(e){}
  }

  function fetchTotal(){
    if (!BASE) return Promise.resolve(null);
    return fetch(BASE + "/counter/TOTAL.json", {mode:"cors"})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){
        const c = j && j.count;
        if (typeof c === "string" && c.trim()) { total = c.trim(); return total; }
        if (typeof c === "number") { total = String(c); return total; }
        return null;
      })
      .catch(function(){ return null; });
  }

  function countText(){
    return total ? total + " 個臺灣囡子的足跡" : FALLBACK;
  }

  function open(){
    if (panel) return;
    closing = false;
    panel = document.createElement("div");
    panel.className = "egg";
    panel.setAttribute("role", "dialog");
    panel.setAttribute("aria-label", LINE1);
    const card = document.createElement("div");
    card.className = "eggcard";
    const l1 = document.createElement("p");
    l1.className = "eggline";
    l1.textContent = LINE1;
    const l2 = document.createElement("p");
    l2.className = "eggcount";
    l2.textContent = countText();
    card.appendChild(l1);
    card.appendChild(l2);
    panel.appendChild(card);

    card.addEventListener("click", function(e){ e.stopPropagation(); });
    panel.addEventListener("click", close);
    document.body.appendChild(panel);

    void panel.offsetWidth;
    panel.classList.add("on");

    if (!total && BASE){
      fetchTotal().then(function(){
        if (panel && !closing && total) l2.textContent = countText();
      });
    }

    document.addEventListener("keydown", onKey);
  }
  function onKey(e){ if (e.key === "Escape") close(); }
  function close(){
    if (!panel || closing) return;
    closing = true;
    document.removeEventListener("keydown", onKey);
    const p = panel;
    panel = null;
    p.classList.remove("on");

    let done = false;
    function drop(){
      if (done) return;
      done = true;
      if (p.parentNode) p.parentNode.removeChild(p);
    }
    p.addEventListener("transitionend", drop);
    setTimeout(drop, 600);
  }

  const logo = document.getElementById("logo");
  if (logo){
    let timer = null, sx = 0, sy = 0, moved = false;
    const HOLD_MS = 3000, TOL = 14;
    function begin(x, y){
      moved = false; sx = x; sy = y;
      clearTimeout(timer);
      timer = setTimeout(function(){ if (!moved) open(); }, HOLD_MS);
    }
    function trackMove(x, y){
      if (Math.abs(x - sx) > TOL || Math.abs(y - sy) > TOL){ moved = true; clearTimeout(timer); }
    }
    function cancel(){ clearTimeout(timer); }
    logo.addEventListener("touchstart", function(e){ const t = e.touches[0]; begin(t.clientX, t.clientY); }, {passive:true});
    logo.addEventListener("touchmove", function(e){ const t = e.touches[0]; trackMove(t.clientX, t.clientY); }, {passive:true});
    logo.addEventListener("touchend", cancel);
    logo.addEventListener("touchcancel", cancel);
    logo.addEventListener("mousedown", function(e){ begin(e.clientX, e.clientY); });
    logo.addEventListener("mousemove", function(e){ if (timer) trackMove(e.clientX, e.clientY); });
    logo.addEventListener("mouseup", cancel);
    logo.addEventListener("mouseleave", cancel);
    logo.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  }

  ping();
  fetchTotal();
})();
</script>
