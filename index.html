5d"}, {"name": "武界雲海民宿", "lat": 23.9089626, "lng": 121.0477894, "town": "南投縣仁愛鄉", "base": "wujie", "zone": "部落核心", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "位於武安路旁之部落中心，為武界原住民接待民宿。提供多種團體客房與家庭套房，提供全包式部落體驗套裝（含在地三餐、高台觀日出專車、部落巡禮及一線天接駁溯溪）。", "note": "套裝行程每人約 2800–3500 元（含一泊三食、導覽與接駁）；需透過電話或官方 Line 預訂；附設專屬大型停車場；夜間提供原民歌舞互動體驗。", "tags": ["親子", "避暑"], "sources": ["https://www.taiwanstay.net.tw/TSA/web_page/TSA020200.jsp?hohi_id=16806"], "source": "https://www.taiwanstay.net.tw/TSA/web_page/TSA020200.jsp?hohi_id=16806", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "pd7b6e679"}, {"name": "武界雲窩森林露營區", "lat": 23.9238772, "lng": 121.0513508, "town": "南投縣仁愛鄉", "base": "wujie", "zone": "茶園高台", "theme": "lodging", "kind": "露營區", "diff": "開車", "time": "", "season": "", "desc": "位於武界茶園巷高處山林間，海拔約 1,050 公尺。營區由天然闊葉林包圍，設有草皮碎石營位與原木平台，視野開闊無光害，早晨可迎接山谷雲海繚繞，夜晚適宜觀賞繁星銀河與野生動物鳴唱。", "note": "自搭帳營位每帳約 1000–1200 元；採電話或官方粉絲專頁預約；衛浴設施集中管理，熱水 24 小時供應；上山產業道路狹小，需慢行會車，不提供夜衝。", "tags": ["夜景", "避暑", "展望"], "sources": ["https://www.facebook.com/%E6%AD%A6%E7%95%8C-%E9%9B%B2%E7%AA%A9%E6%A3%AE%E6%9E%97%E9%9C%B2%E7%87%9F%E5%8D%80-1847505548802197/"], "source": "https://www.facebook.com/%E6%AD%A6%E7%95%8C-%E9%9B%B2%E7%AA%A9%E6%A3%AE%E6%9E%97%E9%9C%B2%E7%87%9F%E5%8D%80-1847505548802197/", "drive": "離基地約 10 分", "stay_h": 0.5, "drive_min": 10, "total_h": 0.8, "season_months": [], "id": "p572de992"}, {"name": "南投武界觀景茶園露營區", "lat": 23.9183867, "lng": 121.0246882, "town": "南投縣仁愛鄉", "base": "wujie", "theme": "trail-near", "kind": "高台觀景", "diff": "開車", "time": "約 1–1.5 小時", "season": "10月-3月", "desc": "座落於武界部落西側高山山脊，海拔約 1,400 公尺。茶園沿著山稜線開墾，視野遼闊無遮蔽，正對武界谷地與中央山脈干卓萬群峰，為清晨觀賞峽谷低空雲海湧現、奔騰雲瀑與日出晨曦的高台。", "note": "清晨觀日出時段需配合晨光（約 05:30–06:30），山區氣溫常較谷地低 6–8 度，需自備保暖衣物；山路產業道路狹小坡陡，會車需留意路肩。", "tags": ["展望", "避暑"], "sources": ["https://www.facebook.com/share/1BfiMWxTdh/"], "source": "https://www.facebook.com/share/1BfiMWxTdh/", "drive": "離基地約 30 分", "stay_h": 1.5, "drive_min": 30, "total_h": 2.5, "season_months": [1, 2, 3, 10, 11, 12], "id": "p0d0b3c8b"}, {"name": "思源吊橋", "lat": 23.9168482, "lng": 121.0549261, "town": "南投縣仁愛鄉", "base": "wujie", "theme": "trail-near", "kind": "吊橋步道", "diff": "散步", "time": "約 20–30 分鐘", "season": "", "desc": "建於 1919 年，橫跨濁水溪上游溪谷，全長約 100 公尺。橋身結構細長，橋下為開闊溪床與沖積扇，為由法治村聚落徒步前往武界壩頂、曲冰古道與摩摩納爾瀑布之必經孔道。", "note": "吊橋每次限通行 10 人，步行時略有晃動；過橋後銜接坡度約 45 度之好漢坡水泥路直上台電工作站，建議著抓地力良好之健行鞋；橋頭前設有私人收費接駁停車空地。", "tags": ["展望", "避暑", "親子"], "sources": ["https://travel.nantou.gov.tw/"], "source": "https://travel.nantou.gov.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p3a94ab19"}, {"name": "一線天", "lat": 23.8885643, "lng": 121.04506, "town": "南投縣仁愛鄉", "base": "wujie", "theme": "water", "kind": "峽谷奇觀", "diff": "健行", "time": "往返約 2–2.5 小時", "season": "11月-4月", "desc": "位於濁水溪與栗栖溪匯流處之上游溪谷，為流水長年侵蝕巨型板岩形成的狹窄地質峽谷。兩側聳立垂直石壁，寬度僅容數人並肩而過，溪床散布紋理特殊的龍紋石與沉積岩碎屑。", "note": "此點位於天然溪床內無車道，僅限冬季枯水期（11月至隔年4月）由部落搭乘合格接駁四驅車抵達下切點後步行，或全程沿溪床徒步；夏秋汛期溪水暴漲有高度危險嚴禁前往；需備防滑涉水鞋。", "tags": ["峽谷", "玩水", "避暑"], "sources": ["https://travel.nantou.gov.tw/"], "source": "https://travel.nantou.gov.tw/", "drive": "離基地約 5 分", "stay_h": 2.5, "drive_min": 5, "total_h": 2.7, "season_months": [1, 2, 3, 4, 11, 12], "id": "pfc8c83fb"}, {"name": "摩摩納爾瀑布", "lat": 23.9223899, "lng": 121.0601056, "town": "南投縣仁愛鄉", "base": "wujie", "theme": "water", "kind": "瀑布步道", "diff": "健行", "time": "往返約 1.5–2 小時", "season": "10月-4月", "desc": "位於武界壩上游之深山峽谷中，為布農族傳統聖地。瀑布自高約 20 公尺的岩壁裂縫傾瀉而下，岩壁因富含鐵質與苔蘚而呈現橙橘色與翠綠色交織紋理，下方形成清澈見底的深潭。", "note": "由思源吊橋步行至瀑布單程約 45 分鐘，後段約 150 公尺需踩踏溪石涉水前進，水深及膝，建議穿著防滑水陸兩用鞋；夏季午後雷雨易致溪水混濁暴漲，應儘早折返。", "tags": ["瀑布", "玩水", "避暑", "峽谷"], "sources": ["https://travel.nantou.gov.tw/"], "source": "https://travel.nantou.gov.tw/", "drive": "離基地約 5 分", "stay_h": 2.0, "drive_min": 5, "total_h": 2.2, "season_months": [1, 2, 3, 4, 10, 11, 12], "id": "p133cc360"}, {"name": "武界壩", "lat": 23.915, "lng": 121.057222, "town": "南投縣仁愛鄉", "base": "wujie", "theme": "water", "kind": "水壩工程", "diff": "散步", "time": "約 30–45 分鐘", "season": "", "desc": "1934 年完工之攔河混凝土重力壩，壩高 57.6 公尺、長 91.5 公尺，主要功能為攔截濁水溪上游溪水，透過長達 15 公里之引水隧道注入日月潭蓄水發電。站在壩頂土地公廟前可俯瞰呈現翠綠色的攔截蓄水池。", "note": "內部水利重地不開放進入，觀景點為土地公廟前觀景平台與安東巒觀景涼亭；由思源吊橋健行至此約需 15–20 分鐘步程。", "tags": ["展望", "避暑"], "sources": ["https://www.taipower.com.tw/"], "source": "https://www.taipower.com.tw/", "drive": "離基地約 5 分", "stay_h": 0.75, "drive_min": 5, "total_h": 0.9, "season_months": [], "id": "p591de3cf"}, {"name": "葉家香世界辣椒莊園", "lat": 24.4489944, "lng": 121.7778048, "town": "宜蘭縣南澳鄉", "theme": "food", "kind": "農產文創展館", "base": "wuta", "diff": "散步", "time": "約 30–45 分鐘", "desc": "葉家香是武塔周邊的辣椒加工與產品展示店家，可作為南澳縱谷行程中的短暫停留。", "note": "營業日、導覽、試吃與產品價格以業者當期公告為準。", "season": "", "tags": [], "sources": ["http://www.chilihunter.com.tw/", "https://travel.yilan.tw/"], "source": "http://www.chilihunter.com.tw/", "drive": "離基地約 5 分", "stay_h": 0.75, "drive_min": 5, "total_h": 0.9, "season_months": [], "id": "pec07d246"}, {"name": "宜蘭縣南澳鄉武塔國民小學", "lat": 24.4454002, "lng": 121.7783355, "town": "宜蘭縣南澳鄉", "theme": "heritage", "kind": "特色原鄉校園", "base": "wuta", "diff": "散步", "time": "約 30–45 分鐘", "desc": "武塔國小是正在使用的部落校園，校園與泰雅文化教育有關，但不應視為常態開放景點。", "note": "未獲校方同意時不進入校園或展示區；上課與活動時間應完全避讓。", "season": "", "tags": [], "sources": ["https://www.nanao.e-land.gov.tw/", "https://travel.yilan.tw/"], "source": "https://www.nanao.e-land.gov.tw/", "drive": "離基地約 5 分", "stay_h": 0.75, "drive_min": 5, "total_h": 0.9, "season_months": [], "id": "p2aba8871"}, {"name": "莎莉慕休閒露營區", "lat": 24.4414055, "lng": 121.7603, "town": "宜蘭縣南澳鄉", "theme": "lodging", "kind": "露營區", "base": "wuta", "zone": "武塔聚落", "diff": "開車", "time": "", "desc": "莎莉慕休閒露營區是武塔周邊的住宿選項。", "note": "營位、設備、價格與預約方式需向業者確認；原始來源不足以支撐固定設施與價格敘述。", "season": "", "tags": ["需預約"], "sources": ["https://www.nanao.e-land.gov.tw/"], "source": "https://www.nanao.e-land.gov.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p529fd4b6"}, {"name": "南澳南溪河岸", "lat": 24.448, "lng": 121.785, "town": "宜蘭縣南澳鄉", "theme": "trail-near", "kind": "河岸景觀步道", "base": "wuta", "diff": "散步", "time": "約 45–60 分鐘", "desc": "南澳南溪河岸可由堤防與合法道路觀察溪谷及出海口地形。", "note": "豪雨、上游降雨或水位警示時遠離河床與堤外；不把河岸描述為固定戲水設施。", "season": "", "tags": [], "sources": ["https://www.nanao.e-land.gov.tw/", "https://travel.yilan.tw/"], "source": "https://www.nanao.e-land.gov.tw/", "drive": "離基地約 10 分", "stay_h": 1.0, "drive_min": 10, "total_h": 1.3, "season_months": [], "id": "p55aead0c"}, {"name": "南澳農場", "lat": 24.4534174, "lng": 121.7904369, "town": "宜蘭縣蘇澳鎮", "theme": "trail-near", "kind": "公有休閒農場", "base": "wuta", "diff": "散步", "time": "約 1–1.5 小時", "desc": "南澳農場保留林蔭、草地與農場地景，可作日間散步停留。", "note": "依原稿現況，露營過夜服務暫停；施工、開放範圍與停車以現場公告為準。", "season": "", "tags": [], "sources": ["https://travel.yilan.tw/", "https://www.facebook.com/nanaofarm"], "source": "https://travel.yilan.tw/", "drive": "離基地約 5 分", "stay_h": 1.5, "drive_min": 5, "total_h": 1.7, "season_months": [], "id": "p9e0dc7e5"}, {"name": "四季星空民宿", "lat": 23.4310478, "lng": 120.6593762, "town": "嘉義縣番路鄉", "base": "xiding", "zone": "巃頭山腰", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "位於隙頂山谷的別墅型民宿，設有面向茶園山谷的陽台。夜間觀星受雲量、月相與周邊照明影響，不保證可見星空。", "note": "雙人房平日約 3600–4500 元、假日約 4600–5800 元（含手作西式早餐）；需透過官方網站訂房系統預訂；由台18線進入民宿之產業道路較陡，依指標減速慢行；室內全面禁菸。", "tags": ["夜景", "避暑"], "sources": ["https://www.seasonstar.com.tw/html/order.htm"], "source": "https://www.seasonstar.com.tw/html/order.htm", "drive": "離基地約 10 分", "stay_h": 0.5, "drive_min": 10, "total_h": 0.8, "season_months": [], "id": "p092470b8"}, {"name": "星月傳說休閒區", "lat": 23.4219883, "lng": 120.6518773, "town": "嘉義縣番路鄉", "base": "xiding", "zone": "隙頂茶區", "theme": "lodging", "kind": "露營區", "diff": "開車", "time": "", "season": "", "desc": "位於隙頂傳說路旁山坡，提供草皮與碎石營位。營區面向西側群山與日落方向，夜間視野受天候與霧況影響。", "note": "自搭帳草地營位每帳約 1000–1200 元；採電話或臉書粉絲頁預約；衛浴設施齊備，熱水穩定供應；傳說路路幅較狹窄，會車需禮讓；營區未提供公用冷藏冰箱，需自備保冰設備。", "tags": ["夕陽", "夜景", "展望", "避暑"], "sources": ["https://m.facebook.com/100063869027448/"], "source": "https://m.facebook.com/100063869027448/", "drive": "離基地約 15 分", "stay_h": 0.5, "drive_min": 15, "total_h": 1.0, "season_months": [], "id": "pc0aba23a"}, {"name": "生力農場民宿", "lat": 23.431723, "lng": 120.6643359, "town": "嘉義縣番路鄉", "base": "xiding", "zone": "巃頭山腰", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "座落於台18線 55.6 公里處隙頂茶區，為結合茶葉產銷、風味餐飲與高山住宿的在地老牌茶莊民宿。客房窗外即為梯田式高山烏龍茶園，提供品茗體驗與阿里山紅茶茶香無菜單料理，清晨可步行前往茶林山步道散步。", "note": "雙人套房平日約 2800–3600 元、假日約 3800–4600 元（含早餐）；可透過官網或電話預訂；提供專屬戶外平面停車場；風味合菜需於入住日前提前預約。", "tags": ["避暑", "展望"], "sources": ["http://www.slfhs.com/"], "source": "http://www.slfhs.com/", "drive": "離基地約 10 分", "stay_h": 0.5, "drive_min": 10, "total_h": 0.8, "season_months": [], "id": "pf2b36c1d"}, {"name": "二延平步道", "lat": 23.4175793, "lng": 120.650847, "town": "嘉義縣番路鄉", "base": "xiding", "theme": "trail-near", "kind": "景觀健行步道", "diff": "健行", "time": "往返約 1.5–2 小時", "season": "10月-3月", "desc": "起點位於台18線 52.8 公里處，全長約 1,150 公尺，海拔由 1,250 攀升至 1,450 公尺。步道依山勢修築木棧階梯與泥石路徑，穿行於孟宗竹林、巨石駁坎與開闊的高山茶園之間，沿途設有三座觀景木亭。", "note": "全線多為連續上坡木棧階梯，單程攀升約 200 公尺落差，需具備基本腳力並建議攜帶登山杖；登山口設有公有洗手間與小型停車場，假日時路肩停車位易客滿。", "tags": ["夕陽", "展望", "避暑"], "sources": ["https://www.ali-nsa.net/zh-tw/attractions/detail/141"], "source": "https://www.ali-nsa.net/zh-tw/attractions/detail/141", "drive": "離基地約 15 分", "stay_h": 2.0, "drive_min": 15, "total_h": 2.5, "season_months": [1, 2, 3, 10, 11, 12], "id": "p184b16ed"}, {"name": "阿里山迷糊步道", "lat": 23.4718923, "lng": 120.7141045, "town": "嘉義縣番路鄉", "base": "xiding", "theme": "trail-near", "kind": "溪谷竹林步道", "diff": "健行", "time": "往返約 1.5–2 小時", "season": "", "desc": "原名米洋溪步道，位於樂野部落旁，全長約 2.3 公里，海拔約 1,200 公尺。步道沿米洋溪兩岸修築，沿途穿行於極具綠意的茂密孟宗竹林與原始林相中，串聯木造涼亭、小拱橋與親水吊橋，清晨水氣豐沛且常起輕霧。", "note": "北側入口位於台18線 66 公里處（阿里山鄉公所旁），設有大型停車場與公廁；步道起伏平緩好走，雨後部分石階濕滑需留意防滑；目前南側通往福山步道段進行維修中，建議原路折返。", "tags": ["避暑", "親子"], "sources": ["https://www.ali-nsa.net/zh-tw/attractions/detail/138"], "source": "https://www.ali-nsa.net/zh-tw/attractions/detail/138", "drive": "離基地約 35 分", "stay_h": 2.0, "drive_min": 35, "total_h": 3.2, "season_months": [], "id": "pde68829b"}, {"name": "隙頂二延平步道觀雲平台", "lat": 23.4243264, "lng": 120.6527138, "town": "嘉義縣阿里山鄉", "base": "xiding", "theme": "trail-near", "kind": "觀雲高台", "diff": "散步", "time": "約 45–60 分鐘", "season": "10月-3月", "desc": "位於二延平步道高處的觀景平台，海拔約 1,450 公尺。平台向西望嘉南平原、仁義潭與蘭潭；秋冬水氣條件合適時，可能觀察到雲霧越過稜線。", "note": "黃昏時段為拍攝夕陽晚霞與雲海之尖峰，常聚集大量攝影愛好者；山頂無洗手間與補給販售，需自備飲水；入夜後氣溫驟降且山風強勁，需備齊防風保暖外套。", "tags": ["夕陽", "展望", "夜景", "避暑"], "sources": ["https://www.ali-nsa.net/zh-tw/attractions/detail/141"], "source": "https://www.ali-nsa.net/zh-tw/attractions/detail/141", "drive": "離基地約 5 分", "stay_h": 1.0, "drive_min": 5, "total_h": 1.2, "season_months": [1, 2, 3, 10, 11, 12], "id": "pa67d49d0"}, {"name": "練習曲書店", "lat": 24.1291036, "lng": 121.6505854, "town": "花蓮縣新城鄉", "base": "xincheng", "theme": "cafe", "kind": "獨立書店", "diff": "散步", "time": "約 45–60 分鐘", "season": "", "desc": "座落於新城國小與新城天主堂旁，由老舊平房改造而成之公益獨立書店。書店主打「只借不賣」，提供旅人與在地偏鄉學童免費借閱書籍，室內陳列大量童書、文學作品與文創明信片，營運盈餘全數回饋在地少棒隊與課輔關懷。", "note": "入店參觀免門票；店內座位區提供手沖咖啡與在地花草茶飲（內用低消每人一杯飲品約 100–150 元）；借閱書籍免押金可外借三個月；營業時間為 09:00–18:00。", "tags": ["老宅", "避暑", "親子"], "sources": ["https://tour-hualien.hl.gov.tw/", "https://www.facebook.com/%E7%B7%B4%E7%BF%92%E6%9B%B2%E6%9B%B8%E5%BA%97-161176664486602/"], "source": "https://tour-hualien.hl.gov.tw/", "drive": "離基地約 5 分", "stay_h": 1.0, "drive_min": 5, "total_h": 1.2, "season_months": [], "id": "p4be7b5fb"}, {"name": "曼波海灘", "lat": 24.1102388, "lng": 121.634187, "town": "花蓮縣新城鄉", "base": "xincheng", "theme": "coast", "kind": "礫石海灘", "diff": "散步", "time": "約 1–1.5 小時", "season": "", "desc": "位於新城鄉順安村之天然礫石海灘，穿越茂密之防風林綠色隧道即可抵達海邊。此處岸際開闊人潮稀少，海灘散布花蓮特有之圓潤大理石與片岩，遊客常於海濱進行疊石平衡創作，遠眺北方清水斷崖山海壯闊線條。", "note": "全天免門票免費開放；防風林入口處設有簡易停車空地；海灘為陡降型深水海域，嚴禁下海戲水與游泳；沙灘無遮蔽物，需備妥遮陽防曬防風裝備。", "tags": ["展望", "避暑"], "sources": ["https://www.sincheng.gov.tw/", "https://tour-hualien.hl.gov.tw/TourContent.aspx?n=242&s=1179"], "source": "https://www.sincheng.gov.tw/", "drive": "離基地約 5 分", "stay_h": 1.5, "drive_min": 5, "total_h": 1.7, "season_months": [], "id": "p4834c3ba"}, {"name": "佳興冰菓店", "lat": 24.1264499, "lng": 121.6518013, "town": "花蓮縣新城鄉", "base": "xincheng", "theme": "food", "kind": "傳統小吃", "diff": "散步", "time": "約 45–60 分鐘", "season": "", "desc": "位於新城老街博愛路的老屋店面，經營檸檬汁與在地小吃。檸檬汁以整顆檸檬連皮帶肉壓榨，再以煉乳調和酸度；另供應炒麵、滷味與薑絲大腸。", "note": "免入園費，餐飲消費另計（什錦麵約 90 元、招牌瓶裝檸檬汁 110 元）；營業時間為 08:00–17:00（熱食部週三公休，檸檬汁無休）；僅收現金；門口周邊劃設路邊免費停車位。", "tags": ["老宅", "親子"], "sources": ["https://tour-hualien.hl.gov.tw/TourContent.aspx?n=243&s=1200", "http://www.lemonjuice.com.tw/"], "source": "https://tour-hualien.hl.gov.tw/TourContent.aspx?n=243&s=1200", "drive": "離基地約 5 分", "stay_h": 1.0, "drive_min": 5, "total_h": 1.2, "season_months": [], "id": "p457263bf"}, {"name": "新城天主堂", "lat": 24.1290268, "lng": 121.6503027, "town": "花蓮縣新城鄉", "base": "xincheng", "theme": "heritage", "kind": "歷史教堂建築", "diff": "散步", "time": "約 45–60 分鐘", "season": "", "desc": "建於 1956 年，其前身為日治時期 1914 年所建之新城神社。天主堂保留了日本神社之鳥居、石燈籠與手水舍古蹟，主堂本體建造為象徵諾亞方舟的洗石子船型天主教堂，外牆爬滿翠綠爬牆虎藤蔓，經指定為花蓮縣定古蹟。", "note": "入園參觀免門票；聖堂內部開放靜心參觀，入內請放低音量並脫帽；周邊設有小型停車格與公廁；緊鄰練習曲書店步行僅 1 分鐘。", "tags": ["老宅", "避暑", "親子"], "sources": ["https://tour-hualien.hl.gov.tw/TourContent.aspx?n=242&s=1173", "https://nchdb.boch.gov.tw/"], "source": "https://tour-hualien.hl.gov.tw/TourContent.aspx?n=242&s=1173", "drive": "離基地約 5 分", "stay_h": 1.0, "drive_min": 5, "total_h": 1.2, "season_months": [], "id": "pf36660c3"}, {"name": "Ocean Chill 海憩露營區", "lat": 24.10934, "lng": 121.62869, "town": "花蓮縣新城鄉", "base": "xincheng", "zone": "順安海濱", "theme": "lodging", "kind": "露營區", "diff": "開車", "time": "", "season": "", "desc": "位於新城鄉順安村田野，距曼波海灘車程約 3 分鐘。提供自搭帳草地與木棧板營位，適合以台9線與蘇花改為主要進出路線的露營安排。", "note": "自搭帳草皮每帳平日約 1,000 元、假日約 1,200 元；採電話或官方粉絲專頁預約；水電齊備、24 小時提供穩定熱水；夏季花蓮小黑蚊較多，營區貼心提供防蚊用品，建議自備長袖衣物。", "tags": ["親子", "避暑"], "sources": ["https://tour-hualien.hl.gov.tw/", "https://www.facebook.com/oceanchillcamp/"], "source": "https://tour-hualien.hl.gov.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "ocean-chill"}, {"name": "太魯閣研海泊渡假別墅 Taroko Yan Hai Bo Villa", "lat": 24.126409, "lng": 121.652904, "town": "花蓮縣新城鄉", "base": "xincheng", "zone": "新城老街區", "theme": "lodging", "kind": "別墅民宿", "diff": "開車", "time": "", "season": "", "desc": "位於新城老街旁巷內，為獨棟木質庭園別墅型民宿。客房設有獨立客廳、陽台與頂樓泡水池，距新城海灘約數百公尺。", "note": "雙人獨棟別墅平日約 3,800–4,600 元、假日約 4,800–5,800 元（含原民風味手作早餐）；需透過官方網站或電話預約；提供專屬戶外停車場；頂樓戲水池需依管家說明使用。", "tags": ["避暑", "親子"], "sources": ["http://www.yanhaibo.com.tw/", "https://tour-hualien.hl.gov.tw/"], "source": "http://www.yanhaibo.com.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "taroko-yan-hai-bo-villa"}, {"name": "煙波花時間 花蓮", "lat": 24.1150661, "lng": 121.6397922, "town": "花蓮縣新城鄉", "base": "xincheng", "zone": "順安海濱", "theme": "lodging", "kind": "度假飯店", "diff": "開車", "time": "", "season": "", "desc": "位於新城順安海岸的煙波花蓮太魯閣渡假園區內，鄰近曼波海灘。提供雙人房、海景家庭房及背包床位，採自助式智慧報到，步行可達太平洋海岸線。", "note": "雙人客房平日約 3,800–4,800 元、假日約 5,200–6,800 元（含早餐）；需透過煙波飯店官網或訂房平台預訂；全區附設大型免費室內外平面停車場；全館室內嚴禁吸菸。", "tags": ["展望", "親子"], "sources": ["https://taroko.lakeshore.com.tw/"], "source": "https://taroko.lakeshore.com.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p48696297"}, {"name": "魯壁一家人", "lat": 24.665776, "lng": 121.2798304, "town": "新竹縣尖石鄉", "base": "xiuluan", "theme": "cafe", "kind": "景觀咖啡館", "diff": "散步", "time": "約 1–1.5 小時", "season": "", "desc": "魯壁一家人位於宇老附近，是進出尖石後山可安排餐飲與休息的民間店家。", "note": "營業日、供餐、低消與停車以店家當期公告為準；不要把餐飲停留排成必然可用的固定服務。", "tags": ["中繼", "需預約", "展望"], "sources": ["https://www.facebook.com/rubyfamily1998/", "https://travel.hsinchu.gov.tw/"], "source": "https://www.facebook.com/rubyfamily1998/", "drive": "離基地約 15 分", "stay_h": 1.5, "drive_min": 15, "total_h": 2.0, "season_months": [], "id": "pf28915bd"}, {"name": "塔克金民宿", "lat": 24.6196736, "lng": 121.286538, "town": "新竹縣尖石鄉", "base": "xiuluan", "zone": "秀巒溪谷", "theme": "lodging", "kind": "原鄉民宿", "diff": "開車", "time": "", "season": "", "desc": "塔克金民宿位在秀巒控溪聚落，鄰近控溪吊橋與溪谷景點，適合把後山道路與隔日行程分開。", "note": "以電話向業者確認房價、早餐、停車及晚間抵達安排；山區補給有限，入住前先備妥個人用品。", "tags": ["需預約"], "sources": ["https://www.google.com/travel/hotels/entity/ChcIypfly8T1ptVMGgsvZy8xdGZiOHdfYhAB"], "source": "https://www.google.com/travel/hotels/entity/ChcIypfly8T1ptVMGgsvZy8xdGZiOHdfYhAB", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "pffd40eb4"}, {"name": "宇老觀景台", "lat": 24.667653, "lng": 121.281963, "town": "新竹縣尖石鄉", "base": "xiuluan", "theme": "trail-near", "kind": "鞍部公路觀景台", "diff": "散步", "time": "約 20–30 分鐘", "season": "", "desc": "宇老位於竹 60 線進入尖石後山的鞍部，是往秀巒、鎮西堡與司馬庫斯前可停靠整理裝備與補給的道路節點。停留重點是山路行程的轉換，不把雲海或遠景視為必然。", "note": "停車空間有限，僅短暫停留並留意來車。後段山路狹窄、濃霧及落石會影響行車，請於白天通行並依道路公告調整。", "tags": ["中繼", "展望"], "sources": ["https://travel.hsinchu.gov.tw/", "https://www.hcts.gov.tw/"], "source": "https://travel.hsinchu.gov.tw/", "drive": "離基地約 20 分", "stay_h": 0.5, "drive_min": 20, "total_h": 1.2, "season_months": [], "id": "pafecaaf0"}, {"name": "控溪吊橋", "lat": 24.6202587, "lng": 121.2868747, "town": "新竹縣尖石鄉", "base": "xiuluan", "theme": "trail-near", "kind": "景觀吊橋與楓香林", "diff": "散步", "time": "約 30–45 分鐘", "season": "12月-1月", "desc": "控溪吊橋跨越白石溪，是秀巒聚落溪谷步行系統的一部分。可與軍艦岩、楓香林及聚落生活脈絡串連。", "note": "雨後橋面與步道可能濕滑；依現場管制與天候決定是否通行，勿跨越封閉標示。", "tags": [], "sources": ["https://travel.hsinchu.gov.tw/", "https://www.hcts.gov.tw/"], "source": "https://travel.hsinchu.gov.tw/", "drive": "離基地約 5 分", "stay_h": 0.75, "drive_min": 5, "total_h": 0.9, "season_months": [1, 12], "id": "p0fcd92d9"}, {"name": "軍艦岩", "lat": 24.6220978, "lng": 121.2863924, "town": "新竹縣尖石鄉", "base": "xiuluan", "theme": "trail-near", "kind": "地質巨石景觀", "diff": "散步", "time": "約 30–45 分鐘", "season": "", "desc": "軍艦岩位於泰崗溪與白石溪匯流一帶，岩體外形是秀巒溪谷地景的辨識點；可由周邊步道與吊橋觀察溪流、岩壁與聚落位置。", "note": "吊橋與步道依現場人流、天候及管制使用；豪雨、強風與落石風險升高時不逗留。", "tags": ["展望", "峽谷", "溫泉"], "sources": ["https://travel.hsinchu.gov.tw/", "https://www.hcts.gov.tw/"], "source": "https://travel.hsinchu.gov.tw/", "drive": "離基地約 5 分", "stay_h": 0.75, "drive_min": 5, "total_h": 0.9, "season_months": [], "id": "p28b42e13"}, {"name": "秀巒野溪溫泉", "lat": 24.6209432, "lng": 121.2873623, "town": "新竹縣尖石鄉", "base": "xiuluan", "theme": "water", "kind": "露天野溪溫泉", "diff": "健行", "time": "約 45–60 分鐘", "season": "11月-4月", "desc": "秀巒野溪溫泉位於溪谷匯流環境，是自然河床中的溫泉露頭，並非固定營運的湯屋或有救生管理的設施。", "note": "僅在當日沒有豪雨、上游降雨、水位警示、道路或地方政府安全警告時才考慮前往；池況、路徑與水溫均不保證。溪水暴漲、落石或任何警示時取消，不下溪、不冒險涉水。", "tags": ["溫泉", "玩水"], "sources": ["https://travel.hsinchu.gov.tw/", "https://www.hcts.gov.tw/"], "source": "https://travel.hsinchu.gov.tw/", "drive": "離基地約 5 分", "stay_h": 1.0, "drive_min": 5, "total_h": 1.2, "season_months": [1, 2, 3, 4, 11, 12], "id": "pae7351bb"}, {"name": "太平山林業鐵路土場車站 林鐵列車展示區", "lat": 24.5730009, "lng": 121.4964925, "town": "宜蘭縣大同鄉", "base": "yingshi-maoan", "theme": "heritage", "kind": "鐵道紀念園區", "diff": "散步", "time": "約 30–45 分鐘", "season": "", "desc": "位於台7甲線與宜專1號交會處之土場聚落，昔日為羅東森林鐵路平地段與山地索道交接的木材轉運站。現場保留重建之中興號柴油客車、羅東一號蒸汽火車頭以及載運檜木原木的鋼體平車，設有歷史照片解說廊道。", "note": "全天免費開放參觀，附設停車場與洗手間；緊鄰太平山國家森林遊樂區土場售票站，適合開車上山前或下山後短暫停留。", "tags": ["看火車", "中繼", "老宅", "親子"], "sources": ["https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2908&ctNode=275&mp=1"], "source": "https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2908&ctNode=275&mp=1", "drive": "離基地約 15 分", "stay_h": 0.75, "drive_min": 15, "total_h": 1.2, "season_months": [], "id": "pcad42792"}, {"name": "太平山—英仕山莊(太平山民宿)", "lat": 24.625918, "lng": 121.5410788, "town": "宜蘭縣大同鄉", "base": "yingshi-maoan", "zone": "英士部落", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "座落於台7線旁之雪山山脈東側斜坡，距離土場收費站約 12 分鐘車程。山莊設有水力旋轉景觀餐廳、獨棟歐式小木屋與本館客房，同時提供草地露營營位，背山面谷可眺望蘭陽溪河床景色。", "note": "雙人房平日約 2600–3500 元、假日約 3600–4600 元；訂房可透過官網或電話預約；設有大型自家庭園停車場；旋轉餐廳下午茶為水力機械帶動之特色體驗。", "tags": ["親子", "避暑"], "sources": ["https://hotel.eztravel.com.tw/detail-yilan-7614-2229646/yingshih-guest-house/"], "source": "https://hotel.eztravel.com.tw/detail-yilan-7614-2229646/yingshih-guest-house/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p0dbcf11b"}, {"name": "太平山旅居TaiPingShan Camper Van", "lat": 24.5387067, "lng": 121.4557843, "town": "宜蘭縣大同鄉", "base": "yingshi-maoan", "zone": "茂安部落", "theme": "lodging", "kind": "露營車", "diff": "開車", "time": "", "season": "", "desc": "位於台7甲線 11.5 公里處茂安部落溪谷旁，距離太平山土場管制站僅約 10 分鐘車程。園區依傍天然九芎林與落羽松，引進配備獨立冷暖空調與衛浴設備之豪華露營車，並設有戶外景觀桌椅與烤肉設施。", "note": "露營車雙人平日約 4300–4900 元、假日約 5200–5800 元（含手作早餐）；需透過官網或訂房平台預訂；全區車輛可直接停放於專屬車位；園區飼養溫馴家畜供親子互動。", "tags": ["親子", "避暑"], "sources": ["https://geothermalhouse.yibnb.net/"], "source": "https://geothermalhouse.yibnb.net/", "drive": "離基地約 30 分", "stay_h": 0.5, "drive_min": 30, "total_h": 1.5, "season_months": [], "id": "taipingshan-camper-van"}, {"name": "尼喬洛娜原木屋", "lat": 24.6140737, "lng": 121.5178097, "town": "宜蘭縣大同鄉", "base": "yingshi-maoan", "zone": "英士部落", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "位於英士部落林森巷，為泰雅族經營的原木屋民宿。提供客房與公共客廳，周邊為部落住宅與山林。", "note": "雙人木屋平日約 2200–2800 元、假日約 3000–3600 元；採電話或官方粉絲專頁預約；附設專用停車場；山區自然生態豐富，建議自備防蚊備品。", "tags": ["避暑"], "sources": ["https://www.facebook.com/%E6%A2%B5%E6%A2%B5%E5%9D%A1-%E5%B0%BC%E5%96%AC%E6%B4%9B%E5%A8%9C-%E5%8E%9F%E6%9C%A8%E5%B1%8B-250475132110419/"], "source": "https://www.facebook.com/%E6%A2%B5%E6%A2%B5%E5%9D%A1-%E5%B0%BC%E5%96%AC%E6%B4%9B%E5%A8%9C-%E5%8E%9F%E6%9C%A8%E5%B1%8B-250475132110419/", "drive": "離基地約 15 分", "stay_h": 0.5, "drive_min": 15, "total_h": 1.0, "season_months": [], "id": "p1877d489"}, {"name": "芃芃溫泉A區", "lat": 24.6169464, "lng": 121.5222045, "town": "宜蘭縣大同鄉", "base": "yingshi-maoan", "theme": "water", "kind": "野溪溫泉", "diff": "散步", "time": "約 1.5–2 小時", "season": "11月-4月", "desc": "位於大同鄉英士村排骨溪與梵梵溪匯流處之天然露天野溪溫泉，海拔約 280 公尺。泉水自溪床碎石中自然湧出，屬弱鹼性碳酸氫鈉泉，水質清澈無硫磺味，常年水溫約在 50 至 60 度，溪床設有多處以卵石堆砌之浸泡池。", "note": "由四季國小英士 const DAY_MIX_STEPS = [0, .32, .44, .50];
const hexMix = (hex, target, ratio) => {
  const n = parseInt(hex.slice(1), 16), t = parseInt(target.slice(1), 16);
  const step = (shift) => {
    const a = (n >> shift) & 255, b = (t >> shift) & 255;
    return Math.round(a + (b - a) * ratio);
  };
  return "#" + [16, 8, 0].map(step).map(v => v.toString(16).padStart(2, "0")).join("");
};
const dayColor = (i, cat) => {
  const c = CT[cat];

  const ratio = DAY_MIX_STEPS[Math.min(i, DAY_MIX_STEPS.length - 1)];
  return ratio ? hexMix(base, DARK ? "#000000" : "#ffffff", ratio) : base;
};

function passExcept(p, skip){
  if (skip!=="base" && S.base.size && !S.base.has(p.base)) return false;
  if (skip!=="themes" && S.themes.size && !S.themes.has(p.theme)) return false;
  if (skip!=="diffs" && S.diffs.size && !S.diffs.has(p.diff)) return false;
  if (skip!=="budget" && S.budget.size && !S.budget.has(bud(p))) return false;
  if (skip!=="inseason" && S.inseason && !months(p).includes(MONTH)) return false;
  if (S.q || S.qtags.length){
    const hay=(p.name+p.town+p.desc+p.note+p.season+p.kind+(p.tags||[]).join("")).toLowerCase();
    if (S.q && !termHit(p, hay, S.q)) return false;
    for (const t of S.qtags) if (!termHit(p, hay, t)) return false;
  }
  return true;
}

const RAD = Math.PI/180;
function km(a,b){
  const dLat=(b.lat-a.lat)*RAD, dLng=(b.lng-a.lng)*RAD, la=(a.lat+b.lat)/2*RAD;
  return Math.hypot(dLat, dLng*Math.cos(la))*6371;
}

const IDX_OF={}; PLACES.forEach((p,i)=>{ IDX_OF[p.id]=i; });
function neighGet(aid,bid){
  if (aid===bid) return null;
  if (aid==="HOME" || bid==="HOME"){
    const i=IDX_OF[aid==="HOME"?bid:aid];
    const h=(i!=null) && (NEIGH_ORIG.__HOME__||[])[i];
    return (h && h[0]!==65535) ? {km:h[0]/10, min:h[1]} : null;
  }
  if (!NEIGH_TRI) return null;
  let ia=IDX_OF[aid], ib=IDX_OF[bid];
  if (ia==null || ib==null) return null;
  if (ia>ib){ const t=ia; ia=ib; ib=t; }
  const n=PLACES.length;
  const k=(ia*(2*n-ia-1)/2 + (ib-ia-1))*2;   // 上三角列序的格位
  const km10=NEIGH_TRI[k];
  return km10===65535 ? null : {km:km10/10, min:NEIGH_TRI[k+1]};
}
function fetchNear(p, pool){
  if (NEAR_DONE.has(p.id) || !pool.length) return;
  const m=NEAR[p.id]||(NEAR[p.id]={});
  pool.forEach(x=>{ if (!(x.id in m)) m[x.id]=neighGet(p.id,x.id); });
  NEAR_DONE.add(p.id);
}

function originDist(oid, p){
  const row=NEIGH_ORIG[oid];
  if (!row) return null;
  const i=IDX_OF[p.id];
  if (i==null) return null;
  const v=row[i];
  return (v && v[0]!==65535) ? {km:v[0]/10, min:v[1]} : null;
}

const esc = s => (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let engine=null, map=null, marks={}, lines=null, pts=null, ready=false, zoom=11;
const ICON_ZOOM = 14;

const POI_ZOOM = 10;

function note(html){
  const el=document.getElementById("mapnote");
  if (!html){ el.style.display="none"; return; }
  el.style.display="block"; el.innerHTML=html;
}
function loadOSM(why){
  if (engine) return;
  engine="loading";
  const css=document.createElement("link");
  css.rel="stylesheet"; css.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
  document.head.appendChild(css);
  const js=document.createElement("script");
  js.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
  js.onload=()=>initOSM(why);
  js.onerror=()=>{
    engine=null;
    const m=document.getElementById("mapmsg");
    m.style.display="flex";
    m.textContent="底圖載不進來，可能是沒連網。切到「清單」，內容一樣看得到。";
  };
  document.head.appendChild(js);
}

function fitBases(){
  const anchors=BASES.filter(b=>b.anchor).map(b=>b.anchor);
  if (!anchors.length){ map.setView([24.76,121.06], 11, {animate:false}); return; }
  map.fitBounds(L.latLngBounds(anchors).pad(.12), {animate:false});
}

let INIT_FIT = false;
function applyInitialView(){
  if (S.trip && LEGS[S.trip]) fitTrip(); else fitBases();
  const el=document.getElementById("map");
  INIT_FIT = !!(el && el.clientWidth>0 && el.clientHeight>0);
  zoom=map.getZoom();
}
function initOSM(why){
  engine="osm";
  map=L.map("map",{zoomControl:true}).setView([24.76,121.06], 11);

  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
              {maxZoom:18,
               attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" ' +
                           'target="_blank" rel="noopener">OpenStreetMap</a> contributors' +
                           ' · <a href="https://opendatacommons.org/licenses/odbl/" ' +
                           'target="_blank" rel="noopener">ODbL</a>'}).addTo(map);
  lines=L.layerGroup().addTo(map);
  pts=L.layerGroup().addTo(map);
  L.marker([HOME.lat,HOME.lng],{icon:L.divIcon({className:"hubpin",
    html:'<svg viewBox="0 0 16 16"><path d="M2.5 8.5 8 3l5.5 5.5M4 7v6h8V7"/></svg>'})})
    .bindTooltip(HOME.name,{direction:"top",offset:[0,-11],className:"tt",opacity:1})
    .addTo(map);
  addLocateControl();
  map.on("click", ()=>{ if (S.sel){ S.sel=null; render(); } });
  map.on("zoomend", ()=>{
    const z=map.getZoom();
    const crossed = ((z>=ICON_ZOOM) !== (zoom>=ICON_ZOOM)) ||
                    ((z>=POI_ZOOM)  !== (zoom>=POI_ZOOM));
    zoom=z;
    if (crossed) draw();
  });
  ready=true;
  applyInitialView();   // fitTrip 要 ready 才動得了，所以排在這一行之後
  note(why ? "底圖用 OpenStreetMap：" + why : "");
  draw();
}

function markerHTML(p){
  const c=(TH[p.theme]||{}).color||"#888";
  const on = p.id===S.sel || !!(INLINE && INLINE.id===p.id);
  return `<div class="pin${p.theme==="lodging"?" lodge":""}${on?" on":""}" style="color:${c}">` +
         `<svg viewBox="0 0 16 16" class="ic" style="margin:0">${ICON[p.theme]||""}</svg>` +
         `<span class="pinlbl">${esc(p.name)}</span></div>`;
}

function tipHTML(p){
  return `<b>${esc(p.name)}</b>` +
    `<i>${esc(p.town)}　${EFFORT[p.diff]||p.diff}　` +
    `<span class="mi" title="車程">${CAR_SVG}${p.drive_min} 分</span>　` +
    `<span class="mi" title="停留">${HOURGLASS_SVG}${p.stay_h} 小時</span></i>` +
    (p.season?`<i>◈ ${esc(p.season)}</i>`:"");
}

function draw(){
  if (!ready) return;
  const list=shown().slice();
  const ids=new Set(list.map(p=>p.id));
  if (S.sel && BY_ID[S.sel] && !ids.has(S.sel)){ list.push(BY_ID[S.sel]); ids.add(S.sel); }

  tripStops().forEach(p=>{ if (!ids.has(p.id)){ list.push(p); ids.add(p.id); } });

  if (engine==="osm"){
    lines.clearLayers(); pts.clearLayers(); marks={};
    drawLegs();

    const focused = !!(S.trip || BASE_SEL || S.sel || anyFilter());
    const asIcon = zoom >= ICON_ZOOM;

    if (focused || zoom >= POI_ZOOM) list.forEach(p=>{
      const on = p.id===S.sel || !!(INLINE && INLINE.id===p.id);
      let m;
      if (asIcon){
        m = L.marker([p.lat,p.lng], {icon:L.divIcon({className:"", html:markerHTML(p), iconSize:[26,26]}),
                                     zIndexOffset:on?900:0});
      } else if (p.theme==="lodging"){
        m = L.marker([p.lat,p.lng], {
          icon:L.divIcon({className:"lodgemk"+(on?" on":""), iconSize:[18,18], iconAnchor:[9,9],
                          html:`<span class="ld" style="background:${(TH[p.theme]||{}).color||"#888"}"></span>`}),
          zIndexOffset:on?900:0});
      } else {
        m = L.circleMarker([p.lat,p.lng],{radius:on?9:5.5, color:"#fff", weight:on?2.5:1.2,
                                          fillColor:(TH[p.theme]||{}).color||"#888", fillOpacity:1,
                                          bubblingMouseEvents:false});
      }
      m.addTo(pts);
      m.bindTooltip(tipHTML(p), {direction:"top", offset:[0,asIcon?-14:-8], className:"tt", opacity:1});
      m.on("mouseover", ()=>highlightRow(p.id,true));
      m.on("mouseout", ()=>highlightRow(p.id,false));
      m.on("click", ()=>select(p.id));
      marks[p.id]=m;
    });
    const front = S.sel || (INLINE && INLINE.id);
    if (front && marks[front] && marks[front].bringToFront) marks[front].bringToFront();
    drawBasePins();
  }
}

function drawLegs(){
  const days=tripLegs();
  if (!days) return;
  const trip = TRIP_BY_ID[S.trip];
  const casing = DARK ? "#000000" : "#ffffff";
  days.forEach((d,i)=>{
    const c=dayColor(i, trip && trip.cat);
    (d.legs||[]).forEach(lg=>{
      if (!lg.coords || lg.coords.length<2) return;
      L.polyline(lg.coords, {color:casing, weight:8, opacity:.5, lineJoin:"round",
                             lineCap:"round", interactive:false}).addTo(lines);
      L.polyline(lg.coords, {color:c, weight:4.5, opacity:.95, lineJoin:"round", lineCap:"round"})
        .bindTooltip(`<b>Day ${i+1}</b><i>${esc(lg.from_name)} → ${esc(lg.to_name)}　` +
                     `${Math.round(lg.min)} 分 · ${lg.km.toFixed(1)} km</i>`,
                     {sticky:true, className:"tt", opacity:1})
        .addTo(lines);
    });
  });
}

function drawBasePins(){
  BASES.forEach(b=>{
    if (!b.anchor) return;
    const m=L.marker(b.anchor, {
      icon:L.divIcon({className:"basepin"+(BASE_SEL===b.id?" on":""), iconSize:[26,26], iconAnchor:[13,13],
        html:`<span class="bp" style="background:${baseColor(b)}">` +
             `<svg viewBox="0 0 16 16"><path d="M2.5 8.5 8 3l5.5 5.5M4 7v6h8V7"/></svg></span>`}),
      zIndexOffset:1500});
    m.bindTooltip(`<b>${esc(b.name)}</b><i>${esc(b.town||"")}` +
                  (b.drive_min!=null?`　離新竹約 ${hm(b.drive_min)}`:"") + `</i>`,
                  {direction:"top", offset:[0,-14], className:"tt", opacity:1});
    m.on("click", ()=>selectBase(b.id));
    m.addTo(pts);
    if (BASE_SEL===b.id) zonesOf(b).forEach(z=>{
      const on=ZONE_SEL===z.name;
      const zm=L.marker([z.anchor.lat, z.anchor.lng], {
        icon:L.divIcon({className:"zonepin"+(on?" on":""), iconSize:[14,14], iconAnchor:[7,7],
                        html:`<span class="zp" style="background:${baseColor(b)}"></span>`}),
        zIndexOffset:1400});
      zm.bindTooltip(`<b>${esc(z.name)}</b>` + (z.note?`<i>${esc(z.note)}</i>`:""),
                     {direction:"top", offset:[0,-8], className:"tt", opacity:1});
      zm.on("click", ()=>selectZone(z.name));
      zm.addTo(pts);
    });
  });
}
function fit(items){
  if (!ready || !items.length) return;
  map.fitBounds(L.latLngBounds(items.map(p=>[p.lat,p.lng])).pad(.15), {animate:false});
}
function panTo(p){
  if (!ready) return;
  map.setView([p.lat,p.lng], Math.max(map.getZoom(),13), {animate:true});
}

const isMapOnly = () => S.view==="map" && getComputedStyle(document.querySelector(".stage")).height!=="auto"
  && !matchMedia("(min-width:900px) and (min-height:560px)").matches;
function renderMapCard(){
  const box=document.getElementById("mapcard");
  if (!box) return;

  if (isMapOnly() && BASE_SEL && !S.sel){
    const b=BS[BASE_SEL];
    if (b){
      const nz=zonesOf(b).length, nl=lodgingOf(b.id).length;
      box.className="mapcard on";
      box.innerHTML =
        `<div class="ttl"><b>${esc(b.name)}</b>` +
          `<button class="x" data-act="closebase" aria-label="關閉">×</button></div>` +
        `<p class="sub">${esc(b.town||"")}　基地</p>` +
        `<p class="m">` +
          (b.drive_min!=null ? `<span class="mi" title="從新竹市區開到這個基地">${CAR_SVG}` +
            `離新竹 <span class="num">${hm(b.drive_min)}</span></span>` : "") +
          `<span class="mi">住宿 <span class="num">${nl}</span> 家` +

        `</div>`;
      box.onclick=e=>{
        const t=e.target.closest("[data-act]"); if (!t) return;
        if (t.dataset.act==="closebase") closeBase();
        else if (t.dataset.act==="basedetail"){
          S.view="list"; syncViews(); S.listOpen=true; SCROLL_BASE=true; save(); render();
        }
      };
      return;
    }
  }
  const p = (isMapOnly() && S.sel) ? BY_ID[S.sel] : null;
  box.className = "mapcard" + (p ? " on" : "");
  if (!p){ box.innerHTML=""; return; }
  const legHTML = `<span class="mi" title="從所屬基地開到這個點的車程">${CAR_SVG}` +
    `離基地 <span class="num">${p.drive_min}</span> 分</span>`;
  box.innerHTML =
    `<div class="ttl"><b>${esc(p.name)}</b>` +
      `<button class="x" data-act="close" aria-label="關閉">×</button></div>` +
    `<p class="sub">${esc(p.town)}　${esc((TH[p.theme]||{}).name||"")}　${EFFORT[p.diff]||p.diff}</p>` +
    `<p class="m">${legHTML}` +
      `<span class="mi" title="停留">${HOURGLASS_SVG}<span class="num">${p.stay_h}</span> 小時</span></p>` +
    tagsHTML(p) +
    `<div class="acts">` +
      `<button class="primary" data-act="detail">看詳細</button>` +
      `<a href="https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(HOME.name)}&destination=${encodeURIComponent(gnav(p))}" target="_blank" rel="noopener">導航</a>` +
      `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(gview(p))}" target="_blank" rel="noopener">看 Google 地圖</a>` +
    `</div>`;
  box.onclick=e=>{
    const b=e.target.closest("[data-act]"); if (!b) return;
    const act=b.dataset.act;
    if (act==="close"){ S.sel=null; render(); }
    else if (act==="tag"){ SCROLL_TO=b.dataset.pid||null; searchFor(b.dataset.tag); }
    else if (act==="detail"){ S.view="list"; syncViews(); S.listOpen=true; SCROLL_TO=p.id; save(); render(); }
  };
}

function renderMapBtns(){
  const box=document.getElementById("mapbtns");
  if (!box) return;

  if (tripLegs()){
    const tb=document.createElement("button");
    tb.textContent="行程全覽";
    tb.title="把地圖縮放到剛好涵蓋整條範例行程的腿線";
    tb.onclick=fitTrip;
    box.appendChild(tb);

}
function resizeMap(){
  if (!ready) return;
  setTimeout(()=>map.invalidateSize({animate:false}),60);
}

let LOC={watch:null, dot:null, ring:null, first:false, btn:null};
function locSay(msg){
  const host=document.getElementById("map"); if (!host) return;
  let t=host.querySelector(".loctip");
  if (!t){ t=document.createElement("div"); t.className="loctip"; host.appendChild(t); }
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove("show"), 2600);
}
function stopLocate(){
  if (LOC.watch!=null && navigator.geolocation) navigator.geolocation.clearWatch(LOC.watch);
  if (LOC.dot) map.removeLayer(LOC.dot);
  if (LOC.ring) map.removeLayer(LOC.ring);
  if (LOC.btn) LOC.btn.classList.remove("on");
  LOC={watch:null, dot:null, ring:null, first:false, btn:LOC.btn};
}
function toggleLocate(){
  if (LOC.watch!=null){ stopLocate(); return; }
  if (!navigator.geolocation){ locSay("這個瀏覽器不支援定位"); return; }
  LOC.btn.classList.add("on");
  LOC.watch=navigator.geolocation.watchPosition(pos=>{
    const ll=[pos.coords.latitude, pos.coords.longitude];
    const acc=pos.coords.accuracy||0;
    if (!LOC.dot){
      LOC.ring=L.circle(ll,{radius:acc, weight:1, color:"#7B57A8", opacity:.5,
                            fillColor:"#7B57A8", fillOpacity:.12, interactive:false}).addTo(map);
      LOC.dot=L.marker(ll,{icon:L.divIcon({className:"mypin",
        html:'<svg viewBox="0 0 48 48">' +
             '<path style="fill:var(--panel)" stroke="none" transform="translate(-0.7,2.7) ' +
             'translate(0,-1) translate(24.5,7.5) scale(1.35) translate(-24.5,-7.5)" ' +
             'd="M20,5.8c.2,2.2-1.1,4.1-2.7,4.2S14.2,' +
             '8.4,14,6.2,15.1,2.1,16.7,2,19.8,3.6,20,5.8ZM22.8,4c-1.1.1-1.9,1.5-1.8,' +
             '3.1s1.1,3,2.2,2.9S25.1,8.5,25,6.9,23.9,3.9,22.8,4Zm4.3,2.3c-.8-.1-1.5.9' +
             '-1.6,2.1s.6,2.3,1.4,2.3,1.5-.9,1.6-2.1S27.9,6.3,27.1,6.3ZM30.7,8c-.7-.1' +
             '-1.5.7-1.7,1.8A1.8,1.8,0,0,0,30,12c.7.1,1.4-.7,1.6-1.8A1.9,1.9,0,0,0,' +
             '30.7,8Zm3,2.5c-.6-.1-1.2.5-1.3,1.3a1.4,1.4,0,0,0,.6,1.7c.6.1,1.1-.5,' +
             '1.3-1.3A1.4,1.4,0,0,0,33.7,10.5Z"/>' +
             '<path style="fill:var(--panel)" stroke="none" transform="translate(-0.7,2.7)" ' +
             'd="M20,12c-2,0-6,1-5,6s8,7,8,11-3,5-5,9,0,' +
             '7,3,8a6.8,6.8,0,0,0,8-4c1-3-.6-4.2,1-9,1-3,3-4,4-10C35.4,14.9,27,12,20,12Z"/>' +
             '</svg>'}),
        interactive:false, zIndexOffset:1500}).addTo(map);
    } else {
      LOC.dot.setLatLng(ll); LOC.ring.setLatLng(ll); LOC.ring.setRadius(acc);
    }
    if (!LOC.first){ LOC.first=true; map.setView(ll, Math.max(map.getZoom(), 14), {animate:false}); }
  }, err=>{
    locSay(err && err.code===1 ? "定位權限未開啟" : "定位失敗");
    stopLocate();
  }, {enableHighAccuracy:true, maximumAge:10000, timeout:15000});
}
function addLocateControl(){
  const ctl=L.control({position:"topleft"});
  ctl.onAdd=function(){
    const d=L.DomUtil.create("div","leaflet-bar");
    const a=L.DomUtil.create("a","locbtn",d);
    a.href="#"; a.title="顯示我的位置"; a.setAttribute("aria-label","顯示我的位置");
    a.innerHTML='<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/>' +
                '<circle cx="8" cy="8" r="5.2"/>' +
                '<path d="M8 .8v2M8 13.2v2M.8 8h2M13.2 8h2"/></svg>';
    LOC.btn=a;
    L.DomEvent.on(a,"click",e=>{ L.DomEvent.stop(e); toggleLocate(); });
    return d;
  };
  ctl.addTo(map);
}

(function(){
  const mapEl = document.getElementById("map");
  if (!mapEl || typeof ResizeObserver === "undefined") return;
  let t = null;
  new ResizeObserver(function(){
    if (t) clearTimeout(t);
    t = setTimeout(function(){
      if (!ready || !map) return;
      map.invalidateSize({animate:false});
      if (!INIT_FIT){ applyInitialView(); draw(); }
    }, 100);
  }).observe(mapEl);
})();
function emphasize(id,on){
  const m=marks[id];
  if (!m) return;
  if (!m.setStyle){
    const el = m.getElement && m.getElement();
    if (el) el.classList.toggle("hot", !!on);
    if (m.setZIndexOffset) m.setZIndexOffset(on ? 1200 : 1000);
    return;
  }
  const sel = id===S.sel || !!(INLINE && INLINE.id===id);   // 同 draw() 的 on
  m.setStyle({radius: on?8.5:(sel?9:5.5), weight: on?2.5:(sel?2.5:1.2)});
  if (on && m.bringToFront) m.bringToFront();
}
function highlightRow(id,on){
  const el=document.querySelector(`.row[data-id="${id}"]`);
  if (el) el.style.background = on ? "var(--sunk)" : "";
}

function chip(label,on,fn,color,theme){
  const b=document.createElement("button");
  b.className="chip"; b.setAttribute("aria-pressed",on);
  b.innerHTML=(theme?ico(theme,color):"")+label;
  b.onclick=fn; return b;
}

function frow(key,nodes,keyTitle){
  const r=document.createElement("div"); r.className="frow";
  const k=document.createElement("div"); k.className="fkey"; k.textContent=key;
  if (keyTitle) k.title=keyTitle;
  const c=document.createElement("div"); c.className="chips";
  nodes.forEach(n=>c.appendChild(n));
  r.append(k,c); return r;
}
function section(label, count, open, fn, cls){
  const b=document.createElement("button");
  b.className="sec"+(cls?" "+cls:""); b.setAttribute("aria-expanded",open);
  b.innerHTML=`${label}${count!=null?`<span class="n">${count}</span>`:""}` +
              `<svg class="chev" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg>`;
  b.onclick=fn; return b;
}

function filterChanged(){ S.sel=null; EXTRA=new Set(); save(); render(); }

function tagsHTML(p){
  const tags = p && p.tags;
  if (!tags || !tags.length) return "";   // 沒掛 tag 的點整排不渲染，不留空容器
  return `<div class="tags">` +
    tags.map(t=>`<button type="button" class="tag" data-act="tag" data-tag="${esc(t)}" data-pid="${esc(p.id)}">${esc(t)}</button>`).join("") +
    `</div>`;
}
function searchFor(term){
  const t=String(term).trim().toLowerCase();   // 與 #q 的 input 處理常式同一條正規化
  if (!t) return;
  if (!S.qtags.includes(t)) S.qtags.push(t);   // 重複點同一顆不疊加
  renderQTags();
  const w=document.getElementById("qwrap"); if (w) w.scrollLeft=w.scrollWidth;
  filterChanged();
}

function renderQTags(){
  const w=document.getElementById("qwrap"), qi=document.getElementById("q");
  if (!w || !qi) return;
  w.querySelectorAll(".qtok").forEach(n=>n.remove());
  S.qtags.forEach(t=>{
    const b=document.createElement("button");
    b.type="button"; b.className="qtok"; b.title="移除這個條件";
    b.append(t);
    const x=document.createElement("span"); x.className="x"; x.textContent="×"; b.append(x);
    b.onclick=e=>{
      e.stopPropagation();
      S.qtags=S.qtags.filter(v=>v!==t);
      SCROLL_GROUP=true;
      renderQTags(); filterChanged();
    };
    w.insertBefore(b, qi);
  });
  qi.placeholder = S.qtags.length ? "" : "搜尋：步道、瀑布、溫泉…";
}

function resetQ(){
  S.q=""; S.qtags=[];
  const qi=document.getElementById("q"); if (qi) qi.value="";
  renderQTags();
}

function wireTags(root, inline){
  root.querySelectorAll(".tag[data-act=tag]").forEach(b=>{
    b.onclick=e=>{
      e.stopPropagation();
      if (!inline) SCROLL_TO=b.dataset.pid||null;
      searchFor(b.dataset.tag);
    };
  });
}
function toggleSet(set,v){ set.has(v)?set.delete(v):set.add(v); }
function toggle(set,v){ toggleSet(set,v); filterChanged(); }

function clearAll(){
  S.base=new Set(); S.themes=new Set(); S.diffs=new Set(); S.budget=new Set();
  S.inseason=false; S.sel=null; EXTRA=new Set(); resetQ();
  S.open=true; S.near=0;
  SCROLL_RESET=true;
  save(); render();
}
function summary(){
  const bits=[];
  if (S.base.size) bits.push([...S.base].map(b=>`<b>${esc((BS[b]||{}).name||b)}</b>`).join("、"));
  if (S.inseason) bits.push(`${MONTH} 月當季`);

const NEAR_STEPS = [{km:10,n:5},{km:20,n:8},{km:30,n:10},{km:40,n:12}];

function pickNearby(list, n){
  const groups=new Map();
  list.forEach(o=>{ if(!groups.has(o.x.theme)) groups.set(o.x.theme,[]); groups.get(o.x.theme).push(o); });
  groups.forEach(g=>g.sort((a,b)=>a.d-b.d));
  const picked=[];
  const gOld=groups.get("oldstreet");
  if (gOld){
    const quota=Math.min(gOld.length, Math.ceil(n/3));
    picked.push(...gOld.splice(0, quota));
    if (!gOld.length) groups.delete("oldstreet");
  }
  const order=[...groups.keys()].sort((a,b)=>groups.get(a)[0].d-groups.get(b)[0].d);
  let idx=0;
  while (picked.length<n){
    let added=false;
    for (const th of order){
      const g=groups.get(th);
      if (idx<g.length){ picked.push(g[idx]); added=true; if (picked.length>=n) break; }
    }
    if (!added) break;
    idx++;
  }
  return picked.sort((a,b)=>a.d-b.d);
}

      `</span>` +
      dayNavHTML(days, i);
    wrap.appendChild(head);
    const tnote = (((TRIP_BY_ID[S.trip] || {}).days || [])[i] || {}).note;
    if (tnote){
      const n=document.createElement("p"); n.className="tdnote"; n.textContent=tnote;
      wrap.appendChild(n);
    }

    const stopKey = pid => `t:${S.trip}:${i}:${pid}`;
    const putStop = p => {
      const k=stopKey(p.id);
      wrap.appendChild(tripStopRow(p, k));
      if (inlineOpen(k)) wrap.appendChild(renderDetail(p, true));
    };
    if ((d.legs||[]).length){
      d.legs.forEach(lg=>{
        wrap.appendChild(legRow(lg));

        if (p) putStop(p);
      });
    } else {
      (d.stops||[]).forEach(nm=>{ const p=BY_NAME[nm]; if (p) putStop(p); });
    }

    box.appendChild(wrap);
  });
  const f=document.createElement("p"); f.className="nonear";
  f.textContent="車程是本地 OSRM 實算的，行程首尾自動接新竹；停留時間與當日總時數請自己斟酌。";
  box.appendChild(f);
  return box;
}

function selectBase(id){
  if (BASE_SEL===id){ closeBase(); return; }
  BASE_SEL=id; ZONE_SEL=null; BASE_NEAR=0;
  const b=BS[id];
  if (b && b.anchor && ready) map.setView(b.anchor, Math.max(map.getZoom(),12), {animate:false});
  if (!isMapOnly()) SCROLL_BASE=true;
  render();
}
function closeBase(){ BASE_SEL=null; ZONE_SEL=null; BASE_NEAR=0; render(); }
function selectZone(name){
  ZONE_SEL = (ZONE_SEL===name) ? null : name;
  BASE_NEAR=0;
  const z=zonesOf(BS[BASE_SEL]).find(x=>x.name===ZONE_SEL);
  if (z && ready) map.setView([z.anchor.lat, z.anchor.lng], Math.max(map.getZoom(),13), {animate:false});
  render();
}
function renderBaseView(){
  const b=BS[BASE_SEL];
  if (!b) return null;
  const zones=zonesOf(b);
  const zone=zones.find(z=>z.name===ZONE_SEL)||null;
  const oid = zone ? zoneOriginId(b.id, zone.name) : ("base:"+b.id);
  const step = NEAR_STEPS[Math.min(BASE_NEAR, NEAR_STEPS.length-1)];
  const menu = BASE_POINTS[b.id] || [];
  const lodges = lodgingOf(b.id);

  const d=document.createElement("div"); d.className="baseview";
  d.innerHTML =
    `<div class="bvh"><b>${esc(b.name)}</b>` +
      `<button type="button" class="x" data-act="closebase" aria-label="關閉基地視圖">×</button></div>` +
    `<p class="bvm">${esc(b.town||"")}` +
      (b.drive_min!=null ? `　<span class="mi" title="從新竹市區開到這個基地">${CAR_SVG}離新竹 ` +
        `<span class="num">${hm(b.drive_min)}</span>` +
        (b.drive_km!=null?` · <span class="num">${b.drive_km.toFixed(1)}</span> km`:"") + `</span>` : "") +
      `　菜單 <span class="num">${menu.length}</span> 個點</p>`;
  d.querySelector("[data-act=closebase]").onclick=closeBase;

  if (zones.length){
    const zr=document.createElement("div"); zr.className="zrow";
    zones.forEach(z=>{
      const c=chip(esc(z.name), ZONE_SEL===z.name, ()=>selectZone(z.name));
      if (z.note) c.title=z.note;    // 完整的 note 在下面住宿分組的帶名底下
      zr.appendChild(c);
    });
    d.appendChild(zr);
  }

  const putLodge=(host,p)=>inlineRow(p, `bl:${b.id}:${p.id}`).forEach(n=>host.appendChild(n));

  const h1=document.createElement("h3");
  h1.textContent=`住宿（${lodges.length} 家）`;
  d.appendChild(h1);
  if (!lodges.length){
    const e=document.createElement("p"); e.className="nonear";
    e.textContent="這個基地還沒有住宿資料。";
    d.appendChild(e);
  } else if (zones.length){
    zones.forEach(z=>{
      const rows=lodges.filter(p=>p.zone===z.name);
      if (!rows.length) return;
      const zh=document.createElement("p"); zh.className="zhead"; zh.textContent=z.name;
      d.appendChild(zh);
      if (z.note){
        const zn=document.createElement("p"); zn.className="znote"; zn.textContent=z.note;
        d.appendChild(zn);
      }
      rows.forEach(p=>putLodge(d,p));
    });
    const rest=lodges.filter(p=>!zones.some(z=>z.name===p.zone));
    if (rest.length){
      const zh=document.createElement("p"); zh.className="zhead"; zh.textContent="未分區";
      d.appendChild(zh);
      rest.forEach(p=>putLodge(d,p));
    }
  } else {
    lodges.forEach(p=>putLodge(d,p));
  }

  const pool=PLACES.filter(x=>x.theme!=="lodging").map(x=>{
    const r=originDist(oid, x);
    if (!r || r.km>step.km) return null;
    const fac = zone && zone.drive && zone.drive[x.id];
    return {x, d:r.km, min: fac ? fac.min : r.min, real:true};
  }).filter(Boolean);
  const near=pickNearby(pool, step.n);
  const h2=document.createElement("h3");
  h2.textContent=`附近精選地點（車程 ${step.km} 公里內，從${zone?`「${zone.name}」`:"基地"}量）`;
  d.appendChild(h2);
  const nb=document.createElement("div");
  if (near.length) near.forEach(({x,d:dd,min,real})=>
    inlineRow(x, `bn:${b.id}:${x.id}`, null, {km:dd, min, real}).forEach(n=>nb.appendChild(n)));
  else {
    const e=document.createElement("p"); e.className="nonear";
    e.textContent="這個車程範圍內沒有別的點。山上繞路遠，可以放寬距離再看。";
    nb.appendChild(e);
  }
  if (BASE_NEAR < NEAR_STEPS.length-1){
    const more=document.createElement("button"); more.className="wider";
    more.textContent=`再遠一點（${NEAR_STEPS[BASE_NEAR+1].km} 公里內）`;
    more.onclick=()=>{ BASE_NEAR++; render(); };
    nb.appendChild(more);
  }
  d.appendChild(nb);
  return d;
}

  if (SCROLL_GROUP){
    const g=box.querySelector(".ghead");

      const max=box.scrollHeight-box.clientHeight;
      if (desired<=max){
        box.scrollTop=Math.max(0, desired);
      } else {
        const rowOffset=r.top-box.getBoundingClientRect().top+box.scrollTop;
        box.scrollTop = (rowOffset+r.height<box.clientHeight) ? 0 : max;
      }
    } else {
      box.scrollTop = 0;
    }
    SCROLL_TO=null;
  }
}

<script>

window.__iosStandaloneFix = { active:false, gap:null, screenH:null, appliedH:null };
(function(){
  function isStandaloneMode(){
    return (window.matchMedia && matchMedia("(display-mode:standalone)").matches) ||
           window.navigator.standalone === true;
  }

  function isPortrait(){
    if (window.matchMedia){
      const mq = matchMedia("(orientation:portrait)");
      if (typeof mq.matches === "boolean") return mq.matches;
    }
    return window.innerWidth < window.innerHeight;
  }
  function clearInline(){
    document.documentElement.style.height = "";
    document.body.style.height = "";
    const appEl = document.getElementById("app");
    if (appEl) appEl.style.height = "";
  }
  function apply(){
    const state = window.__iosStandaloneFix;
    if (!isStandaloneMode()){
      state.active = false; state.gap = null; state.screenH = null; state.appliedH = null;
      return;
    }
    if (!isPortrait()){
      clearInline();
      state.active = false; state.gap = null; state.screenH = null; state.appliedH = null;
      resizeMap();
      return;
    }
    const sh = window.screen && window.screen.height;
    const ih = window.innerHeight;
    if (!sh || !ih){ state.active = false; return; }
    const gap = sh - ih;
    state.screenH = sh; state.gap = gap;
    if (gap > 15 && gap < 100){
      const px = sh + "px";
      document.documentElement.style.height = px;
      document.body.style.height = px;
      const appEl = document.getElementById("app");
      if (appEl) appEl.style.height = px;
      state.active = true;
      state.appliedH = sh;
    } else {
      clearInline();
      state.active = false;
      state.appliedH = null;
    }
    resizeMap();
  }
  apply();
  window.addEventListener("orientationchange", function(){ setTimeout(apply, 250); });
  window.addEventListener("resize", apply);
})();
</script>

<script>

(function(){

  const GOATCOUNTER_SITE = "tw101099n";
  const BASE = GOATCOUNTER_SITE ? "https://" + GOATCOUNTER_SITE + ".goatcounter.com" : "";
  const LINE1 = "我愛我那環海多山的國家";
  const FALLBACK = "Author: 行路有風溫柔閣驕傲的臺灣查某囝";

  let total = null;      // 拿到過的總數（字串，已含千分位）；null＝還沒拿到
  let panel = null, closing = false;

  function ping(){
    if (!BASE) return;
    try{
      const s = document.createElement("script");
      s.async = true;
      s.src = "https://gc.zgo.at/count.js";
      s.setAttribute("data-goatcounter", BASE + "/count");
      s.onerror = function(){};
      document.head.appendChild(s);
    }catch(e){}
  }

  function fetchTotal(){
    if (!BASE) return Promise.resolve(null);
    return fetch(BASE + "/counter/TOTAL.json", {mode:"cors"})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){
        const c = j && j.count;
        if (typeof c === "string" && c.trim()) { total = c.trim(); return total; }
        if (typeof c === "number") { total = String(c); return total; }
        return null;
      })
      .catch(function(){ return null; });
  }

  function countText(){
    return total ? total + " 個臺灣囡子的足跡" : FALLBACK;
  }

  function open(){
    if (panel) return;
    closing = false;
    panel = document.createElement("div");
    panel.className = "egg";
    panel.setAttribute("role", "dialog");
    panel.setAttribute("aria-label", LINE1);
    const card = document.createElement("div");
    card.className = "eggcard";
    const l1 = document.createElement("p");
    l1.className = "eggline";
    l1.textContent = LINE1;
    const l2 = document.createElement("p");
    l2.className = "eggcount";
    l2.textContent = countText();
    card.appendChild(l1);
    card.appendChild(l2);
    panel.appendChild(card);

    card.addEventListener("click", function(e){ e.stopPropagation(); });
    panel.addEventListener("click", close);
    document.body.appendChild(panel);

    void panel.offsetWidth;
    panel.classList.add("on");

    if (!total && BASE){
      fetchTotal().then(function(){
        if (panel && !closing && total) l2.textContent = countText();
      });
    }

    document.addEventListener("keydown", onKey);
  }
  function onKey(e){ if (e.key === "Escape") close(); }
  function close(){
    if (!panel || closing) return;
    closing = true;
    document.removeEventListener("keydown", onKey);
    const p = panel;
    panel = null;
    p.classList.remove("on");

    let done = false;
    function drop(){
      if (done) return;
      done = true;
      if (p.parentNode) p.parentNode.removeChild(p);
    }
    p.addEventListener("transitionend", drop);
    setTimeout(drop, 600);
  }

  const logo = document.getElementById("logo");
  if (logo){
    let timer = null, sx = 0, sy = 0, moved = false;
    const HOLD_MS = 3000, TOL = 14;
    function begin(x, y){
      moved = false; sx = x; sy = y;
      clearTimeout(timer);
      timer = setTimeout(function(){ if (!moved) open(); }, HOLD_MS);
    }
    function trackMove(x, y){
      if (Math.abs(x - sx) > TOL || Math.abs(y - sy) > TOL){ moved = true; clearTimeout(timer); }
    }
    function cancel(){ clearTimeout(timer); }
    logo.addEventListener("touchstart", function(e){ const t = e.touches[0]; begin(t.clientX, t.clientY); }, {passive:true});
    logo.addEventListener("touchmove", function(e){ const t = e.touches[0]; trackMove(t.clientX, t.clientY); }, {passive:true});
    logo.addEventListener("touchend", cancel);
    logo.addEventListener("touchcancel", cancel);
    logo.addEventListener("mousedown", function(e){ begin(e.clientX, e.clientY); });
    logo.addEventListener("mousemove", function(e){ if (timer) trackMove(e.clientX, e.clientY); });
    logo.addEventListener("mouseup", cancel);
    logo.addEventListener("mouseleave", cancel);
    logo.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  }

  ping();
  fetchTotal();
})();
</script>
