<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>新竹出發多日遊｜挑一趟過夜的行程</title>
<meta name="description" content="從新竹出發、過一夜以上的行程：37 個景點與住宿，依基地、主題與時間篩選，可以直接排成一趟兩天一夜。">
<meta property="og:type" content="website">
<meta property="og:title" content="新竹出發多日遊｜挑一趟過夜的行程">
<meta property="og:description" content="以過夜基地為中心的景點與住宿地圖，挑完直接開 Google 地圖導航。">
<meta property="og:locale" content="zh_TW">
<meta property="og:url" content="https://tw101099.github.io/hsinchu-multiday-trips/">
<meta property="og:image" content="https://tw101099.github.io/hsinchu-multiday-trips/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://tw101099.github.io/hsinchu-multiday-trips/og-image.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%235c5449'/%3E%3Cpath d='M5 24h22L18.5 9.5l-4 6.5-3-4z' fill='none' stroke='%23faf9f7' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>

:root{
  --bg:#faf9f7; --panel:#ffffff; --sunk:#f2efe9;
  --ink:#1c1a17; --ink2:#6b645b; --ink3:#9a938a;
  --line:#e3ddd3; --line2:#cfc7ba;
  --accent:#5c5449; --accent-soft:#eae4d9; --on-accent:#ffffff;
  --warn:#9a5b17;

  --danger:#9c3b2c;
  --sb:#cfc7ba; --sb-hover:#a89f92;
  --r:10px; --barh:56px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131211; --panel:#1b1a18; --sunk:#232120;
    --ink:#efeae2; --ink2:#a29a8f; --ink3:#787066;
    --line:#332f2b; --line2:#454039;
    --accent:#bcb2a2; --accent-soft:#2c2822; --on-accent:#17150f;
    --warn:#e0a45c;
    --danger:#c17167;
    --sb:#4a443c; --sb-hover:#6a6157;
      }
}
:root[data-theme="dark"]{
    --bg:#131211; --panel:#1b1a18; --sunk:#232120;
    --ink:#efeae2; --ink2:#a29a8f; --ink3:#787066;
    --line:#332f2b; --line2:#454039;
    --accent:#bcb2a2; --accent-soft:#2c2822; --on-accent:#17150f;
    --warn:#e0a45c;
        --danger:#c17167;
    --sb:#4a443c; --sb-hover:#6a6157;
}
*{box-sizing:border-box; scrollbar-width:thin; scrollbar-color:var(--sb) transparent;
  -webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:11px; height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{
  background:var(--sb); border-radius:999px; border:3px solid transparent; background-clip:content-box;
}
::-webkit-scrollbar-thumb:hover{background:var(--sb-hover); background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}

html{height:100%; overflow:hidden; overscroll-behavior:none; touch-action:manipulation}
body{
  margin:0; height:100dvh; overflow:hidden; overscroll-behavior:none;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.6;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
  -webkit-user-select:none; user-select:none;
  touch-action:manipulation;
}
button{font:inherit; color:inherit; cursor:pointer}
.num{font-family:var(--mono); font-size:.92em; letter-spacing:-.01em}
.ic{width:14px; height:14px; flex:none; stroke:currentColor; fill:none; stroke-width:1.5;
    stroke-linecap:round; stroke-linejoin:round; vertical-align:-2px; margin-right:4px}

.app{display:flex; flex-direction:column; height:100dvh; overflow:hidden; padding-bottom:calc(var(--barh) + env(safe-area-inset-bottom))}

@media (display-mode:standalone) and (orientation:portrait){
  html, body, .app{ height:100vh; height:-webkit-fill-available; }
}
.bar{
  flex:none; display:flex; align-items:center; gap:10px;
  padding:max(8px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));
  background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap;
}
.logo{font-weight:700; white-space:nowrap}
.logo small{display:block; font-weight:400; font-size:11px; color:var(--ink3); letter-spacing:.06em}
.seg{display:flex; background:var(--sunk); border-radius:999px; padding:2px}
.seg button{border:0; background:none; padding:4px 13px; border-radius:999px; font-size:13px; color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--accent); color:var(--on-accent)}

#qwrap{

  flex:1 1 150px; max-width:250px; min-width:110px; padding:2px 9px 2px 6px;
  border-radius:999px; border:1px solid var(--line); background:var(--bg);
  display:flex; flex-wrap:nowrap; align-items:center; gap:3px; min-height:32px; cursor:text;
  overflow-x:auto; scrollbar-width:none;
}
#qwrap::-webkit-scrollbar{display:none}
#qwrap:hover{border-color:var(--accent)}
#qwrap:focus-within{outline:1px solid var(--accent); border-color:var(--accent)}
#q{
  flex:1 1 60px; min-width:50px; width:0; padding:3px 0 3px 6px; border:none; outline:none;
  background:transparent; color:var(--ink); font:inherit; font-size:16px;
}

.qtok{
  flex:none;   
  display:inline-flex; align-items:center; gap:4px; font-size:12px; line-height:1.7;
  padding:0 7px 0 9px; border-radius:999px; border:1px solid var(--accent);
  color:var(--accent); background:none; cursor:pointer; white-space:nowrap; font-family:inherit;
}
.qtok:hover{opacity:.7}
.qtok .x{font-size:14px; line-height:1; opacity:.8}
#theme{
  flex:none; border:1px solid var(--line2); background:var(--bg); border-radius:999px;
  padding:5px 9px; line-height:1; color:var(--ink2);
}
#theme:hover{border-color:var(--accent); color:var(--accent)}
#theme svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.6;
           stroke-linecap:round; stroke-linejoin:round; vertical-align:-2px}
.tally{margin-left:auto; font-size:12px; color:var(--ink3); white-space:nowrap}

@media (max-width:520px){
  .tally{display:none}

  #qwrap{flex:1 1 80px; min-width:80px; max-width:none}
}

.main{flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden}
.panel{
  background:var(--panel); border-top:1px solid var(--line);
  flex:0 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
.stage{position:relative; flex:1 1 auto; min-height:220px; background:var(--sunk)}
#map{position:absolute; inset:0}
.mapnote{
  position:absolute; left:10px; bottom:10px; z-index:500; display:none; max-width:calc(100% - 20px);
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:5px 10px; font-size:11.5px; color:var(--ink2); box-shadow:0 1px 6px rgba(0,0,0,.12);
}
.mapmsg{
  position:absolute; inset:0; display:none; flex-direction:column; justify-content:center;
  padding:26px; gap:8px; color:var(--ink2); font-size:13.5px; text-align:center;
}

.stage .leaflet-bottom{bottom:var(--tripup, 0px)}
.mapoverlay{
  position:absolute; left:10px; right:10px; z-index:600;

  bottom:calc(10px + var(--tripup, 0px));
  display:flex; flex-direction:column; align-items:flex-start; gap:8px; pointer-events:none;
}
.mapoverlay > *{pointer-events:auto}
.mapbtns{display:flex; flex-direction:column; align-items:flex-start; gap:6px; max-width:100%}
.mapbtns button{
  border:1px solid var(--line); background:var(--panel); color:var(--ink2);
  border-radius:999px; padding:5px 12px; font-size:12.5px; white-space:nowrap;
  box-shadow:0 1px 6px rgba(0,0,0,.18);
}
.mapbtns button:hover{border-color:var(--accent); color:var(--accent)}
.mapbtns button[aria-pressed=true]{background:var(--accent-soft); border-color:var(--accent); color:var(--ink); font-weight:600}

.leaflet-bar a.locbtn{display:flex; align-items:center; justify-content:center; cursor:pointer}

.locbtn svg{display:block; width:16px; height:16px; fill:none; stroke:currentColor;
            stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}

.mypin{
  width:22px !important; height:22px !important; margin:-11px 0 0 -11px !important;
  display:grid; place-items:center; border-radius:999px;
  background:#7B57A8; border:2.5px solid var(--panel); box-shadow:0 1px 5px rgba(0,0,0,.35);
}
:root[data-theme="dark"] .mypin{background:#B79BDB}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .mypin{background:#B79BDB} }
.mypin svg{display:block; width:12px; height:12px; stroke:var(--panel); fill:none;
           stroke-width:2; stroke-linecap:round; stroke-linejoin:round}

.leaflet-marker-icon.hubpin, .leaflet-marker-icon.mypin{display:grid}
.locbtn.on{color:#7B57A8}
:root[data-theme="dark"] .locbtn.on{color:#B79BDB}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .locbtn.on{color:#B79BDB} }
.loctip{
  position:absolute; left:50%; bottom:64px; transform:translateX(-50%);
  background:var(--panel); color:var(--ink); border:1px solid var(--line);
  border-radius:8px; padding:6px 12px; font-size:13px; z-index:1200;
  box-shadow:0 2px 10px rgba(0,0,0,.18); opacity:0; transition:opacity .25s;
  pointer-events:none; white-space:nowrap;
}
.loctip.show{opacity:1}

.totop{
  position:fixed; z-index:550;
  right:calc(16px + env(safe-area-inset-right));
  bottom:calc(var(--barh) + env(safe-area-inset-bottom) + 16px);
  width:40px; height:40px;
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--panel); border:1px solid var(--line2); color:var(--ink2);
  box-shadow:0 2px 10px rgba(0,0,0,.22); opacity:0; pointer-events:none;
  transition:opacity .15s, border-color .15s, color .15s;
}
.totop[hidden]{display:none}
.totop svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.totop:hover{border-color:var(--accent); color:var(--accent)}
.totop.show{opacity:1; pointer-events:auto}
.totop.docked{right:calc(100vw - 394px + env(safe-area-inset-right))}

.mapcard{
  display:none; align-self:stretch; background:var(--panel); border:1px solid var(--line2);
  border-radius:var(--r); box-shadow:0 2px 14px rgba(0,0,0,.22); padding:10px 12px;
}
.mapcard.on{display:block}
.mapcard .ttl{display:flex; align-items:flex-start; gap:8px}
.mapcard .ttl b{font-size:14px; font-weight:600; flex:1; min-width:0}
.mapcard .x{flex:none; border:0; background:none; color:var(--ink3); font-size:16px; line-height:1; padding:0 2px}
.mapcard .x:hover{color:var(--accent)}
.mapcard .sub{margin:3px 0 0; font-size:12px; color:var(--ink3)}
.mapcard .m{margin:5px 0 0; font-size:12px; color:var(--ink2); display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 10px}
.mapcard .acts{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px}
.mapcard .acts a, .mapcard .acts button{
  border:1px solid var(--line); background:var(--bg); color:var(--ink2); text-decoration:none;
  border-radius:999px; padding:3px 10px; font-size:12.5px; white-space:nowrap;
}
.mapcard .acts .primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}

.pinlbl{
  position:absolute; left:30px; top:50%; transform:translateY(-50%); white-space:nowrap;
  font-size:11.5px; color:var(--ink); background:var(--panel); border:1px solid var(--line);
  border-radius:4px; padding:1px 5px; box-shadow:0 1px 3px rgba(0,0,0,.16);
  cursor:pointer;   
}
.main.nomap .stage{display:none}

.main.nomap .panel{flex:1 1 auto}

@media (max-width:899px), (max-height:559px){
  .main:not(.nomap) .results,
  .main:not(.nomap) .legend,
  .main:not(.nomap) .foot,

  .main:not(.nomap) .tripbox,
  .main:not(.nomap) .baseview,
  .main:not(.nomap) .sec.toplevel{display:none}
  .main:not(.nomap) .stage{min-height:280px}
}

@media (min-width:900px) and (min-height:560px){
  .main{flex-direction:row}
  .panel{width:410px; flex:0 0 410px; border-top:0; border-right:1px solid var(--line)}
  .main.nomap .panel{width:auto; flex:1 1 auto}
}

.fbar{
  position:sticky; top:0; z-index:400; display:flex; align-items:center; gap:8px;
  padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line);
}
.fbtn{
  flex:none; border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent);
  border-radius:999px; padding:4px 12px; font-size:13px; white-space:nowrap; font-weight:600;
}
.fbtn[aria-expanded=true]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.chev{width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round;
      stroke-linejoin:round; margin-left:4px; vertical-align:-1px; transition:transform .15s}
.fbtn[aria-expanded=true] .chev{transform:rotate(180deg)}
.fsum{

  flex:1; min-width:0; font:inherit; font-size:13.5px; color:var(--ink2);
  overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; border:0; background:none; padding:2px 0; text-align:left;
}
.fsum:hover{color:var(--ink)}
.fsum b{color:var(--ink); font-weight:600}

.clear, .ghost, .trip .go a, .trip .go button{
  border:1px solid var(--line); background:var(--bg); color:var(--ink2);
  border-radius:999px; padding:3px 10px; font-size:12.5px; white-space:nowrap;
  text-decoration:none; font-family:inherit; line-height:1.5;
}
.clear:hover, .ghost:hover, .trip .go a:hover, .trip .go button:hover{border-color:var(--line2); color:var(--ink)}
.clear:hover{color:var(--accent)}
#sort{
  flex:none; border:1px solid var(--line); border-radius:999px; background:var(--bg); color:var(--ink2);
  font:inherit; font-size:12.5px; padding:3px 10px; max-width:120px;
}

.filters{padding:10px 14px 12px; border-bottom:1px solid var(--line)}
.frow{display:flex; align-items:flex-start; gap:9px; padding:4px 0}
.fkey{flex:none; width:52px; padding-top:4px; font-size:11.5px; color:var(--ink3); letter-spacing:.06em}
.chips{display:flex; flex-wrap:wrap; gap:5px; flex:1; min-width:0}
.chip{
  border:1px solid var(--line); background:var(--bg); border-radius:999px;
  padding:3px 10px; font-size:12.5px; color:var(--ink2); line-height:1.5;
  transition:border-color .15s, background .15s, color .15s;
}
.chip:hover{border-color:var(--line2); color:var(--ink)}

.chip[aria-pressed=true]{background:var(--accent-soft); border-color:var(--accent); color:var(--ink); font-weight:600}
.chip:disabled{opacity:.45; cursor:default; pointer-events:none}
.cnt{margin-left:5px; color:var(--ink3); font-size:11px}
.chip[aria-pressed=true] .cnt{color:var(--ink3)}
.sec{
  display:flex; align-items:center; gap:7px; width:100%; border:0; background:none;
  padding:9px 0 0; margin-top:11px; border-top:1px solid var(--line);
  font-size:12.5px; color:var(--ink2); text-align:left;
}
.sec:hover{color:var(--accent)}
.sec .n{color:var(--ink3); font-family:var(--mono)}

.sec .n .ic{width:13px; height:13px; vertical-align:-2px; margin-left:3px}

.sec.toplevel{padding-left:14px; padding-right:14px; border-top:0; margin-top:0}

.filters > .sec:first-child{border-top:0; margin-top:0; padding-top:2px}
.sec.toplevel[aria-expanded=false]{border-bottom:1px solid var(--line); padding-bottom:9px}
.sec .chev{margin-left:auto}
.sec[aria-expanded=true] .chev{transform:rotate(180deg)}
.subrows{margin-top:5px}
.rgroup{margin-top:6px}

.dirsec{border-top:0; margin-top:4px; padding-top:4px; font-size:12px}

.rgroup.first .dirsec{margin-top:0}
.dirsec::before{content:""; flex:none; width:8px; height:8px; border-radius:50%; background:var(--dc,var(--ink3))}
.dirsec .n{font-family:var(--mono)}
.rlist{margin-top:4px}
.rrow{
  display:flex; width:100%; align-items:center; gap:9px; padding:6px 8px; font-size:13px;
  border:1px solid transparent; border-radius:8px; background:none; text-align:left; color:var(--ink2);
}
.rrow:hover{background:var(--sunk); color:var(--ink)}
.rrow[aria-pressed=true]{background:var(--accent-soft); border-color:var(--accent); color:var(--ink); font-weight:600}

.rrow .rbar{flex:none; width:3px; height:17px; border-radius:2px}
.rrow .nm{flex:1; min-width:0}
.rrow .n{flex:none; font-size:11.5px; color:var(--ink3)}

.results{padding:2px 12px 20px}

.ghead{
  position:relative; display:flex; width:100%; align-items:center; gap:7px;
  margin:14px 0 6px; padding:6px 10px 6px 15px; border:0; border-radius:8px;
  border-bottom:1px solid var(--line); background:none; text-align:left; cursor:pointer;
  font:inherit; font-size:12px; color:var(--ink3); transition:background .12s;
}
.ghead:hover{background:var(--sunk)}
.ghead::before{
  content:""; position:absolute; left:0; top:8px; bottom:8px; width:3px;
  border-radius:2px; background:var(--dc,var(--ink3));
}
.ghead .gnm{
  flex:1; min-width:0; font-size:14px; font-weight:600; color:var(--ink);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.ghead .num{flex:none}
.ghead .chev{flex:none; width:12px; height:12px; color:var(--ink3); transition:transform .15s}
.ghead[aria-expanded=true] .chev{transform:rotate(180deg)}

.gintro{
  margin:0 0 8px; padding:10px 13px 11px; border-radius:8px; background:var(--sunk);
}
.gintro .gstyle{display:flex; flex-wrap:wrap; gap:5px; margin:0 0 8px}
.gintro .gchip{
  font-size:11px; padding:2px 8px; border-radius:999px; background:var(--panel);
  border:1px solid var(--line2); color:var(--ink2); white-space:nowrap;
}

.gintro .gdesc{
  font-size:13px; color:var(--ink2); line-height:1.65; margin:0 0 7px;
  -webkit-user-select:text; user-select:text;
}

.gintro .groads{font-size:11.5px; color:var(--ink3); line-height:1.5; margin:0}
.row{
  position:relative; display:flex; width:100%; text-align:left; gap:8px; align-items:flex-start;
  border:1px solid transparent; border-radius:var(--r); background:none; padding:7px 9px;
  transition:background .12s, border-color .12s;
}
.row:hover{background:var(--sunk)}
.row[aria-expanded=true]{background:var(--accent-soft); border-color:var(--accent)}
.row .rbody{flex:1; min-width:0}
.row .t{display:flex; gap:6px; align-items:center; font-size:14.5px; font-weight:600}

.row .m{font-size:12px; color:var(--ink2); margin-top:1px; display:flex; align-items:baseline; flex-wrap:wrap}
.row .off{color:var(--ink3); font-size:11px; border:1px dashed var(--line2); border-radius:999px; padding:0 6px}
.add{
  flex:none; align-self:center; border:1px solid var(--line2); background:var(--bg);
  width:26px; height:26px; border-radius:999px; font-size:14px; line-height:1;
  color:var(--ink3); padding:0;
}
.add:hover{border-color:var(--accent); color:var(--accent)}
.add[data-in=true]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}

.add[data-in=true]:hover{border-color:var(--accent); color:var(--on-accent)}
.tag{font-size:11px; padding:0 7px; border-radius:999px; border:1px solid var(--line2); color:var(--ink2); white-space:nowrap}
.tag.hard{border-color:var(--warn); color:var(--warn)}
.star{color:var(--accent); font-size:11px}
.empty{padding:26px 6px; color:var(--ink2); font-size:14px}
.empty button{border:0; background:none; color:var(--accent); text-decoration:underline; padding:0}

.main.nomap .results{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:0 14px; align-items:start}
.main.nomap .ghead, .main.nomap .gintro, .main.nomap .detail{grid-column:1/-1}

@media (min-width:700px){
  .main.nomap .detail{border-top:1px solid var(--accent); border-radius:var(--r); margin-top:6px}
}

.detail{
  border:1px solid var(--accent); border-top:0; border-radius:0 0 var(--r) var(--r);
  margin:-1px 9px 10px; padding:11px 13px 13px; background:var(--accent-soft);
}

吹風機與電熱毯，附設專屬停車場；全區禁止露營車宿。", "tags": ["需預約", "避暑", "展望", "夕陽", "夜景", "親子"], "sources": ["https://www.sheipa.com.tw/", "https://travel.hsinchu.gov.tw/"], "source": "https://www.sheipa.com.tw/", "drive": "離基地約 10 分", "stay_h": 0.5, "drive_min": 10, "total_h": 0.8, "season_months": [1, 2, 3, 7, 8, 10, 11, 12], "id": "pf6ff94ec"}, {"name": "雲山民宿", "lat": 24.5387187, "lng": 121.1263771, "town": "新竹縣五峰鄉", "base": "guanwu", "zone": "大鹿林道15K雲山帶", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "雲海季10月至翌年3月", "desc": "坐落於大鹿林道15公里處雲山部落，海拔約1,500公尺，為五峰通往觀霧途中重要之中繼宿點。主建築為原木景觀木屋，面向雪山山脈背側深谷，群山環抱，清晨與黃昏常可自陽台直接俯瞰翻騰雲海與落日晚霞。", "note": "雙人套房約2500–3200元、四人套房約3800–4800元（含中式早餐）；採電話預約訂房（03-5856188）；入住時間15:00、退房時間10:00；客房內無冷暖氣機，山區夜間低溫需自備保暖衣物；附設專屬停車場；全館禁菸且不收寵物入住木屋。", "tags": ["需預約", "避暑", "展望", "夕陽"], "sources": ["http://www.8898go.com/035856188", "https://travel.hsinchu.gov.tw/"], "source": "http://www.8898go.com/035856188", "drive": "離基地約 20 分", "stay_h": 0.5, "drive_min": 20, "total_h": 1.2, "season_months": [1, 2, 3, 10, 11, 12], "id": "p51530058"}, {"name": "榛山步道", "lat": 24.4958082, "lng": 121.1105954, "town": "苗栗縣泰安鄉", "base": "guanwu", "theme": "trail-mountain", "kind": "登山步道", "diff": "健行", "time": "環狀 4.13 公里（含聯絡道往返約 8 公里）、約 3.5–4 小時", "season": "杜鵑花季4月至5月", "desc": "自大鹿林道西線車行終點進入，環狀步道全長4.13公里，最高登頂海拔2,489公尺之榛山山頂。稜線觀景平台具備360度開闊全景視野，為眺望雪山山脈「聖稜線」（大霸尖山至雪山主峰）最壯闊完整的制高眺望點，春季沿途台灣杜鵑盛開。", "note": "全天開放（建議07:00–12:00前起登）；免門票；車輛需停放於觀霧山莊停車場，自山莊步行大鹿林道西線約2公里（約30分鐘）至步道入口；全程爬升約400公尺，後段枕木碎石階梯陡峭，需穿抓地登山鞋並攜帶足量飲水與登山杖。", "tags": ["展望", "避暑"], "sources": ["https://recreation.forest.gov.tw/Forest/RA?typ_id=0200004", "https://hiking.biji.co/index.php?q=trail&act=detail&id=238"], "source": "https://recreation.forest.gov.tw/Forest/RA?typ_id=0200004", "drive": "離基地約 5 分", "stay_h": 4.0, "drive_min": 5, "total_h": 4.2, "season_months": [4, 5], "id": "pcd6a678f"}, {"name": "檜山巨木群步道", "lat": 24.5025475, "lng": 121.1108886, "town": "苗栗縣泰安鄉", "base": "guanwu", "theme": "trail-mountain", "kind": "森林步道", "diff": "健行", "time": "單程 2.8 公里至巨木群折返、約 2.5–3 小時", "season": "", "desc": "原為日治時期大鹿林道運材台車舊鐵道，步道起點位於樂山林道1.2公里處，前2.8公里地勢平緩開闊，沿途柳杉林密布。步道深處群聚五株樹齡逾千年以上之紅檜神木，其中2號巨木胸圍達17.2公尺、樹高34公尺，為全台第七大巨木。", "note": "全天開放健行（建議07:00–14:00前進出）；免門票；步道口旁設有樂山林道1.2K小型停車場（約12輛小型車位）與流動廁所；往返巨木群約5.6公里需步行約3小時，過2.8K後為陡降連續木棧階梯較耗體力；山區常午後起霧降雨，需備雨具與登山杖。", "tags": ["巨木", "避暑", "展望"], "sources": ["https://recreation.forest.gov.tw/Forest/RA?typ_id=0200004", "https://hiking.biji.co/index.php?q=trail&act=detail&id=236"], "source": "https://recreation.forest.gov.tw/Forest/RA?typ_id=0200004", "drive": "離基地約 5 分", "stay_h": 3.0, "drive_min": 5, "total_h": 3.2, "season_months": [], "id": "pc20a2c68"}, {"name": "野馬瞰山", "lat": 24.5270111, "lng": 121.1154722, "town": "新竹縣五峰鄉", "base": "guanwu", "theme": "trail-mountain", "kind": "森林步道", "diff": "健行", "time": "環狀約 2 公里、約 1.5 小時", "season": "", "desc": "位於雪霸休閒農場上方之原始林山頭，海拔1,913公尺，山頂立有三等三角點編號6274。森林步道全程穿梭於高聳柳杉林與原生紅檜巨木林中，地面鋪滿厚實松針與落葉腐植層，觸感鬆軟彈性，環形一圈長約2公里。", "note": "全天開放（建議日間08:00–16:00行走）；非住客進入農場免收門票；車輛停放於雪霸休閒農場免費迎賓停車場；步道樹根盤錯濕滑，建議穿著防滑登山鞋；午後14:00起霧後能見度偏低，請沿著樹幹黃色數字反光指標行進勿偏離路徑。", "tags": ["避暑"], "sources": ["https://hiking.biji.co/index.php?q=trail&act=detail&id=472", "https://www.sheipa.com.tw/"], "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=472", "drive": "離基地約 10 分", "stay_h": 1.5, "drive_min": 10, "total_h": 1.8, "season_months": [], "id": "p42d15342"}, {"name": "觀霧山椒魚生態中心", "lat": 24.5066481, "lng": 121.1144437, "town": "苗栗縣泰安鄉", "base": "guanwu", "theme": "trail-near", "kind": "生態園區", "diff": "散步", "time": "約 40 分鐘", "season": "", "desc": "國內首座以冰河時期孑遺物種國寶「觀霧山椒魚」為主題之國家公園生態教育展示館。館內設有山椒魚棲地復育區、高山生態影音解說廳、霧林帶生態模型，展示觀霧特有種植物棣慕華鳳仙花及台灣檫樹復育成果。", "note": "開館時間 09:00–16:30（每週一休館，遇國定假日順延）；免門票自由參觀；每日上午10:00提供定時免費專人解說導覽；館旁設有觀霧國家森林遊樂區遊客中心專用大型免費停車場；館內設有飲水機與公廁。", "tags": ["雨天", "親子", "避暑"], "sources": ["https://www.spnp.gov.tw/cp.aspx?n=14573", "https://recreation.forest.gov.tw/Forest/RA?typ_id=0200004"], "source": "https://www.spnp.gov.tw/cp.aspx?n=14573", "drive": "離基地約 5 分", "stay_h": 0.67, "drive_min": 5, "total_h": 0.8, "season_months": [], "id": "padfb2867"}, {"name": "雲霧步道", "lat": 24.5064251, "lng": 121.1152613, "town": "苗栗縣泰安鄉", "base": "guanwu", "theme": "trail-near", "kind": "景觀步道", "diff": "散步", "time": "環狀 848 公尺、約 30–40 分鐘", "season": "", "desc": "起點位於觀霧山椒魚生態中心後方，全長848公尺之全平整高架環狀木棧道。沿途築有三處制高觀景平台，天氣晴朗時可180度清晰遠眺大霸尖山、小霸尖山、雪山主峰勾勒出之壯麗聖稜線連峰與榛山全貌。", "note": "全天開放；免門票；步道入口緊鄰遊客中心大停車場；環狀步行一圈約30–40分鐘，階梯數百階但坡度平緩好走；高海拔紫外線強烈需防曬；雨後木棧道邊緣偶有濕滑，行走需留心踏點。", "tags": ["展望", "避暑", "親子"], "sources": ["https://recreation.forest.gov.tw/Forest/RA?typ_id=0200004", "https://www.spnp.gov.tw/"], "source": "https://recreation.forest.gov.tw/Forest/RA?typ_id=0200004", "drive": "離基地約 5 分", "stay_h": 0.67, "drive_min": 5, "total_h": 0.8, "season_months": [], "id": "p8e2f6d3f"}, {"name": "清泉溫泉（將軍湯）", "lat": 24.573424, "lng": 121.1056151, "town": "新竹縣五峰鄉", "base": "guanwu", "theme": "water", "kind": "溫泉足湯", "diff": "開車", "time": "約 30 分鐘", "season": "", "desc": "日治時期稱為井上溫泉的天然弱鹼性碳酸氫鈉泉，泉溫約攝氏48度，水質清澈無色無臭。現規劃為戶外免費露天泡腳池，引天然溫泉水流經多階洗石子足湯水道，水深約30公分，可同時容納數十人泡腳放鬆。", "note": "全天24小時開放戶外露天足湯；免收門票自由入座；位於張學良文化園區吊橋旁，車輛停放於清泉第一停車場後步行約3分鐘抵達；出水口溫度較高入池前需先試溫，建議自備擦腳毛巾。", "tags": ["溫泉", "親子"], "sources": ["https://www.trimt-nsa.gov.tw/", "https://travel.hsinchu.gov.tw/"], "source": "https://www.trimt-nsa.gov.tw/", "drive": "離基地約 50 分", "stay_h": 0.5, "drive_min": 50, "total_h": 2.2, "season_months": [], "id": "p989b0709"}, {"name": "天送埤林鐵文創園區（太平山林鐵）", "lat": 24.6626851, "lng": 121.6193472, "town": "宜蘭縣三星鄉", "base": "sanxing-tiansongpi", "theme": "heritage", "kind": "林鐵車站", "diff": "散步", "time": "約 1–1.5 小時", "season": "", "desc": "建於 1921 年，為昔日羅東森林鐵路平原段重要之客貨轉運中繼站，也是全線唯一完整保存之日式木造車站。園區活化保留了檜木站房、轉車盤與火車迴轉軌道，現場設有復刻版五分車台車行駛體驗及林業歷史展示。", "note": "全天開放免費參觀外圍鐵道公園，搭乘復刻蒸氣小火車單趟每人 50 元；周邊緊鄰三星蔥油餅與味珍香卜肉等名店；附設大型免費停車場與洗手間。", "tags": ["看火車", "老宅", "親子", "中繼"], "sources": ["https://www.tsp-station.org/"], "source": "https://www.tsp-station.org/", "drive": "離基地約 5 分", "stay_h": 1.5, "drive_min": 5, "total_h": 1.7, "season_months": [], "id": "pb7474b8c"}, {"name": "天送幸福和苑", "lat": 24.6628368, "lng": 121.6184668, "town": "宜蘭縣三星鄉", "base": "sanxing-tiansongpi", "zone": "天送埤街區", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "座落於天送埤車站古蹟旁，為典雅風格之獨棟包棟式渡假民宿。環境鬧中取靜，庭院植栽雅緻，室內採和風無印設計與高品質寢具，提供廚房、客廳及專屬停車空間，適合成員眾多的家庭團體。", "note": "包棟平日約 18000–22000 元、假日約 24000–28000 元（可容納 10–14 人）；可透過官網或電話預訂；緊鄰歷史鐵道古蹟，全社區與園區嚴禁施放煙火；附設專屬停車位。", "tags": ["老宅", "親子"], "sources": ["https://www.tiansong-villa.com.tw/"], "source": "https://www.tiansong-villa.com.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p907b6a26"}, {"name": "星亮點Kayu露營區", "lat": 24.6780658, "lng": 121.6012158, "town": "宜蘭縣大同鄉", "base": "sanxing-tiansongpi", "zone": "崙埤台地", "theme": "lodging", "kind": "露營區", "diff": "開車", "time": "", "season": "", "desc": "座落於大同鄉崙埤村雪山山脈支脈台地上，海拔約 300 公尺。營區視野開闊無遮蔽，正面俯瞰蘭陽平原街景與龜山島海平線，設有自搭帳草地碎石營位、免搭帳狩獵帳以及沙坑、鞦韆等兒童遊憩設施。", "note": "自搭帳草地營位每帳約 1200–1500 元、狩獵帳雙人平日約 2800–3600 元；需透過官方網站線上預約系統預訂；水電衛浴齊備；通往營區之山區產業道路路幅較狹窄，會車需減速。", "tags": ["夜景", "展望", "親子"], "sources": ["https://www.kayucamp.com/"], "source": "https://www.kayucamp.com/", "drive": "離基地約 10 分", "stay_h": 0.5, "drive_min": 10, "total_h": 0.8, "season_months": [], "id": "kayu"}, {"name": "艾麗絲泉民宿", "lat": 24.6654898, "lng": 121.6243916, "town": "宜蘭縣三星鄉", "base": "sanxing-tiansongpi", "zone": "天送埤街區", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "座落於三星鄉天送埤老爺山莊別墅特區內，鄰近天送埤火車站約 900 公尺。別墅環境清幽開闊，周邊綠樹環繞、鳥語花香，提供雙人房、四人房以及整棟包棟住宿，附設景觀陽台與花園庭院。", "note": "雙人房平日約 2200–2800 元、假日約 3000–3800 元（含手作早餐）；可透過官網或電話預訂；山莊社區內道路寬敞，提供住客專屬免費停車位；全面室內禁菸。", "tags": ["親子"], "sources": ["https://www.alicesprings.com.tw/"], "source": "https://www.alicesprings.com.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p02c26081"}, {"name": "九寮溪自然步道", "lat": 24.6737613, "lng": 121.5995228, "town": "宜蘭縣大同鄉", "base": "sanxing-tiansongpi", "theme": "trail-near", "kind": "溪谷瀑布步道", "diff": "健行", "time": "往返約 2.5–3 小時", "season": "", "desc": "位於大同鄉崙埤村九寮溪生態園區內，步道沿九寮溪溪岸向山區深入，單程長度約 3 公里。沿途穿梭於亞熱帶茂密雨林與闊葉林，串聯崖躍吊橋、巴尬吊橋等特色繩索橋樑，步道終點為高約 30 公尺之戈霸瀑布。", "note": "由停車場至管制步道起點需先步行平緩水泥路約 1 公里（約 15 分鐘）；步道全線起伏平緩、多林蔭，林務局整理之木棧道與碎石路況良好；入口處設有大型收費停車場（小型車 50 元）與公廁。", "tags": ["瀑布", "玩水", "避暑", "親子"], "sources": ["https://recreation.forest.gov.tw/Trail/RT?tr_id=012"], "source": "https://recreation.forest.gov.tw/Trail/RT?tr_id=012", "drive": "離基地約 5 分", "stay_h": 3.0, "drive_min": 5, "total_h": 3.2, "season_months": [], "id": "p172ef995"}, {"name": "玉蘭茶園觀景臺", "lat": 24.6740321, "lng": 121.5846858, "town": "宜蘭縣大同鄉", "base": "songluo-yulan", "theme": "cafe", "kind": "茶園觀景", "diff": "開車", "time": "約 1–1.5 小時", "season": "", "desc": "座落於玉蘭休閒農業區最高處山丘，海拔約 500 公尺。觀景台設有木造涼亭與品茗座椅，視野遼闊無遮蔽，向東可俯瞰整片蘭陽平原與蜿蜒的蘭陽溪谷，周圍環繞梯田狀茶樹林。", "note": "現場提供茶具組與茶葉租借泡茶，亦販售茶燻蛋、茶香滷味與合菜；山頂道路較為狹窄，會車需禮讓；觀景台周邊附設免費小型停車場與公共洗手間。", "tags": ["展望", "夕陽", "中繼", "親子"], "sources": ["https://www.sunshin.org.tw/yulan/"], "source": "https://www.sunshin.org.tw/yulan/", "drive": "離基地約 10 分", "stay_h": 1.5, "drive_min": 10, "total_h": 1.8, "season_months": [], "id": "p86558ded"}, {"name": "牛鬥一角宜蘭露營區民宿", "lat": 24.6348816, "lng": 121.5684732, "town": "宜蘭縣三星鄉", "base": "songluo-yulan", "zone": "牛鬥農莊", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "位於牛鬥橋旁之蘭陽溪南岸台地，鄰近台7丙線終點。園區佔地廣闊，種植落羽松、果樹與大片平整草皮，提供獨棟小木屋套房以及寬敞的草地營位，具備完善的親子活動空間與農莊自然生態。", "note": "小木屋雙人房平日約 2500–3200 元、草地露營每帳約 1000 元；可透過官網或電話訂房；園區附設寬敞免費停車場；全區禁止施放煙火與喧鬧。", "tags": ["親子"], "sources": ["http://www.newdow.com.tw/"], "source": "http://www.newdow.com.tw/", "drive": "離基地約 15 分", "stay_h": 0.5, "drive_min": 15, "total_h": 1.0, "season_months": [], "id": "p5edd408e"}, {"name": "玉蘭茶園露營區", "lat": 24.67472, "lng": 121.584629, "town": "宜蘭縣大同鄉", "base": "songluo-yulan", "zone": "玉蘭茶園", "theme": "lodging", "kind": "露營區", "diff": "開車", "time": "", "season": "", "desc": "位於玉蘭茶園最高點茶樹間，為山坡景觀露營地。營位依茶園地形梯田式分佈，設有木造遮雨棚營位與碎石營位，走出帳篷即可俯瞰蘭陽溪流域與遠方平原夜景，清晨亦能迎接晨霧與日出。", "note": "一帳營位費用約 1000–1200 元；採電話或官方預約；水電與衛浴設備齊全，熱水 24 小時供應；山頂產業道路狹小，夜間開車上山需放慢車速。", "tags": ["夜景", "展望", "避暑"], "sources": ["https://ioutrave.weebly.com/yulanchayuanluyingcyu.html"], "source": "https://ioutrave.weebly.com/yulanchayuanluyingcyu.html", "drive": "離基地約 10 分", "stay_h": 0.5, "drive_min": 10, "total_h": 0.8, "season_months": [], "id": "p85e1004b"}, {"name": "逢春園渡假別墅", "lat": 24.6686883, "lng": 121.597991, "town": "宜蘭縣大同鄉", "base": "songluo-yulan", "zone": "玉蘭茶園", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "座落於玉蘭茶園半山腰，佔地千坪，為大同鄉歷史悠久的莊園民宿。園區擁有修剪整齊之開闊草坪與庭院造景，遠眺蘭陽溪河谷，提供雙人及四人景觀客房，主打在地茶香手作無菜單料理。", "note": "雙人房平日約 3400–4200 元、假日約 4000–5200 元（含精緻早餐）；訂房可透過官網或電話預訂；提供專屬戶外停車場；為維護住宿品質全面禁菸。", "tags": ["避暑"], "sources": ["https://fengchunvilla.com.tw/"], "source": "https://fengchunvilla.com.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p5f359fef"}, {"name": "松羅國家步道", "lat": 24.6687206, "lng": 121.5631729, "town": "宜蘭縣大同鄉", "base": "songluo-yulan", "theme": "trail-near", "kind": "溪谷步道", "diff": "散步", "time": "往返約 2 小時", "season": "", "desc": "沿著松羅溪開闢的林蔭步道，全長約 2 公里，早期為泰雅族獵徑。步道全程依傍溪流，沿途綠樹遮蔭、林相原始茂密，包含巨石溪澗、繩索吊橋與水域生態，水質清澈可見苦花魚悠游。", "note": "由管制鐵門至步道入口需先步行碎石產業道路約 1.5 公里（約 20 分鐘）；步道平緩好走，雨後部分路段濕滑；步道外側設有免費大型停車場與公廁。", "tags": ["避暑", "玩水", "親子"], "sources": ["https://hiking.biji.co/index.php?q=trail&act=detail&id=372"], "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=372", "drive": "離基地約 10 分", "stay_h": 2.0, "drive_min": 10, "total_h": 2.3, "season_months": [], "id": "p8c192901"}, {"name": "太平山林業鐵路_太平山站", "lat": 24.4927778, "lng": 121.535, "town": "宜蘭縣大同鄉", "base": "taipingshan", "theme": "heritage", "kind": "森林鐵道", "diff": "散步", "time": "車程加停留約 1.5–2 小時", "season": "", "desc": "太平山蹦蹦車起點站，海拔約 1,900 公尺，行駛於昔日太平山茂興線運材鐵道上。單程車程約 20 分鐘、長度 3 公里，以開放式黃色開放式台車行駛至茂興車站，下車後可銜接茂興懷舊步道主線與上下環線。", "note": "每日 07:00 於太平山莊站櫃檯現場開賣當日所有班次車票，無預售機制；行駛班次自 07:30 起每半小時或一小時一班，每班次限額 180 人，假日極易提早售罄；全票 180 元、優待票 120 元。位於太平山國家森林遊樂區內，需購票入園（票價與入園時間依林業署官方公告）。", "tags": ["看火車", "親子", "避暑"], "sources": ["https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2996&ctNode=229&mp=1"], "source": "https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2996&ctNode=229&mp=1", "drive": "離基地約 5 分", "stay_h": 2.0, "drive_min": 5, "total_h": 2.2, "season_months": [], "id": "pbfd51638"}, {"name": "太平山莊", "lat": 24.4922909, "lng": 121.5366036, "town": "宜蘭縣大同鄉", "base": "taipingshan", "zone": "太平山莊", "theme": "lodging", "kind": "山莊", "diff": "開車", "time": "", "season": "", "desc": "林業及自然保育署直營之高山旅宿，為太平山行政與遊客服務核心，海拔約 1,950 公尺。建築群隨山勢層疊而建，依木材樹種命名為紅檜館、香杉館、扁柏館、台灣杉館與肖楠館，附設餐廳、咖啡館與販賣部。", "note": "雙人房平日約 2800–3800 元、假日約 3500–4800 元（含早晚餐）；僅能透過林業保育署太平山訂房系統於入住日前 30 天上午 08:00 線上預訂；客房不提供一次性盥洗用品；山莊旁設有階梯停車場。", "tags": ["需預約", "避暑"], "sources": ["https://tpsr.forest.gov.tw/"], "source": "https://tpsr.forest.gov.tw/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p2893b7ef"}, {"name": "翠峰山屋", "lat": 24.5096438, "lng": 121.6105629, "town": "宜蘭縣大同鄉", "base": "taipingshan", "zone": "翠峰山屋", "theme": "lodging", "kind": "山屋", "diff": "開車", "time": "", "season": "", "desc": "座落於翠峰景觀道路 16.5 公里終點，海拔約 1,850 公尺，緊鄰翠峰湖環山步道與望洋山步道入口。山屋為兩層樓木造綠建築，提供二人房型與八人團體通鋪，是深山湖區唯一的過夜住宿設施。", "note": "二人房平日約 3000 元、假日約 3800 元（含早晚餐）；需透過太平山官方訂房系統於入住日前 30 天線上預訂；山區夜間採發電機限時供電（通常 22:00 熄燈）；不提供一次性備品與毛巾，附設小型停車場。", "tags": ["需預約", "避暑"], "sources": ["https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=3000&ctNode=272&mp=1"], "source": "https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=3000&ctNode=272&mp=1", "drive": "離基地約 95 分", "stay_h": 0.5, "drive_min": 95, "total_h": 3.7, "season_months": [], "id": "p414420d1"}, {"name": "太平山檜木原始林步道", "lat": 24.494218, "lng": 121.5349374, "town": "宜蘭縣大同鄉", "base": "taipingshan", "theme": "trail-mountain", "kind": "巨木步道", "diff": "健行", "time": "環狀一圈約 40–50 分鐘", "season": "", "desc": "步道入口位於太平山莊中央階梯頂端鎮安宮旁，海拔約 2,000 公尺，步道全長約 0.6 公里。全線為木棧道環狀動線，穿行於紅檜與台灣扁柏原生林中，沿途可見雙層林相、倒木樹抱石與二代木更新之自然林業生態。", "note": "步道坡度起伏平緩，但需先由太平山莊服務中心攀爬近 500 階紅葉步道階梯抵達入口；雨天木棧道表面濕滑，建議穿著防滑健行鞋與攜帶登山杖。位於太平山國家森林遊樂區內，需購票入園（票價與入園時間依林業署官方公告）。", "tags": ["巨木", "避暑"], "sources": ["https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2966&ctNode=281&mp=1"], "source": "https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2966&ctNode=281&mp=1", "drive": "離基地約 5 分", "stay_h": 0.83, "drive_min": 5, "total_h": 1.0, "season_months": [], "id": "p29d2058e"}, {"name": "望洋山步道", "lat": 24.5101954, "lng": 121.6090163, "town": "宜蘭縣大同鄉", "base": "taipingshan", "theme": "trail-mountain", "kind": "登山步道", "diff": "健行", "time": "往返約 1.5 小時", "season": "", "desc": "步道入口位於翠峰山屋旁，步道長度約 950 公尺，山頂觀景台海拔達 2,050 公尺。步道沿著望洋山稜線鋪設碎石階梯而上，登頂展望平台面朝東方蘭陽平原與太平洋，是翠峰湖區域清晨觀賞日出晨曦與翻騰雲海之核心制高點。", "note": "全線皆為上坡階梯，海拔落差約 180 公尺，清晨觀日出需自備頭燈照明；冬季或清晨氣溫偏低（常低於 10 度），需準備防風保暖衣物；步道起點鄰近翠峰山屋停車場。位於太平山國家森林遊樂區內，需購票入園（票價與入園時間依林業署官方公告）。", "tags": ["展望", "避暑"], "sources": ["https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2973&ctNode=289&mp=1"], "source": "https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2973&ctNode=289&mp=1", "drive": "離基地約 95 分", "stay_h": 1.5, "drive_min": 95, "total_h": 4.7, "season_months": [], "id": "pada633f2"}, {"name": "翠峰湖環山步道-東口", "lat": 24.5107709, "lng": 121.6086183, "town": "宜蘭縣大同鄉", "base": "taipingshan", "theme": "trail-mountain", "kind": "湖泊步道", "diff": "健行", "time": "觀景台折返約 40 分鐘，環湖全程約 2.5 小時", "season": "9月-11月", "desc": "步道圍繞高山湖泊翠峰湖（滿水期湖面面積約 25 公頃），海拔約 1,900 公尺。東口設有木造雙層觀湖平台，沿途鋪設碎石路與木棧道，林相包含奧氏虎皮楠、台灣杜鵑及檜木純林，中段設有寂靜山徑聆聽天然苔蘚音景。", "note": "步道全長 3.95 公里，自東口步行至第一觀湖平台約 300 公尺（約 10 分鐘，平緩好走）；若走完全程需原路折返或由西口（翠峰景觀道路 15.5K）踢產道回東口；東口設有專屬公廁與停車場。位於太平山國家森林遊樂區內，需購票入園（票價與入園時間依林業署官方公告）。", "tags": ["避暑", "展望"], "sources": ["https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2972&ctNode=288&mp=1"], "source": "https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2972&ctNode=288&mp=1", "drive": "離基地約 95 分", "stay_h": 2.5, "drive_min": 95, "total_h": 5.7, "season_months": [9, 10, 11], "id": "pa0543ab0"}, {"name": "見晴懷古步道", "lat": 24.5052473, "lng": 121.5256669, "town": "宜蘭縣大同鄉", "base": "taipingshan", "theme": "trail-mountain", "kind": "森林鐵道步道", "diff": "散步", "time": "往返約 1 小時", "season": "", "desc": "由早期見晴線運材鐵道修築而成，步道長度約 900 公尺，海拔約 1,890 公尺。沿途保留舊時木製鐵軌、枕木、轉轍器與兩座懸空高架鐵道遺跡，林間長年雲霧繚繞且覆蓋厚層苔蘚植物。", "note": "全線平緩好走，目前開放至 900 公尺處吊索橋折返；步道入口位於宜專1號 23.1 公里處，此處僅能停放機車與公務車，小型車需停放於 24.5 公里處之見晴停車場後步行人行專用道（約 1 公里、15 分鐘）至步道口。位於太平山國家森林遊樂區內，需購票入園（票價與入園時間依林業署官方公告）。", "tags": ["避暑", "展望", "親子"], "sources": ["https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2964&ctNode=280&mp=1"], "source": "https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2964&ctNode=280&mp=1", "drive": "離基地約 10 分", "stay_h": 1.0, "drive_min": 10, "total_h": 1.3, "season_months": [], "id": "p92073cf3"}, {"name": "白嶺巨木", "lat": 24.5308457, "lng": 121.5188185, "town": "宜蘭縣大同鄉", "base": "taipingshan", "theme": "trail-near", "kind": "巨木觀景點", "diff": "開車", "time": "約 15–20 分鐘", "season": "", "desc": "位於宜專1號 14.5 公里轉彎處，海拔 1,450 公尺，為太平山針闊葉林分水嶺。此株紅檜巨木樹齡推估超過 2,500 年，樹高約 30 公尺、胸圍 9.4 公尺，需約 6 人才能合抱，樹體頂端雖受雷擊斷裂，側枝依然繁茂旺盛。", "note": "此處位於道路彎道旁，路肩設有木棧觀景平台與解說牌；車位約僅能停靠 3–4 輛小型車，為短暫停歇拍照之中繼點，下車走動需留意轉彎會車。位於太平山國家森林遊樂區內，需購票入園（票價與入園時間依林業署官方公告）。", "tags": ["巨木", "中繼", "避暑"], "sources": ["https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2963&ctNode=279&mp=1"], "source": "https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2963&ctNode=279&mp=1", "drive": "離基地約 35 分", "stay_h": 0.33, "drive_min": 35, "total_h": 1.5, "season_months": [], "id": "pa08350db"}, {"name": "鳩之澤溫泉", "lat": 24.5453779, "lng": 121.5081831, "town": "宜蘭縣大同鄉", "base": "taipingshan", "theme": "water", "kind": "溫泉", "diff": "散步", "time": "約 1.5–2 小時", "season": "", "desc": "位於宜專1號 4.3 公里處多望溪谷，海拔約 520 公尺。泉質為弱鹼性碳酸氫鈉泉，溫泉水呈淡藍色清澈無硫磺味，設有露天溫泉SPA區、男女日式裸湯區、家庭湯屋以及利用地熱熱源的高溫煮蛋槽。", "note": "大眾SPA池與男女裸湯營業時間 09:00–19:00；溫泉煮蛋槽提供竹簍租借（押金 200 元、租金 20 元），現場販售雞蛋與玉米；設有專屬免費停車場與洗手間。位於太平山國家森林遊樂區內，需購票入園（票價與入園時間依林業署官方公告）。", "tags": ["溫泉", "玩水", "避暑", "親子"], "sources": ["https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2962&ctNode=277&mp=1"], "source": "https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2962&ctNode=277&mp=1", "drive": "離基地約 75 分", "stay_h": 2.0, "drive_min": 75, "total_h": 4.5, "season_months": [], "id": "p715753b1"}, {"name": "太平山林業鐵路土場車站 林鐵列車展示區", "lat": 24.5730009, "lng": 121.4964925, "town": "宜蘭縣大同鄉", "base": "yingshi-maoan", "theme": "heritage", "kind": "鐵道紀念園區", "diff": "散步", "time": "約 30–45 分鐘", "season": "", "desc": "位於台7甲線與宜專1號交會處之土場聚落，昔日為羅東森林鐵路平地段與山地索道交接的木材轉運站。現場保留重建之中興號柴油客車、羅東一號蒸汽火車頭以及載運檜木原木的鋼體平車，設有歷史照片解說廊道。", "note": "全天免費開放參觀，附設寬敞免費停車場與洗手間；緊鄰太平山國家森林遊樂區土場售票站，適合開車上山前或下山後短暫停留。", "tags": ["看火車", "中繼", "老宅", "親子"], "sources": ["https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2908&ctNode=275&mp=1"], "source": "https://tps.forest.gov.tw/TPSWeb/wSite/ct?xItem=2908&ctNode=275&mp=1", "drive": "離基地約 15 分", "stay_h": 0.75, "drive_min": 15, "total_h": 1.2, "season_months": [], "id": "pcad42792"}, {"name": "太平山—英仕山莊(太平山民宿)", "lat": 24.625918, "lng": 121.5410788, "town": "宜蘭縣大同鄉", "base": "yingshi-maoan", "zone": "英士部落", "theme": "lodging", "kind": "民宿", "diff": "開車", "time": "", "season": "", "desc": "座落於台7線旁之雪山山脈東側斜坡，距離土場收費站約 12 分鐘車程。山莊設有水力旋轉景觀餐廳、獨棟歐式小木屋與本館客房，同時提供草地露營營位，背山面谷可眺望蘭陽溪河床景色。", "note": "雙人房平日約 2600–3500 元、假日約 3600–4600 元；訂房可透過官網或電話預約；設有大型自家庭園停車場；旋轉餐廳下午茶為水力機械帶動之特色體驗。", "tags": ["親子", "避暑"], "sources": ["https://hotel.eztravel.com.tw/detail-yilan-7614-2229646/yingshih-guest-house/"], "source": "https://hotel.eztravel.com.tw/detail-yilan-7614-2229646/yingshih-guest-house/", "drive": "離基地約 5 分", "stay_h": 0.5, "drive_min": 5, "total_h": 0.7, "season_months": [], "id": "p0dbcf11b"}, {"name": "太平山旅居TaiPingShan Camper Van", "lat": 24.5387067, "lng": 121.4557843, "town": "宜蘭縣大同鄉", "base": "yingshi-maoan", "zone": "茂安部落", "theme": "lodging", "kind": "露營車", "diff": "開車", "time": "", "season": "", "desc": "位於台7甲線 11.5 公里處茂安部落溪谷旁，距離太平山土場管制站僅約 10 分鐘車程。園區依傍天然九芎林與落羽松，引進配備獨立冷暖空調與衛浴設備之豪華露營車，並設有戶外景觀桌椅與烤肉設施。", "note": "露營車雙人平日約 4300–4900 元、 function nearPool(st){
  const maxKm=NEAR_STEPS[NEAR_STEPS.length-1].km;
  return PLACES.filter(x=>x.id!==st.id && nkm(st,x)<=maxKm)
    .sort((a,b)=>nkm(st,a)-nkm(st,b));
}
function nearViewSet(){
  const stops=PLAN.map(id=>BY_ID[id]).filter(Boolean);
  const lim=NEAR_STEPS[Math.min(NEAR_LEVEL, NEAR_STEPS.length-1)].km;
  const out=new Set();
  stops.forEach(st=>{
    out.add(st.id);
    const road=NEAR[st.id];
    nearPool(st).forEach(x=>{
      if (out.has(x.id)) return;
      const r=road&&road[x.id];
      if (r && r.km<=lim) out.add(x.id);
    });
  });
  return out;
}

function primeNearData(){
  PLAN.map(id=>BY_ID[id]).filter(Boolean).forEach(st=>{
    if (!NEAR_DONE.has(st.id)) fetchNear(st, nearPool(st));
  });
}
function primeNearView(){ if (NEAR_VIEW) primeNearData(); }

function nearestStop(p){
  let best=null;
  PLAN.map(id=>BY_ID[id]).filter(Boolean).forEach(st=>{
    if (st.id===p.id) return;
    const r=NEAR[st.id] && NEAR[st.id][p.id];
    if (r && (!best || r.km<best.km)) best={stop:st, km:r.km, min:r.min, real:true};
  });
  return best;
}

function readHash(){
  const h=(location.hash||"").replace(/^#/,"");
  if (!h) return;
  const q={};
  h.split("&").forEach(kv=>{ const i=kv.indexOf("="); if (i>0) q[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1)); });
  if (q.plan){
    const ids=q.plan.split(",").filter(id=>BY_ID[id]);
    if (ids.length){ PLAN=ids; TRIP_OPEN=true; S.open=false; }
  }
  if (/^\d{1,2}:\d{2}$/.test(q.start||"")){
    const [hh,mm]=q.start.split(":").map(Number);
    START=(hh||0)*60+(mm||0);
  }
}

function passExcept(p, skip){
  if (NEAR_SET && !NEAR_SET.has(p.id)) return false;
  if (skip!=="base" && S.base.size && !S.base.has(p.base)) return false;
  if (skip!=="themes" && S.themes.size && !S.themes.has(p.theme)) return false;
  if (skip!=="diffs" && S.diffs.size && !S.diffs.has(p.diff)) return false;
  if (skip!=="budget" && S.budget.size && !S.budget.has(bud(p))) return false;
  if (skip!=="mine" && S.mine==="yes" && !p.in_user_list) return false;
  if (skip!=="mine" && S.mine==="no" && p.in_user_list) return false;
  if (skip!=="inseason" && S.inseason && !months(p).includes(MONTH)) return false;
  if (S.q || S.qtags.length){
    const hay=(p.name+p.town+p.desc+p.note+p.season+p.kind+(p.tags||[]).join("")).toLowerCase();
    if (S.q && !termHit(p, hay, S.q)) return false;
    for (const t of S.qtags) if (!termHit(p, hay, t)) return false;
  }
  return true;
}
const pass = p => passExcept(p, null);
const shown = () => {
  const list = PLACES.filter(pass);
  const ids = new Set(list.map(p=>p.id));
  EXTRA.forEach(id=>{ if (BY_ID[id] && !ids.has(id)) list.push(BY_ID[id]); });
  return list;
};
const anyFilter = () => !!(S.base.size||S.themes.size||S.diffs.size||S.budget.size||S.mine||S.inseason||S.q||S.qtags.length||NEAR_VIEW);
const moreOn = () => S.moreOpen;

const RAD = Math.PI/180;
function km(a,b){
  const dLat=(b.lat-a.lat)*RAD, dLng=(b.lng-a.lng)*RAD, la=(a.lat+b.lat)/2*RAD;
  return Math.hypot(dLat, dLng*Math.cos(la))*6371;
}

const rc = p => (p.nav ? p.nav[1]+","+p.nav[0] : p.lng+","+p.lat);
const navpt = p => (p.nav ? {lat:p.nav[0], lng:p.nav[1]} : p);
const nkm = (a,b) => km(navpt(a), navpt(b));

function legEstimate(a,b){
  const d=nkm(a,b)*1.5;
  return {km:d, min:Math.round(d/45*60), real:false};
}

function legOf(a,b){
  const r=neighGet(a.id||"HOME", b.id||"HOME");
  return r ? {km:r.km, min:r.min, real:true} : legEstimate(a,b);
}

const NEAR={}, NEAR_DONE=new Set();

let NEIGH_TRI=null;
try{
  if (NEIGH_B64){
    const bin=atob(NEIGH_B64);
    const buf=new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
    NEIGH_TRI=new Uint16Array(buf.buffer);
  }
}catch(e){ NEIGH_TRI=null; }
const IDX_OF={}; PLACES.forEach((p,i)=>{ IDX_OF[p.id]=i; });
function neighGet(aid,bid){
  if (aid===bid) return null;
  if (aid==="HOME" || bid==="HOME"){
    const i=IDX_OF[aid==="HOME"?bid:aid];
    const h=(i!=null) && (NEIGH_ORIG.__HOME__||[])[i];
    return (h && h[0]!==65535) ? {km:h[0]/10, min:h[1]} : null;
  }
  if (!NEIGH_TRI) return null;
  let ia=IDX_OF[aid], ib=IDX_OF[bid];
  if (ia==null || ib==null) return null;
  if (ia>ib){ const t=ia; ia=ib; ib=t; }
  const n=PLACES.length;
  const k=(ia*(2*n-ia-1)/2 + (ib-ia-1))*2;   // 上三角列序的格位
  const km10=NEIGH_TRI[k];
  return km10===65535 ? null : {km:km10/10, min:NEIGH_TRI[k+1]};
}
function fetchNear(p, pool){
  if (NEAR_DONE.has(p.id) || !pool.length) return;
  const m=NEAR[p.id]||(NEAR[p.id]={});
  pool.forEach(x=>{ if (!(x.id in m)) m[x.id]=neighGet(p.id,x.id); });
  NEAR_DONE.add(p.id);
}

function originDist(oid, p){
  const row=NEIGH_ORIG[oid];
  if (!row) return null;
  const i=IDX_OF[p.id];
  if (i==null) return null;
  const v=row[i];
  return (v && v[0]!==65535) ? {km:v[0]/10, min:v[1]} : null;
}

const esc = s => (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fmt(min){
  const m=((Math.round(min)%1440)+1440)%1440;
  return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
}

function legText(min, km, real){
  return km!=null ? `${real?"":"約 "}${min} 分 · ${km.toFixed(1)} km` : `${min} 分`;
}

let engine=null, map=null, marks={}, lines=null, pts=null, ready=false, zoom=11;
const ICON_ZOOM = 14;

function note(html){
  const el=document.getElementById("mapnote");
  if (!html){ el.style.display="none"; return; }
  el.style.display="block"; el.innerHTML=html;
}
function loadOSM(why){
  if (engine) return;
  engine="loading";
  const css=document.createElement("link");
  css.rel="stylesheet"; css.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
  document.head.appendChild(css);
  const js=document.createElement("script");
  js.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";

    m.style.display="flex";
    m.textContent="底圖載不進來，可能是沒連網。切到「清單」，內容一樣看得到。";
  };
  document.head.appendChild(js);
}
function initOSM(why){
  engine="osm";
  map=L.map("map",{zoomControl:true}).setView([24.76,121.06],11);

  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
              {maxZoom:18,

                           'target="_blank" rel="noopener">OpenStreetMap</a> contributors' +
                           ' · <a href="https://opendatacommons.org/licenses/odbl/" ' +
                           'target="_blank" rel="noopener">ODbL</a>'}).addTo(map);

    html:'<svg viewBox="0 0 16 16"><path d="M2.5 8.5 8 3l5.5 5.5M4 7v6h8V7"/></svg>'})})
    .bindTooltip(HOME.name,{direction:"top",offset:[0,-11],className:"tt",opacity:1})
    .addTo(map);
  zoom=map.getZoom();
  addLocateControl();
  map.on("click", ()=>{ if (S.sel){ S.sel=null; render(); } });
  map.on("zoomend", ()=>{

function draw(){
  if (!ready) return;
  const list=shown().slice();
  const ids=new Set(list.map(p=>p.id));
  if (S.sel && BY_ID[S.sel] && !ids.has(S.sel)){ list.push(BY_ID[S.sel]); ids.add(S.sel); }
  PLAN.forEach(id=>{ const p=BY_ID[id]; if (p && !ids.has(id)){ list.push(p); ids.add(id); } });

  if (engine==="osm"){
    lines.clearLayers(); pts.clearLayers(); marks={};
    drawLegs();
    const asIcon = zoom >= ICON_ZOOM;
    const planNo={}; PLAN.forEach((id,i)=>{ planNo[id]=i+1; });
    list.forEach(p=>{
      const on=p.id===S.sel;
      const n=planNo[p.id];
      let m;
      if (n){
        m = asIcon
          ? L.marker([p.lat,p.lng], {icon:L.divIcon({className:"", html:planPinHTML(p,n), iconSize:[26,26]}),
                                     zIndexOffset:1000})
          : L.marker([p.lat,p.lng], {icon:L.divIcon({className:"", html:planDotHTML(p,n), iconSize:[20,20]}),
                                     zIndexOffset:1000});
      } else if (asIcon){
        m = L.marker([p.lat,p.lng], {icon:L.divIcon({className:"", html:markerHTML(p), iconSize:[26,26]}),
                                     zIndexOffset:on?900:0});
      } else if (p.theme==="lodging"){
        m = L.marker([p.lat,p.lng], {
          icon:L.divIcon({className:"lodgemk"+(on?" on":""), iconSize:[18,18], iconAnchor:[9,9],
                          html:`<span class="ld" style="background:${(TH[p.theme]||{}).color||"#888"}"></span>`}),
          zIndexOffset:on?900:0});
      } else {
        m = L.circleMarker([p.lat,p.lng],{radius:on?9:5.5, color:"#fff", weight:on?2.5:1.2,
                                          fillColor:(TH[p.theme]||{}).color||"#888", fillOpacity:1,
                                          bubblingMouseEvents:false});
      }
      m.addTo(pts);
      m.bindTooltip(tipHTML(p), {direction:"top", offset:[0,asIcon?-14:-8], className:"tt", opacity:1});
      m.on("mouseover", ()=>highlightRow(p.id,true));
      m.on("mouseout", ()=>highlightRow(p.id,false));
      m.on("click", ()=>select(p.id));
      marks[p.id]=m;
    });
    if (S.sel && marks[S.sel] && marks[S.sel].bringToFront) marks[S.sel].bringToFront();
    PLAN.forEach(id=>{ const m=marks[id]; if (m && m.bringToFront) m.bringToFront(); });
    drawBasePins();
  }
}

function drawLegs(){
  const days=tripLegs();
  if (!days) return;
  const casing = DARK ? "#000000" : "#ffffff";
  days.forEach((d,i)=>{
    const c=dayColor(i);
    (d.legs||[]).forEach(lg=>{
      if (!lg.coords || lg.coords.length<2) return;
      L.polyline(lg.coords, {color:casing, weight:8, opacity:.5, lineJoin:"round",
                             lineCap:"round", interactive:false}).addTo(lines);
      L.polyline(lg.coords, {color:c, weight:4.5, opacity:.95, lineJoin:"round", lineCap:"round"})
        .bindTooltip(`<b>Day ${i+1}</b><i>${esc(lg.from_name)} → ${esc(lg.to_name)}　` +
                     `${Math.round(lg.min)} 分 · ${lg.km.toFixed(1)} km</i>`,
                     {sticky:true, className:"tt", opacity:1})
        .addTo(lines);
    });
  });
}

function drawBasePins(){
  BASES.forEach(b=>{
    if (!b.anchor) return;
    const m=L.marker(b.anchor, {
      icon:L.divIcon({className:"basepin"+(BASE_SEL===b.id?" on":""), iconSize:[26,26], iconAnchor:[13,13],
        html:`<span class="bp" style="background:${b.color||"#888"}">` +
             `<svg viewBox="0 0 16 16"><path d="M2.5 8.5 8 3l5.5 5.5M4 7v6h8V7"/></svg></span>`}),
      zIndexOffset:1500});
    m.bindTooltip(`<b>${esc(b.name)}</b><i>${esc(b.town||"")}` +
                  (b.drive_min!=null?`　離新竹約 ${b.drive_min} 分`:"") + `</i>`,
                  {direction:"top", offset:[0,-14], className:"tt", opacity:1});
    m.on("click", ()=>selectBase(b.id));
    m.addTo(pts);
    if (BASE_SEL===b.id) zonesOf(b).forEach(z=>{
      const on=ZONE_SEL===z.name;
      const zm=L.marker([z.anchor.lat, z.anchor.lng], {
        icon:L.divIcon({className:"zonepin"+(on?" on":""), iconSize:[14,14], iconAnchor:[7,7],
                        html:`<span class="zp" style="background:${b.color||"#888"}"></span>`}),
        zIndexOffset:1400});
      zm.bindTooltip(`<b>${esc(z.name)}</b>` + (z.note?`<i>${esc(z.note)}</i>`:""),
                     {direction:"top", offset:[0,-8], className:"tt", opacity:1});

function panTo(p){

function toggleBaseView(){
  if (BASE_VIEW){
    BASE_VIEW=false; S.base=new Set();
  } else {
    BASE_VIEW=true; NEAR_VIEW=false; NEAR_LEVEL=0;   // 兩種檢視互斥
    S.themes=new Set(); S.diffs=new Set(); S.budget=new Set();
    S.inseason=false; S.mine=null; resetQ();
    S.base=planBaseSet();
    S.listOpen=true; SCROLL_GROUP=true;
    if (!isMapOnly()){ S.open=true; S.basesOpen=true; }
    fit(PLACES.filter(p=>S.base.has(p.base)));
  }
  S.sel=null; EXTRA=new Set(); save(); render();
}
function cycleNearView(){
  if (NEAR_VIEW && NEAR_LEVEL < NEAR_STEPS.length-1){
    NEAR_LEVEL++;                       // 放寬一級
  } else if (NEAR_VIEW){
    NEAR_VIEW=false; NEAR_LEVEL=0;      // 已在最寬，再按就取消
  } else {
    NEAR_VIEW=true; NEAR_LEVEL=0; BASE_VIEW=false;
    S.base=new Set(); S.themes=new Set(); S.diffs=new Set(); S.budget=new Set();
    S.inseason=false; S.mine=null; resetQ();
    S.listOpen=true; SCROLL_RESET=true;
  }
  primeNearView();
  S.sel=null; EXTRA=new Set(); save(); render();
}

function emphasize(id,on){
  const m=marks[id];
  if (!m) return;
  if (!m.setStyle){
    const el = m.getElement && m.getElement();
    if (el) el.classList.toggle("hot", !!on);
    if (m.setZIndexOffset) m.setZIndexOffset(on ? 1200 : 1000);
    return;
  }
  const sel=id===S.sel;
  m.setStyle({radius: on?8.5:(sel?9:5.5), weight: on?2.5:(sel?2.5:1.2)});
  if (on && m.bringToFront) m.bringToFront();
}

const inPlan = id => PLAN.includes(id);
const stayOf = p => (STAY[p.id]==null ? p.stay_h : STAY[p.id]);
function stayLabel(h){
  const m=Math.round(h*60);
  if (m<60) return `停 ${m} 分`;
  return m%60 ? `停 ${Math.floor(m/60)} 小時 ${m%60} 分` : `停 ${m/60} 小時`;
}
function adjustStay(p, delta){
  STAY[p.id]=Math.max(0.25, Math.round((stayOf(p)+delta)*4)/4);
  save(); renderTrip();
}
function togglePlan(id){
  const i=PLAN.indexOf(id);
  if (i<0){ PLAN.push(id); TRIP_OPEN=true; } else PLAN.splice(i,1);
  syncBaseView(); syncNearView();   // 兩種檢視都以行程為前提，行程一動就重算
  save(); render();
}
function movePlan(i, dir){
  const j=i+dir;
  if (j<0 || j>=PLAN.length) return;
  const t=PLAN[i]; PLAN[i]=PLAN[j]; PLAN[j]=t;
  save(); render();
}
function optimizePlan(){
  const ps=PLAN.map(id=>BY_ID[id]).filter(Boolean);
  if (ps.length<3) return;
  const rest=ps.slice(), order=[];
  let cur=HOME;
  while (rest.length){
    let bi=0, bd=Infinity;
    rest.forEach((p,i)=>{ const d=km(cur,p); if (d<bd){ bd=d; bi=i; } });
    cur=rest[bi]; order.push(rest.splice(bi,1)[0]);
  }
  PLAN=order.map(p=>p.id);
  save(); render();
}
function schedule(){
  const ps=PLAN.map(id=>BY_ID[id]).filter(Boolean);
  if (!ps.length) return null;
  let t=START, stayTotal=0, driveTotal=0;
  const items=ps.map((p,i)=>{
    let legMin, legKm, legReal;
    if (i===0){
      const home=neighGet("HOME", p.id);
      legMin=p.drive_min;
      if (home){ legKm=home.km; legReal=true; }
    } else {
      const lg=legOf(ps[i-1],p);
      legMin=lg.min; legKm=lg.km; legReal=lg.real;
    }
    driveTotal += legMin;
    const arrive=t+legMin, stay=stayOf(p), leave=arrive+stay*60;
    t=leave; stayTotal+=stay;
    return {p, n:i+1,
      leg: legText(legMin, legKm, legReal),
      win: `${fmt(arrive)}–${fmt(leave)}`,
      stay: stayLabel(stay),
      warn: (months(p).length && !months(p).includes(MONTH)) ? "這季節不是它最好的時候" : ""};
  });
  const last=ps[ps.length-1];
  const homeBack=neighGet("HOME", last.id);   // 同上：分鐘照策展值，公里數才取表值
  const back = last.drive_min;
  const backKm = homeBack ? homeBack.km : null;
  const backReal = !!homeBack;
  driveTotal+=back;
  return {ps, items, back, backKm, backReal, backTime:t+back, stay:Math.round(stayTotal*10)/10,
          driveTotal, total:Math.round(((t+back)-START)/6)/10};
}
function planURL(){
  const ps=PLAN.map(id=>BY_ID[id]).filter(Boolean);
  if (!ps.length) return "#";
  const last=ps[ps.length-1];
  const way=ps.slice(0,-1).map(gnav).join("|"); // 途經點也是要「開到得了」，跟單點導航同一套規則
  return "https://www.google.com/maps/dir/?api=1&travelmode=driving" +
    "&origin=" + encodeURIComponent(HOME.name) +
    "&destination=" + encodeURIComponent(gnav(last)) +
    (way ? "&waypoints=" + encodeURIComponent(way) : "");
}

function syncTripUp(){
  const el=document.getElementById("trip");
  if (!el) return;
  const h=el.getBoundingClientRect().height;
  const head=el.querySelector(".head");
  const pad=parseFloat(getComputedStyle(el).paddingBottom)||0;
  const base=(head? head.getBoundingClientRect().height : 0)+pad;
  document.documentElement.style.setProperty("--tripup", Math.max(0, h-base)+"px");
}

function alignLeadColumn(root){
  root.classList.remove("stacked");
  root.style.removeProperty("--leadw");
  const leads=root.querySelectorAll(".stop .lead");
  if (!leads.length) return;
  let max=0;
  leads.forEach(l=>{ max=Math.max(max, l.getBoundingClientRect().width); });
  if (!max) return;   // 面板收合中量到的都是 0（display:none），維持原狀，等展開再量
  const opsEl=root.querySelector(".stop .ops");
  const opsW = opsEl ? opsEl.getBoundingClientRect().width : 100;
  const avail = root.getBoundingClientRect().width || innerWidth;
  const META_MIN = 130;   // 中間欄（時間窗＋停留）擠到這個寬度以下就不好讀了
  const needed = max + 10 + META_MIN + 10 + opsW;
  if (needed > avail) root.classList.add("stacked");
  else root.style.setProperty("--leadw", Math.ceil(max)+"px");
}

function wireStopGestures(wrap, stop, grip, id){
  grip.addEventListener("pointerdown", e=>{
    if (e.pointerType==="mouse" && e.button!==0) return;
    e.preventDefault();
    startDrag(id, wrap, e);
  });
  wrap.addEventListener("contextmenu", e=>{ if (wrap.classList.contains("dragging")) e.preventDefault(); });

  wrap.addEventListener("pointerdown", e=>{
    if (e.target.closest("button, .grip, a")) return;
    if (e.pointerType==="mouse" && e.button!==0) return;
    GESTURE = { id, wrap, stop, startX:e.clientX, startY:e.clientY,
                pointerId:e.pointerId, mouse:e.pointerType==="mouse", dir:null, dx:0, thresh:SWIPE_DELETE_PX };
    if (e.pointerType!=="mouse"){
      clearTimeout(PRESS_TIMER);
      const pe=e;
      PRESS_TIMER=setTimeout(()=>{
        if (!GESTURE || GESTURE.id!==id || GESTURE.pointerId!==pe.pointerId || GESTURE.dir!=null) return;
        GESTURE=null;
        startDrag(id, wrap, pe);
      }, 400);
    }
  });
  wrap.addEventListener("pointermove", e=>{
    if (!GESTURE || GESTURE.id!==id || e.pointerId!==GESTURE.pointerId) return;
    const dx=e.clientX-GESTURE.startX, dy=e.clientY-GESTURE.startY;
    if (GESTURE.dir==null){
      if (Math.abs(dx)<8 && Math.abs(dy)<8) return;
      clearTimeout(PRESS_TIMER);   // 位移已經超過長按門檻，不會再是長按
      if (GESTURE.mouse && Math.abs(dy)>=Math.abs(dx)){
        const ev=e; GESTURE=null;
        startDrag(id, wrap, ev);
        return;
      }
      if (Math.abs(dx)>Math.abs(dy)){
        GESTURE.dir="h";
        try{ wrap.setPointerCapture(e.pointerId); }catch(_){}   // 極少數情況（如合成事件）沒有 active pointer 可抓，抓不到就算了，不影響橫滑本身
        wrap.classList.add("swiping");
      } else { GESTURE=null; return; }   // 觸控縱向：放手，讓原生捲頁接手
    }
    if (GESTURE.dir!=="h") return;
    e.preventDefault();
    const clamped=Math.min(0, dx);
    stop.style.transform=`translateX(${clamped}px)`;
    GESTURE.dx=clamped;
    GESTURE.thresh=Math.min(SWIPE_DELETE_PX, wrap.getBoundingClientRect().width*0.35);
    wrap.classList.toggle("del-armed", -clamped>GESTURE.thresh);
  });
  const endSwipe=()=>{
    clearTimeout(PRESS_TIMER);
    if (!GESTURE || GESTURE.id!==id) return;
    if (GESTURE.dir==="h"){
      const commit = -GESTURE.dx > GESTURE.thresh;
      wrap.classList.remove("swiping","del-armed");
      if (commit){
        if (!RM.matches){
          stop.style.transition="transform .16s ease";
          stop.style.transform=`translateX(-${wrap.getBoundingClientRect().width}px)`;
        }
        setTimeout(()=>togglePlan(id), RM.matches?0:150);
      } else {
        if (!RM.matches) stop.style.transition="transform .16s ease";
        stop.style.transform="translateX(0)";
        setTimeout(()=>{ stop.style.transition=""; }, 180);
      }
    }
    GESTURE=null;
  };
  wrap.addEventListener("pointerup", endSwipe);
  wrap.addEventListener("pointercancel", endSwipe);
}

function clearDragIndicators(){
  document.querySelectorAll(".stopwrap.drag-over-top,.stopwrap.drag-over-bottom")
    .forEach(el=>el.classList.remove("drag-over-top","drag-over-bottom"));
}
function markDragOver(id,pos){
  const el=document.querySelector(`.stopwrap[data-id="${id}"]`);
  if (el) el.classList.add(pos==="top"?"drag-over-top":"drag-over-bottom");
}
function startDrag(id, wrap, e){
  const startIndex=PLAN.indexOf(id);
  if (startIndex<0) return;
  const rows=Array.from(document.querySelectorAll("#trip .stopwrap")).map(r=>{
    const rc=r.getBoundingClientRect();
    return {id:r.dataset.id, top:rc.top, h:rc.height};
  });
  DRAG={id, startY:e.clientY, startIndex, targetIndex:startIndex, pointerId:e.pointerId, rows};
  wrap.classList.add("dragging");
  const move=ev=>{
    if (!DRAG || ev.pointerId!==DRAG.pointerId) return;
    ev.preventDefault();
    wrap.style.transform=`translateY(${ev.clientY-DRAG.startY}px)`;
    const others=DRAG.rows.filter(r=>r.id!==id);
    let count=0;
    others.forEach(r=>{ if (ev.clientY > r.top + r.h/2) count++; });
    DRAG.targetIndex=count;
    clearDragIndicators();
    if (count<others.length) markDragOver(others[count].id,"top");
    else if (others.length) markDragOver(others[others.length-1].id,"bottom");
  };
  const up=ev=>{
    if (!DRAG || ev.pointerId!==DRAG.pointerId) return;
    document.removeEventListener("pointermove",move);
    document.removeEventListener("pointerup",up);
    document.removeEventListener("pointercancel",up);
    clearDragIndicators();
    wrap.classList.remove("dragging");
    const {startIndex:si, targetIndex:ti}=DRAG;
    DRAG=null;
    if (ti!==si){
      const arr=PLAN.slice(); arr.splice(si,1); arr.splice(ti,0,id);
      PLAN=arr; save(); render();
    } else {
      if (!RM.matches) wrap.style.transition="transform .14s ease";
      wrap.style.transform="translateY(0)";
      setTimeout(()=>{ wrap.style.transition=""; }, 160);
    }
  };
  document.addEventListener("pointermove",move);
  document.addEventListener("pointerup",up);
  document.addEventListener("pointercancel",up);
}

function chip(label,on,fn,color,theme){

const NEAR_STEPS = [{km:10,n:5},{km:20,n:8},{km:30,n:10},{km:40,n:12}];

function pickNearby(list, n){
  const groups=new Map();
  list.forEach(o=>{ if(!groups.has(o.x.theme)) groups.set(o.x.theme,[]); groups.get(o.x.theme).push(o); });
  groups.forEach(g=>g.sort((a,b)=>a.d-b.d));
  const picked=[];
  const gOld=groups.get("oldstreet");
  if (gOld){
    const quota=Math.min(gOld.length, Math.ceil(n/3));
    picked.push(...gOld.splice(0, quota));
    if (!gOld.length) groups.delete("oldstreet");
  }
  const order=[...groups.keys()].sort((a,b)=>groups.get(a)[0].d-groups.get(b)[0].d);
  let idx=0;
  while (picked.length<n){
    let added=false;
    for (const th of order){
      const g=groups.get(th);
      if (idx<g.length){ picked.push(g[idx]); added=true; if (picked.length>=n) break; }
    }
    if (!added) break;
    idx++;
  }
  return picked.sort((a,b)=>a.d-b.d);
}

    "&destination=" + encodeURIComponent(dest) +
    (way.length ? "&waypoints=" + encodeURIComponent(way.join("|")) : "");

      `<span class="tdbudget${over?" over":""}" title="這一天所有腿段的車程加總，共 ${d.min} 分` +
        `（各段的分鐘各自四捨五入過，逐段相加可能差一兩分）">` +
        CAR_SVG + `開車 <span class="num">${hm(d.min)}</span>` +
        (d.km!=null ? ` · <span class="num">${d.km.toFixed(1)}</span> km` : "") +
      `</span>` +
      dayNavHTML(days, i);
    wrap.appendChild(head);
    const tnote = (((TRIP_BY_ID[S.trip] || {}).days || [])[i] || {}).note;
    if (tnote){
      const n=document.createElement("p"); n.className="tdnote"; n.textContent=tnote;
      wrap.appendChild(n);
    }
    if ((d.legs||[]).length){
      d.legs.forEach(lg=>{
        wrap.appendChild(legRow(lg));
        const p=BY_ID[lg.to];
        if (p) wrap.appendChild(tripStopRow(p));
      });
    } else {
      (d.stops||[]).forEach(nm=>{ const p=BY_NAME[nm]; if (p) wrap.appendChild(tripStopRow(p)); });
    }
    wrap.appendChild(nightRow(d, i, days.length));
    box.appendChild(wrap);
  });
  const f=document.createElement("p"); f.className="nonear";
  f.textContent="車程是本地 OSRM 實算的，行程首尾自動接新竹；停留時間與當日總時數請自己斟酌。";
  box.appendChild(f);
  return box;
}

function selectBase(id){
  if (BASE_SEL===id){ closeBase(); return; }
  BASE_SEL=id; ZONE_SEL=null; BASE_NEAR=0;
  const b=BS[id];
  if (b && b.anchor && ready) map.setView(b.anchor, Math.max(map.getZoom(),12), {animate:false});
  if (!isMapOnly()) SCROLL_BASE=true;
  render();
}
function closeBase(){ BASE_SEL=null; ZONE_SEL=null; BASE_NEAR=0; render(); }
function selectZone(name){
  ZONE_SEL = (ZONE_SEL===name) ? null : name;
  BASE_NEAR=0;
  const z=zonesOf(BS[BASE_SEL]).find(x=>x.name===ZONE_SEL);
  if (z && ready) map.setView([z.anchor.lat, z.anchor.lng], Math.max(map.getZoom(),13), {animate:false});
  render();
}
function renderBaseView(){
  const b=BS[BASE_SEL];
  if (!b) return null;
  const zones=zonesOf(b);
  const zone=zones.find(z=>z.name===ZONE_SEL)||null;
  const oid = zone ? zoneOriginId(b.id, zone.name) : ("base:"+b.id);
  const step = NEAR_STEPS[Math.min(BASE_NEAR, NEAR_STEPS.length-1)];
  const menu = BASE_POINTS[b.id] || [];
  const lodges = lodgingOf(b.id);

  const d=document.createElement("div"); d.className="baseview";
  d.innerHTML =
    `<div class="bvh"><b>${esc(b.name)}</b>` +
      `<button type="button" class="x" data-act="closebase" aria-label="關閉基地視圖">×</button></div>` +
    `<p class="bvm">${esc(b.town||"")}` +
      (b.drive_min!=null ? `　<span class="mi" title="從新竹市區開到這個基地">${CAR_SVG}離新竹 ` +
        `<span class="num">${hm(b.drive_min)}</span>` +
        (b.drive_km!=null?` · <span class="num">${b.drive_km.toFixed(1)}</span> km`:"") + `</span>` : "") +
      `　菜單 <span class="num">${menu.length}</span> 個點</p>`;
  d.querySelector("[data-act=closebase]").onclick=closeBase;

  if (zones.length){
    const zr=document.createElement("div"); zr.className="zrow";
    zones.forEach(z=>{
      const c=chip(esc(z.name), ZONE_SEL===z.name, ()=>selectZone(z.name));
      if (z.note) c.title=z.note;    // 完整的 note 在下面住宿分組的帶名底下
      zr.appendChild(c);
    });
    d.appendChild(zr);
  }

  const h1=document.createElement("h3");
  h1.textContent=`住宿（${lodges.length} 家）`;
  d.appendChild(h1);
  if (!lodges.length){
    const e=document.createElement("p"); e.className="nonear";
    e.textContent="這個基地還沒有住宿資料。";
    d.appendChild(e);
  } else if (zones.length){
    zones.forEach(z=>{
      const rows=lodges.filter(p=>p.zone===z.name);
      if (!rows.length) return;
      const zh=document.createElement("p"); zh.className="zhead"; zh.textContent=z.name;
      d.appendChild(zh);
      if (z.note){
        const zn=document.createElement("p"); zn.className="znote"; zn.textContent=z.note;
        d.appendChild(zn);
      }
      rows.forEach(p=>d.appendChild(rowFor(p)));
    });
    const rest=lodges.filter(p=>!zones.some(z=>z.name===p.zone));
    if (rest.length){
      const zh=document.createElement("p"); zh.className="zhead"; zh.textContent="未分區";
      d.appendChild(zh);
      rest.forEach(p=>d.appendChild(rowFor(p)));
    }
  } else {
    lodges.forEach(p=>d.appendChild(rowFor(p)));
  }

  const pool=PLACES.filter(x=>x.theme!=="lodging").map(x=>{
    const r=originDist(oid, x);
    if (!r || r.km>step.km) return null;
    const fac = zone && zone.drive && zone.drive[x.id];
    return {x, d:r.km, min: fac ? fac.min : r.min, real:true};
  }).filter(Boolean);
  const near=pickNearby(pool, step.n);
  const h2=document.createElement("h3");
  h2.textContent=`附近精選地點（車程 ${step.km} 公里內，從${zone?`「${zone.name}」`:"基地"}量）`;
  d.appendChild(h2);
  const nb=document.createElement("div");
  if (near.length) near.forEach(({x,d:dd,min,real})=>nb.appendChild(rowFor(x, null, {km:dd, min, real})));
  else {
    const e=document.createElement("p"); e.className="nonear";
    e.textContent="這個車程範圍內沒有別的點。山上繞路遠，可以放寬距離再看。";
    nb.appendChild(e);
  }
  if (BASE_NEAR < NEAR_STEPS.length-1){
    const more=document.createElement("button"); more.className="wider";
    more.textContent=`再遠一點（${NEAR_STEPS[BASE_NEAR+1].km} 公里內）`;
    more.onclick=()=>{ BASE_NEAR++; render(); };
    nb.appendChild(more);
  }
  d.appendChild(nb);
  return d;
}

function renderList(){
  const wrap=document.createElement("div"); wrap.className="results";
  const list=shown();
  if (!list.length){
    const d=document.createElement("div"); d.className="empty";
    d.innerHTML="這組條件沒有東西。";
    const b=document.createElement("button"); b.textContent="清掉條件"; b.onclick=clearAll;
    d.appendChild(b); wrap.appendChild(d); return wrap;
  }
  const cmp=(SORTS.find(s=>s.id===S.sort)||SORTS[0]).fn;
  const g={}; list.forEach(p=>(g[p.base]=g[p.base]||[]).push(p));
  BASES.filter(r=>g[r.id]).forEach(r=>{
    const open=BASE_OPEN.has(r.id);
    const h=document.createElement("button");
    h.className="ghead"; h.setAttribute("aria-expanded", open);

    h.innerHTML=`<span class="gnm">${esc(r.name)}</span>` +
      `<span class="num">${g[r.id].length}</span>` +
      `<svg class="chev" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg>`;
    h.onclick=()=>{ toggleSet(BASE_OPEN, r.id); render(); };
    wrap.appendChild(h);
    if (open){

      const rd=document.createElement("div"); rd.className="gintro";
      const nLodge=lodgingOf(r.id).length;
      rd.innerHTML =
        `<p class="gdesc">${esc(r.town||"")}` +
        (r.drive_min!=null ? `　離新竹約 <span class="num">${r.drive_min}</span> 分` : "") +
        (nLodge ? `　住宿 <span class="num">${nLodge}</span> 家` : "") +
        (zonesOf(r).length ? `　住宿帶 <span class="num">${zonesOf(r).length}</span> 條` : "") +
        `</p>`;
      const bvb=document.createElement("button");
      bvb.type="button"; bvb.className="ghost";
      bvb.textContent = BASE_SEL===r.id ? "收起基地視圖" : "基地視圖（住宿與附近）";

    }
    g[r.id].sort(cmp).forEach(p=>{
      wrap.appendChild(rowFor(p));
      if (S.sel===p.id) wrap.appendChild(renderDetail(p));
    });
  });
  return wrap;
}

function renderPanel(){
  const panel=document.getElementById("panel");
  const keep=panel.scrollTop;
  panel.innerHTML="";
  panel.appendChild(renderFilterBar());
  if (S.open) panel.appendChild(renderFilters());

  if (TRIPS.length){
    panel.appendChild(section("範例行程",
      S.trip ? `1/${TRIPS.length} 條` : `${TRIPS.length} 條`, S.tripsOpen,
      ()=>{ S.tripsOpen=!S.tripsOpen; save(); render(); }, "toplevel"));

  if (BASE_SEL){
    const bv=renderBaseView();
    if (bv) panel.appendChild(bv);
  }
  panel.appendChild(section("景點清單", `${shown().length}/${PLACES.length}`, S.listOpen,
    ()=>{ S.listOpen=!S.listOpen; save(); render(); }, "toplevel"));

    panel.appendChild(renderList());
    const lg=document.createElement("div"); lg.className="legend";
    lg.innerHTML=THEMES.map(t=>`<span>${ico(t.id,t.color)}${t.name}</span>`).join("");
    panel.appendChild(lg);
    const f=document.createElement("p"); f.className="foot";
    f.innerHTML = (PUBLIC ? "" : "★ 是你自己收藏過的地方。") +
      "清單上的車程與停留都是估的；「今天的行程」的點間車程與「順路可搭」的距離會另外去算真實路線，" +
      "算不到才退回估算值（會標「約」或「直線」）。" +
      "山區路況、林道封閉、園區開放時間與店家公休都會變動，出發前請以官方公告與店家粉專為準；" +
      "本頁僅供行程參考，不保證資訊正確或即時。底圖與圖磚為 OpenStreetMap 貢獻者所有。";
    panel.appendChild(f);
  }
  if (SCROLL_RESET){
    panel.scrollTop = 0;
    SCROLL_RESET = false;
  } else {
    panel.scrollTop = keep;
  }
  if (SCROLL_BASE){
    const bv=panel.querySelector(".baseview");
    if (bv){
      const bar=document.querySelector(".fbar");
      const r=bv.getBoundingClientRect();
      const target=(bar?bar.getBoundingClientRect().bottom:r.top)+10;
      panel.scrollTop += (r.top-target);
    }
    SCROLL_BASE=false;
  }
  if (SCROLL_GROUP){
    const g=panel.querySelector(".ghead");
    if (g){
      const bar=document.querySelector(".fbar");
      const r=g.getBoundingClientRect();
      const target=(bar?bar.getBoundingClientRect().bottom:r.top)+10;
      panel.scrollTop += (r.top-target);
    }
    SCROLL_GROUP=false;
  }
  if (SCROLL_TO){
    const el=panel.querySelector(`.row[data-id="${SCROLL_TO}"]`);
    if (el){
      const bar=document.querySelector(".fbar");
      const r=el.getBoundingClientRect();
      const target=(bar?bar.getBoundingClientRect().bottom:r.top)+10;
      const desired=panel.scrollTop+(r.top-target);
      const max=panel.scrollHeight-panel.clientHeight;
      if (desired<=max){
        panel.scrollTop=Math.max(0, desired);
      } else {
        const rowOffset=r.top-panel.getBoundingClientRect().top+panel.scrollTop;
        panel.scrollTop = (rowOffset+r.height<panel.clientHeight) ? 0 : max;
      }
    } else {
      panel.scrollTop = 0;
    }
    SCROLL_TO=null;
  }
}

let SCROLL_TO=null;
function select(id){
  if (S.sel===id){ S.sel=null; S.near=0; render(); return; }

  const p=BY_ID[id];
  if (p){
    if (!pass(p)) EXTRA.add(id);        // 從「附近精選地點」跳到不在篩選裡的點，讓它有位置可展開

      map.setView([p.lat,p.lng], ICON_ZOOM, {animate:false});
    } else {
      panTo(p);
    }
  }
  if (!isMapOnly()){ S.listOpen=true; SCROLL_TO=id; }
  render();
}

function syncViews(){
  document.querySelectorAll("#views button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===S.view));
  document.getElementById("main").classList.toggle("nomap", S.view!=="map");
}

function updateTotop(){
  const btn=document.getElementById("totop");
  if (!btn) return;
  btn.hidden = isMapOnly();
  if (btn.hidden) return;
  const main=document.getElementById("main");
  const docked = matchMedia("(min-width:900px) and (min-height:560px)").matches &&
                 main && !main.classList.contains("nomap");
  btn.classList.toggle("docked", docked);
  const panel=document.getElementById("panel");
  const vh = panel.clientHeight || innerHeight;
  btn.classList.toggle("show", panel.scrollTop > vh*1.75);
}
document.getElementById("panel").addEventListener("scroll", updateTotop, {passive:true});
addEventListener("resize", updateTotop);
document.getElementById("totop").onclick=()=>{
  document.getElementById("panel").scrollTo({top:0, behavior: RM.matches ? "auto" : "smooth"});
};
function render(){
  refreshNearSet();
  primeNearView();   // fetchNear 現在是同步查內嵌表（NEIGH），重複呼叫有完成標記守門
  document.getElementById("tally").innerHTML =
    `<span class="num">${shown().length}</span> / <span class="num">${PLACES.length}</span>`;
  draw(); renderPanel(); renderTrip(); renderMapBtns(); renderMapCard(); updateTotop();
}

document.querySelectorAll("#views button").forEach(b=>{
  b.onclick=()=>{
    if (b.dataset.v===S.view){
      document.getElementById("panel").scrollTo({top:0, behavior:"smooth"});
      return;

    S.view=b.dataset.v; syncViews();
    if (S.sel){
      if (S.view==="list"){ S.listOpen=true; SCROLL_TO=S.sel; }
      else if (BY_ID[S.sel] && ready){
        const q=BY_ID[S.sel];
        map.setView([q.lat,q.lng], Math.max(map.getZoom(),13), {animate:false});
      }

    save(); render();
    if (S.view==="map") resizeMap();
  };
});
document.getElementById("q").addEventListener("input", e=>{
  S.q=e.target.value.trim().toLowerCase(); filterChanged();
});
document.getElementById("q").addEventListener("keydown", e=>{
  if (e.key==="Backspace" && !e.target.value && S.qtags.length){
    S.qtags.pop(); SCROLL_GROUP=true;   // 同 × 移除：放寬條件捲回清單開頭

  applyTheme(); save(); render();
};
syncViews();
loadOSM("");
render();

<script>

(function(){
  let lastTouchEnd = 0;
  document.addEventListener("touchend", function(e){
    if (e.target && e.target.closest && e.target.closest("#map")) return;
    const now = Date.now();
    const dt = now - lastTouchEnd;
    lastTouchEnd = now;
    if (dt > 0 && dt < 300){
      e.preventDefault();
      const t = e.target;
      if (t && typeof t.click === "function") t.click();
    }
  }, {passive:false});
})();
